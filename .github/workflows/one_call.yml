name: one-call runner

# SEB-274, changed 20 Oct (SEB-301). Once a day the builder takes the top unchecked job of BACKLOG.md
# (tools/backlog.py), builds it in one cheap model call (qwen, kimi as fallback, $1 a job, inside the
# $20 a month cap), opens a PR that automerge merges on green, ticks the job, and posts one line on
# SEB-301. If a Linear issue labelled one-call is ready it is built first, as before. See tools/one_call.py.
#
# GitHub drops scheduled runs now and then, so there are three slots a day; tools/one_call.py does
# nothing if data/builder_log.csv already has a row for today. Start it by hand with the Run workflow
# button (it then runs even if it ran today); give an issue key to build that Linear issue.
#
# Watched by watchdog.yml: silent for 26 hours, or 3 failures in a row, fails that workflow and
# GitHub emails the repo owner.
# 24 Oct (Seb): no schedule. The Aider builder builds every backlog job; this runs only by hand.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Build one Linear issue by hand, e.g. SEB-273 (empty: the next backlog job)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: one-call
      cancel-in-progress: false
    steps:
      # persist-credentials: false, so git pushes as the app (set on the
      # remote below) and not as GITHUB_TOKEN. checkout's stored header wins
      # over the remote URL otherwise, and main refuses GITHUB_TOKEN pushes:
      # the spend log failed to land on 7 Oct for exactly this reason.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mint the app token (PRs it opens run CI)
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_PUSH_TOKEN: ${{ steps.app_token.outputs.token }}
          DAILY_CAP_USD: "3.00"
          LINEAR_ACTIVITY_LOG_PATH: ${{ runner.temp }}/linear_activity.jsonl
        run: |
          git config user.name "margin-agents[bot]"
          git config user.email "329969015+margin-agents[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          python3 tools/one_call.py ${{ github.event.inputs.issue }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
