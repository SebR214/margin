name: scorecard

# SEB-301, Seb's plan of 25 Oct. The weekly agent scorecard, plain code (tools/scorecard.py): bot PRs merged this week, the job each
# came from, who proposed it, builder runs, spend, and the count toward the 8 Nov kill date. Posted as a comment on the issue
# "Agent scorecard" that mentions the owner, so GitHub emails it. Sunday 12:17 UTC (20:17 SGT), a second slot in case GitHub drops
# the first; the script posts once per week. The Run workflow button posts again.
on:
  schedule:
    - cron: "17 12 * * 0"
    - cron: "47 14 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post the scorecard
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: python3 tools/scorecard.py $FORCE
