name: collect

on:
  # THIS WORKFLOW STARTS ITSELF. Every run ends by sleeping to the next :05 or
  # :35 and dispatching the next one with the built-in GITHUB_TOKEN, so the
  # chain needs no cron, no personal access token and nothing outside GitHub.
  # The schedule below is the RESTARTER, not the clock: it exists only to
  # revive the chain if a link dies, and a scheduled fire that finds the chain
  # already alive exits immediately without collecting. See "Am I needed".
  repository_dispatch:
    types: [collect]
  schedule:
    # RESTARTER. GitHub drops scheduled fires under load: 44 of 168 expected
    # hours went missing in the week to 2026-08-18 (~74% delivery), and it then
    # collapsed outright -- Aug 20-25 averaged 21 of 24 hours a day, Aug 27
    # delivered 2, and Aug 28 to Sep 1 ran between 3 and 7, with 5-to-8-hour
    # holes routine. Measured by tools/check_delivery.py; a dropped hour is
    # gone for good. Unreliable as a clock, which is why it is no longer used
    # as one -- but a trigger that fires eventually is all a restarter needs.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "true only when this run is the next link of a running chain"
        required: false
        default: "false"

permissions:
  contents: write
  # actions: write is what lets a run dispatch its successor.
  actions: write
  # SEB-174/M2: read-only, so tools/emit_machine_room_meters.py's `gh pr
  # list` can see open pull requests. Setting any key here drops every
  # unlisted scope to none, so without this line that call would be
  # denied even though the repo is public.
  pull-requests: read

# No concurrency group on purpose. The chain plus the restarter can overlap by
# design, and the "Am I needed" gate below is what resolves that -- a group
# would instead queue the restarter behind a running link for up to half an
# hour, which is the opposite of what a restarter is for. The collectors are
# idempotent per UTC hour, so an overlap costs nothing anyway.

jobs:
  collect:
    runs-on: ubuntu-latest
    # Up to ~30 minutes of that is the successor step sleeping to the next
    # slot. 45 leaves room for a full collection either side of a 29-minute
    # sleep without ever cutting the dispatch off.
    timeout-minutes: 45
    steps:
      # 3. THE GATE. A scheduled fire is a restarter, not a sample: if any link
      # of the chain is already running or queued, this run has nothing to do
      # and says so. Only a schedule can be redundant this way -- a dispatch was
      # asked for explicitly, by the chain itself or by a person, and always
      # proceeds.
      #
      # Runs BEFORE checkout: deciding whether to work needs no working tree,
      # and a redundant restarter should cost seconds, not a checkout and a pip
      # install.
      - name: Am I needed
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          # REQUIRED, and the reason this step failed every scheduled fire
          # between 2026-09-02 14:39 and 15:5x: `gh` infers the repository from
          # the git remote, and this step runs BEFORE checkout on purpose, so
          # there is no remote to infer from -- "failed to determine base repo".
          # Dispatched runs never hit it (they exit above), so the chain kept
          # running and only the restarter was broken, which is the one failure
          # you would not notice until you needed it.
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched (${{ github.event_name }}) -- always proceeds"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any other run of THIS workflow still going, excluding this one, ON
          # MAIN. Scoped to branch=main because a real chain link only ever
          # runs there -- the restarter fires on the default branch and
          # "Dispatch successor" below hardcodes --ref main -- so a one-shot
          # workflow_dispatch test run on a feature branch (someone verifying
          # a collect.yml change before merging it, say) is not the chain and
          # must not be read as one. Before this filter it was: SEB-125, live
          # test dispatches against phase5-app-push-identity sat in_progress
          # across a chain link's post-sleep recheck (below), that link read
          # them as "another link already alive" and stood down, and because
          # only a real link ever forges the next one, nothing continued the
          # chain from there -- the restarter's own scheduled fires are the
          # one documented ~26%-unreliable (2026-08-18 measurement) recovery
          # path, and collection sat dead for over an hour before the gap
          # crossed the watchdog's threshold.
          #
          # Asked by STATUS, not by scanning the newest N runs. The previous
          # version listed the 50 most recent and filtered them, which fails
          # exactly when it matters: a chain link sleeps for up to 30 minutes,
          # so under any burst it falls out of the newest-50 window and the gate
          # concludes "chain dead" while the chain is very much alive -- and
          # then starts another one. On 2026-09-05 a scheduled fire did exactly
          # that with ~20 chains running, which is part of how the pile-up grew.
          # Status-filtered queries have no window and cannot drift.
          alive=""
          for st in in_progress queued; do
            [ -n "$alive" ] && break
            alive=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/runs?status=$st&branch=main&per_page=100" \
                      --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id] | first // \"\"")
          done
          if [ -n "$alive" ]; then
            echo "chain alive, run $alive"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "chain dead, restarting"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.needed.outputs.proceed == 'true'
        with:
          # Phase 5: checkout's own persisted credential and the App token
          # this job sets later both write to http.https://github.com/.extraheader,
          # and git allows a config key to hold more than one value -- so
          # without this, push sends BOTH as separate Authorization headers
          # and GitHub's server 400s with "Duplicate header: Authorization"
          # (found live, 2026-09-26, testing this exact phase). Read access
          # for checkout itself is unaffected; this repo is public.
          persist-credentials: false
          # SEB-174/M2: tools/emit_machine_room_meters.py counts today's
          # collector commits off this checkout's own `git log`, which the
          # default depth-1 shallow clone can't see past the single commit
          # it fetches. 300 comfortably covers a day's commits (the
          # half-hourly chain alone writes ~48 "sample ..." commits/day)
          # without pulling the repo's full, ever-growing history every run.
          fetch-depth: 300

      - uses: actions/setup-python@v5
        if: steps.needed.outputs.proceed == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.needed.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      # SEB-139. `pip install` above only installs the playwright PYTHON
      # PACKAGE (requirements.txt's own comment says so) -- it does not fetch
      # the browser binary that package drives. Without this step every run
      # since 2026-09-27 15:06 failed identically on WorldRemit's render path
      # ("Executable doesn't exist at .../chrome-headless-shell..."), because
      # collector_providers.py's ONE NARROW EXCEPTION (a headless render of
      # WorldRemit's own calculator, see that file's HARD RULES) had nothing
      # to launch. --with-deps also installs the OS libraries Chromium needs
      # on a bare ubuntu-latest runner, not just the browser itself.
      - name: Install Playwright browser (WorldRemit render path)
        if: steps.needed.outputs.proceed == 'true'
        run: playwright install --with-deps chromium

      # Two collectors, two layers, INDEPENDENT pass/fail. The basis step runs
      # even if the corridor step failed (always()), so one layer breaking never
      # hides the other -- but either one going red fails the whole job.
      - name: Collect corridor sample
        if: steps.needed.outputs.proceed == 'true'
        # Exits non-zero on an incomplete corridor sample. The row is still
        # written, so the commit step (always()) captures it either way.
        run: python3 collector.py

      - name: Collect corridor sample USD->MXN
        if: always() && steps.needed.outputs.proceed == 'true'
        # Second corridor, same method. always() so corridor 1 going red never
        # hides corridor 2 -- and the per-corridor idempotency gate means the
        # two never contend for the hour.
        run: python3 collector.py --corridor "USD->MXN"

      - name: Collect corridor sample AUD->PHP
        if: always() && steps.needed.outputs.proceed == 'true'
        # Same two venues as SGD->PHP and the same verified fee schedules, so
        # no new fee source enters the record. always() so one corridor going
        # red never hides another.
        run: python3 collector.py --corridor "AUD->PHP"

      - name: Collect corridor sample NZD->PHP
        if: always() && steps.needed.outputs.proceed == 'true'
        run: python3 collector.py --corridor "NZD->PHP"

      - name: Collect corridor sample USD->NGN
        if: always() && steps.needed.outputs.proceed == 'true'
        # The premium-country corridor (SOURCES-2, 2026-09-29): Coinbase's
        # own USD onramp, unchanged, paired with Luno's Nigeria order book
        # and its own verified fee schedule -- a genuinely new fee source,
        # not a reused one. always() so this going red never hides the
        # other corridors, same rule as every step below it.
        run: python3 collector.py --corridor "USD->NGN"

      - name: Collect corridor sample USD->INR
        if: always() && steps.needed.outputs.proceed == 'true'
        # Same Coinbase onramp, WazirX's INR order book and its own
        # verified fee schedule on the offramp.
        run: python3 collector.py --corridor "USD->INR"

      - name: Collect corridor sample SGD->INR
        if: always() && steps.needed.outputs.proceed == 'true'
        # Reuses SGD->PHP's Independent Reserve onramp and network fee
        # unchanged; only the offramp (WazirX) is new.
        run: python3 collector.py --corridor "SGD->INR"

      - name: Collect basis sample
        if: always() && steps.needed.outputs.proceed == 'true'
        # Wide layer: exits non-zero ONLY on a total blackout (all venues down).
        # A partial pull is a success with source_ok=False holes.
        run: python3 collector_basis.py

      - name: Collect P2P sample
        if: always() && steps.needed.outputs.proceed == 'true'
        # Capital-controlled markets, read off advertisement boards rather than
        # order books, in their own file. Same contract as the basis layer:
        # exits non-zero ONLY on a total blackout; a currency with no ads is a
        # source_ok=False row, which is a finding about that market.
        run: python3 collector_p2p.py

      - name: Emit basis receipts
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-219. Runs right after the step above so it reads what that step
        # just wrote (data/p2p_basis.csv), and writes
        # data/basis_receipts/<CCY>.json: the one raw row behind tape.html's
        # street-price and bank-rate cells for every currency priced this
        # pass. Exits non-zero only if it cannot write.
        run: python3 tools/emit_basis_receipts.py

      - name: Collect P2P sample -- OKX (SEB-204)
        if: always() && steps.needed.outputs.proceed == 'true'
        # Second P2P board, confirmed live 2026-10-03 (tools/probe_p2p_boards.py):
        # Bybit bot-walls every path, HTX publishes no currency-id->ISO mapping, OKX
        # is the one survivor. Own file (data/p2p_okx.csv), own header -- nothing
        # reads it yet, so this only keeps it collecting alongside item 12's
        # baseline rather than waiting for that cutover. Same contract as every
        # other collector: exits non-zero ONLY on a total blackout.
        run: python3 collector_p2p_okx.py

      - name: Collect provider quotes
        if: always() && steps.needed.outputs.proceed == 'true'
        # Quotes asked of the providers themselves, where they publish one, so
        # the comparison is not sourced entirely from a single competitor.
        # Exits non-zero only if nobody quoted at all.
        run: python3 collector_providers.py

      - name: Collect official exchange rates
        if: always() && steps.needed.outputs.proceed == 'true'
        # The denominator of every index figure, as a record of its own with the
        # source named. Runs after the price layers so it covers exactly the
        # currencies they collected. Exits non-zero only on a total blackout.
        run: python3 collector_fx.py

      - name: Emit machine-readable snapshot
        if: always() && steps.needed.outputs.proceed == 'true'
        # Derived from the CSVs the two steps above just wrote, so it runs after
        # both -- and always(), so a failed collector still refreshes the
        # snapshot from whatever did land. Exits non-zero only if it cannot
        # write the file.
        run: python3 tools/emit_latest.py

      - name: Emit the provider ranking
        if: always() && steps.needed.outputs.proceed == 'true'
        run: python3 tools/emit_providers.py

      - name: Emit provider receipts
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-186. Runs right after the provider ranking so it reads what that
        # step just wrote (data/providers_latest.json) alongside the raw CSVs
        # underneath it, and writes data/provider_receipts/<corridor>_<size>_
        # <hour>.json: the evidence and the arithmetic behind every provider's
        # ranked cost on sending-money.html, one file per corridor and size.
        # Exits non-zero only if it cannot write.
        run: python3 tools/emit_provider_receipts.py

      - name: Emit delivery receipts
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-230. Reads data/provider_delivery.csv (SEB-176's sidecar,
        # already collected above) directly -- not providers_latest.json,
        # since a delivery claim has no arithmetic to replay, only the raw
        # row to show -- and writes data/delivery_receipts/<corridor>_
        # <provider>_<day>.json: the receipt behind every delivery-time
        # string on sending-money.html. Exits non-zero only if it cannot
        # write.
        run: python3 tools/emit_delivery_receipts.py

      - name: Emit real hourly coverage (sending-money series)
        if: always() && steps.needed.outputs.proceed == 'true'
        # Recomputed every run from data/samples.csv, so the coverage % and
        # longest-gap figure shown on sending-money.html and corridor.html
        # never drift stale -- see tools/emit_coverage.py.
        run: python3 tools/emit_coverage.py

      - name: Emit corridor history for the 24h/7d/30d/all-time chart
        if: always() && steps.needed.outputs.proceed == 'true'
        # Feeds corridor.html's route-breakdown history chart (the
        # 24h/7d/30d/all-time buttons). See tools/emit_corridor_history.py.
        run: python3 tools/emit_corridor_history.py

      - name: Emit the price-change record
        if: always() && steps.needed.outputs.proceed == 'true'
        # Append-only. A change is recorded only when a provider moved against
        # every other provider in its panel on the same day, so a move in the
        # reference rate -- which shifts the whole panel at once -- is silent.
        # See the docstring in tools/emit_price_changes.py.
        run: python3 tools/emit_price_changes.py

      - name: Emit the price-change receipts
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-187. Runs right after the step above so it reads what that step
        # just wrote (data/price_changes.csv and data/price_changes_latest.json)
        # alongside the raw panel CSVs underneath them, and writes one receipt
        # per confirmed row to data/pricechange_receipts/ -- the hourly
        # readings, the pairwise comparison and the arithmetic behind a
        # "moved by X" claim on sending-money.html. Append-only, same as the
        # row it explains. Exits non-zero only if it cannot write.
        run: python3 tools/emit_pricechange_receipts.py

      - name: Emit the status of the machine
        if: always() && steps.needed.outputs.proceed == 'true'
        # Feeds /status.html. Derived entirely from files already in data/, so
        # if this page is wrong the rest of the site is wrong too -- which is
        # the point of having it.
        run: python3 tools/agent_status.py

      - name: Emit the machine room meters
        if: always() && steps.needed.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # SEB-174/M2. Feeds how-it-was-built.html's meter row: today's
        # collector commits (this checkout's own `git log`), open pull
        # requests (`gh pr list`, needs GH_TOKEN) and the unbroken-hours
        # streak (data/basis.csv + data/p2p_basis.csv, already collected
        # above). Never fabricates one it can't compute -- see the script's
        # own docstring -- so this step only fails if it can't write the
        # file at all.
        run: python3 tools/emit_machine_room_meters.py

      - name: Emit per-country index files
        if: always() && steps.needed.outputs.proceed == 'true'
        # Derived from the CSVs the collectors just wrote. Implements
        # METHODOLOGY "The index, version 1"; writes data/countries/<CCY>.json
        # and data/index_latest.json -- both still read live, by country.html
        # and the-index.html. It no longer writes any page of its own: the
        # c/*.html pages this step used to emit were retired in PR #157 (dead
        # weight -- nothing linked to them since country.html?ccy=X replaced
        # them), and the page-writing code went with them. Exits non-zero
        # only if it cannot write.
        run: python3 tools/emit_countries.py

      - name: Emit heatmap
        if: always() && steps.needed.outputs.proceed == 'true'
        # Every currency by every day since the first reading, from the
        # country files just written and data/basis.csv. See the docstring in
        # tools/emit_heatmap.py. Stored values only, a day with no reading is
        # null.
        run: python3 tools/emit_heatmap.py

      - name: Emit country readings
        if: always() && steps.needed.outputs.proceed == 'true'
        # Every stored reading per country (one file per currency and month)
        # for the country chart. See tools/emit_country_readings.py.
        run: python3 tools/emit_country_readings.py

      - name: Emit the record, cycle log, milestones, movers, sources and findings
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-240 data for the home, sources and findings pages. Stored
        # files only, no new fetch and no clock: record_daily.json (what has
        # been collected, per day), cycle_log.json (the last 48 hourly
        # cycles and the header countdown), record_milestones.json (when each
        # source, route and backfill series first appeared),
        # movers_week.json (reads the heatmap just written),
        # sources_daily.json (a status per source per day) and
        # findings.json with findings_hours_<id>.csv. Each is a tool of its
        # own; see the docstrings in tools/emit_record_daily.py,
        # emit_cycle_log.py, emit_record_milestones.py, emit_movers_week.py,
        # emit_sources_daily.py and emit_findings.py. One failing must not
        # block the rest.
        run: |
          for t in volume_crossover crossover_receipts record_daily cycle_log record_milestones movers_week sources_daily findings; do
            python3 tools/emit_$t.py || echo "emit_$t failed"
          done

      - name: Emit street depth
        if: always() && steps.needed.outputs.proceed == 'true'
        # How much volume a country's premium holds before the price would
        # move. Reads data/p2p_offers.csv and data/p2p_depth.csv, both
        # already collected above; writes data/street_depth_latest.json,
        # read by country.html next to the premium itself. See the
        # docstring in tools/emit_depth.py for the threshold and why.
        # Exits non-zero only if it cannot write.
        run: python3 tools/emit_depth.py

      - name: Emit receipts
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-56. Runs right after the per-country step so it reads what that
        # step just wrote (data/countries/<CCY>.json) alongside the raw CSVs
        # underneath it, and writes data/receipts/<CCY>.json: the evidence,
        # the official rate, the arithmetic and the evidence-rule check for
        # every currency, published or withheld. Exits non-zero only if it
        # cannot write.
        run: python3 tools/emit_receipts.py

      - name: Emit corridor receipts
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-178, R2 for corridor.html. Reads data/samples.csv alongside
        # data/corridor_waterfall.csv and data/ramp_waterfall.csv (all
        # already written by the collector steps above) and collector.py's
        # own CORRIDORS fee constants, and writes one
        # data/corridor_receipts/<corridor>_<notional>_<hour>.json per
        # (corridor, notional) pair at this hour -- the same evidence/fees/
        # math replay emit_receipts.py gives index/country numbers, for
        # corridor.html's cost-in-bps figures. Exits non-zero only if it
        # cannot write.
        run: python3 tools/emit_corridor_receipts.py

      - name: Audit published numbers
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-209 / ROADMAP item 19. Deterministic, no model call: re-derives
        # up to 50 published numbers per run from the raw CSVs and writes
        # data/audit_latest.json plus one append-only line in
        # data/audit_history.csv. A failed number is reported in the file, not
        # by a red run -- the failures are the point.
        run: python3 tools/audit_numbers.py

      - name: Audit the claims in the copy
        if: always() && steps.needed.outputs.proceed == 'true'
        # Every count or absolute claim (never, always, every, none, since a
        # date) in reader-facing copy has a query in claims.json. Re-derived
        # from the raw CSVs, written to data/claims_status.json; a claim that is
        # not true makes the page drop that line. Never edits copy.json. See
        # tools/audit_claims.py. Runs after the routes and countries emitters
        # above so its published-figure cross-check sees this hour's files.
        run: python3 tools/audit_claims.py

      - name: Emit the stress signal
        if: always() && steps.needed.outputs.proceed == 'true'
        # Append-only. Checks data/countries/*.json (just written above)
        # against data/fx_rates.csv for a currency pulling away from its
        # official rate unexplained by the official rate itself moving --
        # the same check tools/agent_status.py already runs, kept here as a
        # public record instead of an internal one. See the docstring in
        # tools/emit_stress_signal.py.
        run: python3 tools/emit_stress_signal.py

      - name: Emit the P2P spread signal
        if: always() && steps.needed.outputs.proceed == 'true'
        # Append-only. Reads the buy/sell sides data/p2p_basis.csv already
        # collected above and records each reading's spread against its own
        # currency's prior history -- SEB-52. See the docstring in
        # tools/emit_spread_signal.py.
        run: python3 tools/emit_spread_signal.py

      - name: Emit the data manifest
        if: always() && steps.needed.outputs.proceed == 'true'
        # Runs after the per-country step so it reflects what that step just
        # wrote too. Reads every CSV, six snapshot files and data/countries/,
        # and writes data/manifest_latest.json -- the file data.html reads.
        # Exits non-zero only if it cannot write.
        run: python3 tools/emit_manifest.py

      - name: Emit the source list
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-62/U7. Reads data/index_latest.json and data/basis.csv -- both
        # already written above -- and writes data/sources_latest.json, the
        # file methodology.html's "How it works" reads to name what actually
        # priced this hour instead of a list someone typed once.
        run: python3 tools/emit_sources.py

      - name: Emit the browser dataset bundle
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-40. Runs last of the emitters so it packages what every step
        # above just wrote: one parquet file per top-level CSV, plus the
        # country index flattened out of data/countries/*.json, into
        # data/bundle/ -- what a browser queries directly instead of hitting
        # the server. Exits non-zero if it cannot write, or if the bundle
        # grows past its 15 MB target; either way this step going red is the
        # point, not something to route around.
        run: python3 tools/emit_bundle.py

      - name: Emit the corridor summary
        if: always() && steps.needed.outputs.proceed == 'true'
        # D1 (margin.wiki -- v1 freeze and ship brief). Reads data/samples.csv
        # (written by the collector.py runs above) and writes
        # data/corridor_summary.json -- the homepage's headline, waterfall
        # and per-route table, computed fresh every pass, never typed.
        run: python3 tools/emit_corridor_summary.py

      - name: Emit the routes page data
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-240. Reads stored files only (samples, variants, provider
        # quotes and panels, waterfall and ramp legs) and writes
        # data/routes_hourly.json, routes_summary.json, routes_breakdown.json
        # and routes_whatif.json for the routes page. No new service or
        # cost. See tools/emit_routes.py; `--self-test` checks it offline.
        run: python3 tools/emit_routes.py

      - name: Bake the homepage
        if: always() && steps.needed.outputs.proceed == 'true'
        # D1. Writes the real headline and corridor table straight into
        # index.html's own markup (inside <!--BAKE:START/END--> markers) so
        # a crawler or a JS-off visitor sees this hour's real measurement,
        # not "Loading...". The waterfall chart itself stays client-rendered
        # -- tools/bake_homepage.py's own docstring says why. If
        # corridor_summary.json is missing or unmeasurable this pass, this
        # leaves whatever was baked last time in place rather than blanking
        # it, so exits 0 either way; only a genuinely broken page structure
        # (the id= anchors moved) makes it fail loud.
        run: python3 tools/bake_homepage.py

      # Mints a margin-agents GitHub App installation token so the commit
      # below is pushed -- and therefore reviewed, once branch protection is
      # back on -- as the App, not as whoever's GITHUB_TOKEN happened to run
      # this job. Phase 5. See agents/gh_token.sh for why: an App cannot cast
      # an approving review, which is what keeps Sebastian's approval the
      # only one that counts.
      #
      # The three secrets hold what gh_token.sh needs, except MARGIN_GH_APP_KEY:
      # the script wants a file it can read with `-r`, but the secret holds
      # the raw PEM. So this step writes it to $RUNNER_TEMP (torn down with the
      # runner, never in the repo or a persisted path) and points the env var
      # at that file, unchanged from what the script already expects.
      #
      # `: "${VAR:?msg}"` inside gh_token.sh already fails loudly if any of the
      # three secrets is unset (e.g. a fork with no App provisioned) -- this
      # step does not catch or reinterpret that; it lets the step go red with
      # the script's own message in the log.
      - name: Mint GitHub App token
        if: always() && steps.needed.outputs.proceed == 'true'
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Commit samples
        if: always() && steps.needed.outputs.proceed == 'true'
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set +x
          # margin-agents[bot]'s standard commit identity, so GitHub renders
          # the commit as the App, matching the token it's pushed with below.
          git config user.name "margin-agents[bot]"
          # 329969015 is the margin-agents[bot] USER account's id, not the App
          # ID -- GitHub's bot-commit-linking convention keys on the former.
          # Using MARGIN_GH_APP_ID here (found live, first Phase 5 test run)
          # produces a commit that LOOKS right but GitHub never links back to
          # the bot account, so it shows unattributed rather than as the App.
          # Confirm via: gh api users/margin-agents%5Bbot%5D --jq .id
          git config user.email "329969015+margin-agents[bot]@users.noreply.github.com"
          # Staged one at a time, and only if present. `git add` on a path
          # that does not exist yet is a fatal error (exit 128), and under
          # `bash -e` that kills the step BEFORE the freshness guard runs --
          # which is how adding data/stable_spread.csv to this list turned a
          # healthy no-op run red on 2026-09-02. A layer that has not written
          # its first row yet is a normal state, not a failure.
          for f in data/samples.csv data/samples_depth.csv data/basis.csv data/providers.csv \
                   data/providers_usdmxn.csv data/providers_audphp.csv \
                   data/providers_nzdphp.csv \
                   data/providers_usdngn.csv data/providers_usdinr.csv \
                   data/providers_sgdinr.csv data/latest.json \
                   data/crosses_latest.json data/stable_spread.csv \
                   data/p2p_basis.csv data/p2p_sides.csv data/p2p_depth.csv \
                   data/p2p_offers.csv data/street_depth_latest.json \
                   data/index_latest.json \
                   data/fx_rates.csv data/provider_quotes.csv \
                   data/providers_latest.json data/price_changes.csv \
                   data/price_changes_latest.json data/agent_status.json \
                   data/manifest_latest.json data/stress_signal.csv \
                   data/stress_signal_latest.json data/basis_history.csv \
                   data/fee_checks.csv data/withdrawal_fees.csv \
                   data/requests_latest.json data/stable_spread_summary.json \
                   data/p2p_spread_signal.csv data/p2p_spread_signal_latest.json \
                   data/corridor_summary.json data/corridor_waterfall.csv \
                   data/corridor_window.json data/machine_room_meters.json \
                   data/provider_delivery.csv data/audit_latest.json \
                   data/audit_history.csv data/claims_status.json data/claims_history.csv data/routes_hourly.json \
                   data/routes_summary.json data/routes_breakdown.json \
                   data/routes_whatif.json data/heatmap_daily.json \
                   data/record_daily.json data/cycle_log.json \
                   data/record_milestones.json data/movers_week.json \
                   data/sources_daily.json data/findings.json \
                   data/findings_hours_price_changes.csv \
                   data/findings_hours_weekend_penalty.csv \
                   data/findings_hours_volume_crossover.csv \
                   data/findings_hours_sgd_php_never_cheapest.csv \
                   data/findings_hours_stress_signal.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # index.html itself -- D1's bake_homepage.py rewrites it in place
          # every pass. Not under data/ or c/, so the MISSED fallback below
          # (scoped to those two paths on purpose, per the comment there)
          # would never catch it if left off this list; named explicitly
          # instead of widening that fallback's pathspec for one file.
          if [ -f index.html ]; then git add index.html; fi
          # Directories: one file per country, a page per country, one
          # receipt per country, one receipt per corridor+amount
          # (data/corridor_receipts, SEB-178), one receipt per
          # corridor-and-size on sending-money.html's provider ranking
          # (data/provider_receipts, SEB-186), one receipt per confirmed
          # price change (data/pricechange_receipts, SEB-187), one receipt
          # per corridor+provider+day behind a delivery-time string
          # (data/delivery_receipts, SEB-230), and the
          # bundle's parquet files + manifest. A country (or a table
          # emit_bundle.py starts writing, or a new receipt's first file)
          # appears here on its first run with no edit to this list --
          # which is the point of staging the directory rather than naming
          # the files.
          for d in data/countries data/receipts data/corridor_receipts data/provider_receipts data/pricechange_receipts data/meter_receipts data/delivery_receipts data/bundle; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          # Anything TRACKED that an emitter rewrote but the list above forgot.
          # `git add -u` stages modifications to files already in the repo and
          # never picks up a new one, so this cannot repeat the `git add -A`
          # accident that swept in synced-folder duplicates -- a new file still
          # has to be named above to ever be committed.
          #
          # This exists because an omission here is silent and fatal: the step
          # commits, then rebases, and git refuses to rebase with unstaged
          # changes. data/stable_spread_summary.json was added by an emitter on
          # 2026-09-13 and left out of the list, and collection died for 21
          # hours -- readings that cannot be backfilled.
          MISSED=$(git diff --name-only -- data)
          if [ -n "$MISSED" ]; then
            echo "::warning::staged by fallback, add these to the list above:"
            echo "$MISSED" | sed 's/^/::warning::  /'
            git add -u data
          fi
          if git diff --cached --quiet; then
            # Expected on the second fire of an hour the first fire already
            # captured. latest.json is a pure function of the data (no wall
            # clock in it), so a no-op run really does stage nothing -- this
            # branch stays reachable instead of being papered over by a
            # timestamp-only diff.
            echo "nothing staged -- hour already captured"
          else
            # commit BEFORE rebasing: git refuses `pull --rebase` with a staged index.
            git commit -m "sample $(date -u +%Y-%m-%dT%H:%MZ)"
            # Push (and the rebase's own fetch) as the App: checkout's default
            # credential is untouched (it's a read concern, and changing it
            # doesn't change whose review requirements apply once branch
            # protection is back), but the identity that actually writes to
            # main is what matters here, so only this remote is repointed,
            # only for this step, and only in memory (never `git remote
            # set-url`, which would write the token into .git/config on disk).
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
              pull --rebase origin "${GITHUB_REF_NAME}"
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
              push origin "${GITHUB_REF_NAME}"
          fi
          # Rot guard runs on EVERY fire, not just the ones that staged nothing:
          # whether the data is rotting has nothing to do with what this
          # particular run happened to stage. Runs LAST so a stale-data failure
          # still leaves the rows committed and pushed -- loud, but never at the
          # cost of a sample. Exits 1 if the newest row is too old (bash -e).
          python3 tools/check_freshness.py
          # SEB-60: a country's chart and its published number are meant to be
          # the same measurement -- this fails loudly if a future change to
          # tools/emit_countries.py ever lets them drift apart again, the way
          # daily_history() and latest_by_ccy() drifted before this fix.
          python3 tools/check_index_consistency.py

      # 5. THE LINK. What makes the chain a chain: sleep to the next slot, then
      # start the next run with the workflow's own GITHUB_TOKEN.
      #
      # This works because of one documented exception. GitHub, "Triggering a
      # workflow from a workflow":
      #
      #   "When you use the repository's GITHUB_TOKEN to perform tasks, events
      #    triggered by the GITHUB_TOKEN will not create a new workflow run,
      #    with the following exceptions: workflow_dispatch and
      #    repository_dispatch events always create workflow runs."
      #
      # always(), so a link is forged even when the collection above went red --
      # one bad hour must not end the chain. It runs AFTER the freshness guard
      # so a stale-data failure is still loud, and after the commit so a crash
      # here cannot cost a sample that was already pushed.
      # ONLY A CHAIN LINK FORGES THE NEXT ONE. This is what stops a stray
      # dispatch from becoming a second, permanent, self-perpetuating chain.
      #
      # On 2026-09-05 that is exactly what happened: a laptop reboot re-loaded
      # a launchd agent that POSTs repository_dispatch twice an hour, every one
      # of those runs dispatched a successor, and none of the resulting chains
      # ever died. They all sleep to the same :05/:35 slots, so they converged
      # and fired in clumps -- 41 concurrent runs before it was caught.
      #
      # So: a run continues the chain only if it IS the chain (dispatched with
      # chain=true) or is a scheduled fire starting a new one. Anything else --
      # a repository_dispatch, a bare `gh workflow run` -- collects its hour and
      # stops. Useful, harmless, one-shot. Checked here rather than by counting
      # live runs, because counting races: parent and successor overlap by
      # seconds at handover, and a "who is oldest" rule can kill the very chain
      # it is meant to protect.
      #
      # THE 2026-09-13/14 GAP: the "Am I needed" gate above is what tells two
      # would-be chains apart, and it only runs for a scheduled fire -- once a
      # run carries chain=true it forges the next link unconditionally, with no
      # re-check. That is fine in steady state, but it means the only place two
      # independent chains can ever be told apart is a check that itself races:
      # if two schedule fires both read "chain dead" before either run's own
      # existence is visible to the other's `runs?status=` query -- plausible
      # right after an outage, when several restarter fires land close together
      # -- each starts its own permanent chain, and nothing ever merges them
      # back down. That is what happened: two chains, still forming a moment
      # later on 2026-09-13, converged on the same :05/:35 slots and raced to
      # push the same commit -- 6 of 24 hours delivered instead of 24.
      #
      # So this step re-runs the same status-based check immediately before it
      # forges the next link, for every run, chain or schedule. It does not
      # carry the restarter's race: by the time a link reaches this line it has
      # been alive for the run's full duration (collection plus up to the
      # 30-minute sleep above), long past any propagation delay, so a sibling
      # chain is always visible by now. Two live chains each see the other here
      # and both stand down, rather than both re-forging -- worst case a gap
      # until the next restarter fire (<=30 min), never a permanent second
      # chain. A healthy single chain is unaffected: by the time a link reaches
      # this check, its own parent finished minutes ago, so it only ever sees
      # itself.
      - name: Dispatch successor
        if: >-
          always() && steps.needed.outputs.proceed == 'true'
          && (github.event_name == 'schedule' || github.event.inputs.chain == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          # Not strictly needed here -- this step runs after checkout, so `gh`
          # can infer the repo -- but the chain must not depend on a checkout
          # having succeeded to forge its next link.
          GH_REPO: ${{ github.repository }}
        run: |
          # Seconds until the next :05 or :35 UTC. Computed from the clock at
          # this instant, so a slow collection shortens the sleep instead of
          # pushing the whole chain later and later.
          now_m=$(date -u +%M); now_s=$(date -u +%S)
          now_m=$((10#$now_m)); now_s=$((10#$now_s))
          if   [ "$now_m" -lt 5  ]; then target=5
          elif [ "$now_m" -lt 35 ]; then target=35
          else target=65; fi          # 65 == :05 of the next hour
          wait=$(( (target - now_m) * 60 - now_s ))
          [ "$wait" -lt 5 ] && wait=5   # never dispatch into the slot just left
          echo "now $(date -u +%H:%M:%SZ), next slot :$(printf '%02d' $((target % 60))), sleeping ${wait}s"
          sleep "$wait"

          # Re-check right before forging -- see "THE 2026-09-13/14 GAP" above.
          # Same status-by-API check as "Am I needed", excluding this run, and
          # same branch=main scope -- see SEB-125 above the "Am I needed" one.
          alive=""
          for st in in_progress queued; do
            [ -n "$alive" ] && break
            alive=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/runs?status=$st&branch=main&per_page=100" \
                      --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id] | first // \"\"")
          done
          if [ -n "$alive" ]; then
            echo "another link already alive (run $alive) -- standing down instead of forking a second chain"
            exit 0
          fi

          # A failed dispatch breaks the chain, so it must be LOUD if every
          # attempt below fails: the run goes red, and the schedule's next
          # fire finds no link alive and restarts. That recovery path is
          # real but slow and documented as unreliable (the schedule comment
          # above measured ~26-74% delivery), so it is worth a few retries
          # first rather than handing off on the first try. SEB-168: this
          # exact call failed with "HTTP 504: We couldn't respond to your
          # request in time" at 2026-09-30 03:05:12Z, killed the chain
          # outright, and the restarter did not fire for 5+ hours after --
          # the same transient-504 shape PR #271's body already flagged from
          # 2026-09-29. A GitHub-side timeout, not a real block, so retrying
          # before giving up costs nothing and fixes most of these in place.
          attempt=1
          until gh workflow run collect.yml --ref main -f chain=true; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::dispatch failed $attempt times in a row -- giving up, chain ends here"
              exit 1
            fi
            echo "dispatch attempt $attempt failed, retrying in 10s"
            attempt=$((attempt + 1))
            sleep 10
          done
          # `gh workflow run` prints no id, so read it back. Best effort only --
          # the dispatch is what matters and a slow-to-appear run must not fail
          # a step that already succeeded.
          sleep 5
          new_id=$(gh run list --workflow=collect.yml --limit 10 \
                     --json databaseId,event,status \
                     --jq '[.[] | select(.event == "workflow_dispatch")
                                | select(.status == "in_progress" or .status == "queued")
                                | .databaseId] | first // ""' || true)
          echo "successor dispatched: run ${new_id:-<id not yet visible>}"
