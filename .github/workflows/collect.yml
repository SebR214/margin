name: collect

on:
  schedule:
    # Twice an hour on purpose. GitHub drops scheduled fires under load -- 44 of
    # 168 expected hours went missing in the week to 2026-08-18 (~74% delivery).
    # The collectors are idempotent per UTC hour, so the second fire is a no-op
    # when the first landed and a rescue when it didn't. Redundancy, not dupes.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Two collectors, two layers, INDEPENDENT pass/fail. The basis step runs
      # even if the corridor step failed (always()), so one layer breaking never
      # hides the other -- but either one going red fails the whole job.
      - name: Collect corridor sample
        # Exits non-zero on an incomplete corridor sample. The row is still
        # written, so the commit step (always()) captures it either way.
        run: python3 collector.py

      - name: Collect basis sample
        if: always()
        # Wide layer: exits non-zero ONLY on a total blackout (all venues down).
        # A partial pull is a success with source_ok=False holes.
        run: python3 collector_basis.py

      - name: Commit samples
        if: always()
        run: |
          git config user.name "margin-collector"
          git config user.email "actions@github.com"
          git add data/samples.csv data/basis.csv data/providers.csv
          if git diff --cached --quiet; then
            # Expected on the second fire of an hour the first fire already
            # captured. "Nothing staged" stopped meaning "rot" the moment the
            # schedule went twice-hourly, so ask the real question instead:
            # is the newest row still recent? Exits 1 if not (bash -e).
            echo "nothing staged -- hour already captured, checking freshness"
            python3 tools/check_freshness.py
            exit 0
          fi
          # commit BEFORE rebasing: git refuses `pull --rebase` with a staged index.
          git commit -m "sample $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin ${GITHUB_REF_NAME}
