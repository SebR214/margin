name: collect

on:
  # THIS WORKFLOW STARTS ITSELF. Every run ends by sleeping to the next :05 or
  # :35 and dispatching the next one with the built-in GITHUB_TOKEN, so the
  # chain needs no cron, no personal access token and nothing outside GitHub.
  # The schedule below is the RESTARTER, not the clock: it exists only to
  # revive the chain if a link dies, and a scheduled fire that finds the chain
  # already alive exits immediately without collecting. See "Am I needed".
  repository_dispatch:
    types: [collect]
  schedule:
    # RESTARTER. GitHub drops scheduled fires under load: 44 of 168 expected
    # hours went missing in the week to 2026-08-18 (~74% delivery), and it then
    # collapsed outright -- Aug 20-25 averaged 21 of 24 hours a day, Aug 27
    # delivered 2, and Aug 28 to Sep 1 ran between 3 and 7, with 5-to-8-hour
    # holes routine. Measured by tools/check_delivery.py; a dropped hour is
    # gone for good. Unreliable as a clock, which is why it is no longer used
    # as one -- but a trigger that fires eventually is all a restarter needs.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      chain:
        description: "true only when this run is the next link of a running chain"
        required: false
        default: "false"

permissions:
  contents: write
  # actions: write is what lets a run dispatch its successor.
  actions: write

# No concurrency group on purpose. The chain plus the restarter can overlap by
# design, and the "Am I needed" gate below is what resolves that -- a group
# would instead queue the restarter behind a running link for up to half an
# hour, which is the opposite of what a restarter is for. The collectors are
# idempotent per UTC hour, so an overlap costs nothing anyway.

jobs:
  collect:
    runs-on: ubuntu-latest
    # Up to ~30 minutes of that is the successor step sleeping to the next
    # slot. 45 leaves room for a full collection either side of a 29-minute
    # sleep without ever cutting the dispatch off.
    timeout-minutes: 45
    steps:
      # 3. THE GATE. A scheduled fire is a restarter, not a sample: if any link
      # of the chain is already running or queued, this run has nothing to do
      # and says so. Only a schedule can be redundant this way -- a dispatch was
      # asked for explicitly, by the chain itself or by a person, and always
      # proceeds.
      #
      # Runs BEFORE checkout: deciding whether to work needs no working tree,
      # and a redundant restarter should cost seconds, not a checkout and a pip
      # install.
      - name: Am I needed
        id: needed
        env:
          GH_TOKEN: ${{ github.token }}
          # REQUIRED, and the reason this step failed every scheduled fire
          # between 2026-09-02 14:39 and 15:5x: `gh` infers the repository from
          # the git remote, and this step runs BEFORE checkout on purpose, so
          # there is no remote to infer from -- "failed to determine base repo".
          # Dispatched runs never hit it (they exit above), so the chain kept
          # running and only the restarter was broken, which is the one failure
          # you would not notice until you needed it.
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "dispatched (${{ github.event_name }}) -- always proceeds"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any other run of THIS workflow still going, excluding this one.
          #
          # Asked by STATUS, not by scanning the newest N runs. The previous
          # version listed the 50 most recent and filtered them, which fails
          # exactly when it matters: a chain link sleeps for up to 30 minutes,
          # so under any burst it falls out of the newest-50 window and the gate
          # concludes "chain dead" while the chain is very much alive -- and
          # then starts another one. On 2026-09-05 a scheduled fire did exactly
          # that with ~20 chains running, which is part of how the pile-up grew.
          # Status-filtered queries have no window and cannot drift.
          alive=""
          for st in in_progress queued; do
            [ -n "$alive" ] && break
            alive=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/runs?status=$st&per_page=100" \
                      --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id] | first // \"\"")
          done
          if [ -n "$alive" ]; then
            echo "chain alive, run $alive"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "chain dead, restarting"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.needed.outputs.proceed == 'true'

      - uses: actions/setup-python@v5
        if: steps.needed.outputs.proceed == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.needed.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      # Two collectors, two layers, INDEPENDENT pass/fail. The basis step runs
      # even if the corridor step failed (always()), so one layer breaking never
      # hides the other -- but either one going red fails the whole job.
      - name: Collect corridor sample
        if: steps.needed.outputs.proceed == 'true'
        # Exits non-zero on an incomplete corridor sample. The row is still
        # written, so the commit step (always()) captures it either way.
        run: python3 collector.py

      - name: Collect corridor sample USD->MXN
        if: always() && steps.needed.outputs.proceed == 'true'
        # Second corridor, same method. always() so corridor 1 going red never
        # hides corridor 2 -- and the per-corridor idempotency gate means the
        # two never contend for the hour.
        run: python3 collector.py --corridor "USD->MXN"

      - name: Collect corridor sample AUD->PHP
        if: always() && steps.needed.outputs.proceed == 'true'
        # Same two venues as SGD->PHP and the same verified fee schedules, so
        # no new fee source enters the record. always() so one corridor going
        # red never hides another.
        run: python3 collector.py --corridor "AUD->PHP"

      - name: Collect corridor sample NZD->PHP
        if: always() && steps.needed.outputs.proceed == 'true'
        run: python3 collector.py --corridor "NZD->PHP"

      - name: Collect basis sample
        if: always() && steps.needed.outputs.proceed == 'true'
        # Wide layer: exits non-zero ONLY on a total blackout (all venues down).
        # A partial pull is a success with source_ok=False holes.
        run: python3 collector_basis.py

      - name: Collect P2P sample
        if: always() && steps.needed.outputs.proceed == 'true'
        # Capital-controlled markets, read off advertisement boards rather than
        # order books, in their own file. Same contract as the basis layer:
        # exits non-zero ONLY on a total blackout; a currency with no ads is a
        # source_ok=False row, which is a finding about that market.
        run: python3 collector_p2p.py

      - name: Collect provider quotes
        if: always() && steps.needed.outputs.proceed == 'true'
        # Quotes asked of the providers themselves, where they publish one, so
        # the comparison is not sourced entirely from a single competitor.
        # Exits non-zero only if nobody quoted at all.
        run: python3 collector_providers.py

      - name: Collect official exchange rates
        if: always() && steps.needed.outputs.proceed == 'true'
        # The denominator of every index figure, as a record of its own with the
        # source named. Runs after the price layers so it covers exactly the
        # currencies they collected. Exits non-zero only on a total blackout.
        run: python3 collector_fx.py

      - name: Emit machine-readable snapshot
        if: always() && steps.needed.outputs.proceed == 'true'
        # Derived from the CSVs the two steps above just wrote, so it runs after
        # both -- and always(), so a failed collector still refreshes the
        # snapshot from whatever did land. Exits non-zero only if it cannot
        # write the file.
        run: python3 tools/emit_latest.py

      - name: Emit the provider ranking
        if: always() && steps.needed.outputs.proceed == 'true'
        run: python3 tools/emit_providers.py

      - name: Emit the price-change record
        if: always() && steps.needed.outputs.proceed == 'true'
        # Append-only. A change is recorded only when a provider moved against
        # every other provider in its panel on the same day, so a move in the
        # reference rate -- which shifts the whole panel at once -- is silent.
        # See the docstring in tools/emit_price_changes.py.
        run: python3 tools/emit_price_changes.py

      - name: Emit the status of the machine
        if: always() && steps.needed.outputs.proceed == 'true'
        # Feeds /status.html. Derived entirely from files already in data/, so
        # if this page is wrong the rest of the site is wrong too -- which is
        # the point of having it.
        run: python3 tools/agent_status.py

      - name: Emit per-country index files and pages
        if: always() && steps.needed.outputs.proceed == 'true'
        # Derived from the CSVs the collectors just wrote. Implements
        # METHODOLOGY "The index, version 1"; writes data/countries/<CCY>.json,
        # data/index_latest.json and one page per country under c/. Exits
        # non-zero only if it cannot write.
        run: python3 tools/emit_countries.py

      - name: Emit receipts
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-56. Runs right after the per-country step so it reads what that
        # step just wrote (data/countries/<CCY>.json) alongside the raw CSVs
        # underneath it, and writes data/receipts/<CCY>.json: the evidence,
        # the official rate, the arithmetic and the evidence-rule check for
        # every currency, published or withheld. Exits non-zero only if it
        # cannot write.
        run: python3 tools/emit_receipts.py

      - name: Emit the stress signal
        if: always() && steps.needed.outputs.proceed == 'true'
        # Append-only. Checks data/countries/*.json (just written above)
        # against data/fx_rates.csv for a currency pulling away from its
        # official rate unexplained by the official rate itself moving --
        # the same check tools/agent_status.py already runs, kept here as a
        # public record instead of an internal one. See the docstring in
        # tools/emit_stress_signal.py.
        run: python3 tools/emit_stress_signal.py

      - name: Emit the P2P spread signal
        if: always() && steps.needed.outputs.proceed == 'true'
        # Append-only. Reads the buy/sell sides data/p2p_basis.csv already
        # collected above and records each reading's spread against its own
        # currency's prior history -- SEB-52. See the docstring in
        # tools/emit_spread_signal.py.
        run: python3 tools/emit_spread_signal.py

      - name: Emit the data manifest
        if: always() && steps.needed.outputs.proceed == 'true'
        # Runs after the per-country step so it reflects what that step just
        # wrote too. Reads every CSV, six snapshot files and data/countries/,
        # and writes data/manifest_latest.json -- the file data.html reads.
        # Exits non-zero only if it cannot write.
        run: python3 tools/emit_manifest.py

      - name: Emit the source list
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-62/U7. Reads data/index_latest.json and data/basis.csv -- both
        # already written above -- and writes data/sources_latest.json, the
        # file methodology.html's "How it works" reads to name what actually
        # priced this hour instead of a list someone typed once.
        run: python3 tools/emit_sources.py

      - name: Emit the browser dataset bundle
        if: always() && steps.needed.outputs.proceed == 'true'
        # SEB-40. Runs last of the emitters so it packages what every step
        # above just wrote: one parquet file per top-level CSV, plus the
        # country index flattened out of data/countries/*.json, into
        # data/bundle/ -- what a browser queries directly instead of hitting
        # the server. Exits non-zero if it cannot write, or if the bundle
        # grows past its 15 MB target; either way this step going red is the
        # point, not something to route around.
        run: python3 tools/emit_bundle.py

      - name: Commit samples
        if: always() && steps.needed.outputs.proceed == 'true'
        run: |
          git config user.name "margin-collector"
          git config user.email "actions@github.com"
          # Staged one at a time, and only if present. `git add` on a path
          # that does not exist yet is a fatal error (exit 128), and under
          # `bash -e` that kills the step BEFORE the freshness guard runs --
          # which is how adding data/stable_spread.csv to this list turned a
          # healthy no-op run red on 2026-09-02. A layer that has not written
          # its first row yet is a normal state, not a failure.
          for f in data/samples.csv data/basis.csv data/providers.csv \
                   data/providers_usdmxn.csv data/providers_audphp.csv \
                   data/providers_nzdphp.csv data/latest.json \
                   data/crosses_latest.json data/stable_spread.csv \
                   data/p2p_basis.csv data/p2p_sides.csv data/p2p_depth.csv \
                   data/p2p_offers.csv \
                   data/index_latest.json \
                   data/fx_rates.csv data/provider_quotes.csv \
                   data/providers_latest.json data/price_changes.csv \
                   data/price_changes_latest.json data/agent_status.json \
                   data/manifest_latest.json data/stress_signal.csv \
                   data/stress_signal_latest.json data/basis_history.csv \
                   data/fee_checks.csv data/withdrawal_fees.csv \
                   data/requests_latest.json data/stable_spread_summary.json \
                   data/p2p_spread_signal.csv data/p2p_spread_signal_latest.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          # Directories: one file per country, a page per country, one
          # receipt per country, and the bundle's parquet files + manifest. A
          # country (or a table emit_bundle.py starts writing) appears here
          # on its first run with no edit to this list -- which is the point
          # of staging the directory rather than naming the files.
          for d in data/countries data/receipts c data/bundle; do
            if [ -d "$d" ]; then git add "$d"; fi
          done
          # Anything TRACKED that an emitter rewrote but the list above forgot.
          # `git add -u` stages modifications to files already in the repo and
          # never picks up a new one, so this cannot repeat the `git add -A`
          # accident that swept in synced-folder duplicates -- a new file still
          # has to be named above to ever be committed.
          #
          # This exists because an omission here is silent and fatal: the step
          # commits, then rebases, and git refuses to rebase with unstaged
          # changes. data/stable_spread_summary.json was added by an emitter on
          # 2026-09-13 and left out of the list, and collection died for 21
          # hours -- readings that cannot be backfilled.
          MISSED=$(git diff --name-only -- data c)
          if [ -n "$MISSED" ]; then
            echo "::warning::staged by fallback, add these to the list above:"
            echo "$MISSED" | sed 's/^/::warning::  /'
            git add -u data c
          fi
          if git diff --cached --quiet; then
            # Expected on the second fire of an hour the first fire already
            # captured. latest.json is a pure function of the data (no wall
            # clock in it), so a no-op run really does stage nothing -- this
            # branch stays reachable instead of being papered over by a
            # timestamp-only diff.
            echo "nothing staged -- hour already captured"
          else
            # commit BEFORE rebasing: git refuses `pull --rebase` with a staged index.
            git commit -m "sample $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin ${GITHUB_REF_NAME}
          fi
          # Rot guard runs on EVERY fire, not just the ones that staged nothing:
          # whether the data is rotting has nothing to do with what this
          # particular run happened to stage. Runs LAST so a stale-data failure
          # still leaves the rows committed and pushed -- loud, but never at the
          # cost of a sample. Exits 1 if the newest row is too old (bash -e).
          python3 tools/check_freshness.py
          # SEB-60: a country's chart and its published number are meant to be
          # the same measurement -- this fails loudly if a future change to
          # tools/emit_countries.py ever lets them drift apart again, the way
          # daily_history() and latest_by_ccy() drifted before this fix.
          python3 tools/check_index_consistency.py

      # 5. THE LINK. What makes the chain a chain: sleep to the next slot, then
      # start the next run with the workflow's own GITHUB_TOKEN.
      #
      # This works because of one documented exception. GitHub, "Triggering a
      # workflow from a workflow":
      #
      #   "When you use the repository's GITHUB_TOKEN to perform tasks, events
      #    triggered by the GITHUB_TOKEN will not create a new workflow run,
      #    with the following exceptions: workflow_dispatch and
      #    repository_dispatch events always create workflow runs."
      #
      # always(), so a link is forged even when the collection above went red --
      # one bad hour must not end the chain. It runs AFTER the freshness guard
      # so a stale-data failure is still loud, and after the commit so a crash
      # here cannot cost a sample that was already pushed.
      # ONLY A CHAIN LINK FORGES THE NEXT ONE. This is what stops a stray
      # dispatch from becoming a second, permanent, self-perpetuating chain.
      #
      # On 2026-09-05 that is exactly what happened: a laptop reboot re-loaded
      # a launchd agent that POSTs repository_dispatch twice an hour, every one
      # of those runs dispatched a successor, and none of the resulting chains
      # ever died. They all sleep to the same :05/:35 slots, so they converged
      # and fired in clumps -- 41 concurrent runs before it was caught.
      #
      # So: a run continues the chain only if it IS the chain (dispatched with
      # chain=true) or is a scheduled fire starting a new one. Anything else --
      # a repository_dispatch, a bare `gh workflow run` -- collects its hour and
      # stops. Useful, harmless, one-shot. Checked here rather than by counting
      # live runs, because counting races: parent and successor overlap by
      # seconds at handover, and a "who is oldest" rule can kill the very chain
      # it is meant to protect.
      #
      # THE 2026-09-13/14 GAP: the "Am I needed" gate above is what tells two
      # would-be chains apart, and it only runs for a scheduled fire -- once a
      # run carries chain=true it forges the next link unconditionally, with no
      # re-check. That is fine in steady state, but it means the only place two
      # independent chains can ever be told apart is a check that itself races:
      # if two schedule fires both read "chain dead" before either run's own
      # existence is visible to the other's `runs?status=` query -- plausible
      # right after an outage, when several restarter fires land close together
      # -- each starts its own permanent chain, and nothing ever merges them
      # back down. That is what happened: two chains, still forming a moment
      # later on 2026-09-13, converged on the same :05/:35 slots and raced to
      # push the same commit -- 6 of 24 hours delivered instead of 24.
      #
      # So this step re-runs the same status-based check immediately before it
      # forges the next link, for every run, chain or schedule. It does not
      # carry the restarter's race: by the time a link reaches this line it has
      # been alive for the run's full duration (collection plus up to the
      # 30-minute sleep above), long past any propagation delay, so a sibling
      # chain is always visible by now. Two live chains each see the other here
      # and both stand down, rather than both re-forging -- worst case a gap
      # until the next restarter fire (<=30 min), never a permanent second
      # chain. A healthy single chain is unaffected: by the time a link reaches
      # this check, its own parent finished minutes ago, so it only ever sees
      # itself.
      - name: Dispatch successor
        if: >-
          always() && steps.needed.outputs.proceed == 'true'
          && (github.event_name == 'schedule' || github.event.inputs.chain == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          # Not strictly needed here -- this step runs after checkout, so `gh`
          # can infer the repo -- but the chain must not depend on a checkout
          # having succeeded to forge its next link.
          GH_REPO: ${{ github.repository }}
        run: |
          # Seconds until the next :05 or :35 UTC. Computed from the clock at
          # this instant, so a slow collection shortens the sleep instead of
          # pushing the whole chain later and later.
          now_m=$(date -u +%M); now_s=$(date -u +%S)
          now_m=$((10#$now_m)); now_s=$((10#$now_s))
          if   [ "$now_m" -lt 5  ]; then target=5
          elif [ "$now_m" -lt 35 ]; then target=35
          else target=65; fi          # 65 == :05 of the next hour
          wait=$(( (target - now_m) * 60 - now_s ))
          [ "$wait" -lt 5 ] && wait=5   # never dispatch into the slot just left
          echo "now $(date -u +%H:%M:%SZ), next slot :$(printf '%02d' $((target % 60))), sleeping ${wait}s"
          sleep "$wait"

          # Re-check right before forging -- see "THE 2026-09-13/14 GAP" above.
          # Same status-by-API check as "Am I needed", excluding this run.
          alive=""
          for st in in_progress queued; do
            [ -n "$alive" ] && break
            alive=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/collect.yml/runs?status=$st&per_page=100" \
                      --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id] | first // \"\"")
          done
          if [ -n "$alive" ]; then
            echo "another link already alive (run $alive) -- standing down instead of forking a second chain"
            exit 0
          fi

          # A failed dispatch breaks the chain, so it must be LOUD: the run goes
          # red, and the schedule's next fire finds no link alive and restarts.
          # That is the whole recovery path, so it must never be swallowed.
          gh workflow run collect.yml --ref main -f chain=true
          # `gh workflow run` prints no id, so read it back. Best effort only --
          # the dispatch is what matters and a slow-to-appear run must not fail
          # a step that already succeeded.
          sleep 5
          new_id=$(gh run list --workflow=collect.yml --limit 10 \
                     --json databaseId,event,status \
                     --jq '[.[] | select(.event == "workflow_dispatch")
                                | select(.status == "in_progress" or .status == "queued")
                                | .databaseId] | first // ""' || true)
          echo "successor dispatched: run ${new_id:-<id not yet visible>}"
