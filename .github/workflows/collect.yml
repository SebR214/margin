name: collect

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect sample
        # collector exits non-zero on an incomplete sample -> job fails loudly.
        # The row is still written, so commit it either way (see always()).
        run: python3 collector.py

      - name: Commit sample
        if: always()
        run: |
          git config user.name "margin-collector"
          git config user.email "actions@github.com"
          git add data/samples.csv
          if git diff --cached --quiet; then
            echo "no new data -- failing so this never rots silently"
            exit 1
          fi
          # commit BEFORE rebasing: git refuses `pull --rebase` with a staged index.
          git commit -m "sample $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin ${GITHUB_REF_NAME}
