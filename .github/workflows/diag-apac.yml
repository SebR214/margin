name: Diag APAC
on:
  push:
    branches: [apac]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wise comparison API — which APAC corridors return providers
        run: |
          python3 - <<'PY'
          import json, urllib.request, time
          UA={"User-Agent":"margin.wiki/1.0 (+https://margin.wiki)"}
          PAIRS=[("SGD","IDR"),("SGD","INR"),("SGD","MYR"),("SGD","VND"),("SGD","BDT"),
                 ("AUD","PHP"),("HKD","PHP"),("SGD","THB"),("SGD","LKR"),("SGD","NPR"),
                 ("SGD","PKR"),("SGD","CNY"),("AUD","IDR"),("AUD","INR"),("HKD","IDR"),
                 ("JPY","PHP"),("NZD","PHP"),("SGD","PHP"),("USD","MXN")]
          for a,b in PAIRS:
              u=(f"https://api.transferwise.com/v3/comparisons/?sourceCurrency={a}"
                 f"&targetCurrency={b}&sendAmount=1000")
              try:
                  d=json.load(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=25))
                  ps=d.get("providers") or []
                  names=[p.get("name") for p in ps]
                  wise = "Wise" in names
                  print(f"WISE {a}->{b:4} {len(ps):2} providers  wise={'Y' if wise else 'N'}  {', '.join(names[:5])}")
              except Exception as e:
                  print(f"WISE {a}->{b:4} FAIL {type(e).__name__}: {str(e)[:60]}")
              time.sleep(0.6)
          PY
      - name: Exchange order books — APAC
        run: |
          probe() {
            out=$(curl -s -m 18 -w '\n__H__%{http_code}' -H 'User-Agent: Mozilla/5.0 (compatible; margin.wiki/1.0)' -H 'accept: application/json' "$2" 2>&1 || echo "__H__curl-fail")
            code=$(printf '%s' "$out" | tail -1 | sed 's/__H__//')
            body=$(printf '%s' "$out" | sed '$d' | head -c 190 | tr -d '\n')
            printf 'BOOK %-22s %-5s %s\n' "$1" "$code" "$body"
          }
          probe coinhako-SGD   "https://api.coinhako.com/v1/tickers"
          probe luno-MYR       "https://api.luno.com/api/1/ticker?pair=USDTMYR"
          probe luno-XBTMYR    "https://api.luno.com/api/1/ticker?pair=XBTMYR"
          probe luno-ZAR       "https://api.luno.com/api/1/ticker?pair=USDTZAR"
          probe indpres-AUD    "https://api.independentreserve.com/Public/GetMarketSummary?primaryCurrencyCode=Usdt&secondaryCurrencyCode=Aud"
          probe indpres-NZD    "https://api.independentreserve.com/Public/GetMarketSummary?primaryCurrencyCode=Usdt&secondaryCurrencyCode=Nzd"
          probe bitopro-TWD    "https://api.bitopro.com/v3/tickers/usdt_twd"
          probe max-TWD        "https://max-api.maicoin.com/api/v2/tickers/usdttwd"
          probe coindcx-INR    "https://api.coindcx.com/exchange/ticker"
          probe wazirx-INR     "https://api.wazirx.com/api/v2/tickers/usdtinr"
          probe bitbank-JPY    "https://public.bitbank.cc/usdt_jpy/ticker"
          probe bitflyer-JPY   "https://api.bitflyer.com/v1/ticker?product_code=BTC_JPY"
          probe coincheck-JPY  "https://coincheck.com/api/ticker"
          probe indodax-IDR    "https://indodax.com/api/usdt_idr/ticker"
          probe zipmex-THB     "https://api.zipmex.com/v1/ticker"
