name: researcher

# SEB-301, Seb's plan of 25 Oct. The only scheduled model that proposes work. Once a week tools/researcher.py reads the data-gap report
# (tools/gap_report.py, plain code), ROADMAP.md and the backlog titles, makes one Sonnet call through OpenRouter (two if the first
# answer breaks a rule) and writes 3 jobs to the end of BACKLOG.md that the Aider builder can build: new files only, each with its own
# test (tools/job_shape.py). About $0.30 a run, inside the $20 month for all agents. Replaces scout.yml and weekly_planner.yml.
#
# Monday 00:17 UTC (08:17 SGT), before the builder's first slot. A second slot because GitHub drops scheduled runs; the script does
# nothing if it already ran in the last 6 days. Watched by watchdog.yml (tools/check_researcher_health.py).
on:
  schedule:
    - cron: "17 0 * * 1"
    - cron: "47 3 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: print the jobs and the checks, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: researcher
      cancel-in-progress: false
    steps:
      # persist-credentials: false so pushes go out as the app (main refuses GITHUB_TOKEN pushes, see one_call.yml).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mint the app token
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Self-test
        run: python3 tools/researcher.py --self-test

      - name: Researcher
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        run: python3 tools/researcher.py $DRY $FORCE

      # The log, the gap report and the spend are committed even when the call failed.
      - name: Commit the jobs, the log and the spend
        if: always() && github.event.inputs.dry_run != 'true'
        env:
          GH_PUSH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git config user.name "margin-agents[bot]"
          git config user.email "329969015+margin-agents[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git add BACKLOG.md data/researcher_log.csv data/gap_report.json data/agent_spend.csv 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "researcher: jobs and log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push the researcher's jobs"; exit 1
