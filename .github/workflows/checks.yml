name: checks

# PR-time gate. Nothing else in this repo runs on pull_request today --
# collect.yml, fees.yml and collector_watchdog.yml are all schedule-driven
# collection/health jobs, not code review. That gap is how PR #160 ("D3: how
# it works rewrite...") landed and quietly deleted the homepage's waterfall
# chart and its full corridor table: nothing automated ever looked at the
# diff, only a person noticing after the fact caught it (and it was later
# reverted). This workflow is that missing check.
#
# tools/check_inventory.py is the specific gate for that regression: it fails
# the PR if any page's chart/table/interactive-element count drops below the
# committed page_inventory.json baseline (see that script's own docstring
# for what "baseline" means here -- commit 7078efd09, the last commit before
# PR #160 landed).
#
# tools/check_copy.py, tools/check_index_consistency.py and
# tools/check_wise_share.py (SOURCES task 4 -- the single-company
# dependency ceiling: fails a PR that raises the share of published prices
# depending on one external company, Wise, above the committed baseline in
# tools/wise_share_baseline.json) are included too -- all three are
# stdlib-only, need no live network call and no browser, and were
# previously runnable by hand only. Not included: tools/check_page.py
# (needs a real Chromium via CDP -- a browser dependency this workflow does
# not set up, left for a follow-up rather than risking a red PR build over
# missing infrastructure unrelated to the diff under review), and
# tools/check_fees.py / check_freshness.py / check_delivery.py /
# check_collector_health.py / check_ask.py, which check the health of the
# live collection pipeline and a real model backend, not the correctness of
# a PR's diff -- collect.yml and collector_watchdog.yml already own that.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inventory gate (no page may lose charts, tables or interactive elements)
        run: python3 tools/check_inventory.py

      - name: No duplicate files (name N.ext)
        run: |
          python3 tools/check_junk_files.py --self-test
          python3 tools/check_junk_files.py

      - name: Plain-language gate (no payments jargon in headings/nav/labels)
        run: python3 tools/check_copy.py

      - name: A bad board row is refused at collection (SEB-302)
        run: |
          python3 board_guard.py --self-test
          python3 collector_p2p.py --selftest
          python3 collector_p2p_okx.py --selftest

      - name: Source pairs, one source and lasting gaps (SEB-302)
        run: python3 tools/emit_source_pairs.py --self-test

      - name: A new source waits in quarantine (SEB-302)
        run: |
          python3 tools/source_gate.py --self-test
          python3 tools/check_source_gate.py

      - name: Route steps add up to the path that was priced (SEB-268)
        run: python3 tools/emit_routes.py --self-test
      - name: Every Binance P2P ad is read, paged and capped (SEB-311)
        run: python3 collector_p2p_ads.py --selftest

      - name: Seller ids are hashed, keyed to the ads file (SEB-384)
        run: python3 collector_p2p_sellers.py --selftest

      - name: Money-changer trackers parse and guard (SEB-422)
        run: |
          python3 collector_cash.py --selftest
          python3 tools/pull_cash_history.py --self-test

      - name: The big P2P tables are one file a day, and a file near 100 MB fails before the commit (SEB-301)
        run: |
          python3 tools/daily_csv.py --self-test
          python3 tools/check_file_size.py --self-test
          python3 tools/check_collector_health.py --self-test

      - name: The devaluation-watch backtest rules and its kill rule (SEB-384)
        run: python3 tools/backtest_watch.py --selftest

      - name: The dollar map timeline rules (SEB-384)
        run: python3 tools/emit_map_timeline.py --selftest

      - name: The map timeline files agree with the files they come from (SEB-384)
        run: python3 tests/check_map_timeline.py
      - name: A pair that loses stablecoin pricing fails the fee check (SEB-310)
        run: python3 tests/check_stable_pair.py
      - name: A broken official rate never counts as a stress trigger (SEB-301)
        run: python3 tests/check_stress_retest.py
      - name: The Binance and OKX disagreement diagnosis labels fixtures and runs on the real files (BACKLOG 20a)
        run: python3 tests/agent_diagnose_disagree.py
      - name: The capital-controls meter matches a recomputation from the history files (SEB-301)
        run: python3 tests/check_research_capital_controls.py
      - name: A finding shows its retest status only after 14 days of rows (SEB-301)
        run: python3 tests/check_finding_status.py
      - name: The finding status tool builds (SEB-301)
        run: python3 tools/emit_finding_status.py --self-test
      - name: The second official rate parses, flags a broken read and compares with er-api (BACKLOG 10)
        run: python3 collector_fx_second.py --selftest
      - name: The first-venue collectors parse, guard a crossed or thin book and count ads at USD 500 (SEB-301, BACKLOG 17)
        run: |
          python3 collector_zar_valr.py --selftest
          python3 collector_zar_luno.py --selftest
          python3 collector_p2p_kucoin.py --selftest
      - name: The event detector, four tests on the stored history (SEB-311)
        run: |
          python3 tools/detect_events.py --self-test
          python3 tests/check_events.py
      - name: The replay finds the known breaks and misses Nigeria for its stated reason (SEB-311 step 3c)
        run: python3 tests/check_known_breaks.py
      - name: The routes table sums its steps (SEB-310)
        run: python3 tools/emit_routes_table.py --self-test
      - name: The Research claims pass on the files and fail on a wrong number (SEB-423)
        run: python3 tests/check_research_claims.py
      - name: A sudden flip is held back (SEB-302)
        run: python3 tools/check_flip_hold.py

      - name: Crossed boards, each rule proved with a bad row (SEB-302, v1.5)
        run: python3 tools/check_crossed_boards.py


      - name: No Opus or Fable model in code (SEB-301)
        run: python3 tools/check_models.py

      - name: The model caller refuses what it must (SEB-301)
        run: python3 tools/llm.py --self-test

      - name: Status and watchdog helpers (SEB-301)
        run: |
          python3 tools/check_audit_health.py --self-test

      - name: The gap report and the job rules (SEB-301, SEB-422)
        run: |
          python3 tools/gap_report.py --self-test
          python3 tools/job_shape.py --self-test

      - name: Every test an agent job added (tests/agent_*.py)
        run: python3 tools/run_agent_tests.py

      - name: The watchdog posts once per outage (SEB-301)
        run: python3 tools/watchdog_post.py --self-test

      - name: The depth record feeds nothing published, and its report works (SEB-302)
        run: |
          python3 collector_depth.py --selftest
          python3 tools/report_depth.py --self-test
          python3 tools/check_depth_feeds_nothing.py

      - name: The finding tests run, and a finding that stops being true is called so (ROADMAP step 2)
        run: python3 tools/retest_findings.py --self-test

      - name: The build backlog parses, ticks and syncs (SEB-301)
        run: python3 tools/backlog.py --self-test

      - name: The Aider builder and its test command (SEB-301, track A)
        run: python3 tools/aider_builder.py --self-test

      - name: The daily builder shapes a backlog job and finds its PR (SEB-301)
        run: |
          python3 tools/one_call.py --self-test
          python3 tools/waiting_on_seb.py --self-test

      - name: Design ratchet (a page may not get louder - caps, heavy weights, off-palette colours)
        run: python3 tools/check_design.py

      - name: History isolation (labelled history never feeds the index or a published price)
        run: python3 tools/check_history_isolation.py

      - name: Home, sources and findings emitters (invariants on the stored data, offline)
        run: python3 tests/check_home_emitters.py

      - name: A new route in collector.CORRIDORS reaches the Routes page with no other edit
        run: python3 tests/check_new_route.py

      - name: The live official rate collector and the broken-rate check parse and flag (SEB-310)
        run: |
          python3 collector_official_live.py --selftest
          python3 tests/check_official_rates.py

      - name: Index consistency (published figures match their own charts)
        run: python3 tools/check_index_consistency.py

      - name: Single-company dependency ceiling (Wise share must not rise)
        run: python3 tools/check_wise_share.py

  # SEB-302. A PR that changes an emitter may not change a published number in
  # silence: it must also change METHODOLOGY.md and bump INDEX_VERSION. The check
  # runs the emitter on the same data with the base code and the PR's code, and
  # runs from the BASE branch's copy so a PR cannot edit its own judge.
  method-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Method changes are documented
        run: |
          git show "origin/${{ github.base_ref }}:tools/check_method_change.py" > "$RUNNER_TEMP/check_method_change.py" 2>/dev/null \
            || cp tools/check_method_change.py "$RUNNER_TEMP/check_method_change.py"
          # use the base branch's judge, in place, so its ROOT is this checkout
          cp "$RUNNER_TEMP/check_method_change.py" tools/check_method_change.py
          python3 tools/check_method_change.py --self-test
          python3 tools/check_method_change.py --base "origin/${{ github.base_ref }}"

  # Collection code (SEB-301, Seb's merge rule of 20 Oct). A PR that touches collector*.py or collect.yml is judged here:
  # if it is additive (tools/check_additive.py: new collector files and new sidecar CSVs, collect.yml only grows), one full
  # collection run on the branch must pass (tools/check_collection_run.py: no file's columns change, every source that answers
  # on main answers here). A PR that is not additive is not run here: automerge.yml leaves it open and the daily status lists it.
  # A PR that touches no collection code passes this job in seconds.
  collector-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # a newer push to the same PR cancels the older full collection run: two at once would call every exchange twice
    concurrency:
      group: collector-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Does it touch collection code, and is it additive
        id: scope
        run: |
          python3 tools/check_additive.py --self-test
          python3 tools/check_collection_run.py --self-test
          python3 tools/check_additive.py --base "origin/${{ github.base_ref }}" --json | tee verdict.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          v = json.load(open("verdict.json"))
          print("run=%s" % ("true" if v["touches_collection_code"] and v["additive"] else "false"))
          PY

      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Install Playwright browser (WorldRemit render path)
        if: steps.scope.outputs.run == 'true'
        run: playwright install --with-deps chromium

      - name: One full collection run on the branch
        if: steps.scope.outputs.run == 'true'
        run: python3 tools/check_collection_run.py

  # Words belong to the writer agent. Fails a PR that changes copy.json or adds
  # reader-facing text to html/js unless it is a writer PR the owner approved.
  # Runs the check from the BASE branch so the PR cannot edit its own judge.
  copy-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy lock (base-branch copy of the check)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LOCK_ROOT: ${{ github.workspace }}
        run: |
          git show "origin/${{ github.base_ref }}:tools/check_copy_lock.py" > "$RUNNER_TEMP/check_copy_lock.py" 2>/dev/null \
            || cp tools/check_copy_lock.py "$RUNNER_TEMP/check_copy_lock.py"
          python3 "$RUNNER_TEMP/check_copy_lock.py" --self-test
          python3 "$RUNNER_TEMP/check_copy_lock.py" --base "origin/${{ github.base_ref }}"

  # The two reader-facing merge gates (tools/check_rendered.py and
  # tools/check_cold_reader.py). They run for PRs that touch html, css, js or the
  # copy deck, and their self-tests also run when the gates themselves change.
  reader-facing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: What does this PR touch?
        id: scope
        run: |
          touched=false; gates=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
            if echo "$files" | grep -vE '^(docs|tests)/' | grep -qE '(^|/)[^/]+\.(html|css|js)$|^copy\.json$'; then touched=true; fi
            if echo "$files" | grep -qE '^tools/(check_rendered|check_cold_reader|gate_common)\.py$|^tests/(bad|jargon)_page\.html$|^tools/rendered_baseline\.json$'; then gates=true; fi
          fi
          echo "touched=$touched" >> "$GITHUB_OUTPUT"
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          if [ "$touched" = true ] || [ "$gates" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - name: Gate 1 self-test (the rendered check must fail tests/bad_page.html)
        if: steps.scope.outputs.run == 'true'
        run: python3 tools/check_rendered.py --self-test

      - name: Gate 1 - rendered style check (390px and 1280px)
        id: render
        if: steps.scope.outputs.touched == 'true'
        continue-on-error: true
        run: |
          set +e
          python3 tools/check_rendered.py --base "origin/${{ github.base_ref }}" | tee rendered.txt
          exit ${PIPESTATUS[0]}

      - name: Page style, every page matches home
        if: steps.scope.outputs.touched == 'true'
        run: python3 tools/check_design.py --style

      - name: Nothing wider than the screen at 390px
        if: steps.scope.outputs.touched == 'true'
        run: python3 tools/check_design.py --overflow

      - name: No line ends with one word, home counters on one line (SEB-301)
        if: steps.scope.outputs.touched == 'true'
        run: python3 tools/check_design.py --lines

      - name: Two counts of the same thing on the home page agree (SEB-310)
        if: steps.scope.outputs.touched == 'true'
        run: python3 tools/check_design.py --counts

      - name: Post the rendered check's list to the PR
        if: steps.render.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "### Rendered style check failed"; echo; echo '```'; cat rendered.txt; echo '```'; } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md

      - name: Fail the merge if the rendered check failed
        if: steps.render.outcome == 'failure'
        run: exit 1

  # The cold-reader job was turned off (SEB-301) but the branch ruleset on main still lists a required check named
  # "cold-reader". This empty job keeps that name reporting so a PR can merge. It runs no model and checks nothing.
  # Remove it when the ruleset stops requiring the name.
  cold-reader:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "cold reader retired (SEB-301); this job only keeps the required check name reporting"
