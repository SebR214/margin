name: daily status

# SEB-301. Once a day a script posts a status comment on SEB-301, written from
# the logs and GitHub's own records. No model call. Start it by hand with
# print_only=true to see the text in the run log without posting.

on:
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 14 * * *"      # a second slot: the status itself posts once a day, but the one-day depth table should not wait a day more
  workflow_dispatch:
    inputs:
      print_only:
        description: "Print the status in the run log, do not post it"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

# one run at a time: two overlapping runs could both pass the once-a-day check
concurrency:
  group: daily-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 200
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-test
        run: |
          python3 tools/daily_status.py --self-test
          python3 tools/waiting_on_seb.py --self-test
      - name: Post the status
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_ACTIVITY_LOG_PATH: ${{ runner.temp }}/linear_activity.jsonl
          PRINT_ONLY: ${{ github.event.inputs.print_only == 'true' && '--print' || '' }}
        run: python3 tools/daily_status.py $PRINT_ONLY

      # One email if anything has waited on Seb for more than 24 hours, and only when the list changed (tools/waiting_on_seb.py).
      # Seb's depth rule: once 24 clean hours of order-book rows are stored, the one-day table goes on SEB-302, once.
      - name: One-day depth table
        if: github.event.inputs.print_only != 'true'
        continue-on-error: true
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_ACTIVITY_LOG_PATH: ${{ runner.temp }}/linear_activity.jsonl
        run: python3 tools/report_depth.py --post-when-ready

      - name: Waiting on Seb
        if: github.event.inputs.print_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_ACTIVITY_LOG_PATH: ${{ runner.temp }}/linear_activity.jsonl
        run: python3 tools/waiting_on_seb.py
