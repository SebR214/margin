name: Diag FX
on:
  push:
    branches: [fx-intraday]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, time
          UA={"User-Agent":"margin.wiki fx-probe/1.0 (+https://margin.wiki)"}
          WANT=["ARS","VES","LBP","SDG","DZD","SYP","IQD","AFN","MZN","ETB","NGN","AOA",
                "UAH","TND","KRW","IDR","THB","PHP","SGD","MXN","BRL","TRY","INR","ZAR",
                "PKR","BDT","VND","KES","EGP","BOB","XOF","XAF","KZT","LKR","MAD","QAR"]
          def get(u):
              try:
                  r=urllib.request.Request(u,headers=UA)
                  raw=urllib.request.urlopen(r,timeout=25).read()
                  return raw
              except Exception as e:
                  return e
          def report(name, u, extract):
              raw=get(u)
              if isinstance(raw, Exception):
                  print(f"{name:22} FAIL {type(raw).__name__}: {str(raw)[:80]}"); return
              try:
                  rates, stamp = extract(raw)
              except Exception as e:
                  print(f"{name:22} PARSE-FAIL {type(e).__name__}: {str(e)[:70]} body={raw[:90]}"); return
              have=[c for c in WANT if c in rates]
              print(f"{name:22} OK   {len(rates):4} currencies | {len(have)}/{len(WANT)} of ours | stamp={stamp}")
              print(f"{'':22}      missing: {' '.join(c for c in WANT if c not in rates) or 'none'}")
          def j(raw): return json.loads(raw)
          report("frankfurter.app", "https://api.frankfurter.app/latest?base=USD",
                 lambda r: (j(r)["rates"], j(r).get("date")))
          report("frankfurter.dev",  "https://api.frankfurter.dev/v1/latest?base=USD",
                 lambda r: (j(r)["rates"], j(r).get("date")))
          report("open.er-api",     "https://open.er-api.com/v6/latest/USD",
                 lambda r: (j(r)["rates"], j(r).get("time_last_update_utc")))
          report("exchangerate.host","https://api.exchangerate.host/latest?base=USD",
                 lambda r: (j(r)["rates"], j(r).get("date")))
          def ecb(raw):
              import xml.etree.ElementTree as ET
              t=ET.fromstring(raw); ns={"g":"http://www.gesmes.org/xml/2002-08-01",
                                        "e":"http://www.ecb.int/vocabulary/2002-08-01/eurofxref"}
              cube=t.find(".//e:Cube[@time]",ns); d=cube.get("time")
              rates={c.get("currency"): float(c.get("rate")) for c in cube.findall("e:Cube",ns)}
              usd=rates["USD"]
              return ({k: v/usd for k,v in rates.items()}, d)
          report("ECB reference feed","https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml", ecb)
          # how often does each change? poll er-api + frankfurter twice, 40s apart
          print("\n--- update cadence: two polls 40s apart ---")
          for name,u,key in (("open.er-api","https://open.er-api.com/v6/latest/USD","time_last_update_unix"),
                             ("frankfurter","https://api.frankfurter.app/latest?base=USD","date")):
              a=get(u); time.sleep(40); b=get(u)
              try:
                  ja,jb=json.loads(a),json.loads(b)
                  print(f"  {name:14} {key}: {ja.get(key)} -> {jb.get(key)}  "
                        f"ARS {ja['rates'].get('ARS')} -> {jb['rates'].get('ARS')}")
              except Exception as e: print(f"  {name} cadence check failed: {e}")
          PY
