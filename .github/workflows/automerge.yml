name: automerge

# Agents run the site (Seb, 8 Oct). When the PR checks finish green on a PR
# that names a Linear issue (SEB-<n>) in its title, it merges. No model, no
# reviewer, no human label. Seb approved the page when he approved the spec.
# A red check still stops the merge and stays visible on the PR.

on:
  workflow_run:
    workflows: [checks]
    types: [completed]

permissions:
  contents: read

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: agents

      - name: Mint the app token
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Merge if it names a spec and every check passed
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
                 --jq '[.[] | select(.state=="open" and .base.ref=="main" and (.draft|not))][0]')
          [ -z "$pr" ] || [ "$pr" = "null" ] && { echo "no open PR for $SHA"; exit 0; }
          n=$(echo "$pr" | jq -r .number); title=$(echo "$pr" | jq -r .title)
          head=$(echo "$pr" | jq -r .head.sha)
          [ "$head" = "$SHA" ] || { echo "#$n has a newer push, its own checks will decide"; exit 0; }
          echo "$title" | grep -qE '\bSEB-[0-9]+\b' || { echo "#$n names no SEB issue, left for Seb"; exit 0; }
          # Collection history cannot be refilled, so a PR that changes collection code
          # (collector*.py or collect.yml) is never merged by this workflow. It stays open
          # and the daily status on SEB-301 lists it (SEB-301).
          if gh api "repos/$GITHUB_REPOSITORY/pulls/$n/files" --paginate --jq '.[].filename' \
               | grep -qE '^collector[^/]*\.py$|^\.github/workflows/collect\.yml$'; then
            echo "#$n changes collection code, left open for a person"; exit 0
          fi
          bad=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
                  --jq '[.check_runs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")] | length')
          [ "$bad" = "0" ] || { echo "#$n has $bad check(s) not green"; exit 0; }
          gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$n/merge" -f merge_method=squash -f sha="$SHA" --jq '"merged #'$n': \(.merged)"'
          # a builder PR (branch one-call/<issue>) that merged: its Linear issue is Done (SEB-301)
          ref=$(echo "$pr" | jq -r .head.ref)
          case "$ref" in one-call/*)
            key=$(echo "$title" | grep -oE '\bSEB-[0-9]+\b' | head -1)
            LINEAR_API_KEY="$LINEAR_API_KEY" python3 agents/linear_sync.py merged "$key" "$n" || echo "could not update $key in Linear" ;;
          esac

  # A builder PR whose checks failed: its Linear issue gets `needs-claude`, so the
  # runner leaves it and the Scout does not wait on it (SEB-301). Other PRs are untouched.
  failed:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: agents

      - name: Label the issue
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" \
                 --jq '[.[] | select(.state=="open" and .base.ref=="main")][0]')
          [ -z "$pr" ] || [ "$pr" = "null" ] && { echo "no open PR for $SHA"; exit 0; }
          ref=$(echo "$pr" | jq -r .head.ref)
          case "$ref" in one-call/*) ;; *) echo "not a builder PR"; exit 0 ;; esac
          n=$(echo "$pr" | jq -r .number); title=$(echo "$pr" | jq -r .title)
          key=$(echo "$title" | grep -oE '\bSEB-[0-9]+\b' | head -1)
          [ -n "$key" ] || { echo "no issue named"; exit 0; }
          what=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
                   --jq '[.check_runs[] | select(.conclusion=="failure") | .name] | join(", ")')
          python3 agents/linear_sync.py failed "$key" "$n" "$what"
