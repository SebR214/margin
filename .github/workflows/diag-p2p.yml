name: Diag P2P
on:
  push:
    branches: [p2p-layer]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Binance P2P
        run: |
          for ccy in NGN EGP PKR BDT VND KES GHS BOB LBP ETB; do
            code=$(curl -s -o /tmp/b.json -w '%{http_code}' -m 20 -X POST \
              'https://p2p.binance.com/bapi/c2c/v2/friendly/c2c/adv/search' \
              -H 'content-type: application/json' \
              -H 'User-Agent: Mozilla/5.0 (compatible; margin.wiki/1.0; +https://margin.wiki)' \
              -d "{\"page\":1,\"rows\":10,\"asset\":\"USDT\",\"tradeType\":\"BUY\",\"fiat\":\"$ccy\",\"payTypes\":[],\"publisherType\":null}")
            n=$(python3 -c "import json;d=json.load(open('/tmp/b.json'));print(len(d.get('data') or []))" 2>/dev/null || echo parse-fail)
            printf 'BINANCE %-4s %-4s ads=%s %s\n' "$ccy" "$code" "$n" "$(head -c 110 /tmp/b.json | tr -d '\n')"
          done
      - name: Bybit P2P
        run: |
          for ccy in NGN EGP PKR BDT VND KES GHS BOB LBP ETB; do
            code=$(curl -s -o /tmp/y.json -w '%{http_code}' -m 20 -X POST \
              'https://api2.bybit.com/fiat/otc/item/online' \
              -H 'content-type: application/json' \
              -H 'User-Agent: Mozilla/5.0 (compatible; margin.wiki/1.0; +https://margin.wiki)' \
              -d "{\"userId\":\"\",\"tokenId\":\"USDT\",\"currencyId\":\"$ccy\",\"payment\":[],\"side\":\"1\",\"size\":\"10\",\"page\":\"1\",\"amount\":\"\"}")
            n=$(python3 -c "import json;d=json.load(open('/tmp/y.json'));print(len((d.get('result') or {}).get('items') or []))" 2>/dev/null || echo parse-fail)
            printf 'BYBIT %-4s %-4s ads=%s %s\n' "$ccy" "$code" "$n" "$(head -c 110 /tmp/y.json | tr -d '\n')"
          done
