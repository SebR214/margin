name: weekly planner

# SEB-301. Mondays 07:00 UTC, no model: tools/weekly_planner.py counts the logs and posts one line on SEB-301 with items shipped
# and cost per track (A: Aider builder, B: one-call builder), and the jobs waiting for Claude.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post the weekly line
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: python3 tools/weekly_planner.py
