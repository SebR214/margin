name: copy-build

# The words are edited in copy/<page>.json (one file per page, so two PRs on
# different pages never conflict). The pages fetch ./copy.json, so it stays
# committed on main, generated from copy/ by tools/build_copy.py. PRs do not
# edit it. This job rebuilds and commits it after a merge that touched copy/,
# as the margin-agents App (same pattern as collect.yml, so it can write to
# main). Its own commit touches copy.json only, which this path filter ignores,
# so it cannot trigger itself. Until it lands (about a minute) main's copy.json
# is the previous merge's.

on:
  push:
    branches: [main]
    paths:
      - "copy/**"
      - "tools/build_copy.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: copy-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase 5: see collect.yml's checkout step for why.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build copy.json
        run: python3 tools/build_copy.py

      - name: Mint GitHub App token
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Commit copy.json
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set +x
          git config user.name "margin-agents[bot]"
          git config user.email "329969015+margin-agents[bot]@users.noreply.github.com"
          git add copy.json
          if git diff --cached --quiet; then
            echo "copy.json already matches copy/"
            exit 0
          fi
          git commit -m "copy.json: rebuild from copy/"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
            pull --rebase origin "${GITHUB_REF_NAME}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
            push origin "${GITHUB_REF_NAME}"
