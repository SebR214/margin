name: fees

on:
  schedule:
    # Monthly, on the 1st. Minute 23 on purpose: GitHub drops top-of-hour
    # scheduled jobs under load, and this one only fires twelve times a year --
    # a dropped fire is a whole month without a fee check.
    - cron: "23 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fees
  cancel-in-progress: false

jobs:
  fees:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Phase 5: see collect.yml's checkout step for why -- checkout's
          # own persisted credential collides with the App token's push
          # header on the same git config key otherwise ("Duplicate header:
          # Authorization", found live 2026-09-26).
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check published fee schedules
        # Exits non-zero on any drift or unreadable page. The rows are written
        # before it exits, so the commit step below captures them either way.
        run: python3 tools/check_fees.py

      # Phase 5, same pattern as collect.yml's "Mint GitHub App token" -- see
      # the comment there for why (SEB-51/agents/gh_token.sh) and how the PEM
      # secret becomes the file the script expects.
      - name: Mint GitHub App token
        if: always()
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Commit fee checks
        # always(): a mismatch is exactly the run whose evidence must survive.
        # The job still reports the failure -- this step preserves the row, it
        # does not rescue the result.
        #
        # All three files, always together: check_fees.py writes
        # fee_checks.csv, withdrawal_fees.csv AND fee_tier_schedule.csv in
        # the same run. Staging only some of them left the rest
        # modified-but-uncommitted, which made `git pull --rebase` below
        # refuse to run ("You have unstaged changes") and abort the whole step
        # -- discarding the commit that had just been made, on an ephemeral
        # runner, with nothing left to retry. That is exactly how the 2026-09-01
        # run lost its evidence (SEB-36) -- and exactly the failure mode a new
        # emitted file left off this list repeats, per START-HERE.md's own
        # "an emitted file left out of collect.yml's staging list kills
        # collection" lesson. Named explicitly on purpose (never `git add -A`
        # -- see BUILDER.md on synced-folder duplicates), so any FOURTH file
        # this script starts writing has to be added here too, not silently.
        if: always()
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set +x
          git config user.name "margin-agents[bot]"
          # See collect.yml's "Commit samples" step for why this is the bot
          # user's account id (329969015), not MARGIN_GH_APP_ID.
          git config user.email "329969015+margin-agents[bot]@users.noreply.github.com"
          git add data/fee_checks.csv data/withdrawal_fees.csv data/fee_tier_schedule.csv
          if git diff --cached --quiet; then
            echo "nothing staged -- fee check wrote no new rows"
            exit 0
          fi
          # commit BEFORE rebasing: git refuses `pull --rebase` with a staged index.
          git commit -m "fee check $(date -u +%Y-%m-%dT%H:%MZ)"
          # Push as the App -- see collect.yml's "Commit samples" step for why
          # only this remote's credential changes, in memory, for this step.
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
            pull --rebase origin "${GITHUB_REF_NAME}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
            push origin "${GITHUB_REF_NAME}"
