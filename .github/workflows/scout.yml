name: scout

# SEB-301. The Scout picks one job a week and writes the spec into SEB-300.
# Monday 01:00 UTC (09:00 SGT). One Sonnet call, inside the $20 month for all
# agents. Start it by hand from the Actions tab; tick dry_run to see the spec
# and the checks without writing anything to Linear.
#
# Watched by watchdog.yml: no successful run in 8 days fails that workflow.

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: one model call, print the spec and the checks, post nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: scout
      cancel-in-progress: false
    steps:
      # persist-credentials: false so pushes go out as the app (see one_call.yml).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests (the source probe uses it)
        run: pip install 'requests>=2.31'

      - name: Mint the app token
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Self-test
        run: python3 tools/scout.py --self-test

      - name: Scout
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_ACTIVITY_LOG_PATH: ${{ runner.temp }}/linear_activity.jsonl
          DRY: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: python3 tools/scout.py $DRY | tee "$RUNNER_TEMP/scout_out.txt"

      # The log and the spend rows are committed even when the Scout failed.
      - name: Commit the log and the spend
        if: always()
        env:
          GH_PUSH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          git config user.name "margin-agents[bot]"
          git config user.email "329969015+margin-agents[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          git add data/scout_log.csv data/agent_spend.csv 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -q -m "scout log $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "could not push the scout log"; exit 1
