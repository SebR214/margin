name: writer

# SEB-423 step 4. Once a day: two paragraphs for each event that has none, and the home sentences. One Sonnet call each
# through OpenRouter (tools/llm.py, inside the $20 monthly cap). No loop: it runs once and stops. Not part of collect.yml,
# so a refused text can never stop collection. A refusal fails the run, and the texts that passed are committed anyway.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: writer
  cancel-in-progress: false

jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Event paragraphs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/writer.py event

      - name: Home sentences
        if: always()
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 tools/writer.py daily

      - name: Mint GitHub App token
        if: always()
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Commit the texts
        # always(): texts that passed must survive a refusal elsewhere. The run still reports the failure.
        if: always()
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set +x
          git config user.name "margin-agents[bot]"
          git config user.email "329969015+margin-agents[bot]@users.noreply.github.com"
          mkdir -p data/event_prose
          for f in data/event_prose data/home_prose.json data/agent_spend.csv; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing staged, the writer wrote no new text"
            exit 0
          fi
          git commit -m "writer $(date -u +%Y-%m-%dT%H:%MZ)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
            pull --rebase origin "${GITHUB_REF_NAME}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 -w0)" \
            push origin "${GITHUB_REF_NAME}"
