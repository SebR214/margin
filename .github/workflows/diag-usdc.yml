name: Diag USDC
on:
  push:
    branches: [usdc-spread]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          probe() {
            out=$(curl -s -m 15 -w '\n__H__%{http_code}' -H 'User-Agent: margin.wiki basis-collector/1.0 (+https://margin.wiki)' "$2" 2>&1)
            code=$(printf '%s' "$out" | tail -1 | sed 's/__H__//')
            body=$(printf '%s' "$out" | sed '$d' | head -c 200 | tr -d '\n')
            printf 'USDC %-14s %-4s %s\n' "$1" "$code" "$body"
          }
          probe IR      "https://api.independentreserve.com/Public/GetMarketSummary?primaryCurrencyCode=Usdc&secondaryCurrencyCode=Sgd"
          probe CoinsPH "https://api.pro.coins.ph/openapi/quote/v1/ticker/bookTicker?symbol=USDCPHP"
          probe BTCTurk "https://api.btcturk.com/api/v2/ticker?pairSymbol=USDCTRY"
          probe Upbit   "https://api.upbit.com/v1/ticker?markets=KRW-USDC"
          probe Indodax "https://indodax.com/api/usdc_idr/ticker"
          probe Bitkub  "https://api.bitkub.com/api/market/ticker"
          probe Bitso   "https://api.bitso.com/api/v3/ticker?book=usdc_mxn"
          probe Bithumb "https://api.bithumb.com/public/orderbook/USDC_KRW?count=1"
          probe Coinone "https://api.coinone.co.kr/public/v2/ticker_new/KRW/USDC"
          probe Paribu  "https://www.paribu.com/ticker"
          probe Pintu   "https://api.pintu.co.id/v2/trade/price-changes"
          probe Foxbit  "https://api.foxbit.com.br/rest/v3/markets/ticker/24hr"
          probe Mercado "https://api.mercadobitcoin.net/api/v4/tickers?symbols=USDC-BRL"
      - run: |
          echo "--- keys present ---"
          curl -s -m 15 https://api.bitkub.com/api/market/ticker | python3 -c "import json,sys;d=json.load(sys.stdin);print('bitkub THB_USDC' , 'THB_USDC' in d)"
          curl -s -m 15 -H 'User-Agent: m' https://www.paribu.com/ticker | python3 -c "import json,sys;d=json.load(sys.stdin);print('paribu USDC_TL', d.get('USDC_TL'))"
          curl -s -m 15 https://api.pintu.co.id/v2/trade/price-changes | python3 -c "import json,sys;d=json.load(sys.stdin);print('pintu usdc/idr',[p for p in d['payload'] if p['pair'].startswith('usdc/')])"
          curl -s -m 15 https://api.foxbit.com.br/rest/v3/markets/ticker/24hr | python3 -c "import json,sys;d=json.load(sys.stdin);print('foxbit usdcbrl',[r for r in d['data'] if r.get('market_symbol')=='usdcbrl'])"
