name: aider builder

# SEB-301, track A, pilot from 22 Oct. Once a day the Aider builder (tools/aider_builder.py) takes the top job of BACKLOG.md that
# carries a `track: aider` line, builds it with Aider through OpenRouter (Sonnet as architect, qwen3-coder as editor, 30 model turns
# at most, the offline checks of checks.yml as its test command), opens a PR titled `SEB-301: ...` that automerge merges on green,
# and posts its cost (OpenRouter's own figure) and result on SEB-301. A job that fails twice is blocked with `needs-claude`.
# The one-call builder (one_call.yml) keeps running beside it on the jobs without that line.
#
# Same concurrency group as one_call.yml, so the two never run together and the key's usage figure belongs to one run.
# Three slots a day; tools/aider_builder.py does nothing if data/aider_log.csv already has a row for today. The Run workflow button
# runs it even if it ran today.
on:
  schedule:
    - cron: "7 5 * * *"
    - cron: "37 8 * * *"
    - cron: "7 13 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Build this backlog job, e.g. 1a (empty: the top track: aider job)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: one-call
      cancel-in-progress: false
    steps:
      # persist-credentials: false, so git pushes as the app (set on the
      # remote below) and not as GITHUB_TOKEN. checkout's stored header wins
      # over the remote URL otherwise, and main refuses GITHUB_TOKEN pushes:
      # the spend log failed to land on 7 Oct for exactly this reason.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Aider
        run: pip install aider-chat==0.86.1

      - name: Mint the app token (PRs it opens run CI)
        id: app_token
        env:
          MARGIN_GH_APP_ID: ${{ secrets.MARGIN_GH_APP_ID }}
          MARGIN_GH_INSTALL_ID: ${{ secrets.MARGIN_GH_INSTALL_ID }}
          MARGIN_GH_APP_KEY_CONTENT: ${{ secrets.MARGIN_GH_APP_KEY }}
        run: |
          set +x
          key_file="$RUNNER_TEMP/margin-app-key.pem"
          umask 077
          printf '%s\n' "$MARGIN_GH_APP_KEY_CONTENT" > "$key_file"
          export MARGIN_GH_APP_KEY="$key_file"
          token="$(agents/gh_token.sh)"
          rm -f "$key_file"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GH_PUSH_TOKEN: ${{ steps.app_token.outputs.token }}
          LINEAR_ACTIVITY_LOG_PATH: ${{ runner.temp }}/linear_activity.jsonl
          AIDER_ANALYTICS_DISABLE: "1"
        run: |
          git config user.name "margin-agents[bot]"
          git config user.email "329969015+margin-agents[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          python3 tools/aider_builder.py ${{ github.event.inputs.job && format('--job {0}', github.event.inputs.job) || '' }} ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
