<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="./style.css"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>margin.wiki — one transfer, the receipt in full</title>
<meta name="description" content="Is a digital dollar a real dollar? We buy one in Singapore, move it, and sell it in the Philippines, paying every fee on the way, checked hourly against the cheapest app quoting the same amount."/>
<style>
  /* Page-specific only: the layout components below (cards, the size
     switcher, the waterfall legend, tables) belong to this page alone, so
     they live here rather than in style.css. They read the shared tokens --
     ink, paper, divider, Archivo -- rather than defining their own. The
     waterfall/history chart's own colour keys (gain, loss, the blockchain)
     are out of scope for this rebuild (charts are U4) and stay local too. */
  :root{
    --pos:#817FCC; --neg:#D3D0CB; --rail:#D3D0CB; --win:#3F3047; --fill:#F0EBD8;
    --shadow:0 1px 2px rgba(16,22,34,.04),0 8px 30px rgba(16,22,34,.06);
    --mono:var(--font-body);
  }
  *{box-sizing:border-box}
  html,body{margin:0; overflow-x:hidden; max-width:100%}
  body{font-family:var(--font-body); line-height:1.45; -webkit-font-smoothing:antialiased}
  a{color:var(--color-ink);text-decoration:none} a:hover{color:var(--pos)}
  .hero a{color:inherit}
  .wrap{max-width:960px; margin:0 auto; padding:0 20px 60px}

  /* No black band: matches index.html/sending-money.html, which dropped it
     from .hero already. style.css's shared .hero is still black -- this
     page is the only one still linking that stylesheet, so override locally
     rather than edit the shared rule underneath pages that may still want it. */
  .hero{background:none!important;color:var(--color-ink)!important}
  .hero h1{color:var(--color-ink)!important}

  /* Same header as every other current page -- was the old [data-nav="bar"]
     system (style.css, uppercase small-caps, sticky), never migrated when
     the rest of the site moved to this one. */
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 48px;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:800;letter-spacing:-0.02em}
  nav{display:flex;gap:28px;font-size:15px;font-weight:500;color:#333;flex-wrap:wrap}
  nav a.active{color:#0B0B0B;font-weight:700}
  .header-right{display:flex;align-items:center;gap:16px}
  .nav-toggle{display:none;background:none;border:0;font-size:20px;cursor:pointer;padding:6px 8px;color:#0B0B0B;line-height:1}
  @media(max-width:760px){
    header{position:relative;flex-wrap:nowrap!important;padding:22px 24px}
    .brand{gap:14px}
    nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column!important;gap:0!important;padding:6px 24px 16px;border-bottom:1px solid #F0F0F0;box-shadow:0 8px 16px rgba(11,11,11,0.06);z-index:30}
    nav.open{display:flex}
    nav a{padding:12px 0;border-bottom:1px solid #F6F6F6;font-size:16px}
    .nav-toggle{display:block}
  }

  .sub{color:var(--color-neutral-700); font-size:13.5px; margin-top:8px; max-width:60ch}
  .stamp{font-family:var(--mono); font-size:11.5px; color:var(--color-neutral-600); margin-top:10px}
  .stamp b{color:var(--color-neutral-700); font-weight:600}

  .lede{color:var(--color-neutral-700); font-size:14.5px; line-height:1.55; max-width:68ch; margin:0 0 10px}

  .sizebar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:18px 0 6px}
  .sizebar .lbl{font-size:12px; color:var(--color-neutral-600); margin-right:2px}
  .sz{font-family:var(--mono); font-size:12.5px; padding:6px 14px}
  .sz.on{font-weight:700}

  .nums{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; margin:8px 0 6px; background:var(--color-divider)}
  .num{background:var(--color-bg); padding:14px 16px}
  .num .n-l{font-size:12px; color:var(--color-neutral-700); font-weight:600; display:flex; gap:6px; align-items:center}
  .num .n-v{font-family:var(--mono); font-size:30px; font-weight:600; letter-spacing:-.01em; margin-top:3px; line-height:1; font-variant-numeric:tabular-nums}
  .num .n-s{font-size:11.5px; color:var(--color-neutral-600); margin-top:3px}
  .badge{font-size:10px; font-weight:700; padding:1px 6px; border-radius:3px; text-transform:uppercase; letter-spacing:.03em}
  .badge.win{background:#F0EBD8; color:var(--win)}
  .badge.lose{background:#F0EBD8; color:var(--pos)}

  .verdict{background:var(--color-surface); border-top:2px solid var(--color-ink); padding:13px 16px; margin:12px 0; font-size:14px}
  .verdict b{font-weight:700}
  .verdict .split{display:flex; gap:20px; flex-wrap:wrap; margin-top:8px; font-family:var(--mono); font-size:12.5px; color:var(--color-neutral-700)}
  .verdict .split b{color:var(--color-ink)}

  .card{border-top:2px solid var(--color-ink); padding:16px 0; margin-top:28px}
  .card h2{font-size:18px; margin:0 0 3px}
  .card .cap{font-size:12.5px; color:var(--color-neutral-600); margin:0 0 12px; max-width:78ch}
  .wf{display:block; width:100%; height:auto}

  table{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px}
  th,td{text-align:right; padding:8px 6px; border-bottom:1px solid var(--color-divider); font-variant-numeric:tabular-nums; font-family:var(--mono)}
  th{color:var(--color-neutral-600); font-weight:600; font-family:var(--font-body); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em}
  th:first-child,td:first-child{text-align:left}
  tr.hl td{background:var(--color-surface)}
  tr.hl td:first-child{box-shadow:inset 3px 0 0 var(--rail)}
  td .tag{font-family:var(--font-body); font-size:11px; color:var(--color-neutral-600)}
  .winner{font-family:var(--font-body); font-size:11.5px; font-weight:600}
  .winner.c{color:var(--win)} .winner.f{color:var(--color-neutral-700)}

  .legend-row{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--color-neutral-700); margin-top:10px}
  .legend-row i{width:10px; height:10px; display:inline-block; margin-right:5px; vertical-align:-1px}

  footer{margin-top:22px; padding-top:14px; border-top:1px solid var(--color-divider); color:var(--color-neutral-600); font-size:12px; line-height:1.6}
  footer a{color:var(--color-neutral-700)}
  @media (max-width:640px){ .nums{grid-template-columns:1fr} }
</style>

<body>

  <header>
    <div class="brand">
      <div class="logo"><a href="./index.html">margin.wiki</a></div>
      <nav>
        <a href="./index.html">Home</a>

      </nav>
    </div>
    <div class="header-right">

    </div>
  </header>

  <div class="hero">
    <div class="wrap" style="padding-top:0; padding-bottom:0;">
      <h1 id="pageTitle" style="font-size:34px; margin:0 0 12px; max-width:24ch;"></h1>
      <p class="lede" style="color:inherit; opacity:.92;" id="lede1"></p>
      <p class="lede" style="color:inherit; opacity:.92;" id="lede2"></p>
    </div>
  </div>

<div class="wrap">
  <div class="verdict" id="topVerdict" style="margin-top:22px">
    <p style="margin:0 0 8px" id="verdict1"></p>
    <p style="margin:0" id="verdict2"></p>
  </div>

  <div class="stamp" id="stamp"></div>

  <div class="sizebar" id="corrbar"><span class="lbl" id="routeLbl"></span></div>
  <div class="sizebar" id="sizebar"><span class="lbl" id="sendLbl"></span></div>

  <div class="card">
    <h2 id="landedTitle"></h2>
    <p class="cap" id="landedCap"></p>
    <div class="nums" id="nums"></div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="card">
    <h2 id="depthTitle"></h2>
    <p class="cap" id="depthCap"></p>
    <div class="nums" id="depthNums" style="grid-template-columns:repeat(2,1fr)"></div>
  </div>

  <div class="card">
    <h2><span id="wfTitle"></span> <span id="wf-size" style="color:var(--color-neutral-600);font-weight:400"></span></h2>
    <p class="cap" id="wfCap"></p>
    <svg class="wf" id="wf" viewBox="0 0 640 250" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend-row" id="wfLegend"></div>
  </div>

  <div class="card">
    <h2 id="ladderTitle"></h2>
    <p class="cap"><span id="ladderCap"></span></p>
    <div style="overflow-x:auto"><table id="ladder"></table></div>
  </div>

  <div class="card">
    <h2><span id="histTitle"></span> <span id="hist-size" style="color:var(--color-neutral-600);font-weight:400"></span></h2>
    <p class="cap" id="histCap"></p>
    <div style="position:relative">
      <svg class="wf" id="hist" viewBox="0 0 640 220" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="histTip" style="position:absolute;pointer-events:none;opacity:0;transition:opacity .08s;background:#0B0B0B;color:#fff;font-size:12px;font-family:var(--font-body);padding:6px 9px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-130%)"></div>
    </div>
    <div class="legend-row" id="histLegend"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
"use strict";
const SIZES=[200,1000,5000,25000,50000];
let COPY={};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// Loud, not plausible: a missing copy.json key used to fall back to
// hardcoded English that reads exactly like real content, so the deck
// drifting out of sync with this file (a key renamed, a load that quietly
// returned {}) was never visible on the page. "[copy: x]" cannot be
// mistaken for a real sentence.
const cmiss=k=>"[copy: "+k+"]";
const T=(s,vals)=>{
  let out=String(s||"");
  for(const k in (vals||{})) out=out.split("{"+k+"}").join(vals[k]);
  return out;
};
// This page speaks in money and percent. Basis points are a desk unit and they
// live in methodology.html. Precision follows the number so a cost of 0.004%
// does not print as 0.00%, which would read as "not measured".
const pct=(b,signed)=>{
  if(b===null||b===undefined||!isFinite(b)) return "—";
  const p=b/100, a=Math.abs(p), dp=a>=10?1:a>=0.1?2:3, body=a.toFixed(dp)+"%";
  return signed ? (p>=0?"+":"−")+body : (p<0?"−":"")+body;
};
let srcCcy="SGD";
const sym=()=>(srcCcy==="SGD"?"S$":srcCcy==="USD"?"US$":srcCcy+" ");
const money=n=>sym()+(+n).toLocaleString();
// Same symbol convention as sym(), for whichever currency the money lands in
// rather than the one it was sent in -- there is only ever this one mapping.
const symIn=c=>(c==="SGD"?"S$":c==="USD"?"US$":c+" ");
const moneyIn=(c,n)=>(n===null||n===undefined||!isFinite(n))?"—":symIn(c)+Math.round(n).toLocaleString("en-US");
// What a cost quoted as a share of the amount actually comes to, in money,
// rounded to the cent. Differences are taken between ROUNDED values -- see
// cashDiff -- so that the numbers on the page add up to each other. Computing
// the difference from the unrounded shares is more precise by a fraction of a
// cent and reads as an arithmetic error: "S$27.48 against S$13.60, that is
// S$13.89 more" is the kind of line that costs a page its credibility.
const cents=(n,b)=>(n===null||b===null||!isFinite(n)||!isFinite(b))?null:Math.round(n*b/1e4*100)/100;
const fmtCents=v=>v===null?"—":(v<0?"−":"")+sym()+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const cash=(n,b)=>fmtCents(cents(n,b));
const cashDiff=(n,a,b)=>{
  const x=cents(n,a), y=cents(n,b);
  return (x===null||y===null)?"—":fmtCents(Math.round((x-y)*100)/100);
};

function parseCSV(text){
  const rows=[]; let i=0,field="",row=[],q=false,t=text.trim();
  const push=()=>{row.push(field);field="";}, eol=()=>{push();rows.push(row);row=[];};
  while(i<t.length){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){field+='"';i++;}else q=false;}else field+=ch;}
    else if(ch==='"')q=true; else if(ch===',')push();
    else if(ch==='\n')eol(); else if(ch==='\r'){} else field+=ch; i++;}
  if(field.length||row.length)eol();
  const head=rows.shift();
  return rows.map(r=>Object.fromEntries(head.map((h,j)=>[h,r[j]])));
}

let bySize={}, histBySize={}, size=5000, newest="";
// Corridor 1 is the default and stays first. allRows holds every corridor so
// switching regroups in place rather than refetching samples.csv.
let allRows=[], corrKeys=[], corridor="SGD->PHP", feeChecks=[], withdrawalFees=[], wfBySample={};
const PLACE={SGD:"Singapore",PHP:"the Philippines",USD:"the US",MXN:"Mexico",AUD:"Australia",NZD:"New Zealand"};
const place=c=>PLACE[c]||c;
const dstOf=r=>((r&&r.dst)||"").trim();

// Fee verification stamp from data/fee_checks.csv and data/withdrawal_fees.csv
// (both from tools/check_fees.py). Three states and no fourth: verified,
// UNVERIFIED, or nothing at all. An absent or empty file renders nothing -- no
// placeholder, no guessed date. Age computes here, at render time, so the
// stamp cannot go stale in a cached page.
// Distinct verification dates from a fees_verified string, oldest first.
function feeDates(verified){
  const legs=String(verified||"").split("|").map(x=>(x.split(":")[1]||"").trim()).filter(Boolean);
  const uniq=Array.from(new Set(legs)).sort();
  return uniq.length?uniq.join(" · "):"—";
}

function feeStamp(rows,verified,wrows,onVenue){
  const runs={};
  for(const r of (rows||[])){ if(r&&r.ts_utc) (runs[r.ts_utc]=runs[r.ts_utc]||[]).push(r); }
  const stamps=Object.keys(runs).sort();
  const clean=stamps.filter(t=>runs[t].every(r=>(r.status||"").trim()==="ok"));
  const lastClean=clean.length?clean[clean.length-1]:null;
  const tradeBad=stamps.length>0&&runs[stamps[stamps.length-1]].some(r=>(r.status||"").trim()!=="ok");
  // The network leg (data/withdrawal_fees.csv) is keyed by venue, not by
  // corridor, and runs on its own schedule -- only a failure on THIS
  // corridor's sending venue can make this corridor's number unverified.
  const wruns={};
  for(const r of (wrows||[])){ if(r&&r.ts_utc) (wruns[r.ts_utc]=wruns[r.ts_utc]||[]).push(r); }
  const wstamps=Object.keys(wruns).sort();
  const withdrawBad=Boolean(onVenue)&&wstamps.length>0&&wruns[wstamps[wstamps.length-1]]
    .some(r=>(r.venue||"").trim().toLowerCase()===onVenue&&(r.source_ok||"").trim()!=="True");
  if(!stamps.length&&!withdrawBad) return {text:"",unverified:false};
  const FS=COPY.feeStamp||{};
  if(tradeBad||withdrawBad){
    const reason=tradeBad&&withdrawBad?(FS.reasonBoth||"trading and network fees")
      :withdrawBad?(FS.reasonNetwork||"network fee"):(FS.reasonTrading||"trading fees");
    const text=T(FS.unverifiedTemplate||"fees UNVERIFIED ({reason}) — last clean check {lastClean}",
      {reason, lastClean: lastClean?lastClean.slice(0,10):(FS.noneOnRecord||"none on record")});
    return {text, unverified:true};
  }
  // The DATE from the fee config, never an age from the wall clock. Only as
  // verified as the stalest leg, so take the oldest.
  const legs=String(verified||"").split("|").map(x=>(x.split(":")[1]||"").trim())
    .filter(Boolean).sort();
  const date=legs.length?legs[0]:(lastClean?lastClean.slice(0,10):"");
  return {text: date?T(FS.verifiedTemplate||"fees verified {date}",{date}):"", unverified:false};
}

async function loadCSVOptional(path){
  // Optional by design: a 404 is "no stamp", not a broken page.
  try{
    const r=await fetch(path);
    if(!r.ok) return [];
    const t=await r.text();
    return t.trim()?parseCSV(t):[];
  }catch(e){ return []; }
}

async function loadCopy(){
  try{
    const r=await fetch("./copy.json");
    if(!r.ok) return {};
    return await r.json();
  }catch(e){ return {}; }
}

async function boot(){
  // Deep link from another page (the homepage's per-corridor table, for
  // one): ?corridor=AUD->PHP pre-selects that tab instead of always
  // landing on SGD->PHP. Validated against corrKeys once they're known
  // (below), not trusted blind -- an unrecognised value falls through to
  // the existing corrKeys[0] default, same as no param at all.
  const qp=new URLSearchParams(location.search).get("corridor");
  if(qp) corridor=qp;
  const C=await loadCopy();
  COPY=C.corridor||{};
  document.getElementById("pageTitle").textContent=COPY.title||cmiss("title");
  document.getElementById("lede1").textContent=COPY.lede1||"";
  document.getElementById("lede2").textContent=COPY.lede2||"";
  document.getElementById("routeLbl").textContent=(COPY.sizebar||{}).route||"route";
  document.getElementById("sendLbl").textContent=(COPY.sizebar||{}).sendAmount||"send amount";
  document.getElementById("landedTitle").textContent=(COPY.cards||{}).landed?.title||"";
  document.getElementById("landedCap").textContent=(COPY.cards||{}).landed?.cap||"";
  document.getElementById("depthTitle").textContent=(COPY.cards||{}).depth?.title||"";
  document.getElementById("wfTitle").textContent=(COPY.cards||{}).waterfall?.title||"";
  document.getElementById("wfCap").textContent=(COPY.cards||{}).waterfall?.cap||"";
  document.getElementById("ladderTitle").textContent=(COPY.cards||{}).ladder?.title||"";
  document.getElementById("histTitle").textContent=(COPY.cards||{}).history?.title||"";
  document.getElementById("histCap").textContent=(COPY.cards||{}).history?.cap||"";
  document.getElementById("stamp").textContent=COPY.loading||"loading…";

  const L=COPY.legend||{};
  document.getElementById("wfLegend").innerHTML=
    `<span><i style="background:var(--neg)"></i>${L.moneyGained||""}</span>`+
    `<span><i style="background:var(--pos)"></i>${L.moneyLost||""}</span>`+
    `<span><i style="background:var(--rail)"></i>${L.blockchain||""}</span>`+
    `<span><i style="background:var(--win)"></i>${L.total||""}</span>`+
    `<span><i style="background:transparent;border:1px dashed var(--neg)"></i>${L.cheapestProvider||""}</span>`;
  document.getElementById("histLegend").innerHTML=
    `<span><i style="background:var(--pos)"></i>${L.buyingNow||""}</span>`+
    `<span><i style="background:var(--color-neutral-700)"></i>${L.waitingOwnPrice||""}</span>`+
    `<span><i style="background:var(--neg)"></i>${L.cheapestProvider||""}</span>`;

  allRows=parseCSV(await fetch("./data/samples.csv").then(r=>r.text())).filter(r=>r.source_ok==="True");
  // The "is it a real dollar" count is a claim about every round trip ever
  // run, not the one corridor on screen -- so it is computed once here, from
  // every row, and does not change when the reader switches corridors.
  const measureCount=allRows.length, winCount=allRows.filter(r=>r.crypto_wins_taker==="True").length;
  document.getElementById("verdict1").textContent=T(COPY.verdict1,
    { measureCount: measureCount.toLocaleString("en-US"), winCount: winCount.toLocaleString("en-US") });
  document.getElementById("verdict2").textContent=COPY.verdict2||"";
  feeChecks=await loadCSVOptional("./data/fee_checks.csv");
  withdrawalFees=await loadCSVOptional("./data/withdrawal_fees.csv");
  // The waterfall's three bars, computed once in the collector so they
  // reconcile to the total exactly -- not reconstructed here from
  // basis+fee fields, which is what drifted (SEB: corridor waterfall did
  // not reconcile). Keyed the same way the row itself is identified.
  const wfRows=await loadCSVOptional("./data/corridor_waterfall.csv");
  wfBySample={};
  for(const w of wfRows) wfBySample[w.ts+"|"+w.corridor+"|"+w.notional_src]=w;
  // samples.csv carries every corridor interleaved. Group by the corridor
  // column: without it one corridor's rows land in another's waterfall.
  corrKeys=[...new Set(allRows.map(r=>(r.corridor||"").trim()).filter(Boolean))]
    .sort((a,b)=>a==="SGD->PHP"?-1:b==="SGD->PHP"?1:a<b?-1:1);
  if(corrKeys.indexOf(corridor)<0) corridor=corrKeys[0];
  renderCorridors(); selectCorridor(corridor);
}

// Everything below is scoped to the selected corridor.
function selectCorridor(key){
  corridor=key;
  const rows=allRows.filter(r=>(r.corridor||"").trim()===key);
  newest=""; bySize={}; histBySize={};
  for(const r of rows){ if(r.ts>newest) newest=r.ts; }
  const present=[];
  for(const s of SIZES){
    const rs=rows.filter(r=>+r.notional_src===s).sort((a,b)=>a.ts<b.ts?-1:1);
    if(!rs.length) continue;            // a size never sampled is absent, not zero
    histBySize[s]=rs; bySize[s]=rs[rs.length-1]; present.push(s);
  }
  if(!present.length){                   // honest empty state, never placeholder rows
    document.getElementById("stamp").innerHTML=`<b>${key.replace("->"," → ")}</b> — ${COPY.noSamples||"no completed samples yet."}`;
    return;
  }
  if(present.indexOf(size)<0) size=present[present.length-1];
  srcCcy=(bySize[size].src||"SGD").trim();
  const r5=bySize[size];
  const d=new Date(newest.replace(" ","T")), ago=Math.round((Date.now()-d)/6e4);
  const hours=new Set(rows.map(r=>r.ts.slice(0,13))).size;
  document.title="margin.wiki — one transfer, the receipt in full · "+place(srcCcy)+" → "+place(dstOf(r5));
  const feeStampR=feeStamp(feeChecks,r5.fees_verified,withdrawalFees,(r5.onramp_venue||"").trim().toLowerCase());
  document.getElementById("stamp").innerHTML=
    `<b>${esc(COPY.updatedLabel||cmiss("updatedLabel"))}</b> ${newest.slice(0,16).replace("T"," ")}Z · ${ago<90?(COPY.minAgoTemplate?T(COPY.minAgoTemplate,{n:ago}):cmiss("minAgoTemplate")):(COPY.hAgoTemplate?T(COPY.hAgoTemplate,{n:Math.round(ago/60)}):cmiss("hAgoTemplate"))} · `+
    // fees_verified carries one date per leg ("ir:2026-08-10|coins:2026-08-10").
    // Both legs are usually verified on the same day, and printing the string
    // straight through rendered that as "2026-08-10 · 2026-08-10". Distinct
    // dates only -- if the legs ever diverge, both still show.
    T(COPY.venueTemplate||"bought on {onrampVenue}, sold on {offrampVenue} · fees verified {dates}",
      {onrampVenue: r5.onramp_venue, offrampVenue: r5.offramp_venue, dates: feeDates(r5.fees_verified)})+
    // The dates are already printed above from fees_verified. The watcher stamp
    // only earns its place when it DISAGREES -- i.e. a check has gone red.
    (feeStampR.unverified ? ` · ${feeStampR.text}` : "")+
    // Under three hours there is no trend to read. Say how thin it is rather
    // than letting a two-point chart imply one.
    (hours<3?` · <b>${hours} capture${hours===1?"":"s"} so far</b> — every point collected is shown, nothing filled in`:"");
  document.getElementById("ladderCap").textContent=T((COPY.cards||{}).ladder?.capTemplate,
    { highlight: money(SIZES[0]) });
  renderCorridors(); renderSizes(); render();
  const dst=(r5.dst||"").trim();
  document.getElementById("foot").innerHTML=
    T(COPY.footerTemplate, { onrampVenue: r5.onramp_venue, srcCcy, offrampVenue: r5.offramp_venue, dst })+" "+
    `<a href="./how-it-works.html">${(COPY.footerLinks||{}).methodology||""}</a> · <a href="./index.html">${(COPY.footerLinks||{}).board||""}</a>`;
}

function renderCorridors(){
  const bar=document.getElementById("corrbar");
  bar.querySelectorAll(".sz").forEach(e=>e.remove());
  if(corrKeys.length<2){ bar.style.display="none"; return; }
  for(const k of corrKeys){
    const b=document.createElement("button");
    b.className="sz pill-input"+(k===corridor?" on is-active":""); b.textContent=k.replace("->"," → ");
    b.onclick=()=>selectCorridor(k);
    bar.appendChild(b);
  }
}

function renderSizes(){
  const bar=document.getElementById("sizebar");
  bar.querySelectorAll(".sz").forEach(e=>e.remove());
  for(const s of SIZES){
    if(!bySize[s]) continue;            // never sampled at this size -> no pill
    const b=document.createElement("button");
    b.className="sz pill-input"+(s===size?" on is-active":""); b.textContent=money(s); b.onclick=()=>{size=s;renderSizes();render();};
    bar.appendChild(b);
  }
}

function netBps(r){ return (+r.network_fee_stable)/((+r.notional_src)/(+r.onramp_vwap))*1e4; }

// How much the selling side of the route could take right now, in the
// destination currency rather than a raw coin count. Same run, same row as
// everything else on the page; both figures convert at the one live price
// that exchange is actually quoting for this leg (offramp_vwap), not the
// separate official cross-rate used nowhere else on this page. This has
// nothing to do with the send-amount pills above -- it is what the market
// could absorb from anyone selling, not what the reader is sending.
function renderDepth(r){
  const dst=dstOf(r), venue=r.offramp_venue||"the exchange", rate=+r.offramp_vwap;
  const top=+r.offramp_depth_top_level, within1=+r.offramp_depth_1pct;
  const okTop=r.offramp_depth_top_level!==undefined&&r.offramp_depth_top_level!==""&&isFinite(top)&&isFinite(rate);
  const ok1=r.offramp_depth_1pct!==undefined&&r.offramp_depth_1pct!==""&&isFinite(within1)&&isFinite(rate);
  const D=COPY.depth||{};
  document.getElementById("depthCap").textContent=T(D.capTemplate, { dst, venue });
  document.getElementById("depthNums").innerHTML=`
    <div class="num"><div class="n-l">${D.atBestPrice||""}</div>
      <div class="n-v">${okTop?moneyIn(dst,top*rate):"—"}</div>
      <div class="n-s">${D.atBestPriceSub||""}</div></div>
    <div class="num"><div class="n-l">${D.before1Pct||""}</div>
      <div class="n-v">${ok1?moneyIn(dst,within1*rate):"—"}</div>
      <div class="n-s">${D.before1PctSub||""}</div></div>`;
}

function render(){
  const r=bySize[size], t=+r.cost_bps_taker, m=+r.cost_bps_maker, base=+r.baseline_cost_bps;
  const cw=t<base, mw=m<base;
  const N=COPY.numCards||{};
  document.getElementById("nums").innerHTML=`
    ${numCard((N.buyingNow||{}).label,(N.buyingNow||{}).sub,t,cw,size)}
    ${numCard((N.waitingOwnPrice||{}).label,(N.waitingOwnPrice||{}).sub,m,mw,size)}
    ${numCard(r.baseline_provider||N.cheapestProviderLabel,N.cheapestProviderSub,base,null,size)}`;
  // Same figure the waterfall's "Moving it" bar shows a few lines down --
  // reads from the same sidecar so this line and that bar never disagree.
  // Falls back to the old approximation only when the sidecar has no row
  // for this exact sample yet.
  const wfSum=wfBySample[r.ts+"|"+r.corridor+"|"+r.notional_src];
  const rail=wfSum?+wfSum.wf_move_bps:netBps(r), doors=t-rail;
  // The worked example, in the currency being sent, at the amount selected.
  const dstPlace=place(dstOf(r));
  const VL=COPY.verdictLine||{};
  document.getElementById("verdict").innerHTML=
    `<b>${cw?VL.cryptoCheaper:VL.cryptoDearer}</b> `+
    T(VL.sendTemplate,{ amount: money(size), place: dstPlace, provider: r.baseline_provider, providerCost: cash(size,base), routeCost: cash(size,t) })+" "+
    (cw?T(VL.youSave,{amount:cashDiff(size,base,t)}):T(VL.moreExpensive,{amount:cashDiff(size,t,base)}))+" "+
    T(VL.waitingTemplate,{ amount: cash(size,m), closes: mw?VL.doesClose:VL.doesNotClose })+
    `<div class="split"><span>${VL.blockchainSplit}: <b>${cash(size,rail)}</b></span><span>${VL.exchangesSplit}: <b>${cash(size,doors)}</b></span></div>`;
  document.getElementById("wf-size").textContent="· "+money(size);
  document.getElementById("hist-size").textContent="· "+money(size);
  renderDepth(r);
  drawWaterfall(r); drawLadder(); drawHistory();
}

function numCard(label,sub,val,win,n){
  const NC=COPY.numCards||{};
  const badge = win===null?"":`<span class="badge ${win?"win":"lose"}">${win?NC.cheaper:NC.dearer}</span>`;
  // Money is the headline; the percentage is the footnote. Nobody sends 0.55%.
  return `<div class="num"><div class="n-l">${label} ${badge}</div>
    <div class="n-v">${cash(n,val)}</div><div class="n-s">${pct(val)} of what you send · ${sub}</div></div>`;
}

function drawWaterfall(r){
  // Buy the coin, move it, sell it -- computed once in the collector as a
  // sequential chain (decompose()'s own gross->bought->stable->quote->landed
  // steps), not reconstructed here as independent basis+fee sums, which is
  // what used to drift off the total (SEB: corridor waterfall did not
  // reconcile -- 79.15 shown against a real 78.40 total). No sidecar row for
  // this exact sample yet (a currency's first hour after this shipped, say)
  // means no invented approximation either -- the section says so.
  const n=+r.notional_src;
  const wf=wfBySample[r.ts+"|"+r.corridor+"|"+r.notional_src];
  if(!wf){
    document.getElementById("wf").innerHTML=`<text x="12" y="30" fill="var(--color-neutral-600)" font-size="13" font-family="var(--font-body)">${esc(COPY.waterfallUnavailable||cmiss("waterfallUnavailable"))}</text>`;
    return;
  }
  const comps=[
    {l:"Buying the coin in "+place(srcCcy), v:+wf.wf_buy_bps, k:"neg"},
    {l:"Moving it", v:+wf.wf_move_bps, k:"rail"},
    {l:"Selling it in "+place(dstOf(r)), v:+wf.wf_sell_bps, k:"neg"},
  ];
  const total=+r.cost_bps_taker, base=+r.baseline_cost_bps;
  let run=0; const cum=[0]; comps.forEach(c=>{run+=c.v; cum.push(run);});
  const all=[0,total,base,...cum], dMin=Math.min(...all), dMax=Math.max(...all);
  const pad=(dMax-dMin)*.12||10, lo=dMin-pad, hi=dMax+pad;
  const L=168, R=624, X=v=>L+(v-lo)/(hi-lo)*(R-L);
  const rowH=30, top=6, W=640;
  const rows=comps.length+1, H=top+rows*rowH+30;
  const svg=document.getElementById("wf"); svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const col={fee:"var(--pos)",fee2:"var(--fill)",neg:"var(--neg)",rail:"var(--rail)"};
  let s=`<line x1="${X(0)}" y1="${top}" x2="${X(0)}" y2="${top+rows*rowH}" stroke="var(--color-divider)" stroke-width="1"/>`;
  // baseline (incumbent) marker
  s+=`<line x1="${X(base).toFixed(1)}" y1="${top-2}" x2="${X(base).toFixed(1)}" y2="${top+rows*rowH+4}" stroke="var(--neg)" stroke-width="1.3" stroke-dasharray="3 3"/>`+
     `<text x="${X(base).toFixed(1)}" y="${top+rows*rowH+18}" fill="var(--neg)" font-size="10.5" font-family="var(--mono)" text-anchor="middle">${r.baseline_provider} ${cash(n,base)}</text>`;
  // The three bps legs already sum to cost_bps_taker exactly (collector-side,
  // to the cent). Converting each to a DOLLAR amount and rounding each
  // independently can still land a bar's label a cent off the total --
  // three coins rounded on their own don't reliably make the same total as
  // one. Last leg's shown value is the remainder against the total's own
  // cents, not its own independently-rounded figure, so the printed numbers
  // always add up, not just the underlying bps.
  const totalCents=cents(n,total);
  const compCents=comps.map(c=>cents(n,c.v));
  compCents[compCents.length-1]=Math.round((totalCents-compCents.slice(0,-1).reduce((a,b)=>a+b,0))*100)/100;
  let feeLegsSeen=0;
  comps.forEach((c,i)=>{
    const y=top+i*rowH, a=X(cum[i]), b=X(cum[i+1]), x0=Math.min(a,b), w=Math.max(2,Math.abs(b-a));
    let fill;
    if(c.k!=="neg") fill=col[c.k];
    else if(c.v<0) fill=col.neg;
    else { fill=feeLegsSeen===0?col.fee:col.fee2; feeLegsSeen++; }
    const stroke = fill===col.fee2 ? ' stroke="var(--neg)" stroke-width="1"' : '';
    s+=`<text x="12" y="${y+rowH/2+4}" fill="var(--color-ink)" font-size="12" font-family="var(--font-body)">${c.l}</text>`+
       `<rect x="${x0.toFixed(1)}" y="${y+6}" width="${w.toFixed(1)}" height="${rowH-12}" fill="${fill}"${stroke}/>`+
       `<text data-wf-leg="${i}" x="${(b+(b>=a?4:-4)).toFixed(1)}" y="${y+rowH/2+4}" fill="var(--color-neutral-700)" font-size="11" font-family="var(--mono)" text-anchor="${b>=a?"start":"end"}">${fmtCents(compCents[i])}</text>`;
  });
  const y=top+comps.length*rowH, xt=X(total);
  s+=`<text x="12" y="${y+rowH/2+4}" fill="var(--color-ink)" font-size="12.5" font-family="var(--font-body)" font-weight="700">${(COPY.legend||{}).wholeTransfer||"The whole transfer"}</text>`+
     `<rect x="${Math.min(X(0),xt).toFixed(1)}" y="${y+5}" width="${Math.max(2,Math.abs(xt-X(0))).toFixed(1)}" height="${rowH-10}" fill="var(--win)"/>`+
     `<text data-wf-total="1" x="${(xt+(total>=0?4:-4)).toFixed(1)}" y="${y+rowH/2+4}" fill="var(--color-ink)" font-size="12" font-family="var(--mono)" font-weight="700" text-anchor="${total>=0?"start":"end"}">${cash(n,total)}</text>`;
  svg.innerHTML=s;
}

function drawLadder(){
  const rows=SIZES.map(s=>bySize[s]).filter(Boolean);
  const LT=COPY.ladderTable||{}, cols=LT.columns||{};
  let h=`<tr><th>${cols.send||""}</th><th>${cols.buyingNow||""}</th><th>${cols.waitingOwnPrice||""}</th><th>${cols.cheapestProvider||""}</th><th>${cols.cheaper||""}</th></tr>`;
  for(const r of rows){
    const s=+r.notional_src, t=+r.cost_bps_taker, m=+r.cost_bps_maker, b=+r.baseline_cost_bps, cw=t<b;
    h+=`<tr class="${s===size?"hl":""}${s===200?" hl":""}">
      <td>${money(s)}${s===200?` <span class="tag">${LT.worstTag||""}</span>`:""}</td>
      <td>${cash(s,t)}<br><span class="tag">${pct(t)}</span></td>
      <td>${cash(s,m)}<br><span class="tag">${pct(m)}</span></td>
      <td>${r.baseline_provider}<br><span class="tag">${cash(s,b)}</span></td>
      <td class="winner ${cw?"c":"f"}">${cw?T(LT.dollarRouteByTemplate,{amount:cashDiff(s,t,b)}):T(LT.providerByTemplate,{amount:cashDiff(s,b,t)})}</td></tr>`;
  }
  document.getElementById("ladder").innerHTML=h;
}

// ROADMAP.md's chart invariant: every chart hovers, the nearest real point's
// exact value, no interpolation. Three series on one x-axis, so js/chart.js
// (one series plus an optional static reference line) doesn't fit directly --
// same interaction pattern (nearest-point lookup, tooltip, hover dots, a
// vertical guide), built for three live series instead of one.
function fmtHistDate(iso){
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d=new Date(iso); if(isNaN(d)) return "";
  return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()];
}
function drawHistory(){
  const rows=histBySize[size]; const svg=document.getElementById("hist");
  const tip=document.getElementById("histTip");
  const W=640,H=220,padL=44,padR=12,padT=12,padB=22;
  if(rows.length<2){ svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="var(--color-neutral-600)" font-size="12" font-family="var(--font-body)">${T((COPY.history||{}).buildingTemplate,{count:rows.length+(rows.length===1?" sample":" samples")})}</text>`; tip.style.opacity=0; return; }
  const HL=COPY.history||{};
  const series=[["cost_bps_taker","var(--pos)",HL.buyingNow||"buying it now"],["cost_bps_maker","var(--color-neutral-700)",HL.waitingOwnPrice||"waiting for your price"],["baseline_cost_bps","var(--neg)",HL.cheapestProvider||"best fiat provider"]];
  const vals=rows.flatMap(r=>series.map(([k])=>+r[k]));
  let lo=Math.min(0,...vals), hi=Math.max(0,...vals); const pv=(hi-lo)*.1||5; lo-=pv; hi+=pv;
  const plotB=H-padB;
  const X=i=>padL+i*(W-padL-padR)/(rows.length-1), Y=v=>padT+(hi-v)/(hi-lo)*(plotB-padT);
  let s=`<line x1="${padL}" y1="${Y(0).toFixed(1)}" x2="${W-padR}" y2="${Y(0).toFixed(1)}" stroke="var(--color-divider)" stroke-width="1"/>`+
        `<text x="${padL-6}" y="${Y(0).toFixed(1)+4}" text-anchor="end" fill="var(--color-neutral-600)" font-size="10" font-family="var(--mono)">0%</text>`+
        `<text x="${padL-6}" y="${(Y(hi)+8).toFixed(1)}" text-anchor="end" fill="var(--color-neutral-600)" font-size="10" font-family="var(--mono)">${pct(hi)}</text>`+
        `<text x="${padL-6}" y="${(Y(lo)+0).toFixed(1)}" text-anchor="end" fill="var(--color-neutral-600)" font-size="10" font-family="var(--mono)">${pct(lo)}</text>`;
  for(const [k,c] of series){
    const pts=rows.map((r,i)=>`${X(i).toFixed(1)},${Y(+r[k]).toFixed(1)}`).join(" ");
    s+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
    const last=rows[rows.length-1];
    s+=`<circle cx="${X(rows.length-1).toFixed(1)}" cy="${Y(+last[k]).toFixed(1)}" r="2.4" fill="${c}"/>`;
  }
  const vlineId="hvl"+Math.random().toString(36).slice(2,8);
  s+=`<line id="${vlineId}" x1="0" y1="${padT}" x2="0" y2="${plotB}" stroke="#0B0B0B" stroke-width="1" opacity="0"/>`;
  const dotIds=series.map((_,i)=>{ const id="hd"+i+Math.random().toString(36).slice(2,6); s+=`<circle id="${id}" r="4" fill="${series[i][1]}" stroke="#fff" stroke-width="1.5" opacity="0"/>`; return id; });
  svg.innerHTML=s;

  const vline=document.getElementById(vlineId);
  const dots=dotIds.map(id=>document.getElementById(id));
  function nearest(px){
    let best=0, bestD=Infinity;
    for(let i=0;i<rows.length;i++){ const d=Math.abs(X(i)-px); if(d<bestD){bestD=d; best=i;} }
    return best;
  }
  svg.onmousemove=function(ev){
    const rect=svg.getBoundingClientRect();
    const px=(ev.clientX-rect.left)*(W/rect.width);
    const i=nearest(px), r=rows[i];
    vline.setAttribute("x1",X(i).toFixed(1)); vline.setAttribute("x2",X(i).toFixed(1)); vline.setAttribute("opacity",0.25);
    let lines="";
    series.forEach(([k,c,label],si)=>{
      dots[si].setAttribute("cx",X(i).toFixed(1)); dots[si].setAttribute("cy",Y(+r[k]).toFixed(1)); dots[si].setAttribute("opacity",1);
      lines+=`<div><span style="color:${c.replace("var(--color-neutral-700)","#6B6B6B").replace("var(--pos)","#817FCC").replace("var(--neg)","#D3D0CB")}">●</span> ${esc(label)}: ${pct(+r[k])}</div>`;
    });
    tip.innerHTML=`<div style="font-weight:700;padding-bottom:3px">${esc(fmtHistDate(r.ts))}</div>`+lines;
    const leftPct=(X(i)/W)*100, topPct=(Y(+r[series[0][0]])/H)*100;
    tip.style.left=leftPct+"%"; tip.style.top=topPct+"%"; tip.style.opacity=1;
  };
  svg.onmouseleave=function(){ vline.setAttribute("opacity",0); dots.forEach(d=>d.setAttribute("opacity",0)); tip.style.opacity=0; };
}

boot().catch(e=>{document.getElementById("stamp").textContent=(COPY.loadFailed)||"failed to load data"; console.error(e);});
</script>
<script>
(function(){
  var btn = document.getElementById('navToggle');
  var nav = document.querySelector('header nav');
  if (btn && nav) {
    btn.addEventListener('click', function(){ nav.classList.toggle('open'); });
    document.addEventListener('click', function(e){
      if (nav.classList.contains('open') && !nav.contains(e.target) && e.target !== btn) nav.classList.remove('open');
    });
  }
})();
</script>
