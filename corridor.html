<style>

<script>
"use strict";
const SIZES=[200,1000,5000,25000,50000];
let COPY={};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const VENUE={IndependentReserve:"Independent Reserve",Coins_ph:"Coins.ph","coins.ph":"Coins.ph",CoinsPH:"Coins.ph",OKX_P2P:"OKX P2P",Bitso:"Bitso",Binance_P2P:"Binance P2P"};
const venueName=v=>VENUE[v]||String(v||"").replace(/_/g," ");
// Loud, not plausible: a missing copy.json key used to fall back to
// hardcoded English that reads exactly like real content, so the deck
// drifting out of sync with this file (a key renamed, a load that quietly
// returned {}) was never visible on the page. "[copy: x]" cannot be
// mistaken for a real sentence.
const cmiss=k=>"[copy: "+k+"]";
const T=(s,vals)=>{
  let out=String(s||"");
  for(const k in (vals||{})) out=out.split("{"+k+"}").join(vals[k]);
  return out;
};
// This page speaks in money and percent. Basis points are a desk unit and they
// live in methodology.html. Precision follows the number so a cost of 0.004%
// does not print as 0.00%, which would read as "not measured".
const pct=(b,signed)=>{
  if(b===null||b===undefined||!isFinite(b)) return "—";
  const p=b/100, a=Math.abs(p), dp=a>=10?1:a>=0.1?2:3, body=a.toFixed(dp)+"%";
  return signed ? (p>=0?"+":"−")+body : (p<0?"−":"")+body;
};
let srcCcy="SGD";
const sym=()=>(srcCcy==="SGD"?"S$":srcCcy==="USD"?"US$":srcCcy+" ");
const money=n=>sym()+(+n).toLocaleString();
// Same symbol convention as sym(), for whichever currency the money lands in
// rather than the one it was sent in -- there is only ever this one mapping.
const symIn=c=>(c==="SGD"?"S$":c==="USD"?"US$":c+" ");
const moneyIn=(c,n)=>(n===null||n===undefined||!isFinite(n))?"—":symIn(c)+Math.round(n).toLocaleString("en-US");
// What a cost quoted as a share of the amount actually comes to, in money,
// rounded to the cent. Differences are taken between ROUNDED values -- see
// cashDiff -- so that the numbers on the page add up to each other. Computing
// the difference from the unrounded shares is more precise by a fraction of a
// cent and reads as an arithmetic error: "S$27.48 against S$13.60, that is
// S$13.89 more" is the kind of line that costs a page its credibility.
const cents=(n,b)=>(n===null||b===null||!isFinite(n)||!isFinite(b))?null:Math.round(n*b/1e4*100)/100;
const fmtCents=v=>v===null?"—":(v<0?"−":"")+sym()+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const cash=(n,b)=>fmtCents(cents(n,b));
const cashDiff=(n,a,b)=>{
  const x=cents(n,a), y=cents(n,b);
  return (x===null||y===null)?"—":fmtCents(Math.round((x-y)*100)/100);
};

function parseCSV(text){
  const rows=[]; let i=0,field="",row=[],q=false,t=text.trim();
  const push=()=>{row.push(field);field="";}, eol=()=>{push();rows.push(row);row=[];};
  while(i<t.length){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){field+='"';i++;}else q=false;}else field+=ch;}
    else if(ch==='"')q=true; else if(ch===',')push();
    else if(ch==='\n')eol(); else if(ch==='\r'){} else field+=ch; i++;}
  if(field.length||row.length)eol();
  const head=rows.shift();
  return rows.map(r=>Object.fromEntries(head.map((h,j)=>[h,r[j]])));
}

let bySize={}, histBySize={}, size=5000, newest="";
// Corridor 1 is the default and stays first. allRows holds every corridor so
// switching regroups in place rather than refetching samples.csv.
let allRows=[], corrKeys=[], corridor="SGD->PHP", feeChecks=[], withdrawalFees=[], wfBySample={};
let measureCount=0, winCount=0, historyStart="";
let providersLatest=null;
// The 24h/7d/30d/all-time chart's own small sidecar (tools/emit_corridor_history.py,
// data/corridor_history.json) -- an hourly {ts, stablecoin_cost_pct,
// cheapest_app_cost_pct} row per corridor+amount actually sampled. Kept
// separate from allRows/histBySize above: those feed the three-series
// line chart at full resolution; this feeds the range-toggle bar chart,
// which regroups client-side (see groupHistRange()) rather than re-reading
// samples.csv on every button click.
let corridorHistory=null, histRange="720";
// The true cheapest APP (never the stablecoin route itself) for this
// corridor+size, from data/providers_latest.json -- the same file
// sending-money.html reads, built by tools/emit_providers.py from BOTH
// providers' own direct quotes (data/provider_quotes.csv, which is where
// Airwallex/Instarem live) and the Wise comparison feed, sorted cheapest
// first. samples.csv's baseline_provider/baseline_cost_bps columns only
// ever hold the winner of the Wise feed alone, which can name a provider
// that is not actually the cheapest once direct quotes are considered
// (SEB: corridor.html called Wise "the cheapest app" while Airwallex
// quoted less for the same route). Falls back to the samples.csv row's own
// baseline_provider/baseline_cost_bps when providers_latest.json has no
// entry for this exact corridor+size yet, so a gap in the newer file never
// blanks this number.
function cheapestApp(corridorKey, sizeAmount, fallbackRow){
  const rows=providersLatest && providersLatest.corridors &&
    providersLatest.corridors[corridorKey] &&
    providersLatest.corridors[corridorKey].sizes &&
    providersLatest.corridors[corridorKey].sizes[String(sizeAmount)] &&
    providersLatest.corridors[corridorKey].sizes[String(sizeAmount)].rows;
  if(rows && rows.length){
    // Public comparison only, until the direct provider quotes are verified
    // (Airwallex flat 0.104% at every amount, Instarem ~0.002%: not credible).
    // Each provider's price as the public comparison quotes it: the row's
    // own cost for comparison rows, the comparison's figure (also_quoted_pct)
    // for providers that also quote us directly.
    const cands=rows.map(rr=>({provider:rr.provider, pct: rr.source==="comparison" ? rr.cost_pct : rr.also_quoted_pct}))
                    .filter(c=>c.pct!=null && isFinite(c.pct)).sort((a,b)=>a.pct-b.pct);
    if(cands.length) return { provider: cands[0].provider, bps: cands[0].pct*100 };
  }
  return { provider: fallbackRow.baseline_provider, bps: +fallbackRow.baseline_cost_bps };
}
// Real coverage per corridor, from data/coverage.json (tools/emit_coverage.py,
// computed from data/samples.csv -- never typed). {} until boot() loads it.
let COVERAGE={};
const PLACE={SGD:"Singapore",PHP:"the Philippines",USD:"the US",MXN:"Mexico",AUD:"Australia",NZD:"New Zealand"};
const place=c=>PLACE[c]||c;
const dstOf=r=>((r&&r.dst)||"").trim();

// Fee verification stamp from data/fee_checks.csv and data/withdrawal_fees.csv
// (both from tools/check_fees.py). Three states and no fourth: verified,
// UNVERIFIED, or nothing at all. An absent or empty file renders nothing -- no
// placeholder, no guessed date. Age computes here, at render time, so the
// stamp cannot go stale in a cached page.
// Distinct verification dates from a fees_verified string, oldest first.
function feeDates(verified){
  const legs=String(verified||"").split("|").map(x=>(x.split(":")[1]||"").trim()).filter(Boolean);
  const uniq=Array.from(new Set(legs)).sort();
  return uniq.length?uniq.join(" · "):"—";
}

function feeStamp(rows,verified,wrows,onVenue){
  const runs={};
  for(const r of (rows||[])){ if(r&&r.ts_utc) (runs[r.ts_utc]=runs[r.ts_utc]||[]).push(r); }
  const stamps=Object.keys(runs).sort();
  const clean=stamps.filter(t=>runs[t].every(r=>(r.status||"").trim()==="ok"));
  const lastClean=clean.length?clean[clean.length-1]:null;
  const tradeBad=stamps.length>0&&runs[stamps[stamps.length-1]].some(r=>(r.status||"").trim()!=="ok");
  // The network leg (data/withdrawal_fees.csv) is keyed by venue, not by
  // corridor, and runs on its own schedule -- only a failure on THIS
  // corridor's sending venue can make this corridor's number unverified.
  const wruns={};
  for(const r of (wrows||[])){ if(r&&r.ts_utc) (wruns[r.ts_utc]=wruns[r.ts_utc]||[]).push(r); }
  const wstamps=Object.keys(wruns).sort();
  const withdrawBad=Boolean(onVenue)&&wstamps.length>0&&wruns[wstamps[wstamps.length-1]]
    .some(r=>(r.venue||"").trim().toLowerCase()===onVenue&&(r.source_ok||"").trim()!=="True");
  if(!stamps.length&&!withdrawBad) return {text:"",unverified:false};
  const FS=COPY.feeStamp||{};
  if(tradeBad||withdrawBad){
    const reason=tradeBad&&withdrawBad?(FS.reasonBoth||"trading and network fees")
      :withdrawBad?(FS.reasonNetwork||"network fee"):(FS.reasonTrading||"trading fees");
    const text=T(FS.unverifiedTemplate||"fees UNVERIFIED ({reason}) — last clean check {lastClean}",
      {reason, lastClean: lastClean?lastClean.slice(0,10):(FS.noneOnRecord||"none on record")});
    return {text, unverified:true};
  }
  // The DATE from the fee config, never an age from the wall clock. Only as
  // verified as the stalest leg, so take the oldest.
  const legs=String(verified||"").split("|").map(x=>(x.split(":")[1]||"").trim())
    .filter(Boolean).sort();
  const date=legs.length?legs[0]:(lastClean?lastClean.slice(0,10):"");
  return {text: date?T(FS.verifiedTemplate||"fees verified {date}",{date}):"", unverified:false};
}

async function loadCSVOptional(path){
  // Optional by design: a 404 is "no stamp", not a broken page.
  try{
    const r=await fetch(path);
    if(!r.ok) return [];
    const t=await r.text();
    return t.trim()?parseCSV(t):[];
  }catch(e){ return []; }
}

// Everything below is scoped to the selected corridor.
function selectCorridor(key){
  corridor=key;
  const rows=allRows.filter(r=>(r.corridor||"").trim()===key);
  newest=""; bySize={}; histBySize={};
  for(const r of rows){ if(r.ts>newest) newest=r.ts; }
  const present=[];
  for(const s of SIZES){
    const rs=rows.filter(r=>+r.notional_src===s).sort((a,b)=>a.ts<b.ts?-1:1);
    if(!rs.length) continue;            // a size never sampled is absent, not zero
    histBySize[s]=rs; bySize[s]=rs[rs.length-1]; present.push(s);
  }
  if(!present.length){                   // honest empty state, never placeholder rows
    document.getElementById("stamp").innerHTML=`<b>${key.replace("->"," → ")}</b> — ${COPY.noSamples||"no completed samples yet."}`;
    return;
  }
  if(present.indexOf(size)<0) size=present[present.length-1];
  srcCcy=(bySize[size].src||"SGD").trim();
  const r5=bySize[size];
  const routeWords=place(srcCcy)+" → "+place(dstOf(r5));
  // pageTitle/verdict1 (the h1/lede) are set in render() below, once the
  // selected size's real cost figures are known -- see the comment there.
  const d=new Date(newest.replace(" ","T")), ago=Math.round((Date.now()-d)/6e4);
  const hours=new Set(rows.map(r=>r.ts.slice(0,13))).size;
  // Keeps the "margin.wiki — one transfer, the receipt in full" prefix
  // tools/check_page.py's PAGE_TITLE map expects for this page's job,
  // with the corridor appended -- a plain "margin.wiki — {route} by
  // stablecoin" title used to overwrite that prefix entirely and fail
  // the gate (startswith(), not ==) the moment JS ran.
  document.title="margin.wiki — one transfer, the receipt in full — "+routeWords;
  const feeStampR=feeStamp(feeChecks,r5.fees_verified,withdrawalFees,(r5.onramp_venue||"").trim().toLowerCase());
  document.getElementById("stamp").innerHTML=
    // fees_verified carries one date per leg ("ir:2026-08-10|coins:2026-08-10").
    // Both legs are usually verified on the same day, and printing the string
    // straight through rendered that as "2026-08-10 · 2026-08-10". Distinct
    // dates only -- if the legs ever diverge, both still show.
    T(COPY.sourceTemplate||"Updated {time} UTC · buy on {onrampVenue}, sell on {offrampVenue} · exchange fees checked {dates}",
      {time: newest.slice(0,16).replace("T"," "), onrampVenue: venueName(r5.onramp_venue), offrampVenue: venueName(r5.offramp_venue), dates: feeDates(r5.fees_verified)})+
    // The dates are already printed above from fees_verified. The watcher stamp
    // only earns its place when it DISAGREES -- i.e. a check has gone red.
    (feeStampR.unverified ? ` · ${feeStampR.text}` : "")+
    // Under three hours there is no trend to read. Say how thin it is rather
    // than letting a two-point chart imply one.
    (hours<3?` · <b>${hours} capture${hours===1?"":"s"} so far</b> — every point collected is shown, nothing filled in`:"");
  renderCorridors(); renderSizes(); render();
  const dst=(r5.dst||"").trim();
  document.getElementById("foot").innerHTML=
    T(COPY.footerTemplate, { onrampVenue: venueName(r5.onramp_venue), srcCcy, offrampVenue: venueName(r5.offramp_venue), dst })+" "+
    `<a href="./how-it-works.html">${(COPY.footerLinks||{}).methodology||""}</a> · <a href="./index.html">${(COPY.footerLinks||{}).board||""}</a>`+
    // New shared closing line, per the final route-breakdown mockup
    // (docs/mockups/route-breakdown.html, 2026-09-28): every page's own
    // footer keeps its page-specific detail above; this is the one
    // site-wide transparency line, reconciled with the near-identical
    // wording already used on index.html/fee-tiers.html/country.html
    // rather than introducing a third phrasing.
    `<p style="margin-top:10px">${COPY.dataSourceNote||""}</p>`;
}

function renderCorridors(){
  const bar=document.getElementById("corrbar");
  bar.querySelectorAll(".sz").forEach(e=>e.remove());
  if(corrKeys.length<2){ bar.style.display="none"; return; }

    b.className="sz pill-input"+(k===corridor?" on is-active":""); b.textContent=k.replace("->"," → ");
    b.onclick=()=>selectCorridor(k);

function renderSizes(){
  const bar=document.getElementById("sizebar");
  bar.querySelectorAll(".sz").forEach(e=>e.remove());
  for(const s of SIZES){
    if(!bySize[s]) continue;            // never sampled at this size -> no pill

    b.className="sz pill-input"+(s===size?" on is-active":""); b.textContent=money(s); b.onclick=()=>{size=s;renderSizes();render();};
    bar.appendChild(b);
  }
}

function netBps(r){ return (+r.network_fee_stable)/((+r.notional_src)/(+r.onramp_vwap))*1e4; }

function render(){
  const r=bySize[size], t=+r.cost_bps_taker, m=+r.cost_bps_maker;
  // "The cheapest app" is the true cheapest of every quote for this route
  // (direct provider quotes plus the comparison feed), not just whoever
  // wins the Wise comparison feed alone -- see cheapestApp() above.
  const cheapest=cheapestApp(r.corridor,size,r), base=cheapest.bps;
  const cw=t<base, mw=m<base;
  const N=COPY.numCards||{};
  document.getElementById("nums").innerHTML=`
    ${numCard(N.marketLabel||"Stablecoin, market order",t,cw,size)}
    ${numCard(N.limitLabel||"Stablecoin, limit order",m,mw,size)}
    ${numCard(T(N.cheapestLabelTemplate||"Cheapest app ({provider})",{provider:cheapest.provider}),base,null,size)}`;
  // Same figure the waterfall's "Moving it" bar shows a few lines down --
  // reads from the same sidecar so this line and that bar never disagree.
  // Falls back to the old approximation only when the sidecar has no row
  // for this exact sample yet.
  const wfSum=wfBySample[r.ts+"|"+r.corridor+"|"+r.notional_src];
  const rail=wfSum?+wfSum.wf_move_bps:netBps(r), doors=t-rail;
  // The worked example, in the currency being sent, at the amount selected.
  const VL=COPY.verdictLine||{};
  document.getElementById("verdict").innerHTML=
    (cw
      ? T(VL.stableCheaperTemplate||"The stablecoin route is cheaper at this amount by {amount}.",{amount:cashDiff(size,base,t)})
      : T(VL.appCheaperTemplate||"The cheapest app is cheaper at this amount by {amount}. A limit order saves {limitAmount}, {closes} the gap.",
          {amount:cashDiff(size,t,base), limitAmount:cashDiff(size,t,m), closes: mw?(VL.closes||"closing"):(VL.doesNotClose||"not enough to close")}))+
    `<div class="split"><span>${VL.blockchainSplit||"Network fee"}: <b>${cash(size,rail)}</b></span><span>${VL.exchangesSplit||"exchange fees"}: <b>${cash(size,doors)}</b></span></div>`;
  // The headline states the finding, per DESIGN.md ("headers say the
  // finding, sub-headers only add supporting detail"): this amount, this
  // route, the stablecoin's real cost against the cheapest app's real
  // cost -- both live numbers for the size on screen, never a fixed
  // sentence. Same shape as the mockup's own h1
  // ("Sending S$5,000 to the Philippines by stablecoin costs S$63.58.
  // Airwallex costs S$5.18.").
  document.getElementById("pageTitle").textContent=T(COPY.titleTemplate||"Sending {amount} to {place} by stablecoin costs {marketCost}. {provider} costs {appCost}.",{
    amount: money(size), place: place(dstOf(r)),
    marketCost: cash(size,t), appCost: cash(size,base), provider: cheapest.provider,
  });
  // The lede stays a generic, size-independent sentence (mockup: "Every
  // cost of the stablecoin route, step by step, checked every hour.") --
  // the numeric claim now lives in the h1 above, so this line no longer
  // needs to repeat it.
  document.getElementById("verdict1").textContent=COPY.lede||"Every cost of sending it with stablecoins, step by step, checked every hour.";
  drawWaterfall(r,cheapest); drawLadder(); drawHistory();
}

function numCard(label,val,win,n){
  const NC=COPY.numCards||{};
  const badge = win===null?"":`<span class="badge ${win?"win":"lose"}">${win?NC.cheaper:NC.dearer}</span>`;
  // Money is the headline; the percentage is the footnote. Nobody sends 0.55%.
  return `<div class="num"><div class="n-l">${label} ${badge}</div>
    <div class="n-v">${cash(n,val)}</div><div class="n-s">${T(NC.subTemplate||"{pct} of the amount",{pct:pct(val)})}</div></div>`;
}

function drawWaterfall(r,cheapest){
  // Buy the coin, move it, sell it -- computed once in the collector as a
  // sequential chain (decompose()'s own gross->bought->stable->quote->landed
  // steps), not reconstructed here as independent basis+fee sums, which is
  // what used to drift off the total (SEB: corridor waterfall did not
  // reconcile -- 79.15 shown against a real 78.40 total). No sidecar row for
  // this exact sample yet (a currency's first hour after this shipped, say)
  // means no invented approximation either -- the section says so.
  const n=+r.notional_src;
  const wf=wfBySample[r.ts+"|"+r.corridor+"|"+r.notional_src];
  if(!wf){
    document.getElementById("wfTitle").textContent=T((COPY.cards||{}).waterfall?.titleTemplate||"Where the {amount} cost goes",{amount:money(n)});
    document.getElementById("wfAnswer").textContent="";
    document.getElementById("wf").innerHTML=`<text x="12" y="30" fill="var(--color-neutral-600)" font-size="13" font-family="var(--font-body)">${esc(COPY.waterfallUnavailable||cmiss("waterfallUnavailable"))}</text>`;
    return;
  }
  const comps=[
    {l:"Buy USDT with "+srcCcy, v:+wf.wf_buy_bps, k:"neg"},
    {l:"Send it on chain", v:+wf.wf_move_bps, k:"rail"},
    {l:"Sell USDT for "+dstOf(r), v:+wf.wf_sell_bps, k:"neg"},
  ];
  const total=+r.cost_bps_taker;
  cheapest=cheapest||cheapestApp(r.corridor,n,r);
  const base=cheapest.bps;
  // Header states the finding, computed live from THIS sample's own three
  // legs: does buying+selling the coin cost more than moving it on chain?
  // With real data this is true almost every hour (the site's whole thesis
  // -- trading fees dwarf the network fee), but it is checked, not assumed,
  // so a corridor where the network fee genuinely dominates still gets an
  // honest header instead of a wrong one.
  const WF=(COPY.cards||{}).waterfall||{};
  const tradeBps=Math.abs(+wf.wf_buy_bps)+Math.abs(+wf.wf_sell_bps), moveBps=Math.abs(+wf.wf_move_bps);
  document.getElementById("wfTitle").textContent=T(
    tradeBps>=moveBps ? (WF.buyDominantTemplate||"Most of the {total} goes on buying and selling {stable}, not on sending it")
                       : (WF.moveDominantTemplate||"Most of the {total} goes on sending {stable} on chain, not on buying or selling it"),
    {total:cash(n,total), stable:(r.stable||"USDT")});
  document.getElementById("wfAnswer").textContent=T(WF.answerTemplate||"Sending it on chain costs {moveCost}. Buying {stable} costs {buyCost}.",
    {moveCost:cash(n,+wf.wf_move_bps), stable:(r.stable||"USDT"), buyCost:cash(n,+wf.wf_buy_bps)});
  document.getElementById("wfCap").textContent=T(WF.capTemplate||"Buying USDT is {buyCost} of the {totalCost}. The dashed line is the cheapest app.",
    {buyCost:cash(n,+wf.wf_buy_bps), totalCost:cash(n,total)});
  let run=0; const cum=[0]; comps.forEach(c=>{run+=c.v; cum.push(run);});
  const all=[0,total,base,...cum], dMin=Math.min(...all), dMax=Math.max(...all);
  const pad=(dMax-dMin)*.12||10, lo=dMin-pad, hi=dMax+pad;
  // W = the svg's own real rendered width (it's a static element, CSS
  // width:100%, so its layout box is already correct before we touch the
  // viewBox), not a hardcoded 640 -- a fixed 640-wide viewBox squeezed into
  // a ~335px mobile card scaled every font-size down with it (measured:
  // 10.5/10-unit text rendering at an effective ~5.5px/5.2px). Matches the
  // same fix in index.html's renderWaterfall(); see its comment for why
  // viewBox-width == real-width keeps 1 unit == 1 real px at any size.
  const svg=document.getElementById("wf");
  const W=Math.max(240, Math.round(svg.getBoundingClientRect().width)) || 640;
  // Fixed pixel gutter, not a fraction of W -- like js/chart.js's own
  // rightGutter, the value labels ("S$57.00") are real, constant-size text
  // now that 1 unit == 1 real px, so the space reserved for them has to be
  // a real constant amount too. A gutter that shrank proportionally with W
  // clipped "S$57.00" down to "S$57" on a narrow card (measured: value text
  // right edge at 355 against a 335-wide viewBox).
  const rightGutter=56;
  const L=Math.min(168, Math.round(W*0.5)), R=W-rightGutter, X=v=>L+(v-lo)/(hi-lo)*(R-L);
  const rowH=30, top=6;
  const rows=comps.length+1, H=top+rows*rowH+30;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const col={fee:"var(--pos)",fee2:"var(--fill)",neg:"var(--neg)",rail:"var(--rail)"};
  let s=`<line x1="${X(0)}" y1="${top}" x2="${X(0)}" y2="${top+rows*rowH}" stroke="var(--color-divider)" stroke-width="1"/>`;
  // baseline (incumbent) marker
  s+=`<line x1="${X(base).toFixed(1)}" y1="${top-2}" x2="${X(base).toFixed(1)}" y2="${top+rows*rowH+4}" stroke="var(--neg)" stroke-width="1.3" stroke-dasharray="3 3"/>`+
     `<text x="${X(base).toFixed(1)}" y="${top+rows*rowH+18}" fill="var(--neg)" font-size="10.5" font-family="var(--mono)" text-anchor="middle">${cheapest.provider} ${cash(n,base)}</text>`;
  // The three bps legs already sum to cost_bps_taker exactly (collector-side,
  // to the cent). Converting each to a DOLLAR amount and rounding each
  // independently can still land a bar's label a cent off the total --
  // three coins rounded on their own don't reliably make the same total as
  // one. Last leg's shown value is the remainder against the total's own
  // cents, not its own independently-rounded figure, so the printed numbers
  // always add up, not just the underlying bps.
  const totalCents=cents(n,total);
  const compCents=comps.map(c=>cents(n,c.v));
  compCents[compCents.length-1]=Math.round((totalCents-compCents.slice(0,-1).reduce((a,b)=>a+b,0))*100)/100;
  let feeLegsSeen=0;
  comps.forEach((c,i)=>{
    const y=top+i*rowH, a=X(cum[i]), b=X(cum[i+1]), x0=Math.min(a,b), w=Math.max(2,Math.abs(b-a));
    let fill;
    if(c.k!=="neg") fill=col[c.k];
    else if(c.v<0) fill=col.neg;
    else { fill=feeLegsSeen===0?col.fee:col.fee2; feeLegsSeen++; }
    const stroke = fill===col.fee2 ? ' stroke="var(--neg)" stroke-width="1"' : '';
    s+=`<text x="12" y="${y+rowH/2+4}" fill="var(--color-ink)" font-size="12" font-family="var(--font-body)">${c.l}</text>`+
       `<rect x="${x0.toFixed(1)}" y="${y+6}" width="${w.toFixed(1)}" height="${rowH-12}" fill="${fill}"${stroke}/>`+
       `<text data-wf-leg="${i}" x="${(b+(b>=a?4:-4)).toFixed(1)}" y="${y+rowH/2+4}" fill="var(--color-neutral-700)" font-size="11" font-family="var(--mono)" text-anchor="${b>=a?"start":"end"}">${fmtCents(compCents[i])}</text>`;
  });
  const y=top+comps.length*rowH, xt=X(total);
  s+=`<text x="12" y="${y+rowH/2+4}" fill="var(--color-ink)" font-size="12.5" font-family="var(--font-body)" font-weight="700">${(COPY.legend||{}).wholeTransfer||"The whole transfer"}</text>`+
     `<rect x="${Math.min(X(0),xt).toFixed(1)}" y="${y+5}" width="${Math.max(2,Math.abs(xt-X(0))).toFixed(1)}" height="${rowH-10}" fill="var(--win)"/>`+
     `<text data-wf-total="1" x="${(xt+(total>=0?4:-4)).toFixed(1)}" y="${y+rowH/2+4}" fill="var(--color-ink)" font-size="12" font-family="var(--mono)" font-weight="700" text-anchor="${total>=0?"start":"end"}">${cash(n,total)}</text>`;
  svg.innerHTML=s;
  drawReceipt(r,wf);
}

function drawReceipt(r,wf){
  const n=+r.notional_src, stable=(r.stable||"USDT"), dst=dstOf(r);
  const buy=+wf.wf_buy_bps, move=+wf.wf_move_bps, sell=+wf.wf_sell_bps;
  const feeOn=+r.fee_on_taker_bps||0, feeOff=+r.fee_off_taker_bps||0;
  const on=venueName(r.onramp_venue), off=venueName(r.offramp_venue);
  const netStable=+r.network_fee_stable;
  const lines=[
    {leg:`1 · Buy ${stable} with ${srcCcy} on ${on}`},
    {l:`${stable} priced above the dollar`, v:buy-feeOn},
    {l:`${on} fee`, v:feeOn},
    {leg:`2 · Send ${stable} on chain`},
    {l:`Network fee${isFinite(netStable)&&netStable>0?", "+(+netStable.toFixed(2))+" "+stable:""}`, v:move},
    {leg:`3 · Sell ${stable} for ${dst} on ${off}`},
    {l:`${off} fee`, v:feeOff},
    {l:(sell-feeOff)<0?"Selling price slightly better than the real rate":"Selling price below the real rate", v:sell-feeOff},
  ];
  const total=+r.cost_bps_taker;
  // Cents: every line rounded on its own, last line is the remainder, so the
  // printed column always adds up to the printed total.
  const vals=lines.filter(x=>x.v!=null);
  const totalC=cents(n,total);
  const cs=vals.map(x=>cents(n,x.v));
  cs[cs.length-1]=Math.round((totalC-cs.slice(0,-1).reduce((a,b)=>a+b,0))*100)/100;
  let k=0, h="";
  for(const x of lines){
    if(x.leg){ h+=`<div class="rc leg">${esc(x.leg)}</div>`; continue; }
    const c=cs[k++], neg=c<0;
    h+=`<div class="rc${neg?" neg":""}"><span>${esc(x.l)}</span><span class="a">${neg?"−":""}${fmtCents(Math.abs(c))}</span><span class="b">${pct(x.v)}</span></div>`;
  }
  h+=`<div class="rc tot"><span>Total</span><span class="a">${cash(n,total)}</span><span class="b">${pct(total)}</span></div>`;
  document.getElementById("receipt").innerHTML=h;
  document.getElementById("wfDisclosure").textContent=`Not included yet: bank fees to get ${srcCcy} into ${on} and ${dst} out of ${off}.`;
}

function drawLadder(){
  const rows=SIZES.map(s=>bySize[s]).filter(Boolean);
  const LT=COPY.ladderTable||{}, cols=LT.columns||{};
  const smallest=rows[0], largest=rows[rows.length-1];
  const smallS=+smallest.notional_src, largeS=+largest.notional_src;
  // Header states the finding with the real number: the smallest sampled
  // amount's own stablecoin market-order cost, not the flat network fee
  // alone (the mockup's "3.72% at S$200" is the whole stablecoin cost at
  // that size, network fee included).
  document.getElementById("ladderTitle").textContent=T((COPY.cards||{}).ladder?.titleTemplate||"Small transfers cost the most by stablecoin: {smallPct} at {smallest}",
    {smallPct: pct(+smallest.cost_bps_taker), smallest:money(smallS)});
  // "wins at every size" is only printed when it is actually true for the
  // corridor on screen -- computed live from cheapestApp() on each row here,
  // not assumed.
  const appWinsAll=rows.every(r=>{
    const s=+r.notional_src, t=+r.cost_bps_taker, b=cheapestApp(r.corridor,s,r).bps;
    return t>=b;
  });
  const smallNet=netBps(smallest);
  document.getElementById("ladderCap").textContent=T(
    appWinsAll?((COPY.cards||{}).ladder?.capAllTemplate):((COPY.cards||{}).ladder?.capMostTemplate),
    { smallPct: pct(smallNet), smallest: money(smallS), largest: money(largeS) });
  let h=`<tr><th>Amount</th><th>Stablecoin</th><th>Limit order</th><th>Cheapest app</th></tr>`;
  for(const r of rows){
    const s=+r.notional_src, t=+r.cost_bps_taker, m=+r.cost_bps_maker;
    const cheapest=cheapestApp(r.corridor,s,r), b=cheapest.bps, cw=t<b;
    h+=`<tr class="${s===size?"hl":""}${s===200?" hl":""}">
      <td>${money(s)}</td>
      <td>${cash(s,t)}<br><span class="tag">${pct(t)}</span></td>
      <td>${cash(s,m)}<br><span class="tag">${pct(m)}</span></td>
      <td>${cash(s,b)}<br><span class="tag">${pct(b)}</span></td></tr>`;
  }
  document.getElementById("ladder").innerHTML=h;
}

// The route-breakdown history chart, per docs/mockups/route-breakdown.html:
// 24h/7d/30d/all-time buttons over one small per-corridor sidecar
// (data/corridor_history.json, tools/emit_corridor_history.py) rather than
// samples.csv itself -- see that script's docstring for why the "cheapest
// app" series there is the comparison feed's own historical figure, not
// cheapestApp()'s richer current-hour logic. med() matches the mockup's
// own bucketing exactly: coarser bars (6h, then daily) at wider ranges,
// hourly at 24h, so a bar always represents a readable number of samples.
const med=a=>{const s=[...a].sort((x,y)=>x-y);return s.length?s[s.length>>1]:0};
const parseHourTs=h=>new Date(h+":00:00Z").getTime();

function groupHistRange(rows,r){
  const bucketH = r==='24'?1 : r==='168'?6 : 24;
  const hrs = r==='all' ? Infinity : +r;
  const lastT=parseHourTs(rows[rows.length-1][0]);
  const sel = hrs===Infinity ? rows : rows.filter(rr=>lastT-parseHourTs(rr[0])<hrs*3600000);
  const m=new Map();
  for(const rr of sel){
    const t=parseHourTs(rr[0]), k=Math.floor(t/(bucketH*3600000));
    if(!m.has(k)) m.set(k,{t:k*bucketH*3600000,s:[],a:[]});
    const g=m.get(k); g.s.push(rr[1]); g.a.push(rr[2]);
  }
  const bars=[...m.values()].sort((x,y)=>x.t-y.t).map(g=>({t:g.t,s:med(g.s),a:med(g.a),n:g.s.length}));
  return {sel,bucketH,bars};
}

function fmtHistBarDate(t,bucketH){
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const d=new Date(t), day=d.getUTCDate(), mo=MONTHS[d.getUTCMonth()], h=String(d.getUTCHours()).padStart(2,"0");
  return bucketH<24 ? `${day} ${mo}, ${h}:00 UTC` : `${day} ${mo}`;
}

function renderRangeButtons(){
  const RB=((COPY.cards||{}).history||{}).rangeButtons||{};
  const bar=document.getElementById("rng");
  bar.innerHTML="";
  for(const r of ["24","168","720","all"]){
    const b=document.createElement("button");
    b.textContent=RB[r]||r; b.className=r===histRange?"on":"";
    // Tap target is >=40px tall (.rng button CSS above) -- covered by the
    // same click handler on mouse and touch, no separate touch listener
    // needed for a plain button.
    b.onclick=()=>{ histRange=r; renderRangeButtons(); drawHistory(); };
    bar.appendChild(b);
  }
}

function drawHistory(){
  const svg=document.getElementById("hist"), tip=document.getElementById("histTip");
  const HIST=(COPY.cards||{}).history||{};
  const rowsAll=(corridorHistory && corridorHistory.corridors[corridor] &&
    corridorHistory.corridors[corridor].sizes &&
    corridorHistory.corridors[corridor].sizes[String(size)]) || [];

  renderRangeButtons();

  const covEl=document.getElementById("histCoverage");
  if(covEl){ const cov=(COVERAGE.corridors||{})[corridor]; covEl.textContent=cov?cov.sentence:""; }

  if(rowsAll.length<2){
    document.getElementById("histTitle").textContent=
      T(HIST.hasNotBeenCheaperTemplate||"The stablecoin has not been cheaper than the cheapest app in any hour since {start}",
        {start:historyStart?historyStart.slice(0,10):""});
    document.getElementById("histCap").textContent=
      T(COPY.buildingTemplate||"history builds as we check — {count} so far",
        {count:rowsAll.length+(rowsAll.length===1?" sample":" samples")});
    document.getElementById("histSum").innerHTML="";
    svg.innerHTML=""; tip.style.opacity=0;
    return;
  }

  // The overall finding (h2): has the stablecoin EVER been cheaper than
  // the cheapest app, at this amount, on this corridor, across every hour
  // sampled -- independent of the range toggle below, same as the
  // mockup's own static h2 vs its per-range #ans paragraph.
  const startDate=(function(d){const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return (+d.slice(8,10))+" "+M[(+d.slice(5,7))-1];})(rowsAll[0][0].slice(0,10));
  const winsAllTime=rowsAll.filter(rr=>rr[1]<rr[2]).length;
  document.getElementById("histTitle").textContent = winsAllTime
    ? T(HIST.wasCheaperTemplate||"The stablecoin was cheaper than the cheapest app in {wins} of {total} hours since {start}",
        {wins:winsAllTime, total:rowsAll.length, start:startDate})
    : T(HIST.hasNotBeenCheaperTemplate||"The stablecoin has not been cheaper than the cheapest app in any hour since {start}",
        {start:startDate});

  const {sel,bucketH,bars}=groupHistRange(rowsAll,histRange);
  const winsInRange=sel.filter(rr=>rr[1]<rr[2]).length;
  const rangeLabel=T((HIST.rangeLabels||{})[histRange]||"",{start:startDate});
  const unit=bucketH===1?"hour":bucketH===6?"6 hours":"day";
  document.getElementById("histCap").textContent=T(
    HIST.rangeCapTemplate||"{count} hours checked {rangeLabel}, at {amount}{winsClause}. One bar per {unit}.",
    { count:sel.length, rangeLabel, amount:money(size),
      winsClause: winsInRange ? T(HIST.winsClauseTemplate||", cheaper in {wins}",{wins:winsInRange}) : "",
      unit });

  const sumS=med(sel.map(rr=>rr[1])), sumA=med(sel.map(rr=>rr[2]));
  document.getElementById("histSum").innerHTML=
    `<div><div class="k">${esc(HIST.sumStableLabel||"Stablecoin, typical")}</div><div class="v p">${pct(sumS*100)}</div></div>`+
    `<div><div class="k">${esc(HIST.sumAppLabel||"Cheapest app, typical")}</div><div class="v">${pct(sumA*100)}</div></div>`+
    `<div><div class="k">${esc(HIST.sumWinsLabel||"Hours it was cheaper")}</div><div class="v">${winsInRange} of ${sel.length}</div></div>`;

  drawRangeChart(bars,bucketH,svg,tip);
}

// Draws the bars into an already-sized <svg>. Split out from drawHistory()
// so window resize (see the listener near boot(), below) can redraw just
// the chart at the container's new real width without recomputing the
// range/summary text above it.
let _lastHistBars=null, _lastHistBucket=null;
function drawRangeChart(bars,bucketH,svg,tip){
  _lastHistBars=bars; _lastHistBucket=bucketH;
  // Read the container's REAL clientWidth, not a fixed viewBox scaled by
  // CSS -- a scaled-down fixed viewBox is exactly the bug that shrank
  // chart text on narrow phones sitewide (fixed 2026-09-27); this chart
  // must not reintroduce it. Redrawn on resize (see below), so it never
  // goes stale after a rotate or a window resize either.
  const box=svg.parentNode.getBoundingClientRect();
  const W=Math.max(280, Math.round(box.width)) || 640, H=W<500?200:220;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const L=8, R=54, Ttop=14, B=28;
  const top=Math.max(0.5, Math.ceil(Math.max(0.5,...bars.map(b=>b.s))*2)/2);
  const Y=v=>Ttop+(top-v)/top*(H-Ttop-B);
  const bw=(W-L-R)/bars.length;
  let g="";
  for(let v=0.5; v<=top+1e-9; v+=0.5){
    g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--color-divider)"/>`+
       `<text x="${(W-R+6).toFixed(1)}" y="${(Y(v)+3).toFixed(1)}" font-size="14" font-family="var(--mono)" fill="var(--color-neutral-600)">${v.toFixed(1)}%</text>`;
  }
  bars.forEach((b,i)=>{
    const pad=Math.min(1,bw*0.15), x=L+i*bw+pad, w=Math.max(1,bw-2*pad);
    const app=Math.max(0,b.a), s=Math.max(app,b.s);
    g+=`<g data-i="${i}">`+
       `<rect x="${x.toFixed(1)}" y="${Y(app).toFixed(1)}" width="${w.toFixed(1)}" height="${(Y(0)-Y(app)).toFixed(1)}" fill="var(--neg)"/>`+
       `<rect x="${x.toFixed(1)}" y="${Y(s).toFixed(1)}" width="${w.toFixed(1)}" height="${(Y(app)-Y(s)).toFixed(1)}" fill="var(--pos)"/>`+
       `<rect x="${(L+i*bw).toFixed(1)}" y="${Ttop}" width="${bw.toFixed(1)}" height="${(H-Ttop-B).toFixed(1)}" fill="transparent"/></g>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" stroke="var(--color-ink,#0B0B0B)"/>`+
     `<text x="${(W-R+6).toFixed(1)}" y="${(Y(0)+3).toFixed(1)}" font-size="14" font-family="var(--mono)" fill="var(--color-neutral-600)">0%</text>`+
     `<text x="${L}" y="${H-8}" font-size="14" font-family="var(--font-body)" fill="var(--color-neutral-600)">${esc(fmtHistBarDate(bars[0].t,bucketH))}</text>`+
     `<text x="${(W-R).toFixed(1)}" y="${H-8}" text-anchor="end" font-size="14" font-family="var(--font-body)" fill="var(--color-neutral-600)">${esc(fmtHistBarDate(bars[bars.length-1].t,bucketH))}</text>`;
  svg.innerHTML=g;

  function showTip(i,clientX,clientY){
    const b=bars[i], tbox=svg.parentNode.getBoundingClientRect();
    tip.innerHTML=`<b>${esc(fmtHistBarDate(b.t,bucketH))}</b><br>Stablecoin <b style="color:#817FCC">${pct(b.s*100)}</b><br>Cheapest app <b>${pct(b.a*100)}</b><br>Extra <b>+${Math.max(0,b.s-b.a).toFixed(2)} pts</b>`;
    let x=clientX-tbox.left+12; if(x>tbox.width-170) x=clientX-tbox.left-170;
    tip.style.left=x+"px"; tip.style.top=Math.max(0,clientY-tbox.top-10)+"px"; tip.style.opacity=1;
  }
  svg.querySelectorAll("g[data-i]").forEach(el=>{
    const i=+el.dataset.i;
    // pointer* covers mouse hover AND touch tap in one listener -- nothing
    // on this chart is hover-only (site mobile rule, 2026-09-28).
    el.addEventListener("pointermove",ev=>showTip(i,ev.clientX,ev.clientY));
    el.addEventListener("pointerdown",ev=>showTip(i,ev.clientX,ev.clientY));
    el.addEventListener("pointerleave",()=>{ tip.style.opacity=0; });
  });
}

boot().catch(e=>{document.getElementById("stamp").textContent=(COPY.loadFailed)||"failed to load data"; console.error(e);});

// Every chart on this page reads its container's real width at draw time
// (drawWaterfall, the old drawHistory, drawRangeChart above) rather than a
// fixed viewBox scaled by CSS, so a resize or rotate needs a real redraw,
// not just a re-scale -- site mobile rule, 2026-09-28. render() recomputes
// everything from the size/corridor already selected, so this is a full
// redraw, debounced to one per animation frame rather than one per resize
// event.
let _resizeRAF=null;
window.addEventListener("resize",()=>{
  if(_resizeRAF) return;
  _resizeRAF=requestAnimationFrame(()=>{ _resizeRAF=null; if(bySize[size]) render(); });
});
</script>

    document.addEventListener('click', function(e){

    });
