<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>margin.wiki — ask it a question</title>
<meta name="description" content="Ask what a dollar costs anywhere this site tracks, why a country isn't priced, the cheapest way to send money, or how any number was made — answered live, watched as it happens."/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="./js/chart.js"></script>
<style>
  :root{ --ink:#0B0B0B; --sub:#6B6B6B; --stamp:#9A9A9A; --indigo:#817FCC; --rule:#F0F0F0; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Archivo',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);background:#fff}
  a{color:var(--ink);text-decoration:none} a:hover{color:var(--indigo)}
  .num{font-variant-numeric:tabular-nums}
  .stamp{font-size:11px;color:var(--stamp);letter-spacing:.06em}
  .receipt{font-size:13px;color:var(--sub)}
  .wrap{max-width:820px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 48px;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:800;letter-spacing:-0.02em}
  nav{display:flex;gap:28px;font-size:15px;font-weight:500;color:#333;flex-wrap:wrap}
  .hero{padding:24px 48px 8px}
  h1{font-size:34px;font-weight:800;line-height:1.12;letter-spacing:-0.02em;margin:0}
  .sub{padding-top:12px;font-size:16px;line-height:1.5;color:var(--sub)}
  .body{padding:0 48px 64px}
  .ask{margin-top:24px;height:60px;background:#F6F6F6;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 9px 0 26px;box-sizing:border-box}
  .ask input{border:0;background:none;outline:none;font-size:18px;font-family:inherit;flex:1;color:var(--ink)}
  .ask input::placeholder{color:#9A9A9A;font-weight:500}
  .ask button{width:44px;height:44px;border-radius:50%;background:#0B0B0B;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
  .chips{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .chip{padding:8px 15px;background:#F6F6F6;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;border:0;font-family:inherit}
  .item p{font-size:18px;font-weight:500;line-height:1.55;margin:0}
  .item .num{font-weight:700} .indigo{color:var(--indigo)}
  @media(max-width:900px){
    header{flex-wrap:wrap;gap:12px;padding:22px 24px}
  }

  .header-right{display:flex;align-items:center;gap:16px}
  .nav-toggle{display:none;background:none;border:0;font-size:20px;cursor:pointer;padding:6px 8px;color:#0B0B0B;line-height:1}
  @media(max-width:760px){
    header{position:relative;flex-wrap:nowrap!important;padding:16px 20px} .hero{padding:20px 20px 8px} .body{padding:0 20px 48px}
    h1{font-size:26px}
    .brand{gap:14px}
    nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column!important;gap:0!important;padding:6px 20px 16px;border-bottom:1px solid #F0F0F0;box-shadow:0 8px 16px rgba(11,11,11,0.06);z-index:30}
    nav.open{display:flex}
    nav a{padding:12px 0;border-bottom:1px solid #F6F6F6;font-size:16px}
    .nav-toggle{display:block}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><a href="./index.html">margin.wiki</a></div>
      <nav>
        <a href="./the-index.html">The index</a>
        <a href="./sending-money.html">Sending money</a>
        <a href="./findings.html">Findings</a>
        <a href="./how-it-works.html">How it works</a>
      </nav>
    </div>
    <div class="header-right">
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <div class="hero">
    <h1>Ask it a question.</h1>
    <div class="sub" id="coverage">Loading this hour's coverage…</div>
  </div>

  <div class="body">
    <div class="ask">
      <input type="text" placeholder="Ask about any country, corridor or provider here…" id="askInput"/>
      <button aria-label="ask" id="askBtn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="answerBox" style="display:none"></div>
    <div class="chips" id="chips"></div>
    <div id="coverageList" style="display:none;margin-top:10px;padding:16px 20px;background:#F6F6F6;border-radius:12px;font-size:13px;line-height:1.7;color:#333"></div>
  </div>
</div>

<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // A negative index_pct means the street price is BELOW the official rate --
  // real, and it happens. "costs -0.35% more" is a false claim from a sign
  // bug, not an edge case to ignore.
  var PAR_EPSILON = 0.05;
  function costPhrase(pct, digits) {
    digits = digits == null ? 1 : digits;
    if (Math.abs(pct) < PAR_EPSILON) return 'trades basically at the official rate';
    if (pct > 0) return 'costs ' + pct.toFixed(digits) + '% more than the official rate';
    return 'costs ' + Math.abs(pct).toFixed(digits) + '% less than the official rate';
  }
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function shortDate(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()];
  }
  function sparkDates(c){
    if (!c.spark || !c.history_start || !c.hour_utc) return [];
    var end = new Date(c.hour_utc), n = c.spark.length, out = [];
    for (var i = 0; i < n; i++) {
      var d = new Date(end);
      d.setUTCDate(d.getUTCDate() - (n - 1 - i));
      out.push(d.toISOString());
    }
    return out;
  }
  function cashPct(bps){ var pct = bps/100; return (pct>=0?'+':'') + pct.toFixed(2) + '%'; }
  function fmtVolume(v) {
    if (v >= 1e9) return 'S$' + (v/1e9).toFixed(1).replace(/\.0$/,'') + 'B';
    if (v >= 1e6) return 'S$' + (v/1e6).toFixed(1).replace(/\.0$/,'') + 'M';
    if (v >= 1e3) return 'S$' + (v/1e3).toFixed(0) + 'K';
    return 'S$' + v.toFixed(0);
  }

  Promise.all([
    fetch('./data/index_latest.json', {cache:'no-store'}).then(r=>r.json()),
    fetch('./data/providers_latest.json', {cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    fetch('./data/volume_crossover.json', {cache:'no-store'}).then(r=>r.json()).catch(()=>null)
  ]).then(function(res){
    var idx = res[0], prov = res[1], crossover = res[2];
    var countries = idx.countries || [];
    var withheld = idx.withheld || [];
    var hourUtc = (idx.as_of_utc || idx.computed_at || '').slice(11,16);
    var trackedCountryCount = countries.length + withheld.length;

    var ranked = countries.slice().sort(function(a,b){ return b.index_pct - a.index_pct; });
    var corridorCount = prov && prov.corridors ? Object.keys(prov.corridors).length : 0;
    var earliest = countries.reduce(function(m, c){
      if (!c.history_start) return m;
      return (!m || c.history_start < m) ? c.history_start : m;
    }, null);
    document.getElementById('coverage').innerHTML =
      'Answers what a dollar costs in any of the <a href="#" id="showCountries" style="color:#0B0B0B;font-weight:600;border-bottom:1px solid #DDD">' +
      (trackedCountryCount) + ' tracked countries</a>, why one isn\'t priced, the cheapest way to send money on ' +
      corridorCount + ' tracked corridors, how a price moved over time, how any published number was made, and how the site works.' +
      (earliest ? ' The longest record goes back to ' + shortDate(earliest + 'T00:00:00Z') + '.' : '');

    var trackedNames = {};
    countries.forEach(function(c){ trackedNames[c.country.toLowerCase()] = { ccy: c.ccy, priced: true, country: c.country }; });
    withheld.forEach(function(w){ trackedNames[w.country.toLowerCase()] = { ccy: w.ccy, priced: false, country: w.country }; });

    document.getElementById('showCountries').addEventListener('click', function(e){
      e.preventDefault();
      var box = document.getElementById('coverageList');
      if (box.style.display === 'block') { box.style.display = 'none'; return; }
      var all = Object.keys(trackedNames).map(function(n){ return trackedNames[n]; })
        .sort(function(x, y){ return x.country.localeCompare(y.country); });
      box.innerHTML = '<b>Every country this site tracks</b> — ' + countries.length +
        ' priced this hour, ' + withheld.length + ' checked but withheld:<br>' +
        all.map(function(t){
          return '<a href="./country.html?ccy=' + esc(t.ccy) + '" style="color:' + (t.priced ? '#0B0B0B' : '#6B6B6B') + '">' + esc(t.country) + '</a>';
        }).join(' · ');
      box.style.display = 'block';
    });

    var worldNames = {};
    try {
      var dn = new Intl.DisplayNames(['en'], { type: 'region' });
      for (var a = 65; a <= 90; a++) for (var b = 65; b <= 90; b++) {
        var code = String.fromCharCode(a) + String.fromCharCode(b);
        var nm = dn.of(code);
        if (nm && nm !== code) worldNames[nm.toLowerCase()] = nm;
      }
    } catch (e) { /* older browser: falls through to the generic A2 message */ }

    var answerBox = document.getElementById('answerBox');
    var passStampLabel = 'answered from the ' + hourUtc + ' UTC pass';
    var API_BASE = location.hostname.endsWith("margin.wiki")
      ? "https://api.margin.wiki" : "http://127.0.0.1:8901";

    function showAnswerCard(sentenceHtml, receiptHtml, chartCountry, rawChartOpts) {
      var chartId = (chartCountry || rawChartOpts) ? 'chip' + Math.random().toString(36).slice(2,8) : null;
      answerBox.innerHTML = '<div class="item" style="padding-top:22px;border-top:1px solid #F0F0F0;margin-top:6px">' +
        '<div class="stamp num">' + esc(passStampLabel) + '</div>' +
        '<p>' + sentenceHtml + '</p>' +
        (chartId ? '<div id="' + chartId + '" style="margin:14px 0"></div>' : '') +
        (receiptHtml ? '<div class="receipt">' + receiptHtml + '</div>' : '') +
        '</div>';
      answerBox.style.display = 'block';
      if (chartId && window.MarginChart) {
        if (chartCountry && chartCountry.spark && chartCountry.spark.length > 1) {
          MarginChart.render(document.getElementById(chartId),
            { spark: chartCountry.spark, timestamps: sparkDates(chartCountry), valueSuffix: '%' });
        } else if (rawChartOpts) {
          MarginChart.render(document.getElementById(chartId), rawChartOpts);
        }
      }
    }

    var corridorCount2 = corridorCount;
    var dollarRouteRow = null, cheapestRow = null, corridorWords = null;
    if (prov && prov.corridors) {
      var r0 = prov.corridors[Object.keys(prov.corridors)[0]];
      var s0 = r0 && r0.sizes['5000'];
      corridorWords = r0 && r0.route_words;
      dollarRouteRow = s0 && s0.rows.find(function(r){ return r.provider === 'The dollar route'; });
      cheapestRow = s0 && s0.rows[0];
    }
    var widestGap = ranked[0];
    var movedCountry = countries.filter(function(c){ return c.spark && c.spark.length > 1; })
      .sort(function(a,b){ return Math.abs(b.index_pct-b.spark[0]) - Math.abs(a.index_pct-a.spark[0]); })[0];
    var costCountry = countries.find(function(c){ return c.country === 'Argentina'; }) || countries[0];
    var withheldPick = withheld[0];

    function countryFrame(c) {
      return '<b>' + esc(c.country) + ' (' + esc(c.ccy) + '):</b> a dollar ' + costPhrase(c.index_pct) +
        ' this hour, from ' + esc(c.evidence_words) + '. <a href="./country.html?ccy=' + esc(c.ccy) + '" style="font-weight:600;color:#0B0B0B">the full receipt →</a>';
    }

    var CHIP_DEFS = [];
    if (costCountry) CHIP_DEFS.push({
      label: 'What does a dollar cost in ' + costCountry.country + '?',
      run: function(){ showAnswerCard(countryFrame(costCountry), null); }
    });
    if (widestGap) CHIP_DEFS.push({
      label: 'Which country has the widest gap this hour?',
      run: function(){ showAnswerCard('The widest gap right now: a dollar in <b>' + esc(widestGap.country) + '</b> ' + costPhrase(widestGap.index_pct) +
        ', from ' + esc(widestGap.evidence_words) + '.', '<a href="./country.html?ccy=' + esc(widestGap.ccy) + '" style="font-weight:600;color:#0B0B0B">the full receipt →</a>'); }
    });
    if (withheldPick) CHIP_DEFS.push({
      label: 'Why is ' + withheldPick.country + ' not priced?',
      run: function(){
        showAnswerCard('<b>' + esc(withheldPick.country) + ' (' + esc(withheldPick.ccy) + '):</b> ' + esc(withheldPick.reason) +
          '. Checked again next pass — this is the current hour\'s real result, not a permanent state.',
          'nothing ships unverified · <a href="./country.html?ccy=' + esc(withheldPick.ccy) + '" style="font-weight:600;color:#0B0B0B">' + esc(withheldPick.country) + '\'s page →</a>');
      }
    });
    if (dollarRouteRow && cheapestRow) CHIP_DEFS.push({
      label: 'Cheapest way to send money ' + corridorWords + '?',
      run: function(){
        showAnswerCard('<b>' + esc(cheapestRow.provider) + '</b> is cheapest right now at <b class="num">' + esc(cheapestRow.costs) + '</b>. The digital-dollar route costs <b class="num">' + esc(dollarRouteRow.costs) + '</b> — ' +
          (dollarRouteRow.cost_pct > cheapestRow.cost_pct ? 'more than the cheapest ordinary option.' : 'less than every ordinary option.'),
          're-priced every hour · <a href="./sending-money.html" style="font-weight:600;color:#0B0B0B">every way to send it, ranked →</a>');
      }
    });
    if (movedCountry) CHIP_DEFS.push({
      label: 'How has the gap in ' + movedCountry.country + ' moved over time?',
      run: function(){
        var delta = movedCountry.index_pct - movedCountry.spark[0];
        showAnswerCard('<b>' + esc(movedCountry.country) + ':</b> the gap has ' + (delta>=0?'widened':'narrowed') + ' by <b class="num">' + Math.abs(delta).toFixed(1) + ' points</b> over the tracked window — a dollar there now ' + costPhrase(movedCountry.index_pct) + '.',
          '<a href="./country.html?ccy=' + esc(movedCountry.ccy) + '" style="font-weight:600;color:#0B0B0B">' + esc(movedCountry.country) + '\'s full receipt →</a>',
          movedCountry);
      }
    });
    if (crossover && crossover.status === 'ok' && crossover.taker && crossover.taker.status === 'crosses') {
      CHIP_DEFS.push({
        label: 'At what volume does SGD→PHP flip to stablecoins?',
        run: function(){
          var t = crossover.taker, m = crossover.maker;
          var sentence = 'At S$' + Number(crossover.rung_sgd).toLocaleString() +
            ' a transfer, the stablecoin route only beats the best fiat provider once a sender is running real payments-company volume, not retail: <b>' +
            fmtVolume(t.monthly_volume_sgd) + '/month</b> and up buying it now' +
            (m && m.status === 'crosses' ? (', <b>' + fmtVolume(m.monthly_volume_sgd) + '/month</b> if waiting for your price') : '') +
            ' — that volume is what unlocks Independent Reserve’s ' + t.fee_pct_at_crossover_ir.toFixed(2) +
            '% tier, down from 0.50% at the base rate everyone starts on. Below it, stablecoins lose, every time.';
          var chartOpts = {
            spark: t.curve.map(function(p){ return p.cost_bps / 100; }),
            xLabels: t.curve.map(function(p){ return fmtVolume(p.monthly_volume_sgd) + '/mo'; }),
            valueSuffix: '%',
            refValue: crossover.baseline_cost_bps_median / 100,
            refLabel: 'best fiat provider: ' + cashPct(crossover.baseline_cost_bps_median)
          };
          showAnswerCard(sentence,
            'measured from ' + crossover.n_samples + ' real S$' + Number(crossover.rung_sgd).toLocaleString() +
            ' samples and the venues’ own published fee tiers, re-derived not assumed · <a href="./methodology.html" style="font-weight:600;color:#0B0B0B">the exact method →</a>',
            null, chartOpts);
        }
      });
    }
    CHIP_DEFS.push({
      label: 'How was ' + (costCountry ? costCountry.country : 'a number') + '\'s number made?',
      run: function(){ methodologyAnswer('how was ' + (costCountry ? costCountry.country : '') + ' made', costCountry); }
    });
    CHIP_DEFS.push({
      label: 'How does this site work?',
      run: function(){ methodologyAnswer('how does this work', null); }
    });

    document.getElementById('chips').innerHTML = CHIP_DEFS.map(function(c, i){
      return '<button class="chip" data-i="' + i + '">' + esc(c.label) + '</button>';
    }).join('');
    document.querySelectorAll('.chip').forEach(function(btn){
      btn.addEventListener('click', function(){ CHIP_DEFS[+btn.getAttribute('data-i')].run(); });
    });

    var METHOD_RE = /\bhow\b.*\b(made|calculat|comput|built|measur|works?)\b|methodolog/i;
    function methodologyAnswer(q, maybeCountry) {
      if (maybeCountry) {
        var p2pNote = esc(maybeCountry.evidence_words) + ' (' + esc(maybeCountry.source_words) + ')';
        showAnswerCard('Every hour the collector takes the real median price, ' + p2pNote +
          ', compares it to the official rate captured in the same pass, and that gap is the number — nothing modelled, nothing smoothed.',
          '<a href="./country.html?ccy=' + esc(maybeCountry.ccy) + '" style="font-weight:600;color:#0B0B0B">' + esc(maybeCountry.country) + '\'s full receipt →</a> · <a href="./how-it-works.html" style="font-weight:600;color:#0B0B0B">how it works →</a>');
      } else {
        showAnswerCard('Every hour the collector takes a real median price, compares it to the official rate from the same pass, and publishes the gap — nothing modelled, nothing forecast. Every number traces to a file you can open.',
          '<a href="./how-it-works.html" style="font-weight:600;color:#0B0B0B">read how it works, in full →</a>');
      }
    }

    function diagnose(q) {
      var lower = ' ' + q.toLowerCase().replace(/[^a-z\s]/g, ' ') + ' ';
      var mentionedTracked = Object.keys(trackedNames).filter(function(n){ return lower.indexOf(' ' + n + ' ') !== -1; });
      var mentionedWorld = Object.keys(worldNames).filter(function(n){ return lower.indexOf(' ' + n + ' ') !== -1; });
      var untracked = mentionedWorld.filter(function(n){ return !trackedNames[n]; });
      if (untracked.length) {
        return '<b>' + esc(worldNames[untracked[0]]) + '</b> isn’t one of the ' +
          (trackedCountryCount) + ' countries this site collects prices for — nothing is being hidden, it was simply never collected. ' +
          '<a href="#" id="diagShow" style="font-weight:600;color:#0B0B0B">See the ones that are tracked →</a>';
      }
      if (mentionedTracked.length) {
        var t = trackedNames[mentionedTracked[0]];
        var full = countries.find(function(c){ return c.ccy === t.ccy; });
        if (full) return 'That phrasing didn’t resolve, but <b>' + esc(t.country) + '</b> <i>is</i> tracked. Right now: ' + countryFrame(full);
        var w = withheld.find(function(x){ return x.ccy === t.ccy; });
        return 'That phrasing didn’t resolve, but <b>' + esc(t.country) + '</b> <i>is</i> tracked — it just has no price this hour: ' + esc(w ? w.reason : 'checked, not yet priced') +
          '. <a href="./country.html?ccy=' + esc(t.ccy) + '" style="font-weight:600;color:#0B0B0B">' + esc(t.country) + '\'s page →</a>';
      }
      return 'That couldn’t be turned into a query against what’s collected here. The nearest real answer: the widest gap this hour is <b>' + (widestGap ? esc(widestGap.country) : 'unavailable') + '</b>. ' +
        '<a href="./the-index.html" style="font-weight:600;color:#0B0B0B">See every tracked country →</a>';
    }

    var askInput = document.getElementById('askInput');
    var askBtn = document.getElementById('askBtn');

    function renderLiveCard(state) {
      var html = '<div class="item" style="padding-top:22px;border-top:1px solid #F0F0F0;margin-top:6px">' +
        '<div class="stamp num">' + (state.final || state.error ? esc(passStampLabel) : 'watching the agent work, live') + '</div>';
      state.attempts.forEach(function(a, i){
        var retryNote = (i > 0 && state.attempts[i - 1] && state.attempts[i - 1].note)
          ? '<div style="font-size:13px;color:#6B6B6B;margin-bottom:6px">That didn\'t fully answer it — trying again, because ' + esc(state.attempts[i - 1].note) + '</div>' : '';
        html += '<div style="margin:14px 0;font-size:14px;padding-left:14px;border-left:2px solid #F0F0F0">' +
          retryNote +
          '<div style="font-weight:700;color:#0B0B0B;margin-bottom:6px">Attempt ' + (i + 1) + '</div>' +
          '<div style="color:#6B6B6B;margin-bottom:2px">Looking at what’s collected, writing a query' + (a.sql ? '.' : '…') + '</div>';
        if (a.sql) html += '<div style="font-family:ui-monospace,monospace;font-size:12px;color:#817FCC;word-break:break-all;margin:4px 0 8px;background:#F9F9FC;padding:8px 10px;border-radius:6px">' + esc(a.sql) + '</div>';
        if (a.sql && a.rows == null) html += '<div style="color:#6B6B6B;margin-bottom:2px">Running it against the real data…</div>';
        if (a.rows != null) html += '<div style="color:#6B6B6B;margin-bottom:2px">Ran it — ' + a.rows + ' row' + (a.rows === 1 ? '' : 's') + ' came back' + (a.rowsError ? ' (' + esc(a.rowsError) + ')' : '') + '.</div>';
        if (a.rows != null && !a.evaluated) html += '<div style="color:#6B6B6B;margin-bottom:2px">Checking whether that answers the question…</div>';
        if (a.evaluated) html += '<div style="color:' + (a.sufficient ? '#0B0B0B' : '#6B6B6B') + ';font-weight:600">' + (a.sufficient ? 'Yes — answers the question.' : ('Not enough on its own — ' + esc(a.note || '') + '.')) + '</div>';
        html += '</div>';
      });
      if (state.error) {
        html += '<p>' + state.error + '</p>';
      } else if (state.final) {
        html += '<p style="margin-top:14px">' + esc(state.final.sentence) + '</p>';
        if (state.final.chart) html += '<div id="askChartHost" style="margin:14px 0"></div>';
        if (state.final.sql) {
          html += '<a href="#" id="askSqlToggle" style="font-weight:600;color:#0B0B0B">See the actual database query →</a>' +
            '<div id="askSqlBody" style="display:none;margin-top:6px;font-family:ui-monospace,monospace;font-size:12px;word-break:break-all">' + esc(state.final.sql) + '</div>';
        }
      } else if (!state.attempts.length) {
        html += '<div style="color:#9A9A9A">Asking…</div>';
      }
      html += '</div>';
      answerBox.innerHTML = html;
      answerBox.style.display = 'block';
      if (state.final && state.final.chart) {
        var host = document.getElementById('askChartHost');
        if (host && window.MarginChart) MarginChart.render(host, state.final.chart);
      }
      if (state.final && state.final.sql) {
        var t = document.getElementById('askSqlToggle');
        if (t) t.addEventListener('click', function(e){
          e.preventDefault();
          var b = document.getElementById('askSqlBody');
          b.style.display = b.style.display === 'none' ? 'block' : 'none';
        });
      }
      var dlink = document.getElementById('diagShow');
      if (dlink) dlink.addEventListener('click', function(e){
        e.preventDefault();
        document.getElementById('showCountries').click();
        document.getElementById('coverageList').scrollIntoView({behavior:'smooth', block:'center'});
      });
    }

    function submitAsk(){
      var q = (askInput.value || '').trim();
      if (!q) return;
      if (METHOD_RE.test(q)) { methodologyAnswer(q, null); return; }

      var state = { attempts: [], final: null, error: null };
      renderLiveCard(state);

      var es;
      try {
        es = new EventSource(API_BASE + '/ask_stream?question=' + encodeURIComponent(q));
      } catch (e) {
        state.error = 'The live ask service is not reachable right now. That failure is shown, not hidden. ' +
          (widestGap ? 'The widest gap this hour is still visible: <b>' + esc(widestGap.country) + '</b>.' : '');
        renderLiveCard(state);
        return;
      }
      var closed = false;
      function close(){ if (!closed) { closed = true; es.close(); } }

      es.onmessage = function(ev){
        var data;
        try { data = JSON.parse(ev.data); } catch (e) { return; }
        var slot;
        if (data.type === 'attempt') {
          state.attempts[data.n - 1] = state.attempts[data.n - 1] || {};
        } else if (data.type === 'sql') {
          slot = state.attempts[data.n - 1] = state.attempts[data.n - 1] || {};
          slot.sql = data.sql;
        } else if (data.type === 'rows') {
          slot = state.attempts[data.n - 1] = state.attempts[data.n - 1] || {};
          slot.rows = data.count;
          if (data.error) slot.rowsError = data.error;
        } else if (data.type === 'evaluate') {
          slot = state.attempts[data.n - 1] = state.attempts[data.n - 1] || {};
          slot.evaluated = true;
          slot.sufficient = data.sufficient;
          slot.note = data.note;
        } else if (data.type === 'error') {
          var err = String(data.message || '');
          var isOperational = /enough questions|reachable|budget|not configured/i.test(err);
          state.error = isOperational ? esc(err) : diagnose(q);
          close();
        } else if (data.type === 'final') {
          if (data.insufficient) {
            state.error = esc(data.sentence) + ' ' + diagnose(q);
          } else {
            state.final = data;
          }
          close();
        }
        renderLiveCard(state);
      };
      es.onerror = function(){
        if (!state.final && !state.error) {
          state.error = 'The live ask service is not reachable right now. That failure is shown, not hidden. ' +
            (widestGap ? 'The widest gap this hour is still visible: <b>' + esc(widestGap.country) + '</b>.' : '');
          renderLiveCard(state);
        }
        close();
      };
    }
    if (askBtn) askBtn.addEventListener('click', submitAsk);
    if (askInput) askInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') submitAsk(); });

    // Lets tools/check_page.py exercise one real chip headlessly, the same
    // way a reader clicking one would.
    var verifyIdx = new URLSearchParams(location.search).get('verify');
    if (verifyIdx !== null && CHIP_DEFS[+verifyIdx]) {
      CHIP_DEFS[+verifyIdx].run();
    }
  }).catch(function(err){
    document.getElementById('coverage').textContent = "Could not load this hour's data. That failure is shown, not hidden.";
  });
})();
</script>

<script>
(function(){
  var btn = document.getElementById('navToggle');
  var nav = document.querySelector('header nav');
  if (btn && nav) {
    btn.addEventListener('click', function(){ nav.classList.toggle('open'); });
    document.addEventListener('click', function(e){
      if (nav.classList.contains('open') && !nav.contains(e.target) && e.target !== btn) nav.classList.remove('open');
    });
  }
})();
</script>
