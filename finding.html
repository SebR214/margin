<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>margin.wiki</title>
<link rel="stylesheet" href="./style.css">
<style>
  /* One finding (SEB-268), rebuilt to the approved reference. Header, column, title and pill styles are the shared ones
     (css/site_head.css, css/site_page.css); colours are the style.css tokens; every word is in copy.json, findingData. */
  .num { font-variant-numeric: tabular-nums; }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px 96px; box-sizing: border-box; }
  .fnav { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 24px; }
  .fnav .back { font-size: 15px; color: var(--color-neutral-600); text-decoration: none; }
  .fnav .back::before { content: "\2190  "; }
  .fnav .back:hover { color: var(--color-ink); }
  .fnav .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .fnav .pill { min-width: 48px; justify-content: center; text-decoration: none; }
  .hero { padding-top: 24px; max-width: 760px; }
  .stamp { margin: 0; font-size: 14px; color: var(--color-neutral-600); }
  .numline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 6px 0 0; }
  .numline b { font-size: 36px; font-weight: 600; line-height: 1; }
  .numline span { font-size: 15px; color: var(--color-neutral-700); max-width: 520px; }
  section { margin-top: 48px; }
  h2 { margin: 0 0 8px; }
  .note { margin: 0 0 16px; font-size: 15px; color: var(--color-neutral-700); max-width: 680px; }
  .body { margin: 0 0 12px; max-width: 680px; font-size: 16px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  #chart .pills { margin: 0 0 16px; }
  .chart { position: relative; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ax { fill: var(--color-neutral-600); font: 400 12px 'Archivo', system-ui, sans-serif; }
  .ax.z { fill: var(--color-ink); font-weight: 600; }
  .rows { border-top: 1px solid var(--color-neutral-200); }
  .r { display: grid; grid-template-columns: 260px 1fr 140px; gap: 0 24px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-neutral-200); color: inherit; text-decoration: none; }
  .r b { font-weight: 600; font-size: 15px; }
  .r .v { text-align: right; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .r .v small { display: block; font-size: 13px; color: var(--color-neutral-600); font-weight: 400; white-space: normal; }
  .r .m { font-size: 14px; color: var(--color-neutral-700); }
  #evidence .r { grid-template-columns: 260px 1fr 190px; }
  .files { display: flex; flex-direction: column; border-top: 1px solid var(--color-neutral-200); max-width: 680px; }
  .files a { padding: 10px 0; border-bottom: 1px solid var(--color-neutral-200); font-size: 14px; color: var(--color-ink); text-decoration: none; }
  .files a:hover { color: var(--data-700); }
  .rel { grid-template-columns: 48px 1fr 140px !important; }
  .rel .no { color: var(--color-neutral-600); font-size: 14px; }
  .rel:hover b { color: var(--data-700); }
  .nf { margin-top: 48px; }
  @media (max-width: 700px) { .wrap { padding: 0 24px 64px; } }
  @media (max-width: 620px) {
    .r { grid-template-columns: 1fr auto; }
    .r .m { grid-column: 1 / -1; grid-row: 2; margin-top: 4px; }
    #evidence .r { grid-template-columns: 1fr auto; }
    .rel { grid-template-columns: 40px 1fr !important; }
    .rel .v { grid-column: 2; }
    .numline b { font-size: 30px; }
    .pills.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .pills.scroll::-webkit-scrollbar { display: none; }
    .pills.scroll .pill { flex: none; }
  }
</style>
<link rel="stylesheet" href="./css/site_head.css?v=4">
<link rel="stylesheet" href="./css/site_page.css?v=1">
</head>
<body>
<div class="wrap">
  <div class="hp-head">
    <div class="hp-headleft">
      <a class="hp-logo" href="./index.html">margin.wiki</a>
      <nav class="hp-nav" aria-label="Main" id="nav"></nav>
    </div>
  </div>

  <div class="fnav" id="fnav"></div>
  <div class="hero" id="hero"></div>
  <section id="chart"></section>
  <section id="evidence"></section>
  <section id="method"></section>
  <section id="limits"></section>
  <section id="download"></section>
  <section id="related"></section>
  <p class="nf" id="nf" hidden></p>
</div>
<script src="./js/tooltip.js"></script>
<script src="./js/finding_detail.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/site_head.js?v=3"></script>
</body>
</html>
