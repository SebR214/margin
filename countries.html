<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>margin.wiki — countries</title>
<meta name="description" content="What people pay for a dollar against the official rate, every tracked country, updated hourly."/>
<link rel="stylesheet" href="./style.css">
<style>
  /* Countries (SEB-270): rebuilt to match the approved reference exactly
     (https://claude.ai/artifact/A7iDWVRm1NRjKLHqvfwmFE). Scoped to this
     page with a ci- prefix so it never touches style.css's own .wrap/
     .hero/header rules, which other pages rely on. Colours are DESIGN.md's
     chart palette (periwinkle/dust/grape) -- this page compares many named
     countries against the official rate, exactly the "two or more named
     things" case DESIGN.md reserves the accent colours for. Font is the
     site's self-hosted Archivo from style.css, not a Google Fonts link. */
  :root {
    --ci-ink: var(--color-ink); --ci-sub: var(--color-neutral-700); --ci-stamp: var(--color-neutral-600); --ci-rule: var(--color-neutral-200);
    --ci-peri: var(--data-600); --ci-peri-deep: var(--data-700); --ci-peri-soft: var(--data-400);
    --ci-dust: var(--color-neutral-300); --ci-grape: var(--color-neutral-900);
  }
  .ci-wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 64px; color: var(--ci-ink); }
  .ci-wrap p { margin: 0; }
  .ci-wrap a { color: var(--ci-ink); text-decoration: none; font-weight: 500; }
  .ci-num { font-variant-numeric: tabular-nums; }

  .ci-head { display: flex; align-items: center; gap: 28px; padding: 20px 0; }
  .ci-logo { font-size: 18px; font-weight: 800; letter-spacing: -.02em; flex: none; color: var(--ci-ink); text-decoration: none; }
  .ci-nav { display: flex; gap: 4px; font-size: 15px; font-weight: 500; overflow-x: auto; scrollbar-width: none; white-space: nowrap; min-width: 0; }
  .ci-nav::-webkit-scrollbar { display: none; }
  .ci-nav a { padding: 10px; color: var(--ci-sub); min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; }
  .ci-nav a[aria-current] { color: var(--ci-ink); font-weight: 700; }

  .ci-hero { padding: 24px 0 0; display: flex; flex-direction: column; gap: 12px; }
  .ci-hero h1 {margin: 0;max-width: 640px;}
  .ci-lead {max-width: 620px;}
  .ci-meta { font-size: 14px; color: var(--ci-stamp); }
  .ci-live { width: 7px; height: 7px; border-radius: 50%; background: var(--ci-peri); display: inline-block; margin-right: 8px; vertical-align: 1px; }

  .ci-tools { display: flex; flex-direction: column; gap: 12px; margin-top: 28px; }
  .ci-search { width: 100%; padding: 12px 14px; font: inherit; font-size: 15px; border: 1px solid var(--ci-dust); border-radius: 8px; background: #fff; color: var(--ci-ink); min-height: 44px; }
  .ci-pills { display: flex; flex-wrap: wrap; gap: 8px; }

  .ci-key { display: flex; flex-wrap: wrap; gap: 6px 20px; align-items: center; margin: 24px 0 0; padding-top: 20px; border-top: 1px solid var(--ci-rule); font-size: 14px; color: var(--ci-sub); }
  .ci-key i { display: inline-block; vertical-align: middle; margin-right: 8px; }
  .ci-kd { width: 10px; height: 10px; border-radius: 50%; background: var(--ci-peri); }
  .ci-kr { width: 28px; height: 8px; border-radius: 4px; background: var(--ci-peri-soft); }
  .ci-kl { width: 2px; height: 14px; background: var(--ci-ink); }
  .ci-kw { font-size: 12.5px; font-weight: 700; color: var(--ci-grape); font-style: normal; width: auto; margin-right: 6px; }

  .ci-band { margin-top: 32px; }
  .ci-band h2 {margin: 0 0 10px;}
  .ci-band h2 .ci-n { color: var(--ci-stamp); font-weight: 500; }

  .ci-row, .ci-axisrow { display: grid; grid-template-columns: 150px 1fr 64px; gap: 0 14px; align-items: center; }
  .ci-axisrow { height: 26px; font-size: 12px; color: var(--ci-stamp); }
  .ci-row { min-height: 34px; border-top: 1px solid var(--ci-rule); text-decoration: none; color: inherit; }
  .ci-row:hover { background: var(--color-neutral-100); }
  .ci-row .ci-nm { font-size: 15px; font-weight: 600; line-height: 1.25; padding: 6px 0; }
  .ci-row .ci-v { text-align: right; font-weight: 700; font-size: 15px; color: var(--ci-peri-deep); line-height: 1.2; }
  .ci-row .ci-v .ci-wk { display: block; font-size: 12.5px; font-weight: 600; color: var(--ci-grape); }
  .ci-money .ci-row, .ci-money .ci-axisrow { grid-template-columns: 150px 1fr 104px 104px 64px; }
  .ci-money .ci-axisrow { height: auto; align-items: end; padding-top: 4px; }
  .ci-mh { font-size: 12px; color: var(--ci-stamp); text-align: right; line-height: 1.3; }
  .ci-sup { font-size: 12px; font-weight: 600; color: var(--ci-sub); text-align: center; border-bottom: 1px solid var(--ci-rule); padding-bottom: 2px; margin-bottom: 2px; }
  .ci-money .ci-axisrow .ci-sup { grid-column: 3/5; grid-row: 1; }
  .ci-money .ci-axisrow > span:first-child { grid-row: 2; grid-column: 1; }
  .ci-money .ci-axisrow .ci-track { grid-row: 2; grid-column: 2; }
  .ci-money .ci-axisrow .ci-mh { grid-row: 2; }
  .ci-money .ci-axisrow .ci-mh.pay { grid-column: 3; } .ci-money .ci-axisrow .ci-mh.off { grid-column: 4; }
  .ci-money .ci-axisrow > span:last-child { grid-row: 2; grid-column: 5; }
  .ci-row .ci-nm .ci-cc { font-size: 12.5px; font-weight: 500; color: var(--ci-stamp); }
  .ci-row .ci-m { text-align: right; font-size: 14px; color: var(--ci-sub); white-space: nowrap; }
  .ci-row .ci-m.pay { color: var(--ci-ink); font-weight: 600; }
  .ci-row.hide { display: none; }
  .ci-track { position: relative; height: 34px; }
  .ci-axisrow .ci-track { height: 26px; }
  .ci-gridl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ci-rule); }
  .ci-gridl.zero { background: var(--ci-ink); width: 1px; }
  .ci-rng { position: absolute; top: 50%; height: 8px; margin-top: -4px; border-radius: 4px; background: var(--ci-peri-soft); min-width: 2px; }
  .ci-dot { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--ci-peri); border: 1.5px solid #fff; }
  .ci-tk { position: absolute; bottom: 8px; transform: translateX(-50%); white-space: nowrap; line-height: 1; }
  .ci-axisrow .ci-gridl { top: auto; bottom: 0; height: 5px; }
  .ci-tk.z { color: var(--ci-ink); font-weight: 600; }
  .ci-rng.cl { border-top-left-radius: 0; border-bottom-left-radius: 0; background: linear-gradient(90deg, transparent, var(--ci-peri-soft) 14px); }
  .ci-rng.cr { border-top-right-radius: 0; border-bottom-right-radius: 0; background: linear-gradient(270deg, transparent, var(--ci-peri-soft) 14px); }
  .ci-rng.cl.cr { background: linear-gradient(90deg, transparent, var(--ci-peri-soft) 14px, var(--ci-peri-soft) calc(100% - 14px), transparent); }

  .ci-np { margin-top: 40px; padding-top: 28px; border-top: 1px solid var(--ci-rule); }
  .ci-np h2 {margin: 0 0 10px;}
  .ci-np .ci-note { margin: 2px 0 10px; font-size: 15px; color: var(--ci-sub); }
  .ci-np details { font-size: 15px; color: var(--ci-sub); }
  .ci-np summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; color: var(--ci-ink); font-weight: 500; }
  .ci-why { list-style: none; margin: 0; padding: 0; }
  .ci-why li { padding: 10px 0; border-top: 1px solid var(--ci-rule); }
  .ci-why li span { display: block; font-size: 14px; color: var(--ci-stamp); }
  .ci-aside { font-size: 15px; color: var(--ci-sub); margin: 24px 0 0; }

  @media (max-width: 620px) {
    .ci-row, .ci-axisrow { grid-template-columns: 1fr 64px; }
    .ci-money .ci-row, .ci-money .ci-axisrow { grid-template-columns: 1fr 1fr 64px; }
    .ci-money .ci-row .ci-nm { grid-column: 1/3; grid-row: 1; }
    .ci-money .ci-row .ci-v { grid-column: 3; grid-row: 1; }
    .ci-money .ci-row .ci-track { grid-column: 1/-1; grid-row: 2; }
    .ci-money .ci-row .ci-m { grid-row: 3; text-align: left; padding-bottom: 8px; }
    .ci-money .ci-row .ci-m.pay { grid-column: 1; } .ci-money .ci-row .ci-m.off { grid-column: 2; }
    .ci-money .ci-axisrow .ci-track { grid-column: 1/-1; grid-row: 1; }
    .ci-money .ci-axisrow .ci-sup { grid-column: 1/3; grid-row: 2; text-align: left; margin-top: 6px; }
    .ci-money .ci-axisrow .ci-mh { grid-row: 3; text-align: left; display: block !important; }
    .ci-money .ci-axisrow .ci-mh.pay { grid-column: 1; } .ci-money .ci-axisrow .ci-mh.off { grid-column: 2; }
    .ci-row .ci-track, .ci-axisrow .ci-track { grid-column: 1/-1; grid-row: 2; }
    .ci-axisrow > span:first-child, .ci-axisrow > span:last-child { display: none; }
    .ci-axisrow { grid-template-columns: 1fr; }
    .ci-axisrow .ci-track { grid-row: 1; }
    .ci-row .ci-nm { padding: 8px 0 0; }
    .ci-pills { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .ci-pills::-webkit-scrollbar { display: none; }
    .ci-pill {flex: none;}
  }
</style>
<link rel="stylesheet" href="./css/site_head.css?v=3">
<link rel="stylesheet" href="./css/site_page.css?v=1">
</head>
<body>
<div id="app"></div>
<template id="ciRowTpl"><a class="ci-row"><span class="ci-nm"></span><div class="ci-track"></div><span class="ci-v ci-num"></span></a></template>
<script src="./js/tooltip.js"></script>
<script src="./js/countries_page.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/site_head.js?v=3"></script>
</body>
</html>
