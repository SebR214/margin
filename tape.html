<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>margin.wiki — what people pay for a dollar</title>
<meta name="description" content="What people pay for a US dollar in each country compared with the official rate, shown as each price is checked."/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&display=swap" rel="stylesheet">
<script src="./js/receipt_replay.js"></script>
<style>
  :root{ --ink:#201E1D; --sub:#7D7979; --stamp:#7D7979; --rule:rgba(32,30,29,.1) }
  *{box-sizing:border-box}
  body{margin:0;padding:0 24px env(safe-area-inset-bottom,0px);font-family:'Archivo',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);background:#fff}
  a{color:var(--ink);text-decoration:none} a:hover{color:var(--sub)}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;height:64px;margin:0 0 24px;gap:28px}
  .logo{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;flex:none}
  nav{display:flex;gap:24px;align-items:center;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto}
  nav::-webkit-scrollbar{display:none}
  nav a{font-size:15px;font-weight:600;color:var(--sub);padding:10px 0;white-space:nowrap}
  nav a:hover{color:var(--ink)}
  h1{font-size:28px;font-weight:600;line-height:1.22;letter-spacing:-.02em;margin:24px 0 10px}
  h2{font-size:21px;font-weight:600;line-height:1.3;margin:0 0 6px}
  .lede{font-size:17px;line-height:1.55;color:var(--sub);margin:0;max-width:640px}
  .status{font-size:14px;line-height:1.5;color:var(--stamp);margin:14px 0 0;min-height:21px}
  .meta{font-size:14px;line-height:1.5;color:var(--stamp);margin:2px 0 0;min-height:21px}
  section{border-top:1px solid var(--rule);margin-top:32px;padding-top:28px}
  .num{font-variant-numeric:tabular-nums}
  .head,.row{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:4px 16px;align-items:baseline}
  .head{padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:14px;color:var(--sub);font-weight:400}
  .head span+span,.row .v{text-align:right}
  .row{padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .row .c{font-weight:600}
  .row .t{display:block;font-size:13px;font-weight:400;color:var(--stamp);margin-top:2px}
  .row .v{font-weight:600}
  .row .b,.row .d{text-align:right;color:var(--sub);font-weight:400}
  .row .unit{font-size:13px;font-weight:400;color:var(--stamp);margin-left:4px}
  .row.new .t{color:var(--ink);font-weight:600}
  .empty{padding:20px 0;font-size:15px;color:var(--sub)}
  .note{font-size:14px;color:var(--sub);line-height:1.5;margin:18px 0 0;max-width:640px}
  .more{font-size:15px;margin:14px 0 0}
  .more a{display:inline-block;padding:6px 0;font-weight:600}
  footer{border-top:1px solid var(--rule);margin-top:48px;padding:24px 0 48px;font-size:15px;color:var(--sub)}
  @media(max-width:620px){
    body{padding:0 16px}
    header{height:56px;gap:16px}
    .logo{font-size:17px}
    nav{gap:16px}
    h1{font-size:24px}
    .head,.row{grid-template-columns:minmax(0,1.25fr) repeat(3,minmax(0,1fr));gap:4px 8px}
    .row .unit{display:block;margin:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="logo" href="./index.html">margin.wiki</a><nav>
        <a href="./index.html">Home</a>
        <a href="./sending-money.html">Sending money</a>
        <a href="./countries.html">Countries</a>
        <a href="./how-it-works.html">How it works</a>
        <a href="./how-it-was-built.html">How it was built</a>
      </nav></header>

  <h1 id="title">&nbsp;</h1>
  <p class="lede" id="lede">&nbsp;</p>
  <p class="status" id="status" aria-live="polite">&nbsp;</p>
  <p class="meta num" id="meta">&nbsp;</p>

  <section>
    <h2 id="listTitle">&nbsp;</h2>
    <div class="head"><span id="colCountry">&nbsp;</span><span id="colStreet">&nbsp;</span><span id="colBank">&nbsp;</span><span id="colDiff">&nbsp;</span></div>
    <div id="rows"></div>
    <p class="note" id="note">&nbsp;</p>
    <p class="more"><a id="more" href="./countries.html">&nbsp;</a></p>
  </section>

  <footer id="foot">&nbsp;</footer>
</div>

<script>
(function () {
  var API_BASE = location.hostname.endsWith("margin.wiki")
    ? "https://api.margin.wiki" : "http://127.0.0.1:8903";
  // Enough of the end of the file to hold the last few ten-minute slots.
  // Servers that ignore Range send the whole file, which parses the same.
  var TAIL_BYTES = 40000;
  var STALE_MS = 6 * 3600 * 1000;
  // Minutes between collector runs. The events stream and the data files do
  // not carry the cadence, so it is named here once. It matches the ten-minute
  // timer in collector_p2p_box.py. Change both together.
  var COLLECTOR_INTERVAL_MIN = 10;

  var COPY = {};
  var NAMES = {};   // ccy -> country name, from data/index_latest.json
  var ROWS = {};    // ccy -> { ts, mid, fx, fresh }
  var live = false;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function T(s, vals){
    var out = String(s || '');
    for (var k in (vals || {})) out = out.split('{' + k + '}').join(vals[k] == null ? '' : vals[k]);
    return out;
  }
  function $(id){ return document.getElementById(id); }
  function hhmm(iso){ var d = new Date(iso); return isNaN(d) ? '' : d.toISOString().slice(11, 16); }
  function minute(iso){ return String(iso || '').slice(0, 16); }
  function fmt(v){
    if (v == null || isNaN(v)) return '';
    var dp = v >= 1000 ? 0 : v >= 100 ? 1 : v >= 1 ? 2 : 4;
    return Number(v).toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  }

  function setStatus(key, vals){ $('status').textContent = T(COPY[key], vals); }

  // Newest check on screen, and the next one: that time plus the interval.
  function newestTs(){
    return Object.keys(ROWS).reduce(function(a, k){ return ROWS[k].ts > a ? ROWS[k].ts : a; }, '');
  }
  function nextCheckMs(){
    var last = Date.parse(newestTs());
    return isNaN(last) ? NaN : last + COLLECTOR_INTERVAL_MIN * 60000;
  }
  // Shown only while the live stream is not connected.
  function showIdle(offline){
    if (live) return;
    var next = nextCheckMs();
    var ok = !isNaN(next) && next > Date.now();
    if (ok) setStatus(offline ? 'statusOffline' : 'statusIdle', { time: hhmm(new Date(next).toISOString()) });
    else setStatus(offline ? 'statusOfflineLate' : 'statusIdleLate');
  }
  function fmtPct(p){
    var s = Number(Math.abs(p).toFixed(1)).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
    return (p > 0 && s !== '0.0' ? '+' : p < 0 && s !== '0.0' ? '-' : '') + s + '%';
  }

  // data-receipt-basis-ccy, not countries.html's own data-receipt-ccy: that
  // attribute opens data/receipts/<CCY>.json, the premium-index receipt --
  // a different number from the raw street price and bank rate this page
  // shows. This opens data/basis_receipts/<CCY>.json instead (SEB-219),
  // which replays the exact row both of this row's cells came from. No bank
  // rate to show means no receipt to open, so that cell stays a plain
  // placeholder instead.
  function receiptSpan(ccy, text){
    return '<span data-receipt-basis-ccy="' + esc(ccy) + '" data-receipt-value="' + esc(text) + '" tabindex="0">' + text + '</span>';
  }

  function draw(){
    var ccys = Object.keys(ROWS);
    var el = $('rows');
    if (!ccys.length) { el.innerHTML = '<div class="empty">' + esc(COPY.unavailable) + '</div>'; $('meta').textContent = ''; return; }
    var latest = newestTs();
    ccys.sort(function(a, b){
      var ma = minute(ROWS[a].ts), mb = minute(ROWS[b].ts);
      if (ma !== mb) return ma < mb ? 1 : -1;
      return String(NAMES[a] || a).localeCompare(String(NAMES[b] || b));
    });
    el.innerHTML = ccys.map(function(k){
      var r = ROWS[k];
      var tag = r.fresh ? '<span class="t num">' + esc(COPY.justArrived) + '</span>' : '';
      return '<div class="row' + (r.fresh ? ' new' : '') + '"><div class="c">' + esc(NAMES[k] || k) + tag + '</div>' +
        '<div class="v num">' + receiptSpan(k, esc(fmt(r.mid))) + '<span class="unit">' + esc(k) + '</span></div>' +
        '<div class="b num">' + (r.fx ? receiptSpan(k, esc(fmt(r.fx))) + '<span class="unit">' + esc(k) + '</span>' : esc(COPY.noBankRate)) + '</div>' +
        '<div class="d num">' + (r.fx ? esc(fmtPct((r.mid / r.fx - 1) * 100)) : esc(COPY.noBankRate)) + '</div></div>';
    }).join('');
    $('meta').textContent = T(COPY.metaTemplate, { time: hhmm(latest), n: ccys.length });
  }

  function renderStatic(){
    $('title').textContent = T(COPY.title, { minutes: COLLECTOR_INTERVAL_MIN });
    $('lede').textContent = COPY.lede || '';
    $('listTitle').textContent = COPY.listTitle || '';
    $('colCountry').textContent = COPY.colCountry || '';
    $('colStreet').textContent = COPY.colStreet || '';
    $('colBank').textContent = COPY.colBank || '';
    $('colDiff').textContent = COPY.colDiff || '';
    $('note').textContent = COPY.note || '';
    $('more').textContent = COPY.linkText || '';
    $('more').href = COPY.linkHref || './countries.html';
    $('foot').textContent = COPY.footer || '';
  }

  // The newest slot is at the end of data/p2p_basis.csv. Take the latest row
  // per country from the tail, binance rows that were priced, nothing older
  // than STALE_MS behind the newest row.
  function seedFromCsv(text){
    var lines = text.split('\n');
    var parsed = [];
    for (var i = 0; i < lines.length; i++) {
      var f = lines[i].split(',');
      if (f.length < 10 || f[0] === 'ts_utc' || f[1] !== 'binance_p2p' || f[9] !== 'True') continue;
      var mid = parseFloat(f[5]);
      if (!(mid > 0) || isNaN(Date.parse(f[0]))) continue;
      parsed.push({ ts: f[0], ccy: f[2], mid: mid, fx: parseFloat(f[6]) > 0 ? parseFloat(f[6]) : null });
    }
    if (!parsed.length) return;
    var newest = Date.parse(parsed[parsed.length - 1].ts);
    parsed.forEach(function(p){
      if (newest - Date.parse(p.ts) > STALE_MS) return;
      var cur = ROWS[p.ccy];
      if (!cur || p.ts >= cur.ts) ROWS[p.ccy] = { ts: p.ts, mid: p.mid, fx: p.fx, fresh: false };
    });
  }

  function listen(){
    if (!window.EventSource) return;
    var es = new EventSource(API_BASE + '/v1/events');
    var offlineTimer = null;
    es.onopen = function(){
      if (offlineTimer) { clearTimeout(offlineTimer); offlineTimer = null; }
      live = true; setStatus('statusLive');
    };
    // Reconnecting quietly is normal. Only a failure that lasts says so.
    es.onerror = function(){
      if (offlineTimer) return;
      offlineTimer = setTimeout(function(){ live = false; offlineTimer = null; showIdle(true); }, 8000);
    };
    es.onmessage = function(ev){
      var e; try { e = JSON.parse(ev.data); } catch (err) { return; }
      if (e.kind !== 'p2p_row' || !(e.mid > 0) || !e.ccy) return;
      var cur = ROWS[e.ccy];
      if (cur && e.ts <= cur.ts) return;
      ROWS[e.ccy] = { ts: e.ts, mid: e.mid, fx: e.fx_mid_per_usd > 0 ? e.fx_mid_per_usd : null, fresh: true };
      draw();
    };
  }

  async function boot(){
    var copyDoc = await fetch('./copy.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).catch(function(){ return {}; });
    COPY = copyDoc.tape || {};
    renderStatic();
    var idx = await fetch('./data/index_latest.json', { cache: 'no-store' }).then(function(r){ return r.json(); }).catch(function(){ return {}; });
    (idx.countries || []).concat(idx.withheld || []).forEach(function(c){ if (c.ccy && c.country) NAMES[c.ccy] = c.country; });
    // Currencies shared by several countries get a plain region name from copy.
    var shared = COPY.sharedCurrencyNames || {};
    for (var s in shared) NAMES[s] = shared[s];
    var text = await fetch('./data/p2p_basis.csv', { cache: 'no-store', headers: { Range: 'bytes=-' + TAIL_BYTES } })
      .then(function(r){ return r.ok ? r.text() : ''; }).catch(function(){ return ''; });
    seedFromCsv(text);
    draw();
    showIdle(false);
    listen();
  }
  boot();
})();
</script>
</body>
</html>
