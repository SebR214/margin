<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>margin.wiki — sending money</title>
<meta name="description" content="Every provider's all-in cost to send money, fee plus the margin hidden in the exchange rate, re-checked most hours -- real gaps shown, not hidden."/>
<link rel="stylesheet" href="./style.css">
<style>
  /* Sending money (SEB-272): rebuilt to match the owner's reference artifact
     (https://claude.ai/artifact/9XijuhKEnEw9irjehEfnXn) at desktop and 390px --
     Archivo, a 760px column, plain bars for "this hour", one grey line for
     the week-by-week chart (DESIGN.md's single-series rule), range-bar rows
     for "Other places" in the same shape countries.html uses. Colours are
     DESIGN.md's chart palette (periwinkle / dust grey / vintage grape). The
     reference loaded Archivo from Google Fonts directly; every other page
     on this site self-hosts it instead (style.css's own @font-face), so
     this page does too -- same typeface, no new external request. */
  :root{
    --sm-ink:var(--color-ink); --sm-sub:var(--color-neutral-700); --sm-stamp:var(--color-neutral-600); --sm-rule:var(--color-neutral-200);
    --sm-peri:var(--data-600); --sm-peri-deep:var(--data-700); --sm-peri-soft:var(--data-400);
    --sm-dust:var(--color-neutral-300); --sm-grape:var(--color-neutral-900);
  }
  body.sm-body{ background:#fff; color:var(--sm-ink); font-size:17px; line-height:1.55; }
  .sm-wrap{ max-width:760px; margin:0 auto; padding:0 24px 64px; }
  .sm-wrap a{ color:var(--sm-ink); text-decoration:none; font-weight:500; }
  .sm-num{ font-variant-numeric:tabular-nums; }

  .sm-head{ display:flex; align-items:center; gap:28px; padding:20px 0; }
  .sm-logo{ font-size:18px; font-weight:800; letter-spacing:-.02em; flex:none; }
  .sm-nav{ display:flex; gap:4px; font-size:15px; font-weight:500; overflow-x:auto; scrollbar-width:none; white-space:nowrap; min-width:0; }
  .sm-nav::-webkit-scrollbar{ display:none; }
  .sm-nav a{ padding:10px; color:var(--sm-sub); min-height:44px; display:inline-flex; align-items:center; }
  .sm-nav a[aria-current]{ color:var(--sm-ink); font-weight:700; }

  .sm-hero{ padding:24px 0 0; display:flex; flex-direction:column; gap:12px; }
  .sm-hero h1{ font-size:28px; line-height:1.25; letter-spacing:-.01em; margin:0; font-weight:700; max-width:640px; }
  .sm-lead{ margin:0; color:var(--sm-sub); max-width:620px; }
  .sm-meta{ margin:0; font-size:14px; color:var(--sm-stamp); }
  .sm-live{ width:7px; height:7px; border-radius:50%; background:var(--sm-peri); display:inline-block; margin-right:8px; vertical-align:1px; }

  .sm-tools{ display:flex; flex-direction:column; gap:10px; margin-top:28px; }
  .sm-pills{ display:flex; flex-wrap:wrap; gap:8px; }
  .sm-pill{ font:inherit; font-size:14px; font-weight:600; padding:0 14px; min-height:40px; border:1px solid var(--sm-dust); border-radius:999px; background:#fff; color:var(--sm-sub); cursor:pointer; }
  .sm-pill[aria-pressed="true"]{ background:var(--sm-ink); border-color:var(--sm-ink); color:#fff; }

  .sm-key{ display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center; margin:0 0 6px; font-size:14px; color:var(--sm-sub); }
  .sm-key i{ display:inline-block; vertical-align:middle; margin-right:8px; }
  .sm-key .sm-kd{ width:10px; height:10px; border-radius:50%; background:var(--sm-peri); }
  .sm-key .sm-kr{ width:28px; height:8px; border-radius:4px; background:var(--sm-peri-soft); }
  .sm-key .sm-kl{ width:2px; height:14px; background:var(--sm-ink); }

  .sm-wrap section{ margin-top:40px; padding-top:28px; border-top:1px solid var(--sm-rule); }
  .sm-wrap section.sm-first{ margin-top:28px; }
  .sm-wrap h2{ font-size:21px; line-height:1.3; margin:0 0 6px; font-weight:700; }
  .sm-wrap h3{ font-size:17px; line-height:1.3; margin:28px 0 4px; font-weight:700; }
  .sm-note{ margin:0 0 14px; font-size:15px; color:var(--sm-sub); max-width:620px; }

  .sm-row,.sm-axisrow{ display:grid; grid-template-columns:190px 1fr 112px; gap:0 14px; align-items:center; }
  .sm-axisrow{ height:26px; font-size:12px; color:var(--sm-stamp); }
  .sm-row{ min-height:40px; border-top:1px solid var(--sm-rule); color:var(--sm-ink); font-weight:400; }
  button.sm-row{ width:100%; font:inherit; text-align:left; background:none; border:0; border-top:1px solid var(--sm-rule); padding:0; cursor:pointer; }
  .sm-row:hover{ background:var(--color-neutral-100); }
  .sm-row.sm-on{ background:var(--data-100); }
  .sm-row.sm-on .sm-nm{ font-weight:700; }
  .sm-row .sm-nm{ font-size:15px; font-weight:600; line-height:1.25; padding:7px 0; }
  .sm-row .sm-nm small{ display:block; font-size:12.5px; font-weight:500; color:var(--sm-stamp); }
  .sm-row .sm-v{ text-align:right; font-weight:700; font-size:15px; color:var(--sm-peri-deep); line-height:1.2; }
  .sm-row .sm-v small{ display:block; font-size:12.5px; font-weight:600; color:var(--sm-grape); }
  .sm-row.sm-tot{ border-top:1px solid var(--sm-dust); }
  .sm-row.sm-app .sm-v{ color:var(--sm-ink); }
  .sm-row.sm-app .sm-dot{ background:var(--sm-ink); }
  .sm-row.sm-app .sm-rng{ background:var(--sm-dust); }
  .sm-track{ position:relative; height:40px; }
  .sm-axisrow .sm-track{ height:26px; }
  .sm-gridl{ position:absolute; top:0; bottom:0; width:1px; background:var(--sm-rule); }
  .sm-gridl.sm-zero{ background:var(--sm-ink); }
  .sm-rng{ position:absolute; top:50%; height:8px; margin-top:-4px; border-radius:4px; background:var(--sm-peri-soft); min-width:2px; }
  .sm-dot{ position:absolute; top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; background:var(--sm-peri); border:1.5px solid #fff; }
  .sm-tk{ position:absolute; bottom:8px; transform:translateX(-50%); white-space:nowrap; line-height:1; }
  .sm-tk.sm-z{ color:var(--sm-ink); font-weight:600; }
  .sm-axisrow .sm-gridl{ top:auto; bottom:0; height:5px; }

  .sm-bar{ position:relative; height:40px; }
  .sm-bar .sm-z{ position:absolute; top:8px; bottom:8px; width:1px; background:var(--sm-ink); }
  .sm-bar b{ position:absolute; top:50%; height:12px; margin-top:-6px; border-radius:3px; background:var(--sm-peri); }
  .sm-row.sm-app .sm-bar b{ background:var(--sm-dust); }
  .sm-row.sm-step .sm-bar b{ background:var(--sm-peri-soft); }
  .sm-row.sm-tot .sm-bar b{ background:var(--sm-grape); }
  .sm-row.sm-tot .sm-v{ color:var(--sm-grape); }

  .sm-chart{ position:relative; margin-top:8px; }
  .sm-chart svg{ display:block; width:100%; height:auto; overflow:visible; }
  .sm-chart .sm-ax{ fill:var(--sm-stamp); font:400 12px 'Archivo',system-ui,sans-serif; }
  .sm-chart .sm-ax.sm-z{ fill:var(--sm-ink); font-weight:600; }
  .sm-tip{ position:absolute; top:0; background:#fff; border:1px solid var(--sm-dust); border-radius:6px; padding:6px 10px; font-size:13px; pointer-events:none; white-space:nowrap; }
  .sm-tip span{ display:block; color:var(--sm-stamp); font-size:12px; }
  .sm-small{ font-size:14px; color:var(--sm-sub); margin:12px 0 0; max-width:620px; }

  .sm-np p{ margin:0 0 8px; font-size:15px; color:var(--sm-sub); max-width:620px; }
  .sm-np .sm-names{ color:var(--sm-ink); }
  .sm-wrap footer{ border-top:1px solid var(--sm-rule); margin-top:48px; padding:24px 0 48px; font-size:14px; color:var(--sm-stamp); }
  .sm-wrap footer p{ margin:0 0 6px; }

  @media (max-width:620px){
    .sm-row,.sm-axisrow{ grid-template-columns:1fr 112px; }
    .sm-row .sm-track,.sm-axisrow .sm-track{ grid-column:1/-1; grid-row:2; }
    .sm-axisrow > span:first-child,.sm-axisrow > span:last-child{ display:none; }
    .sm-axisrow{ grid-template-columns:1fr; }
    .sm-axisrow .sm-track{ grid-row:1; }
    .sm-row .sm-track,.sm-row .sm-bar{ height:28px; margin-bottom:6px; }
    .sm-row .sm-bar{ grid-column:1/-1; grid-row:2; }
    .sm-row .sm-nm{ padding:9px 0 0; }
    .sm-row .sm-v{ padding-top:9px; align-self:start; }
    .sm-pills{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
    .sm-pills::-webkit-scrollbar{ display:none; }
    .sm-pill{ flex:none; }
    .sm-hero h1{ font-size:24px; }
    .sm-axisrow .sm-tk:nth-of-type(even){ display:none; }
  }
</style>
<link rel="stylesheet" href="./css/site_head.css">
</head>
<body class="sm-body">
<div id="app"></div>
<script src="./js/route.js"></script>
<script src="./js/site_head.js"></script>
</body>
</html>
