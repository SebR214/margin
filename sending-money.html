<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>margin.wiki — sending money</title>
<meta name="description" content="Every provider's all-in cost to send money, fee plus the margin hidden in the exchange rate, re-checked most hours -- real gaps shown, not hidden."/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
  /* Page-specific only: container width, header/nav layout and h1/h2/body
     sizing now live in style.css (2026-09-28 page-frame unification). Header
     is not inside .wrap in this page's markup, so it gets its own matching
     max-width/margin here to line up with .page below it. */
  :root{ --ink:#0B0B0B; --mute:#6B6B6B; --faint:#9A9A9A; --line:#F0F0F0; --peri:#817FCC; --soft:#D3D0CB; --grape:#3F3047; --egg:#F0EBD8;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px) }
  :root[data-theme="dark"]{ --ink:#eee; --mute:#a3a3a3; --faint:#6f6f6f; --line:#2a2a2a; --peri:#9E9CE0; --soft:#5b5853; --grape:#A99BB5; --egg:#221f1a; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Archivo',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);background:#fff}
  /* 2026-09-28 final-mockup typography bump is page-scoped on purpose: the
     shared style.css body rule (16px) still serves the other 6 pages, whose
     own mockups haven't been reconciled to the final revision yet. Bumping
     the shared rule here would change all 7 pages' body text in one PR
     scoped to sending-money.html only. */
  body{font-size:17px}
  :root[data-theme="dark"] body{background:#121212}
  a{color:var(--ink);text-decoration:none} a:hover{color:var(--peri)}
  .num{font-variant-numeric:tabular-nums}
  header{max-width:760px;margin:0 auto;padding:22px 24px;flex-wrap:wrap}
  nav a{color:var(--mute);padding:10px 0;white-space:nowrap}
  nav a.active{color:var(--ink);font-weight:700}

  .page{max-width:760px;margin:0 auto;padding:8px 24px 72px}
  h1{font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.22;margin:20px 0 8px}
  .lead{font-size:17px;color:var(--mute);line-height:1.5;margin:0}
  .meta{font-size:14px;color:var(--faint);margin:14px 0 0}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--peri);display:inline-block;margin-right:6px;vertical-align:1px}

  .pills{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 0}
  .pill{font-size:14px;padding:10px 16px;min-height:40px;display:inline-flex;align-items:center;border-radius:999px;border:1px solid var(--soft);color:var(--ink);background:#fff;white-space:nowrap;cursor:pointer;font-family:inherit}
  .pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .pills.small{margin-top:10px}
  .pills.small .pill{font-size:14px;padding:8px 14px;min-height:36px}

  section{border-top:1px solid var(--line);margin-top:40px;padding-top:32px}
  h2{font-size:21px;line-height:1.3;margin:0 0 8px;font-weight:700;letter-spacing:-0.01em}
  .answer{font-size:16px;color:var(--mute);margin:0 0 22px;line-height:1.5}
  .answer b{color:var(--ink);font-weight:600}

  .prow{display:grid;grid-template-columns:minmax(150px,210px) 1fr 84px 60px;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);min-height:40px}
  .prow.head{border-top:0;padding:0 0 8px;font-size:14px;color:var(--faint);font-weight:600;letter-spacing:.03em}
  .pname{font-size:15px;font-weight:500;line-height:1.3}
  .pname small{display:block;font-size:14px;color:var(--faint);font-weight:400;margin-top:2px}
  .track{height:10px;background:var(--line);border-radius:2px;position:relative}
  .track i{position:absolute;left:0;top:0;bottom:0;background:var(--soft);border-radius:2px;min-width:2px}
  .num-cell{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
  .pct-cell{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;color:var(--mute)}
  .prow.stable .pname,.prow.stable .num-cell,.prow.stable .pct-cell{color:var(--peri);font-weight:600}
  .prow.stable .pname small{color:var(--faint);font-weight:400}
  .prow.stable .track i{background:var(--peri)}
  .prow.missing{opacity:.55}
  .prow.missing .num-cell,.prow.missing .pct-cell{font-style:italic;font-weight:400}
  .prow.venue-row{cursor:pointer}
  .prow.venue-row:hover{background:rgba(129,127,204,0.06)}
  .venue-toggle-caret{font-size:11px;color:var(--faint)}
  .venue-breakdown{padding:6px 0 12px 0;border-top:0;border-bottom:1px solid var(--line)}
  .venue-breakdown-hdr{font-size:14px;color:var(--faint);padding-bottom:6px}
  .venue-combo-row{display:grid;grid-template-columns:1fr 90px;gap:16px;font-size:13px;color:var(--grape);padding:4px 0;min-height:24px;align-items:center}
  .venue-combo-row .num-cell{font-size:13px}

  .small{font-size:15px;color:var(--faint);margin:14px 0 0;line-height:1.5}

  .curve-title{margin-top:26px;font-size:15px;font-weight:700}
  .curve-wrap{padding-top:10px}
  .curve-caption{font-size:12px;color:var(--faint);padding-top:4px}
  .curve-legend{display:flex;gap:18px;font-size:12px;flex-wrap:wrap;padding-bottom:6px}

  .brow{display:grid;grid-template-columns:200px 1fr 90px;gap:14px;align-items:center;padding:8px 0;font-size:15px;min-height:40px}
  .brow .track{height:14px}
  .brow .track i{background:var(--grape)}
  .brow .num-cell{font-size:14px}
  .zero{font-size:14px;color:var(--mute);margin:10px 0 0;line-height:1.5}

  .list{margin:0;padding:0;list-style:none}
  .list li{padding:12px 0;border-top:1px solid var(--line);font-size:15px;display:grid;grid-template-columns:1fr auto;gap:12px;min-height:40px}
  .list li>span:last-child{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
  .up{color:var(--grape);font-weight:600}
  .s2{display:block;font-size:14px;color:var(--faint);margin-top:2px}
  .list.log li .s2[style]{text-align:right}

  footer.foot{border-top:1px solid var(--line);margin-top:56px;padding-top:24px;font-size:15px;color:var(--mute)}
  footer.foot a{color:var(--ink);font-weight:500}

  @media(max-width:900px){
    header{padding:18px 24px;flex-wrap:nowrap} .mcp{display:none}
    .page{padding:8px 24px 56px}
  }

  @media(max-width:620px){
    nav{flex-wrap:nowrap;overflow-x:auto;gap:4px;-ms-overflow-style:none;scrollbar-width:none;margin:0 -24px;padding:0 24px 2px;max-width:52vw}
    nav::-webkit-scrollbar{display:none}
    nav a{padding:11px 8px;font-size:15px;min-height:40px;display:inline-flex;align-items:center}
    header{flex-wrap:nowrap}
    .brand{gap:14px;min-width:0;flex-wrap:nowrap}

    .prow{grid-template-columns:1fr 70px 52px;gap:8px}
    .prow .track,.prow.head span:nth-child(2){display:none}
    .venue-combo-row{grid-template-columns:1fr 60px;gap:8px;font-size:12px}

    .list li{grid-template-columns:1fr}
    .list li>span:last-child{white-space:normal;text-align:left}
    .list.log li .s2[style]{text-align:left!important}

    .brow{grid-template-columns:1fr 70px;gap:8px}
    .brow .track{grid-column:1/3;order:3}
  }
</style>

<body>
  <header class="mwh" style="max-width:760px!important;margin-left:auto!important;margin-right:auto!important;padding:0 24px!important;box-sizing:border-box!important"><a class="mwh-logo" href="./index.html">margin.wiki</a><nav>

  <div class="page">

    <footer class="foot">Every number on this site comes from a public data file. <a href="https://github.com/SebR214/margin">Code and raw data on GitHub →</a></footer>

<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmt(n){ return n.toFixed(2)+'%'; }
  function T(s, vals){
    var out = String(s||'');
    for (var k in vals) out = out.split('{' + k + '}').join(vals[k]);
    return out;
  }
  function fmtDay(iso){
    // "2026-09-27" -> "27 Sep", no year -- a same-window recency date, the
    // page's own coverage/start dates keep the year (see COVERAGE.start_words).
    var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||'');
    if (!m) return iso||'';
    return String(+m[3]) + ' ' + MON[+m[2]-1];
  }
  function fmtTime(iso){
    var m = /T(\d{2}):(\d{2})/.exec(iso||'');
    return m ? (m[1]+':'+m[2]) : '';
  }

  var AMOUNT_ORDER = ['200','1000','5000','25000','50000'];
  var ROUTE_ORDER = ['SGD->PHP', 'AUD->PHP', 'NZD->PHP', 'USD->MXN',
                      'USD->NGN', 'USD->INR', 'SGD->INR'];
  var CURVE_ROUTES = ['USD->MXN'];
  // Short arrow-style place names for pills, weekend rows, pattern rows and
  // the change log -- the site's own "arrow notation" convention (see
  // corridor.html's route table), distinct from the full "X to Y" sentence
  // phrasing (ROUTE_WORDS-derived) used inside generated headline sentences.
  var ARROW_PLACE = {SGD:'Singapore', PHP:'Philippines', AUD:'Australia', NZD:'New Zealand', USD:'US', MXN:'Mexico', NGN:'Nigeria', INR:'India'};
  var HEADLINE_PLACE = {SGD:'Singapore', PHP:'the Philippines', AUD:'Australia', NZD:'New Zealand', USD:'the US', MXN:'Mexico', NGN:'Nigeria', INR:'India'};
  function arrowWords(route){ return (ARROW_PLACE[route.src]||route.src) + ' → ' + (ARROW_PLACE[route.dst]||route.dst); }
  // Oxford-style "A, B and C" join for the source-meter sentence's list of
  // providers that quote us directly -- computed from the real rows every
  // render, never typed, since which providers are "own"-sourced varies by
  // corridor and by size (2026-09-28 final-mockup reconciliation: SGD->PHP
  // and AUD->PHP currently have 3, NZD->PHP has 2, USD->MXN has 1 -- a
  // hardcoded provider list would already be wrong for two of the four
  // routes today, and wrong again the next time collector_providers.py's
  // precedence picks up or drops one).
  function joinWithAnd(list){
    if (!list.length) return '';
    if (list.length === 1) return list[0];
    if (list.length === 2) return list[0] + ' and ' + list[1];
    return list.slice(0, -1).join(', ') + ' and ' + list[list.length - 1];
  }

  var SIZE_TIERS = ['200', '1000', '5000', '25000', '50000'];
  function parseSamplesCSV(text) {
    var lines = text.split('\n');
    var header = lines[0].split(',');
    var idx = {};
    header.forEach(function(h, i){ idx[h] = i; });
    var byKey = {};
    for (var i = 1; i < lines.length; i++) {
      if (!lines[i]) continue;
      var cols = lines[i].split(',');
      var corridor = cols[idx.corridor], size = cols[idx.notional_src];
      if (!corridor || !size) continue;
      byKey[corridor + '|' + size] = {
        costBpsTaker: parseFloat(cols[idx.cost_bps_taker]),
        costBpsMaker: parseFloat(cols[idx.cost_bps_maker]),
        baselineProvider: cols[idx.baseline_provider],
        baselineCostBps: parseFloat(cols[idx.baseline_cost_bps]),
        cryptoWinsTaker: cols[idx.crypto_wins_taker] === 'True',
        cryptoWinsMaker: cols[idx.crypto_wins_maker] === 'True'
      };
    }
    return byKey;
  }

  // ---- Cost-by-size curve. Redraws at the container's own real width, both
  // on first render and on every resize -- a fixed viewBox scaled down by
  // CSS is what shrank chart text on narrow phones before (fixed sitewide,
  // 2026-09-27); this keeps the SVG's own coordinate space equal to the
  // actual rendered pixel width at all times, so text is never scaled.
  var curveState = null;
  function renderCostCurve(container, corridorKey, byKey) {
    var points = SIZE_TIERS.map(function(s){ return byKey[corridorKey + '|' + s]; });
    if (points.some(function(p){ return !p; })) {
      container.innerHTML = '<div style="font-size:13px;color:var(--faint);padding:16px 0">Not enough measured sizes for this corridor yet.</div>';
      return;
    }
    var w = Math.max(240, Math.round(container.getBoundingClientRect().width)) || 860;
    var h = 220, padL = 24, padR = 90, padT = 16, padB = 30;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var allVals = points.map(function(p){ return p.costBpsTaker; })
      .concat(points.map(function(p){ return p.costBpsMaker; }))
      .concat(points.map(function(p){ return p.baselineCostBps; }));
    var maxV = Math.max.apply(null, allVals), minV = Math.min(0, Math.min.apply(null, allVals));
    var range = (maxV - minV) || 1;
    var logSizes = SIZE_TIERS.map(function(s){ return Math.log10(+s); });
    var logMin = logSizes[0], logMax = logSizes[logSizes.length - 1];
    function xPos(i){ return padL + ((logSizes[i] - logMin) / (logMax - logMin)) * plotW; }
    function yPos(v){ return padT + (1 - (v - minV) / range) * plotH; }

    function pathFor(getVal) {
      return points.map(function(p, i){ return (i===0?'M':'L') + xPos(i).toFixed(1) + ',' + yPos(getVal(p)).toFixed(1); }).join(' ');
    }
    var takerPath = pathFor(function(p){ return p.costBpsTaker; });
    var makerPath = pathFor(function(p){ return p.costBpsMaker; });
    var basePath = pathFor(function(p){ return p.baselineCostBps; });

    var dots = points.map(function(p, i){
      return '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(p.costBpsTaker).toFixed(1)+'" r="3.5" fill="#817FCC"/>' +
        '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(p.costBpsMaker).toFixed(1)+'" r="3.5" fill="#6B6B6B"/>' +
        '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(p.baselineCostBps).toFixed(1)+'" r="3.5" fill="#D3D0CB"/>';
    }).join('');
    var xLabels = points.map(function(p, i){
      return '<text x="'+xPos(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-family="Archivo, sans-serif" font-size="12" fill="#9A9A9A">'+esc(SIZE_TIERS[i].length>3 ? '$'+(+SIZE_TIERS[i]/1000)+'k' : '$'+SIZE_TIERS[i])+'</text>';
    }).join('');
    var yLabels = [minV, minV + range/2, maxV].map(function(v){
      var y = yPos(v);
      return '<text x="'+(plotW+padL+10)+'" y="'+(y+4).toFixed(1)+'" font-family="Archivo, sans-serif" font-size="12" fill="#9A9A9A">'+(v/100).toFixed(1)+'%</text>';
    }).join('');

    container.innerHTML =
      '<div class="curve-legend">' +
      '<span style="color:#817FCC;font-weight:700">&#9679; market order</span>' +
      '<span style="color:#6B6B6B;font-weight:700">&#9679; limit order</span>' +
      '<span style="color:#9A9A9A">&#9679; best fiat provider ('+esc(points[points.length-1].baselineProvider)+')</span></div>' +
      '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="display:block">' +
      '<path d="'+basePath+'" fill="none" stroke="#D3D0CB" stroke-width="1.5" stroke-dasharray="3,3"/>' +
      '<path d="'+makerPath+'" fill="none" stroke="#6B6B6B" stroke-width="2"/>' +
      '<path d="'+takerPath+'" fill="none" stroke="#817FCC" stroke-width="2"/>' +
      dots + yLabels + xLabels +
      '</svg>' +
      '<div class="curve-caption">All-in cost, as a share of the amount, at each size actually measured. Stops at $50,000, the largest size measured. Nothing past that point is estimated.</div>';
  }

  var COPY = {};
  var COVERAGE = {};
  var PROVIDERS = null;
  var SAMPLES_BY_KEY = null;
  var currentRouteKey = null;

  window.addEventListener('resize', debounce(function(){
    if (curveState) renderCostCurve(curveState.el, curveState.key, curveState.byKey);
  }, 150));
  function debounce(fn, ms){
    var t = null;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, ms);
    };
  }

  Promise.all([
    fetch('./data/providers_latest.json', {cache:'no-store'}).then(r=>r.json()),
    fetch('./data/samples.csv', {cache:'no-store'}).then(r=>r.text()),
    fetch('./copy.json', {cache:'no-store'}).then(r=>r.json()).catch(function(){ return {}; }),
    fetch('./data/coverage.json', {cache:'no-store'}).then(r=>r.json()).catch(function(){ return {}; })
  ]).then(function(res){
    PROVIDERS = res[0];
    SAMPLES_BY_KEY = parseSamplesCSV(res[1]);
    COPY = res[2].sendingMoney || {};
    COVERAGE = (res[3] || {}).corridors || {};

    document.getElementById('pageH1').textContent = COPY.pageTitle || document.getElementById('pageH1').textContent;
    document.getElementById('pageLead').textContent = COPY.lead || '';

    var routeKeys = ROUTE_ORDER.filter(function(k){ return PROVIDERS.corridors[k]; });
    var picker = document.getElementById('corridorPicker');
    var sizeByRoute = {};
    currentRouteKey = routeKeys[0];

    picker.innerHTML = routeKeys.map(function(k){
      return '<button class="pill'+(k===currentRouteKey?' on':'')+'" data-route="'+esc(k)+'">'+esc(arrowWords(PROVIDERS.corridors[k]))+'</button>';
    }).join('');
    picker.querySelectorAll('.pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        currentRouteKey = btn.getAttribute('data-route');
        picker.querySelectorAll('.pill').forEach(function(b){ b.classList.toggle('on', b === btn); });
        showRoute(currentRouteKey);
      });
    });

    showRoute(currentRouteKey);
    renderWeekend();
    renderPatterns();
    renderChanges();

    function showRoute(routeKey){
      renderMain(routeKey, sizeByRoute[routeKey] || '5000');
    }

    function renderMain(routeKey, selectedSize){
      sizeByRoute[routeKey] = selectedSize;
      var route = PROVIDERS.corridors[routeKey];
      var size = route.sizes[selectedSize];
      var rows = size.rows.slice().sort(function(a,b){ return a.rank - b.rank; });
      var cov = COVERAGE[routeKey];
      // Same numbers as the route breakdown and home:
      // - stablecoin = this hour's all-in cost on the default exchange pair
      //   (data/samples.csv), not the best-of-venues figure;
      // - apps = each provider's public-comparison price. A provider that only
      //   has a direct quote is shown as "not checked yet" and left out of the
      //   ranking (direct quotes like Airwallex's flat ~0.1% aren't verified).
      (function(){
        var amt = +selectedSize;
        var sym = (String(size.amount_words||'').match(/^[^0-9]*/)||[''])[0];
        function money(p){ return sym + (amt*p/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
        var smp = SAMPLES_BY_KEY[routeKey+'|'+selectedSize] || SAMPLES_BY_KEY[routeKey+'|'+selectedSize+'.0'];
        rows = rows.map(function(r){
          var c = {}; for (var k in r) c[k] = r[k];
          if (c.provider === 'Sending it with stablecoins') {
            if (smp && isFinite(smp.costBpsTaker)) { c.cost_pct = smp.costBpsTaker/100; c.costs = money(c.cost_pct); }
          } else if (c.source === 'own') {
            if (c.also_quoted_pct != null && isFinite(c.also_quoted_pct)) { c.cost_pct = c.also_quoted_pct; c.costs = money(c.cost_pct); c.source = 'comparison'; }
            else { c.unchecked = true; }
          }
          return c;
        });
        var ranked = rows.filter(function(r){ return !r.unchecked && r.source !== 'missing' && r.cost_pct != null; })
                         .sort(function(a,b){ return a.cost_pct - b.cost_pct; });
        var rest = rows.filter(function(r){ return ranked.indexOf(r) === -1; });
        rows = ranked.concat(rest);
        rows.forEach(function(r,i){ r.rank = i+1; });
      })();

      var sizePicker = document.getElementById('sizePicker');
      sizePicker.innerHTML = AMOUNT_ORDER.filter(function(a){ return route.sizes[a]; }).map(function(a){
        return '<button class="pill'+(a===selectedSize?' on':'')+'" data-amt="'+a+'">'+esc(route.sizes[a].amount_words)+'</button>';
      }).join('');
      sizePicker.querySelectorAll('.pill').forEach(function(btn){
        btn.addEventListener('click', function(){ renderMain(routeKey, btn.getAttribute('data-amt')); });
      });

      // The meta line under the lead: this route's own real check timestamp
      // and real coverage (data/coverage.json, tools/emit_coverage.py), never
      // typed -- updates the moment the route picker or the underlying data
      // changes.
      var metaEl = document.getElementById('pageMeta');
      if (cov) {
        metaEl.innerHTML = '<span class="dot"></span>' + esc(T(COPY.metaTemplate || '', {
          time: fmtTime(route.panel_hour_utc || route.crypto_hour_utc || ''),
          checked: cov.n_checked, possible: cov.n_possible, start: cov.start_words
        }));
      } else {
        metaEl.innerHTML = '<span class="dot"></span>&nbsp;';
      }

      var ordinaryRows = rows.filter(function(r){ return r.provider !== 'Sending it with stablecoins' && r.source !== 'missing' && !r.unchecked; });
      var stableRow = rows.filter(function(r){ return r.provider === 'Sending it with stablecoins'; })[0];
      var co = route.crossover;
      // Cheapest of ALL quotes, direct and public-comparison alike -- the
      // same rule corridor.html's own cheapestApp() uses (first non-"measured"
      // row once rows are rank-sorted, i.e. the cheapest ordinary way to
      // send money, excluding the stablecoin route's own row).
      var cheapest = ordinaryRows[0];

      if (cheapest && stableRow) {
        document.getElementById('mainHeadline').textContent = T('Sending {amountWords} to {destWords}: the cheapest app costs {cheapestCost}, the stablecoin route costs {stablecoinCost}', {
          amountWords: size.amount_words,
          destWords: HEADLINE_PLACE[route.dst] || route.dst,
          cheapestProvider: cheapest.provider,
          cheapestCost: cheapest.costs,
          stablecoinCost: stableRow.costs
        });
      } else {
        document.getElementById('mainHeadline').textContent = route.route_words + ', ' + size.amount_words;
      }
      if (co && co.win_rate_pct > 0) {
        document.getElementById('mainAnswer').textContent = T(COPY.routeAnswerWinTemplate || '', { winPct: co.win_rate_pct, startWords: cov ? cov.start_words : '' });
      } else {
        document.getElementById('mainAnswer').textContent = T(COPY.routeAnswerNeverTemplate || '', { startWords: cov ? cov.start_words : '' });
      }

      var maxCost = Math.max.apply(null, rows.map(function(r){ return r.unchecked ? 0 : (r.cost_pct || 0); })) || 1;
      var pctColHeader = T(COPY.colPctTemplate || '', { amountWords: size.amount_words });
      var rowsHtml = '<div class="prow head"><span>'+esc(COPY.colProvider||'')+'</span><span></span><span class="num-cell" style="font-size:14px">'+esc(COPY.colCost||'')+'</span><span class="pct-cell" style="font-size:14px">'+esc(pctColHeader)+'</span></div>';
      rowsHtml += rows.map(function(r, i){
        var isMissing = r.source === 'missing';
        var isStable = r.provider === 'Sending it with stablecoins';
        var displayName = isStable ? 'Stablecoin route' : r.provider;
        var hasVenues = isStable && r.venues && r.venues.combos && r.venues.combos.length > 1;
        // 2026-09-28 final mockup: per-row "quoted by the provider"/"from a
        // public price comparison" captions are dropped for ordinary rows,
        // and the stablecoin row's caption drops its specific venue names
        // too -- that detail isn't lost, it still lives in the per-venue
        // breakdown below (combosHtml) and in how-it-works.html's own
        // methodology paragraph.
        var sourceLabel = isStable
          ? ('all fees in &middot; <a href="./corridor.html?corridor='+encodeURIComponent(routeKey)+'" class="route-link" style="font-weight:600;color:#0B0B0B">every cost, step by step →</a>')
          : '';
        var nameCell = '<div><span class="pname">'+esc(displayName)+(hasVenues ? ' <span class="venue-toggle-caret">▸</span>' : '')+(sourceLabel ? '<small>'+sourceLabel+'</small>' : '')+'</span></div>';
        if (r.unchecked) {
          return '<div class="prow missing"><div><span class="pname">'+esc(r.provider)+'<small>direct quote, not checked yet</small></span></div><div class="track"></div><div class="num-cell">—</div><div class="pct-cell">—</div></div>';
        }
        var cost = isMissing ? 'no price this hour' : esc(r.costs);
        var pct = isMissing ? '—' : r.cost_pct.toFixed(2)+'%';
        var barWidth = isMissing ? 0 : Math.max(2, (r.cost_pct / maxCost) * 100);
        var vid = 'venue-breakdown-'+routeKey+'-'+selectedSize+'-'+i;
        var rowHtml = '<div class="prow'+(isMissing?' missing':'')+(isStable?' stable':'')+(hasVenues?' venue-row':'')+'"'+(hasVenues?' data-venue-target="'+vid+'"':'')+'>'+nameCell+'<div class="track"><i style="width:'+barWidth.toFixed(1)+'%"></i></div><div class="num-cell">'+cost+'</div><div class="pct-cell">'+pct+'</div></div>';
        if (!hasVenues) return rowHtml;
        var combosHtml = r.venues.combos.map(function(c){
          var star = c.is_default_pair ? ' <span style="color:var(--faint)">(the one this site has always shown)</span>' : '';
          return '<div class="venue-combo-row"><div>'+esc(c.buy_venue)+' &rarr; '+esc(c.sell_venue)+star+'</div><div class="num-cell">'+c.cost_pct.toFixed(2)+'%</div></div>';
        }).join('');
        var expandHtml = '<div class="venue-breakdown" id="'+vid+'" style="display:none">' +
          '<div class="venue-breakdown-hdr">All '+r.venues.combos.length+' exchange combinations priced this hour ('+esc((r.venues.as_of_utc||'').slice(11,16))+' UTC)</div>' +
          combosHtml + '</div>';
        return rowHtml + expandHtml;
      }).join('');

      var showCurve = CURVE_ROUTES.indexOf(routeKey) !== -1;
      rowsHtml += showCurve ?
        '<div class="curve-title">By size, on this corridor</div>' +
        '<div class="curve-wrap" id="curve-'+esc(routeKey)+'"></div>' : '';
      rowsHtml += '<p style="margin:18px 0 0;font-size:16px"><a href="./corridor.html?corridor='+encodeURIComponent(routeKey)+'" style="font-weight:600;color:#0B0B0B;display:inline-flex;min-height:40px;align-items:center">The stablecoin route on this corridor, every cost step by step →</a></p>';
      document.getElementById('mainRows').innerHTML = rowsHtml;

      // 2026-09-28 final mockup: the separate boxed disclosure note and the
      // three-way source-meter sentence merge into one line. Which
      // providers quote us directly is computed from this render's own
      // rows (see joinWithAnd's comment) rather than typed, so the
      // sentence can't go stale as collector_providers.py's precedence
      // changes provider-by-provider or route-by-route.
      var ownNames = [];
      rows.forEach(function(r){ if (r.source === 'own') ownNames.push(r.provider); });
      document.getElementById('mainSourceLine').textContent =
        'App prices are from a public price comparison, typical of what a first-time sender sees. Stablecoin route: buy and sell on real exchange order books, all exchange fees in. Bank fees to get money on and off the exchanges are not included yet.';

      document.getElementById('mainRows').querySelectorAll('.venue-row').forEach(function(rowEl){
        rowEl.addEventListener('click', function(e){
          if (e.target && e.target.classList && (e.target.classList.contains('venue-breakdown-link') || e.target.classList.contains('route-link'))) return;
          toggleVenue(rowEl);
        });
      });
      document.getElementById('mainRows').querySelectorAll('.venue-breakdown-link').forEach(function(a){
        a.addEventListener('click', function(e){
          e.preventDefault();
          toggleVenue(a.closest('.venue-row'));
        });
      });
      function toggleVenue(rowEl){
        var target = document.getElementById(rowEl.getAttribute('data-venue-target'));
        if (!target) return;
        var open = target.style.display !== 'none';
        target.style.display = open ? 'none' : 'block';
        var caret = rowEl.querySelector('.venue-toggle-caret');
        if (caret) caret.textContent = open ? '▸' : '▾';
      }

      if (showCurve) {
        var curveEl = document.getElementById('curve-'+routeKey);
        curveState = { el: curveEl, key: routeKey, byKey: SAMPLES_BY_KEY };
        renderCostCurve(curveEl, routeKey, SAMPLES_BY_KEY);
      } else {
        curveState = null;
      }
    }

    // ================================================================
    // Section 2: do providers charge more on Saturdays.
    // ================================================================
    function renderWeekend(){
      fetch('./data/price_changes_latest.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(pc){
        var changes = pc.changes || [];
        var judged = pc.saturdays_judged || {};
        var totalSlots = 0, hikeDays = 0;
        var hikesByPair = {};
        var slotsByCorridor = {}, hikeDaysByCorridor = {};
        changes.filter(function(c){ return c.kind === 'weekend_up'; }).forEach(function(c){
          var key = c.provider + '|' + c.corridor;
          if (!hikesByPair[key]) hikesByPair[key] = { provider: c.provider, corridor: c.corridor, days: {}, moves: [] };
          hikesByPair[key].days[c.day] = true;
          hikesByPair[key].moves.push(c.move_pct);
        });
        Object.keys(judged).forEach(function(corridor){
          var route = PROVIDERS.corridors[corridor];
          if (!route) return;
          var providers = {};
          Object.keys(route.sizes).forEach(function(sz){
            route.sizes[sz].rows.forEach(function(r){ if (r.provider !== 'Sending it with stablecoins') providers[r.provider] = true; });
          });
          var slots = Object.keys(providers).length * judged[corridor];
          totalSlots += slots;
          slotsByCorridor[corridor] = slots;
        });
        Object.keys(hikesByPair).forEach(function(k){
          var n = Object.keys(hikesByPair[k].days).length;
          hikeDays += n;
          var c = hikesByPair[k].corridor;
          hikeDaysByCorridor[c] = (hikeDaysByCorridor[c] || 0) + n;
        });
        var allMoves = Object.keys(hikesByPair).reduce(function(a,k){ return a.concat(hikesByPair[k].moves); }, []);
        var avgMove = allMoves.length ? allMoves.reduce(function(a,b){return a+b;},0)/allMoves.length : 0;
        var offenders = Object.keys(hikesByPair).map(function(k){ return hikesByPair[k]; })
          .sort(function(a,b){ return Object.keys(b.days).length - Object.keys(a.days).length; });
        document.getElementById('weekendHeadline').textContent = T(COPY.weekendHeadlineTemplate || '', { n: hikeDays, m: totalSlots });
        // Unique provider names only -- a provider that hiked on more than
        // one corridor (e.g. OFX on both Singapore->Philippines and
        // US->Mexico) is named once, not once per corridor.
        var offenderNames = [];
        offenders.forEach(function(o){ if (offenderNames.indexOf(o.provider) === -1) offenderNames.push(o.provider); });
        var named = offenderNames.length
          ? offenderNames.join(' and ') + ' account for it'
          : 'Nobody has done it more than once';
        document.getElementById('weekendAnswer').textContent = T(COPY.weekendAnswerTemplate || '', { pct: avgMove.toFixed(2), named: named });

        var chartRows = Object.keys(slotsByCorridor).map(function(c){
          var slots = slotsByCorridor[c];
          var hikes = hikeDaysByCorridor[c] || 0;
          return { route: PROVIDERS.corridors[c], ratePct: slots ? hikes/slots*100 : 0, hikeDays: hikes, totalSlots: slots };
        }).filter(function(r){ return r.totalSlots > 0; }).sort(function(a,b){ return b.ratePct - a.ratePct; });
        var maxRate = Math.max(10, Math.max.apply(null, chartRows.map(function(r){ return r.ratePct; }).concat([0])));
        document.getElementById('weekendBars').innerHTML = chartRows.filter(function(r){ return r.hikeDays > 0; }).map(function(r){
          return '<div class="brow"><span>'+esc(arrowWords(r.route))+'</span><div class="track"><i style="width:'+Math.max(2, r.ratePct/maxRate*100).toFixed(1)+'%"></i></div><span class="num-cell">'+r.hikeDays+' of '+r.totalSlots+'</span></div>';
        }).join('');
        var zeros = chartRows.filter(function(r){ return r.hikeDays === 0; });
        document.getElementById('weekendZero').textContent = zeros.length
          ? T(COPY.weekendZeroTemplate || '', { list: zeros.map(function(r){ return arrowWords(r.route) + ' (' + r.totalSlots + ' checked)'; }).join(' or ') })
          : '';
      }).catch(function(){
        document.getElementById('weekendHeadline').textContent = 'Could not load this data.';
      });
    }

    // ================================================================
    // Section 3: who raises and cuts prices most often.
    // ================================================================
    function renderPatterns(){
      fetch('./data/price_changes_latest.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(pc){
        var changes = pc.changes || [];
        document.getElementById('patternsHeadline').textContent = COPY.patternsHeadline || '';
        document.getElementById('patternsAnswer').textContent = COPY.patternsAnswer || '';

        var byFreq = {};
        changes.filter(function(c){ return c.kind === 'change'; }).forEach(function(c){
          var key = c.provider + '|' + c.corridor;
          if (!byFreq[key]) byFreq[key] = { provider: c.provider, corridor: c.corridor, route: PROVIDERS.corridors[c.corridor], up: {}, down: {} };
          var bucket = c.move_pct > 0 ? byFreq[key].up : byFreq[key].down;
          bucket[c.day] = true;
        });
        var ranked = Object.keys(byFreq).map(function(k){
          var p = byFreq[k];
          p.upCount = Object.keys(p.up).length;
          p.downCount = Object.keys(p.down).length;
          p.total = p.upCount + p.downCount;
          return p;
        }).filter(function(p){ return p.total > 0 && p.route; })
          .sort(function(a,b){ return b.total - a.total; })
          .slice(0, 4);

        document.getElementById('patternsList').innerHTML = ranked.map(function(p){
          var cov = COVERAGE[p.corridor];
          var sub = T(COPY.patternsSubTemplate || '', { n: p.total, startWords: cov ? cov.start_words : '' });
          return '<li><span>'+esc(p.provider)+', '+esc(arrowWords(p.route))+'<span class="s2">'+esc(sub)+'</span></span>' +
            '<span>'+esc(COPY.patternsUpWord||'')+' <span class="up">'+p.upCount+' times</span>, '+esc(COPY.patternsDownWord||'')+' '+p.downCount+' times</span></li>';
        }).join('');
      }).catch(function(){
        document.getElementById('patternsHeadline').textContent = 'Could not load this data.';
      });
    }

    // ================================================================
    // Section 4: every price change, newest first.
    // ================================================================
    function renderChanges(){
      fetch('./data/price_changes_latest.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(pc){
        document.getElementById('changesHeadline').textContent = COPY.changesTitle || '';

        var changes = pc.changes || [];
        var seen = {};
        var dedup = [];
        changes.slice().sort((a,b)=> b.ts_utc.localeCompare(a.ts_utc) || (a.size==='5000'?-1:1))
          .forEach(function(c){
            var key = c.day+'|'+c.provider+'|'+c.corridor;
            if (!seen[key]) { seen[key] = true; dedup.push(c); }
          });

        function cardFor(c){
          var up = c.move_pct > 0;
          var sub = T(COPY.changeLogSubTemplate || '', { amountWords: c.amount_words, oldDay: fmtDay(c.old_day), newDay: fmtDay(c.day) });
          var word = up ? (COPY.changeUpWord||'') : (COPY.changeDownWord||'');
          var agree = T(COPY.changeAgreeTemplate || '', { n: c.n_agree, m: c.n_panel });
          return '<li><span>'+esc(c.provider)+', '+esc(arrowWords(PROVIDERS.corridors[c.corridor] || {src:'',dst:''}))+'<span class="s2">'+esc(sub)+'</span></span>' +
            '<span>'+(up?'<span class="up">'+esc(word)+'</span>':esc(word))+'<span class="s2" style="text-align:right">'+fmt(c.old_cost_pct)+' → '+fmt(c.new_cost_pct)+'</span></span></li>';
        }

        var listEl = document.getElementById('changesList');
        var VISIBLE = 5;
        var expanded = false;
        function draw(){
          var shown = expanded ? dedup : dedup.slice(0, VISIBLE);
          listEl.innerHTML = shown.length ? shown.map(cardFor).join('')
            : '<li><span>'+esc(COPY.noChanges||'')+'</span><span></span></li>';
          // 2026-09-28 final mockup: drops the "a change only counts when a
          // provider moved against every other provider..." methodology
          // sentence here (not explained anywhere else on the reader-facing
          // site today -- flagged in the PR body as a follow-up for
          // how-it-works.html) but keeps the "Show all N →" control.
          var footer = document.getElementById('changesFooter');
          if (dedup.length > VISIBLE) {
            var label = expanded ? (COPY.showFewerLabel || '') : T(COPY.showAllTemplate || '', { n: dedup.length });
            footer.innerHTML = '<button class="pill" id="showAllBtn" style="margin-top:12px">'+esc(label)+'</button>';
            var btn = document.getElementById('showAllBtn');
            if (btn) btn.addEventListener('click', function(){ expanded = !expanded; draw(); });
          } else {
            footer.textContent = '';
          }
        }
        draw();
      }).catch(function(){
        document.getElementById('changesList').innerHTML = '<li><span>Could not load findings data. That failure is shown, not hidden.</span><span></span></li>';
      });
    }
  }).catch(function(){
    document.getElementById('mainSection').innerHTML = '<p style="color:var(--ink)">Could not load corridor data. That failure is shown, not hidden.</p>';
  });
})();
</script>
</body>
