<style>
  /* The routes page (SEB-310 item 2): one question, how much of a country's dollar premium survives the trip. One table, one
     chart, a short list of the biggest moves. Archivo, a 760px column and the chart palette of DESIGN.md. Colours of the
     chart lines: the destination sets the colour, the sending country sets the dash. */
  :root{
    --sm-ink:var(--color-ink); --sm-sub:var(--color-neutral-700); --sm-stamp:var(--color-neutral-600); --sm-rule:var(--color-neutral-200);
    --sm-peri:var(--data-700); --sm-dust:var(--color-neutral-300); --sm-grape:var(--color-neutral-900);
  }
  body.sm-body{ background:#fff; color:var(--sm-ink); font-size:17px; line-height:1.55; }
  .sm-wrap{ max-width:760px; margin:0 auto; padding:0 24px 64px; }
  .sm-wrap a{ color:var(--sm-ink); text-decoration:none; font-weight:500; }
  .sm-num{ font-variant-numeric:tabular-nums; }

  .sm-head{ display:flex; align-items:center; gap:28px; padding:20px 0; }
  .sm-logo{ font-size:18px; font-weight:800; letter-spacing:-.02em; flex:none; }
  .sm-nav{ display:flex; gap:4px; font-size:15px; font-weight:500; min-width:0; }
  .sm-nav a{ padding:10px; color:var(--sm-sub); min-height:44px; display:inline-flex; align-items:center; }
  .sm-nav a[aria-current]{ color:var(--sm-ink); font-weight:700; }

  .sm-hero{ padding:24px 0 0; display:flex; flex-direction:column; gap:12px; }
  .sm-hero h1{margin:0;max-width:640px;}
  .sm-lead{margin:0;max-width:620px;}
  .sm-meta{ margin:0; font-size:14px; color:var(--sm-stamp); }

  .sm-wrap section{ margin-top:48px; }
  .sm-wrap h2{margin:0 0 6px;}
  .sm-note{ margin:0 0 14px; font-size:15px; color:var(--sm-sub); max-width:620px; }
  .sm-small{ font-size:14px; color:var(--sm-sub); margin:12px 0 0; max-width:620px; }

  /* the table: one row per way of sending, sorted by the destination's dollar premium */
  .rt{ width:100%; border-collapse:collapse; }
  .rt th{ text-align:left; font-size:14px; font-weight:500; line-height:1.3; color:var(--sm-sub); padding:0 14px 10px 0; border-bottom:1px solid var(--sm-ink); vertical-align:bottom; }
  .rt td{ padding:14px 14px 14px 0; border-bottom:1px solid var(--sm-rule); vertical-align:top; font-size:15px; line-height:1.35; }
  .rt th:first-child,.rt td:first-child{ width:27%; }
  .rt td.rt-nm{ font-weight:500; }
  .rt td small{ display:block; font-size:14px; color:var(--sm-stamp); margin-top:2px; }
  .rt td.rt-wait{ color:var(--sm-sub); }
  .rt tr:last-child td{ border-bottom:0; }
  .rt caption{ position:absolute; left:-9999px; }

  /* the chart: one line per way of sending, daily */
  .sm-chart{ position:relative; margin-top:12px; }
  .sm-chart svg{ display:block; width:100%; height:auto; overflow:visible; }
  .sm-chart .sm-ax{ fill:var(--color-neutral-600); font:400 11px 'Archivo',system-ui,sans-serif; }
  .sm-chart .sm-ax.sm-z{ fill:var(--color-ink); }
  .sm-chart .sm-grid{ stroke:var(--color-neutral-200); stroke-width:1; }
  .sm-chart .sm-zline{ stroke:var(--color-ink); stroke-width:1; }
  .sm-chart .sm-ln{ fill:none; stroke-width:1.75; stroke-linejoin:round; stroke-linecap:round; }
  .sm-chart .sm-cross{ stroke:var(--color-neutral-600); stroke-dasharray:3 3; }
  .sm-tip{ position:absolute; top:0; background:#fff; border:1px solid var(--sm-dust); border-radius:6px; padding:8px 10px; font-size:13px; line-height:1.4; pointer-events:none; white-space:nowrap; z-index:2; }
  .sm-tip b{ display:block; font-weight:600; margin-bottom:2px; }
  .sm-tip i{ display:inline-block; width:14px; height:0; border-top:2px solid; margin-right:8px; vertical-align:middle; }
  .sm-keys{ list-style:none; padding:0; margin:14px 0 0; display:grid; grid-template-columns:1fr 1fr; gap:6px 20px; font-size:14px; color:var(--sm-sub); }
  .sm-keys i{ display:inline-block; width:22px; height:0; border-top:2px solid; margin-right:8px; vertical-align:middle; }

  /* the biggest moves */
  .sm-moves{ list-style:none; padding:0; margin:12px 0 0; }
  .sm-moves li{ padding:12px 0; border-bottom:1px solid var(--sm-rule); font-size:15px; line-height:1.4; }
  .sm-moves li:first-child{ border-top:1px solid var(--sm-ink); }

  .sm-wrap footer{ border-top:1px solid var(--sm-rule); margin-top:48px; padding:24px 0 48px; font-size:14px; color:var(--sm-stamp); }
  .sm-wrap footer p{ margin:0 0 6px; }

  /* a phone: each row of the table becomes a block, the column label printed before each figure */
  @media (max-width:620px){
    .sm-keys{ grid-template-columns:1fr; }
    .rt,.rt tbody,.rt tr,.rt td{ display:block; width:auto; }
    .rt thead{ position:absolute; left:-9999px; }
    .rt tr{ padding:14px 0; border-bottom:1px solid var(--sm-rule); }
    .rt td{ border:0; padding:3px 0; display:flex; justify-content:space-between; gap:16px; text-align:right; }
    .rt td::before{ content:attr(data-label); color:var(--sm-sub); text-align:left; flex:none; max-width:55%; }
    .rt td.rt-nm{ display:block; text-align:left; font-size:17px; padding-bottom:6px; width:auto; }
    .rt td.rt-nm::before{ content:none; }
    .rt td.rt-wait{ display:block; text-align:left; }
    .rt td.rt-wait::before{ content:none; }
    .rt th:first-child,.rt td:first-child{ width:auto; }
    .rt td small{ margin-top:0; }
    .rt-v{ text-align:right; white-space:nowrap; }
    .rt td::before{ white-space:normal; }
  }
  /* a phone, 27 Oct (Seb: "text coming at you from the left and the right"): each route reads top to bottom. The name,
     then its four figures in two columns, each label above its number, everything left aligned. */
  @media (max-width:620px){
    #smTable{ margin-top:32px !important; padding-top:0 !important; }
    .rt thead{ display:none !important; }
    .rt tr{ display:grid !important; grid-template-columns:1fr 1fr; column-gap:20px; row-gap:4px; padding:20px 0 !important; }
    .rt td{ display:grid !important; grid-row:span 2; grid-template-rows:subgrid; padding:0 !important; text-align:left !important; align-content:start; }
    .rt td:nth-child(4), .rt td:nth-child(5){ padding-top:14px !important; }
    .rt td::before{ display:block; max-width:none !important; font-size:14px; line-height:1.3; align-self:end; }
    .rt td.rt-nm{ display:block !important; grid-column:1 / -1; grid-row:auto; padding:0 0 10px !important; font-size:18px; }
    .rt td.rt-wait{ display:block !important; grid-column:2; grid-row:auto; }
    .rt-v{ text-align:left !important; white-space:normal !important; font-size:17px; }
    .rt td small{ font-size:14px; }
    .rt tr.rt-on td, .rt tr.rt-on td.rt-nm{ background:none !important; font-weight:inherit; }   /* tapping a route scrolls to its detail, so no marked row on a phone (27 Oct) */
    .rt td.rt-nm{ font-weight:500 !important; }
  }

  /* the picked route, under the table (brought back 22 Oct from the 21 Oct page) */
  :root{ --sm-peri-deep:var(--data-700); --sm-peri-soft:var(--data-400); }
  .sm-tools{ display:flex; flex-direction:column; gap:10px; margin-top:28px; }
  .sm-pills{ display:flex; flex-wrap:wrap; gap:8px; }

  .sm-key{ display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center; margin:0 0 6px; font-size:14px; color:var(--sm-sub); }
  .sm-key i{ display:inline-block; vertical-align:middle; margin-right:8px; }
  .sm-key .sm-kd{ width:10px; height:10px; border-radius:50%; background:var(--sm-peri); }
  .sm-key .sm-kr{ width:28px; height:8px; border-radius:4px; background:var(--sm-peri-soft); }
  .sm-key .sm-kl{ width:2px; height:14px; background:var(--sm-ink); }

  .sm-wrap h3{ font-size:17px; line-height:1.3; margin:28px 0 4px; font-weight:700; }
  .sm-row,.sm-axisrow{ display:grid; grid-template-columns:190px 1fr 112px; gap:0 14px; align-items:center; }
  .sm-axisrow{ height:26px; font-size:12px; color:var(--sm-stamp); }
  .sm-row{ min-height:40px; border-top:1px solid var(--sm-rule); color:var(--sm-ink); font-weight:400; }
  button.sm-row{ width:100%; font:inherit; text-align:left; background:none; border:0; border-top:1px solid var(--sm-rule); padding:0; cursor:pointer; }
  .sm-row:hover{ background:var(--color-neutral-100); }
  .sm-row.sm-on{ background:var(--data-100); }
  .sm-row.sm-on .sm-nm{ font-weight:700; }
  .sm-row .sm-nm{ font-size:15px; font-weight:600; line-height:1.25; padding:7px 0; }
  .sm-row .sm-nm small{ display:block; font-size:12.5px; font-weight:500; color:var(--sm-stamp); }
  .sm-row .sm-v{ text-align:right; font-weight:700; font-size:15px; color:var(--sm-peri-deep); line-height:1.2; }
  .sm-row .sm-v small{ display:block; font-size:12.5px; font-weight:600; color:var(--sm-grape); }
  .sm-row.sm-tot{ border-top:1px solid var(--sm-dust); }
  .sm-row.sm-app .sm-v{ color:var(--sm-ink); }
  .sm-row.sm-app .sm-dot{ background:var(--sm-ink); }
  .sm-row.sm-app .sm-rng{ background:var(--sm-dust); }
  .sm-track{ position:relative; height:40px; }
  .sm-axisrow .sm-track{ height:26px; }
  .sm-gridl{ position:absolute; top:0; bottom:0; width:1px; background:var(--sm-rule); }
  .sm-gridl.sm-zero{ background:var(--sm-ink); }
  .sm-rng{ position:absolute; top:50%; height:8px; margin-top:-4px; border-radius:4px; background:var(--sm-peri-soft); min-width:2px; }
  .sm-dot{ position:absolute; top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; border-radius:50%; background:var(--sm-peri); border:1.5px solid #fff; }
  .sm-tk{ position:absolute; bottom:8px; transform:translateX(-50%); white-space:nowrap; line-height:1; }
  .sm-tk.sm-z{ color:var(--sm-ink); font-weight:600; }
  .sm-axisrow .sm-gridl{ top:auto; bottom:0; height:5px; }

  .sm-bar{ position:relative; height:40px; }
  .sm-bar .sm-z{ position:absolute; top:8px; bottom:8px; width:1px; background:var(--sm-ink); }
  .sm-bar b{ position:absolute; top:50%; height:12px; margin-top:-6px; border-radius:3px; background:var(--sm-peri); }
  .sm-row.sm-app .sm-bar b{ background:var(--sm-dust); }
  .sm-row.sm-step .sm-bar b{ background:var(--sm-peri-soft); }
  .sm-row.sm-tot .sm-bar b{ background:var(--sm-grape); }
  .sm-row.sm-tot .sm-v{ color:var(--sm-grape); }
  .sm-detail{ margin-top:64px !important; padding-top:40px; border-top:1px solid var(--sm-rule); }
  .sm-detail .sm-hero{ display:flex; flex-direction:column; gap:12px; }
  .sm-detail h2{ margin:0; }
  .sm-detail .sm-lead{ margin:0; }
  .sm-detail .sm-meta{ margin:0; font-size:14px; color:var(--sm-sub); }
  .rt tr[data-r]{ cursor:pointer; }
  @media (hover:hover){ .rt tbody tr[data-r]:hover td{ background:var(--color-neutral-100); } }   /* a tap on a phone left this grey on the row (27 Oct) */
  .rt tr.rt-on td{ background:var(--data-100); }
  .rt tr.rt-on td.rt-nm{ font-weight:600; }
  .sm-chart .sm-tick{ stroke:var(--color-neutral-300); }
  .sm-chart .sm-area{ fill:var(--data-700); fill-opacity:.14; stroke:none; }
  .sm-chart .sm-line{ fill:none; stroke:var(--data-700); stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round; }
  .sm-chart .sm-dot{ fill:var(--data-700); }
  .sm-chart .sm-gasmiss, .sm-chart .sm-band{ fill:var(--color-neutral-100); }
  .sm-chart .sm-bandlbl{ fill:var(--color-neutral-600); font:400 12px 'Archivo',system-ui,sans-serif; }
  .sm-chart .sm-zone{ paint-order:stroke; stroke:#fff; stroke-width:3px; fill:var(--color-neutral-600); font:500 12px 'Archivo',system-ui,sans-serif; }
  .sm-chart .sm-gapline{ stroke:var(--color-neutral-400); stroke-width:1.5; stroke-dasharray:1 4; stroke-linecap:round; opacity:1; }
  .sm-periods{ display:flex; width:max-content; gap:2px; margin:12px auto 0; padding:3px; border-radius:999px; background:var(--color-neutral-100); }
  .sm-periods button{ font:inherit; font-size:14px; font-weight:500; line-height:1; padding:7px 12px; border:0; border-radius:999px; background:transparent; color:var(--color-neutral-700); cursor:pointer; }
  .sm-periods button[aria-pressed="true"]{ background:var(--color-bg,#fff); color:var(--color-ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .sm-tip span{ display:block; color:var(--sm-stamp); font-size:12px; }
  @media (max-width:700px){
    .sm-row,.sm-axisrow{ grid-template-columns:1fr 112px; }
    .sm-row .sm-track,.sm-axisrow .sm-track{ grid-column:1/-1; grid-row:2; }
    .sm-axisrow > span:first-child,.sm-axisrow > span:last-child{ display:none; }
    .sm-axisrow{ grid-template-columns:1fr; }
    .sm-axisrow .sm-track{ grid-row:1; }
    .sm-row .sm-track,.sm-row .sm-bar{ height:28px; margin-bottom:6px; }
    .sm-row .sm-bar{ grid-column:1/-1; grid-row:2; }
    .sm-row .sm-nm{ padding:9px 0 0; }
    .sm-row .sm-v{ padding-top:9px; align-self:start; }
    .sm-pills{ flex-wrap:wrap; }
    .sm-axisrow .sm-tk:nth-of-type(even){ display:none; }
  }

  .sm-routesel{ display:none; }
  @media (max-width:767px){
    .sm-routesel{ display:block; margin:0 0 12px; }
    .sm-routesel label{ display:block; font-size:13px; color:var(--sm-sub); margin-bottom:6px; }
    .sm-routesel select{ box-sizing:border-box; width:100%; min-height:44px; padding:0 12px; font:inherit; font-size:16px; color:var(--sm-ink); background:#fff; border:1px solid var(--sm-dust); border-radius:8px; }
    #smRoutes{ display:none; }
  }

  /* the route cards (27 Oct, Seb): one card per way of sending, read top to bottom at every width.
     The answer as a sentence, then why, then how often. Overrides the old table and its phone grid. */
  .rt.rc-list, .rt.rc-list tbody, .rt.rc-list tr{ display:block !important; width:auto !important; }
  .rt.rc-list{ border-top:1px solid var(--sm-rule); }
  .rt.rc-list tr{ padding:20px 0 !important; border-bottom:1px solid var(--sm-rule); box-shadow:none !important; cursor:pointer; }
  #smTable{ padding-top:0 !important; margin-top:40px !important; }
  .sm-lead{ text-wrap:pretty !important; }
  .rt.rc-list td.rc{ width:auto !important; display:block !important; padding:0 !important; border:0 !important; text-align:left !important; background:none !important; max-width:680px; }
  .rt.rc-list td.rc::before{ content:none !important; }
  .rc-t{ margin:0 0 6px !important; font-size:15px !important; font-weight:500 !important; line-height:1.35 !important; color:var(--sm-sub) !important; }
  .rc-v{ margin:0; font-size:19px; line-height:1.4; font-weight:500; color:var(--sm-ink); }
  .rc-why{ margin:8px 0 0; font-size:16px; line-height:1.55; color:var(--sm-sub); }
  .rc-hrs{ margin:6px 0 0; font-size:16px; line-height:1.55; color:var(--sm-sub); }
  @media (hover:hover){ .rt.rc-list tr:hover .rc-v{ color:var(--data-700); } }
</style>
