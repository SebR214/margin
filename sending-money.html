<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>margin.wiki — sending money</title>
<meta name="description" content="Every provider's all-in cost to send money, fee plus the margin hidden in the exchange rate, re-priced every hour."/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B0B0B; --sub:#6B6B6B; --stamp:#9A9A9A; --indigo:#817FCC; --rule:#F0F0F0; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Archivo',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);background:#fff}
  a{color:var(--ink);text-decoration:none} a:hover{color:var(--indigo)}
  .num{font-variant-numeric:tabular-nums}
  .lbl{font-size:11px;letter-spacing:.1em;color:#6B6B6B}
  .wrap{max-width:1150px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 48px;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:800;letter-spacing:-0.02em}
  nav{display:flex;gap:28px;font-size:15px;font-weight:500;color:#333;flex-wrap:wrap}
  nav a.active{color:var(--ink);font-weight:700}
  .live{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:#6B6B6B}
  .header-right{display:flex;align-items:center;gap:16px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--indigo)}
  .hero{padding:44px 48px 0;display:flex;flex-direction:column;gap:12px}
  h1{font-size:38px;font-weight:800;letter-spacing:-0.02em;margin:0}
  .lede{max-width:780px;font-size:16px;color:#6B6B6B;line-height:1.5}
  .job{font-size:15px;color:#6B6B6B;padding:2px 48px 0;max-width:780px}
  .corridor-picker{display:flex;gap:8px;flex-wrap:wrap;padding:28px 48px 0}
  .route-pill{padding:10px 18px;background:#F6F6F6;color:#0B0B0B;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;border:0;font-family:inherit}
  .route-pill.on{background:#0B0B0B;color:#fff}
  .corridor{padding:28px 48px 0;display:flex;flex-direction:column;max-width:860px;box-sizing:content-box}
  .corridor:last-child{padding-bottom:56px}
  .corridor-hdr{display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;flex-wrap:wrap;gap:10px}
  .corridor-title{font-size:22px;font-weight:800;letter-spacing:-0.01em}
  .pills{display:flex;gap:6px;flex-wrap:wrap}
  .pill{padding:6px 13px;background:#F6F6F6;color:#0B0B0B;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;border:0;font-family:inherit}
  .pill.on{background:#0B0B0B;color:#fff}
  .prow-hdr{display:grid;grid-template-columns:1fr 150px 150px;gap:16px;align-items:center;border-bottom:1px solid #0B0B0B;padding:8px 0}
  .prow{display:grid;grid-template-columns:1fr 150px 150px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule);font-size:15px}
  .prow .cost{text-align:right;font-weight:700} .prow .pct{text-align:right;color:#6B6B6B}
  .prow .name-cell{display:flex;flex-direction:column;gap:2px}
  .prow .source-label{font-size:11px;color:#9A9A9A;font-weight:400}
  .prow.missing{opacity:.5}
  .prow.missing .cost,.prow.missing .pct{color:#9A9A9A;font-weight:400;font-style:italic}
  .foot{padding-top:10px;font-size:12px;color:#9A9A9A;line-height:1.5}
  .crossover{font-size:15px;line-height:1.6;color:#1A1A1A;padding-bottom:6px;max-width:780px}
  .crossover-explain{font-size:13px;color:#6B6B6B;line-height:1.5;padding-bottom:16px;max-width:780px}

  /* ---- Folded-in findings section (formerly findings.html, Phase 4) ---- */
  .findings{padding:12px 48px 56px}
  .findings-hdr{font-size:26px;font-weight:800;letter-spacing:-0.01em;margin:0 0 8px}
  .section-kicker{font-size:13px;letter-spacing:.06em;color:#9A9A9A;text-transform:uppercase;padding:28px 0 8px}
  .findings .card{padding:24px 0;border-bottom:1px solid var(--rule);max-width:820px}
  .findings .stamp{font-size:11px;color:#9A9A9A;letter-spacing:.06em;padding-bottom:8px}
  .findings .p{font-size:16px;line-height:1.6;color:#1A1A1A;font-weight:400}
  .findings .p b{font-weight:700}
  .findings .receipt{font-size:13px;color:#6B6B6B;padding-top:10px}
  .findings .receipt a{font-weight:600;color:#0B0B0B}
  .show-all-wrap{padding-top:18px}
  @media(max-width:900px){h1{font-size:30px} header{padding:22px 24px} .hero{padding:32px 24px 0} .corridor{padding:32px 24px 0;max-width:100%} .findings{padding:12px 24px 56px}}

  .nav-toggle{display:none;background:none;border:0;font-size:20px;cursor:pointer;padding:6px 8px;color:#0B0B0B;line-height:1}
  @media(max-width:760px){
    header{position:relative;flex-wrap:nowrap!important}
    .brand{gap:14px}
    nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column!important;gap:0!important;padding:6px 24px 16px;border-bottom:1px solid #F0F0F0;box-shadow:0 8px 16px rgba(11,11,11,0.06);z-index:30}
    nav.open{display:flex}
    nav a{padding:12px 0;border-bottom:1px solid #F6F6F6;font-size:16px}
    .nav-toggle{display:block}
    .status{gap:10px}
    .mcp{display:none}
    .live{max-width:52vw;overflow:hidden}
    .live .num{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%;vertical-align:middle}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><a href="./index.html">margin.wiki</a></div>
      <nav>
        <a href="./index.html">Home</a>
        <a href="./sending-money.html" class="active">Sending money</a>
        <a href="./the-index.html">Countries</a>
        <a href="./machine-room.html">How it was built</a>
      </nav>
    </div>
    <div class="header-right">
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <div class="hero">
    <h1>What sending money really costs</h1>
  </div>
  <div class="job">For each route we track, every provider's all-in cost this hour, cheapest first.</div>

  <div class="corridor-picker" id="corridorPicker"></div>
  <div id="corridors"></div>

  <div class="findings" id="findings">
    <div class="findings-hdr" id="findingsHeading">&nbsp;</div>
    <div class="lede" id="findingsLede">&nbsp;</div>
    <div id="weekendIndex"></div>
    <div id="weekendChart"></div>
    <div id="patterns"></div>
    <div class="section-kicker" id="changesKicker">&nbsp;</div>
    <div id="priceChangeCards"></div>
    <div class="show-all-wrap" id="showAllWrap"></div>
  </div>
</div>

<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmt(n){ return n.toFixed(2)+'%'; }
  var AMOUNT_ORDER = ['200','1000','5000','25000','50000'];
  // Fixed, not alphabetical or however the API happens to order its keys --
  // SGD->PHP is the flagship corridor (the one measured longest, the one
  // the homepage's own finding leads with) and reads first every time.
  var ROUTE_ORDER = ['SGD->PHP', 'AUD->PHP', 'NZD->PHP', 'USD->MXN'];
  // The by-size curve only earns its place on USD->MXN: that is the one
  // corridor where the dollar route sometimes actually wins at some size
  // (the crossover the homepage finding is about). On the three PHP
  // corridors it never crosses, so the curve says the same "always more
  // expensive" at every point -- a chart with nothing to show.
  var CURVE_ROUTES = ['USD->MXN'];

  // ---- Cost-by-size curve: real, and deliberately bounded. -----------
  // samples.csv already carries a real cost figure (cost_bps_taker, the
  // stablecoin route all-in) and a real baseline (the cheapest ordinary
  // provider's own cost_bps) at five real measured sizes, $200 to $50,000.
  // Nothing here is modelled or extrapolated -- the curve stops exactly
  // where the measured fills stop. A $500k point would be invented; the
  // order books this site samples were never asked to fill one.
  var SIZE_TIERS = ['200', '1000', '5000', '25000', '50000'];
  function parseSamplesCSV(text) {
    var lines = text.split('\n');
    var header = lines[0].split(',');
    var idx = {};
    header.forEach(function(h, i){ idx[h] = i; });
    var byKey = {};
    for (var i = 1; i < lines.length; i++) {
      if (!lines[i]) continue;
      var cols = lines[i].split(',');
      var corridor = cols[idx.corridor], size = cols[idx.notional_src];
      if (!corridor || !size) continue;
      // File is chronological; later rows overwrite earlier ones for the
      // same (corridor, size), leaving the latest real reading.
      byKey[corridor + '|' + size] = {
        costBpsTaker: parseFloat(cols[idx.cost_bps_taker]),
        costBpsMaker: parseFloat(cols[idx.cost_bps_maker]),
        baselineProvider: cols[idx.baseline_provider],
        baselineCostBps: parseFloat(cols[idx.baseline_cost_bps]),
        cryptoWinsTaker: cols[idx.crypto_wins_taker] === 'True',
        cryptoWinsMaker: cols[idx.crypto_wins_maker] === 'True'
      };
    }
    return byKey;
  }

  function renderCostCurve(container, corridorKey, byKey) {
    var points = SIZE_TIERS.map(function(s){ return byKey[corridorKey + '|' + s]; });
    if (points.some(function(p){ return !p; })) {
      container.innerHTML = '<div style="font-size:13px;color:#9A9A9A;padding:16px 0">Not enough measured sizes for this corridor yet.</div>';
      return;
    }
    var w = 860, h = 220, padL = 24, padR = 90, padT = 16, padB = 30;
    var plotW = w - padL - padR, plotH = h - padT - padB;
    var allVals = points.map(function(p){ return p.costBpsTaker; })
      .concat(points.map(function(p){ return p.costBpsMaker; }))
      .concat(points.map(function(p){ return p.baselineCostBps; }));
    var maxV = Math.max.apply(null, allVals), minV = Math.min(0, Math.min.apply(null, allVals));
    var range = (maxV - minV) || 1;
    // Log-spaced x: sizes span 200 to 50,000, a 250x range -- linear
    // spacing would crush the first two points into the same pixel.
    var logSizes = SIZE_TIERS.map(function(s){ return Math.log10(+s); });
    var logMin = logSizes[0], logMax = logSizes[logSizes.length - 1];
    function xPos(i){ return padL + ((logSizes[i] - logMin) / (logMax - logMin)) * plotW; }
    function yPos(v){ return padT + (1 - (v - minV) / range) * plotH; }

    function pathFor(getVal) {
      return points.map(function(p, i){ return (i===0?'M':'L') + xPos(i).toFixed(1) + ',' + yPos(getVal(p)).toFixed(1); }).join(' ');
    }
    var takerPath = pathFor(function(p){ return p.costBpsTaker; });
    var makerPath = pathFor(function(p){ return p.costBpsMaker; });
    var basePath = pathFor(function(p){ return p.baselineCostBps; });
    var lastX = xPos(points.length - 1);

    // Same three colors and the same meaning as the round-trip chart on
    // corridor.html (--pos/--neg tokens): red = buying it now, gray =
    // waiting for your price, blue = the cheapest ordinary provider. One
    // color language across the site, not a new one per chart.
    var dots = points.map(function(p, i){
      return '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(p.costBpsTaker).toFixed(1)+'" r="3.5" fill="#817FCC"/>' +
        '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(p.costBpsMaker).toFixed(1)+'" r="3.5" fill="#6B6B6B"/>' +
        '<circle cx="'+xPos(i).toFixed(1)+'" cy="'+yPos(p.baselineCostBps).toFixed(1)+'" r="3.5" fill="#D3D0CB"/>';
    }).join('');
    var xLabels = points.map(function(p, i){
      return '<text x="'+xPos(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-family="Archivo, sans-serif" font-size="12" fill="#9A9A9A">'+esc(SIZE_TIERS[i].length>3 ? '$'+(+SIZE_TIERS[i]/1000)+'k' : '$'+SIZE_TIERS[i])+'</text>';
    }).join('');
    var yLabels = [minV, minV + range/2, maxV].map(function(v){
      var y = yPos(v);
      return '<text x="'+(plotW+padL+10)+'" y="'+(y+4).toFixed(1)+'" font-family="Archivo, sans-serif" font-size="12" fill="#9A9A9A">'+(v/100).toFixed(1)+'%</text>';
    }).join('');

    container.innerHTML =
      '<div style="display:flex;gap:18px;font-size:12px;flex-wrap:wrap;padding-bottom:6px">' +
      '<span style="color:#817FCC;font-weight:700">&#9679; buying it now</span>' +
      '<span style="color:#6B6B6B;font-weight:700">&#9679; waiting for your price</span>' +
      '<span style="color:#9A9A9A">&#9679; best fiat provider ('+esc(points[points.length-1].baselineProvider)+')</span></div>' +
      '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="display:block">' +
      '<path d="'+basePath+'" fill="none" stroke="#D3D0CB" stroke-width="1.5" stroke-dasharray="3,3"/>' +
      '<path d="'+makerPath+'" fill="none" stroke="#6B6B6B" stroke-width="2"/>' +
      '<path d="'+takerPath+'" fill="none" stroke="#817FCC" stroke-width="2"/>' +
      dots + yLabels + xLabels +
      '</svg>' +
      '<div style="font-size:12px;color:#9A9A9A;padding-top:4px">all-in cost, as a share of the amount, at each size actually measured -- stops at $50,000 because that is as far as real fills go; nothing past that point is estimated</div>';
  }

  // ---- Template substitution, same convention as findings.html's own T()
  // and corridor.html's -- a copy.json string with {name} placeholders,
  // filled with already-plain values. ----------------------------------
  function T(s, vals){
    var out = String(s||'');
    for (var k in vals) out = out.split('{' + k + '}').join(vals[k]);
    return out;
  }

  var COPY = {};

  Promise.all([
    fetch('./data/providers_latest.json', {cache:'no-store'}).then(r=>r.json()),
    fetch('./data/samples.csv', {cache:'no-store'}).then(r=>r.text()),
    fetch('./copy.json', {cache:'no-store'}).then(r=>r.json()).catch(function(){ return {}; })
  ]).then(function(res){
    var d = res[0];
    var samplesByKey = parseSamplesCSV(res[1]);
    COPY = res[2].sendingMoney || {};

    // Fixed order, real keys only -- a route in ROUTE_ORDER the API doesn't
    // currently have is dropped silently (nothing to show), never invented.
    var routeKeys = ROUTE_ORDER.filter(function(k){ return d.corridors[k]; });
    var container = document.getElementById('corridors');
    var picker = document.getElementById('corridorPicker');
    var current = routeKeys[0];
    var sizeByRoute = {};

    picker.innerHTML = routeKeys.map(function(k){
      return '<button class="route-pill'+(k===current?' on':'')+'" data-route="'+esc(k)+'">'+esc(d.corridors[k].route_words)+'</button>';
    }).join('');
    picker.querySelectorAll('.route-pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        current = btn.getAttribute('data-route');
        picker.querySelectorAll('.route-pill').forEach(function(b){ b.classList.toggle('on', b === btn); });
        show(current);
      });
    });

    var el = document.createElement('div');
    el.className = 'corridor';
    container.appendChild(el);

    function show(routeKey){
      renderCorridor(el, d.corridors[routeKey], sizeByRoute[routeKey] || '5000', routeKey, samplesByKey);
    }
    show(current);
    renderFindings();

    function renderCorridor(el, route, selectedSize, routeKey, samplesByKey){
      sizeByRoute[routeKey] = selectedSize;
      var size = route.sizes[selectedSize];
      var rows = size.rows.slice().sort(function(a,b){ return a.rank - b.rank; });
      var pillsHtml = AMOUNT_ORDER.filter(a => route.sizes[a]).map(function(a){
        var amt = route.sizes[a].amount_words;
        return '<button class="pill'+(a===selectedSize?' on':'')+'" data-amt="'+a+'">'+esc(amt)+'</button>';
      }).join('');
      var rowsHtml = rows.map(function(r){
        var isMissing = r.source === 'missing';
        var name = r.provider === 'Sending it with stablecoins' ? '<span style="color:#6B6B6B">'+esc(r.provider)+'</span>' : (r.rank===1 && !isMissing ? '<span style="font-weight:700">'+esc(r.provider)+'</span>' : esc(r.provider));
        // Every row says where its number came from -- a provider's own
        // quote, Wise's comparison feed, the stablecoin measurement,
        // or, when nothing came back this hour, that plainly too.
        var nameCell = '<div class="name-cell">'+name+'<span class="source-label">'+esc(r.source_words||'')+'</span></div>';
        var cost = isMissing ? 'no price this hour' : esc(r.costs);
        var pct = isMissing ? '—' : r.cost_pct.toFixed(2)+'%';
        return '<div class="prow'+(isMissing?' missing':'')+'">'+nameCell+'<div class="cost num">'+cost+'</div><div class="pct num">'+pct+'</div></div>';
      }).join('');
      var ownProviders = rows.filter(r => r.source === 'own').map(r => r.provider);
      var footnote = (ownProviders.length ? ownProviders.join(' and ') + ' quote their own prices; the rest come ' : 'Every price comes ') +
        'from a public comparison across providers; the dollar route is measured on real exchanges, all in.';
      var showCurve = CURVE_ROUTES.indexOf(routeKey) !== -1;
      // Phase 4 (FINAL spec): one plain sentence, computed from real
      // samples.csv counts (tools/emit_providers.py's crossover_stats),
      // saying when the stablecoin route -- waiting for its own price,
      // not paying whatever the market offers right now -- actually beats
      // the cheapest ordinary provider on this corridor. Never invented:
      // a corridor with a real zero win rate says so, plainly, instead of
      // manufacturing an exception.
      var co = route.crossover;
      var crossoverHtml = '';
      if (co) {
        var pct = Math.round(co.win_rate_pct);
        var sentence = pct > 0
          ? T(COPY.crossoverWinTemplate, { sendingWords: co.sending_words, pct: pct })
          : T(COPY.crossoverNeverTemplate, { sendingWords: co.sending_words });
        crossoverHtml =
          '<div class="crossover">' + esc(sentence) + '</div>' +
          '<div class="crossover-explain">' + esc(COPY.crossoverExplain || '') + '</div>';
      }
      el.innerHTML =
        '<div class="corridor-hdr"><div class="corridor-title">'+esc(route.route_words)+'</div>' +
        '<div class="pills">'+pillsHtml+'</div></div>' +
        crossoverHtml +
        '<div class="prow-hdr lbl"><div>SENDING '+esc(size.amount_words)+'</div><div style="text-align:right">ALL IN</div><div style="text-align:right">% OF AMOUNT</div></div>' +
        rowsHtml +
        '<div class="foot">'+esc(footnote)+'</div>' +
        (showCurve ?
          // This corridor is the one where waiting for your own price
          // sometimes actually wins (real, in data/samples.csv) -- the
          // by-size view earns its place here because there is a real
          // crossover to see, not on a corridor where the dollar route
          // never wins at any size.
          '<div style="margin-top:22px;font-size:15px;font-weight:700">By size, on this corridor</div>' +
          '<div id="curve-'+esc(routeKey)+'" style="padding-top:10px"></div>' : '');
      el.querySelectorAll('.pill').forEach(function(btn){
        btn.addEventListener('click', function(){ renderCorridor(el, route, btn.getAttribute('data-amt'), routeKey, samplesByKey); });
      });
      if (showCurve) renderCostCurve(document.getElementById('curve-'+routeKey), routeKey, samplesByKey);
    }

    // ==================================================================
    // Folded in from findings.html (Phase 4, FINAL spec): the weekend
    // penalty index, the per-corridor hike-rate chart built from the same
    // numbers, the "patterns, not one-offs" cards, and the day-by-day
    // price-change cards -- max 5 visible, the rest behind a "show all"
    // pill, same expander idiom as the site's other pickers/chips.
    // findings.html itself becomes a redirect stub to this page.
    // ==================================================================
    function renderFindings(){
    function renderWeekendChart(container, corridorRows){
      // corridorRows: [{routeWords, ratePct, hikeDays, totalSlots}], real
      // counts only -- no corridor with zero judged Saturdays is drawn.
      var rows = corridorRows.filter(function(r){ return r.totalSlots > 0; });
      if (!rows.length) { container.innerHTML = ''; return; }
      var w = 760, rowH = 34, padL = 4, padR = 54, top = 8;
      var h = top + rows.length * rowH + 8;
      var plotW = w - padL - padR;
      var maxRate = Math.max(10, Math.max.apply(null, rows.map(function(r){ return r.ratePct; })));
      var bars = rows.map(function(r, i){
        var y = top + i * rowH;
        var barW = (r.ratePct / maxRate) * plotW;
        return '<text x="'+padL+'" y="'+(y+14)+'" font-family="Archivo, sans-serif" font-size="13" fill="#0B0B0B">'+esc(r.routeWords)+'</text>' +
          '<rect x="'+padL+'" y="'+(y+18)+'" width="'+plotW+'" height="6" rx="3" fill="#F0F0F0"/>' +
          '<rect x="'+padL+'" y="'+(y+18)+'" width="'+Math.max(2, barW).toFixed(1)+'" height="6" rx="3" fill="#817FCC"/>' +
          '<text x="'+(padL+plotW+8)+'" y="'+(y+27)+'" font-family="Archivo, sans-serif" font-size="12" fill="#6B6B6B" class="num">'+r.ratePct.toFixed(1)+'%</text>';
      }).join('');
      container.innerHTML =
        '<svg width="100%" viewBox="0 0 '+w+' '+h+'" style="display:block">' + bars + '</svg>' +
        '<div style="font-size:12px;color:#9A9A9A;padding-top:6px">'+esc(COPY.weekendChartCaption||'')+'</div>';
    }

    fetch('./data/price_changes_latest.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(pc){
      document.getElementById('findingsHeading').textContent = COPY.findingsHeading || '';
      document.getElementById('findingsLede').textContent = COPY.findingsLede || '';

      var changes = pc.changes || [];

      // ---- The weekend penalty index, sitewide and per corridor --------
      var judged = pc.saturdays_judged || {};
      var totalSlots = 0, hikeDays = 0;
      var hikesByPair = {};
      var slotsByCorridor = {}, hikeDaysByCorridor = {};
      changes.filter(function(c){ return c.kind === 'weekend_up'; }).forEach(function(c){
        var key = c.provider + '|' + c.corridor;
        if (!hikesByPair[key]) hikesByPair[key] = { provider: c.provider, corridor: c.corridor, route_words: c.route_words, days: {}, moves: [] };
        hikesByPair[key].days[c.day] = true;
        hikesByPair[key].moves.push(c.move_pct);
      });
      Object.keys(judged).forEach(function(corridor){
        var route = d.corridors[corridor];
        if (!route) return;
        var providers = {};
        Object.keys(route.sizes).forEach(function(sz){
          route.sizes[sz].rows.forEach(function(r){ if (r.provider !== 'Sending it with stablecoins') providers[r.provider] = true; });
        });
        var slots = Object.keys(providers).length * judged[corridor];
        totalSlots += slots;
        slotsByCorridor[corridor] = slots;
      });
      Object.keys(hikesByPair).forEach(function(k){
        var n = Object.keys(hikesByPair[k].days).length;
        hikeDays += n;
        var c = hikesByPair[k].corridor;
        hikeDaysByCorridor[c] = (hikeDaysByCorridor[c] || 0) + n;
      });
      var allMoves = Object.keys(hikesByPair).reduce(function(a,k){ return a.concat(hikesByPair[k].moves); }, []);
      var avgMove = allMoves.length ? allMoves.reduce(function(a,b){return a+b;},0)/allMoves.length : 0;
      var offenders = Object.keys(hikesByPair).map(function(k){ return hikesByPair[k]; })
        .sort(function(a,b){ return Object.keys(b.days).length - Object.keys(a.days).length; });
      var rate = totalSlots ? (hikeDays / totalSlots * 100) : 0;

      if (totalSlots) {
        document.getElementById('weekendIndex').innerHTML =
          '<div class="section-kicker">'+esc(COPY.weekendTitle||'')+'</div>' +
          '<div style="font-size:20px;font-weight:800;letter-spacing:-0.01em;line-height:1.3">' + rate.toFixed(1) + '% of provider-Saturday combinations we\'ve watched show a price hike</div>' +
          '<div style="font-size:15px;color:#333;padding-top:8px;line-height:1.6">' + hikeDays + ' of ' + totalSlots + ' provider-Saturday observations, across every provider on every route this site tracks. Narrow, not industry-wide: ' +
          (offenders.length ? offenders.map(function(o){ return esc(o.provider) + ' on ' + esc(o.route_words); }).join(' and ') + ' account for all of it.' : 'nobody has done it more than once.') +
          ' When it happens, the average hike is <b class="num">' + avgMove.toFixed(2) + '%</b> of the amount.</div>' +
          '<div style="font-size:13px;color:#9A9A9A;padding-top:10px">measured, not assumed -- the stablecoin route this site also tracks doesn\'t close for the weekend, which is the actual argument for it</div>';

        var chartRows = Object.keys(slotsByCorridor).map(function(c){
          var slots = slotsByCorridor[c];
          var hikes = hikeDaysByCorridor[c] || 0;
          return { routeWords: (d.corridors[c]||{}).route_words || c, ratePct: slots ? hikes/slots*100 : 0, hikeDays: hikes, totalSlots: slots };
        }).sort(function(a,b){ return b.ratePct - a.ratePct; });
        renderWeekendChart(document.getElementById('weekendChart'), chartRows);
      }

      // ---- Patterns, not one-offs --------------------------------------
      var weekendUps = changes.filter(function(c){ return c.kind === 'weekend_up'; });
      var byProvider = {};
      weekendUps.forEach(function(c){
        var key = c.provider + '|' + c.corridor;
        if (!byProvider[key]) byProvider[key] = { provider: c.provider, corridor: c.corridor, route_words: c.route_words, days: {} };
        byProvider[key].days[c.day] = true;
      });
      var patterns = Object.keys(byProvider).map(function(k){
        var p = byProvider[k];
        p.dayCount = Object.keys(p.days).length;
        p.judged = (pc.saturdays_judged || {})[p.corridor] || p.dayCount;
        return p;
      }).filter(function(p){ return p.dayCount >= 2; })
        .sort(function(a,b){ return (b.dayCount/b.judged) - (a.dayCount/a.judged); });

      var weekdayUps = changes.filter(function(c){ return c.kind === 'change' && c.move_pct > 0; });
      var byFreq = {};
      weekdayUps.forEach(function(c){
        var key = c.provider + '|' + c.corridor;
        if (!byFreq[key]) byFreq[key] = { provider: c.provider, corridor: c.corridor, route_words: c.route_words, days: {} };
        byFreq[key].days[c.day] = true;
      });
      var freqRanked = Object.keys(byFreq).map(function(k){
        var p = byFreq[k]; p.dayCount = Object.keys(p.days).length; return p;
      }).filter(function(p){ return p.dayCount >= 5; })
        .sort(function(a,b){ return b.dayCount - a.dayCount; })
        .slice(0, 3);

      if (patterns.length || freqRanked.length) {
        document.getElementById('patterns').innerHTML =
          '<div class="section-kicker">'+esc(COPY.patternsTitle||'')+'</div>' +
          patterns.slice(0, 5).map(function(p){
            return '<div class="card"><div class="p">' +
              esc(p.provider) + ' has raised its weekend price on ' + esc(p.route_words) +
              ' on <b>' + p.dayCount + ' of the ' + p.judged + ' Saturdays</b> we\'ve watched that route.</div></div>';
          }).join('') +
          freqRanked.map(function(p){
            return '<div class="card"><div class="p">' +
              esc(p.provider) + ' has raised its price on ' + esc(p.route_words) +
              ' on <b>' + p.dayCount + ' separate days</b> since we started watching — not a one-off, a habit.</div></div>';
          }).join('');
      }

      // ---- Every change, day by day -- max 5, rest behind "show all" --
      document.getElementById('changesKicker').textContent = COPY.changesTitle || '';
      var seen = {};
      var dedup = [];
      changes.slice().sort((a,b)=> b.ts_utc.localeCompare(a.ts_utc) || (a.size==='5000'?-1:1))
        .forEach(function(c){
          var key = c.day+'|'+c.provider+'|'+c.corridor;
          if (!seen[key]) { seen[key] = true; dedup.push(c); }
        });

      function cardFor(c){
        var up = c.move_pct > 0;
        var sentence;
        if (c.kind === 'weekend_up') {
          sentence = esc(c.provider)+' raised its weekend price on '+esc(c.route_words)+
            ': sending '+esc(c.amount_words)+' now costs <b>'+fmt(c.new_cost_pct)+'</b> of the amount, up from '+fmt(c.old_cost_pct)+' on '+esc(c.weekday)+'.';
        } else if (c.kind === 'weekend_back') {
          sentence = esc(c.provider)+' dropped its price back down on '+esc(c.route_words)+
            ' after the weekend: sending '+esc(c.amount_words)+' now costs <b>'+fmt(c.new_cost_pct)+'</b>, down from '+fmt(c.old_cost_pct)+'.';
        } else {
          sentence = esc(c.provider)+' '+(up?'raised':'cut')+' its price on '+esc(c.route_words)+
            ': sending '+esc(c.amount_words)+' now costs <b>'+fmt(c.new_cost_pct)+'</b> of the amount, '+(up?'up':'down')+' from '+fmt(c.old_cost_pct)+' the day before.';
        }
        return '<div class="card"><div class="stamp">'+esc(c.day).toUpperCase()+'</div>' +
          '<div class="p">'+sentence+'</div>' +
          '<div class="receipt">from the daily provider panel, '+esc(c.n_agree)+' of '+esc(c.n_panel)+' readings agree</div></div>';
      }

      var cardsEl = document.getElementById('priceChangeCards');
      var wrapEl = document.getElementById('showAllWrap');
      var VISIBLE = 5;
      var expanded = false;

      function draw(){
        var shown = expanded ? dedup : dedup.slice(0, VISIBLE);
        cardsEl.innerHTML = shown.length ? shown.map(cardFor).join('')
          : '<div class="card"><div class="p">'+esc(COPY.noChanges||'')+'</div></div>';
        if (dedup.length > VISIBLE) {
          var label = expanded ? (COPY.showFewerLabel || '') : T(COPY.showAllTemplate || '', { n: dedup.length });
          wrapEl.innerHTML = '<button class="pill" id="showAllBtn">'+esc(label)+'</button>';
          document.getElementById('showAllBtn').addEventListener('click', function(){
            expanded = !expanded;
            draw();
          });
        } else {
          wrapEl.innerHTML = '';
        }
      }
      draw();
    }).catch(function(){
      document.getElementById('priceChangeCards').innerHTML = '<div class="card"><p style="color:#0B0B0B">Could not load findings data. That failure is shown, not hidden.</p></div>';
    });
    } // end renderFindings
  }).catch(function(){
    document.getElementById('corridors').innerHTML = '<div class="corridor"><p style="color:#0B0B0B">Could not load corridor data. That failure is shown, not hidden.</p></div>';
  });
})();
</script>

<script>
(function(){
  var btn = document.getElementById('navToggle');
  var nav = document.querySelector('header nav');
  if (btn && nav) {
    btn.addEventListener('click', function(){ nav.classList.toggle('open'); });
    document.addEventListener('click', function(e){
      if (nav.classList.contains('open') && !nav.contains(e.target) && e.target !== btn) nav.classList.remove('open');
    });
  }
})();
</script>
</body>
