<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>margin.wiki</title>
<link rel="stylesheet" href="./style.css">
<style>
  /* The Sources page. Layout from the owner's home and route references (SEB-240):
     header, h1 and one line, the big number, the stats row, chips, list rows, the
     square strip. Colours are the --dk-* tokens in style.css, fonts --font-data and
     --font-mono; no colour is written here. Every word is a key in copy.json
     (sourcesData) and an element whose key is empty is not rendered. */
  .s-wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px 96px; display: flex; flex-direction: column; gap: 56px; }
  .s-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--color-neutral-300); }
  .s-brand { display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px; }
  .s-logo { font-weight: 600; font-size: 18px; color: var(--color-ink); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
  .s-nav { display: flex; flex-wrap: wrap; gap: 0 22px; font-size: 15px; font-weight: 400; color: var(--color-neutral-600); overflow: visible; }
  .s-nav a { color: var(--color-neutral-600); text-decoration: none; font-weight: 400; display: inline-flex; align-items: center; min-height: 44px; }
  .s-nav a[aria-current] { color: var(--color-ink); font-weight: 400; }
  .s-asof { font-size: 13px; overflow-wrap: anywhere; }

  .s-hero { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-end; }
  .s-hero-text { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .s-hero-num { flex: 1 1 260px; display: flex; flex-direction: column; gap: 6px; }
  h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: 0; }
  h2 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.25; letter-spacing: 0; }
  p { margin: 0; }
  .s-lede { font-size: 17px; }
  .s-big { font-size: 88px; font-weight: 600; line-height: 1; color: var(--data-700); }
  .s-bigl { font-size: 15px; }

  .s-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px; background: var(--color-neutral-300); border: 1px solid var(--color-neutral-300); border-radius: 8px; overflow: hidden; margin-top: -24px; }
  .s-stat { background: var(--color-surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
  .s-stat .num { font-size: 24px; font-weight: 600; }
  .s-stat .lab { font-size: 14px; }

  .s-controls { display: flex; flex-direction: column; gap: 16px; }
  .s-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .s-chip { min-height: 44px; padding: 0 16px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--color-neutral-400); background: var(--color-surface); color: var(--color-neutral-700); }
  .s-chip.on { background: var(--color-ink); color: var(--color-bg); border-color: var(--color-ink); }
  .s-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .s-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; font-size: 12px; }
  .s-legend .head { font-size: 14px; }
  .s-key { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
  .s-count { font-size: 13px; }

  .s-sec { display: flex; flex-direction: column; gap: 16px; }
  .s-list { border-top: 1px solid var(--color-neutral-300); }
  .s-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px 32px; padding: 16px 0; border-bottom: 1px solid var(--color-neutral-300); font-size: 14px; }
  .s-info { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .s-id { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
  .s-kind { align-self: flex-start; font-size: 12px; color: var(--color-neutral-600); }
  .s-axis { display: flex; justify-content: space-between; gap: 16px; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--color-neutral-300); }
  .s-small { font-size: 13px; overflow-wrap: anywhere; }
  .s-stripcol { flex: 2 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .s-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(14px, 1fr)); gap: 3px; }
  .s-strip span { aspect-ratio: 1 / 1; border-radius: 3px; background: var(--grid-empty); }
  .s-strip .s-ans { background: var(--color-ink); }
  .s-strip .s-some { background: var(--data-500); }
  .s-strip .s-all { background: var(--data-700); }
  .s-strip .s-not { background: var(--grid-empty); }
  .sw.s-ans { background: var(--color-ink); }
  .sw.s-some { background: var(--data-500); }
  .sw.s-all { background: var(--data-700); }
  .sw.s-not { background: var(--grid-empty); }
  .s-ends { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
  .s-histcol { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .s-cur { flex: 1 1 100%; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .s-togs { display: flex; flex-wrap: wrap; gap: 8px; }
  .s-tog { min-height: 44px; padding: 0 16px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--color-neutral-400); background: var(--color-surface); color: var(--color-ink); }
  .s-codes { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
  .s-codes[hidden] { display: none; }
  .s-histcol code { font-family: var(--font-body); font-size: inherit; font-weight: 400; color: inherit; overflow-wrap: anywhere; }
  .s-fail { font-size: 15px; }

  [hidden] { display: none !important; }
  @media (max-width: 480px) {
    .s-wrap { padding: 0 16px 72px; gap: 40px; }
  }
  .s-row.s-target { box-shadow: 0 0 0 1px var(--data-700); }
</style>
<link rel="stylesheet" href="./css/site_head.css">
</head>
<body>
<div class="s-wrap">
  <header class="s-head">
    <div class="s-brand">
      <a class="s-logo mono" id="logo" href="./index.html" hidden></a>
      <nav class="s-nav" id="nav"></nav>
    </div>
    <span class="s-asof mono muted" id="asof" hidden></span>
  </header>

  <section class="s-hero hero bleed">
    <div class="s-hero-text">
      <h1 id="headline" hidden></h1>
      <p class="s-lede soft" id="lede" hidden></p>
    </div>
    <div class="s-hero-num">
      <span class="s-big mono" id="big"></span>
      <span class="s-bigl soft" id="bigl" hidden></span>
    </div>
  </section>

  <div class="s-stats" id="stats"></div>

  <section class="s-controls">
    <div class="s-chips" id="chips" role="group"></div>
    <div class="s-bar">
      <div class="s-legend soft" id="legend"></div>
      <span class="s-count mono muted" id="count" hidden></span>
    </div>
  </section>

  <section class="s-sec" id="liveSec">
    <h2 id="liveHead" hidden></h2>
    <div class="s-list" id="liveList"></div>
  </section>

  <section class="s-sec" id="histSec">
    <h2 id="histHead" hidden></h2>
    <div class="s-list" id="histList"></div>
  </section>
  <p class="s-fail soft" id="fail" hidden></p>
</div>
<script src="./js/sources_page.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/site_head.js"></script>
</body>
</html>
