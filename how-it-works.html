<script>
// Every sentence here is a key of copy.json's "howItWorks" block. Each figure is read from a file the site publishes, never typed:
//   sources         data/sources_daily.json   how many sources are read every hour
//   minAds          data/index_latest.json    min_buy_ads (the evidence rule)
//   country, rate   data/index_latest.json    the ranked country with the largest figure this hour (rate and street rounded to whole units, each with its currency)
//   amounts, cost   data/providers_latest.json  the quoted sizes, and the cheapest app for S$5,000 to the Philippines
// A sentence whose figure cannot be read is left out, not guessed.
function getJson(u){ return fetch(u, {cache:'no-store'}).then(function(r){ return r.json(); }).catch(function(){ return null; }); }
function fillCopy(tpl, vals){
  if (!tpl) return '';
  return tpl.split(/(?<=\.)\s+/).map(function(sent){
    var bad = false;
    var out = sent.replace(/\{(\w+)\}/g, function(m, k){ if (vals[k] == null || vals[k] === '') { bad = true; return m; } return vals[k]; });
    return bad ? '' : out;
  }).filter(Boolean).join(' ');
}
function setText(id, txt){ var el = document.getElementById(id); if (el) { el.textContent = txt; el.hidden = !txt; } }
function setLink(id, tpl, label, href){
  var el = document.getElementById(id); if (!el || !tpl) return;
  var parts = tpl.split('{link}');
  el.textContent = parts[0];
  var a = document.createElement('a'); a.href = href; a.textContent = label; el.appendChild(a);
  el.appendChild(document.createTextNode(parts[1] || ''));
}
function whole(n){ return Math.round(n).toLocaleString('en-US'); }

Promise.all([getJson('./copy.json'), getJson('./data/index_latest.json'), getJson('./data/providers_latest.json'), getJson('./data/sources_daily.json'), getJson('./data/heatmap_daily.json')]).then(function(res){
  var H = (res[0] && res[0].howItWorks) || {}, idx = res[1], prov = res[2], src = res[3], heat = res[4];
  var navEl = document.getElementById('nav');
  ((res[0] && res[0].nav) || []).forEach(function(n){
    var a = document.createElement('a'); a.className = 'hp-navlink' + (n.href === './how-it-works.html' ? ' on' : ''); a.href = n.href; a.textContent = n.label; navEl.appendChild(a);
  });
  document.title = 'margin.wiki: How it works';
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', H.pageDescription || '');
  var vals = {};
  // how many countries the site tracks: data/heatmap_daily.json countries_tracked, the count every page shares
  if (heat) { vals.n = heat.countries_tracked || null; }

  // the ranked country with the largest figure this hour, worked through; every figure rounded to whole units
  var ranked = ((idx && idx.countries) || []).filter(function(c){ return c.denominator_class !== 'unmaintained' && c.index_pct != null; });
  var top = ranked.length ? ranked.reduce(function(a, b){ return b.index_pct > a.index_pct ? b : a; }) : null;
  if (top) {
    vals.country = top.country;
    vals.unit = top.ccy;
    vals.rate = whole(top.fx_mid_per_usd);
    vals.street = whole(top.buy_price);
    vals.rate100 = whole(top.fx_mid_per_usd * 100);
    vals.street100 = whole(top.buy_price * 100);
    vals.pct = (Math.round(top.index_pct * 10) / 10).toFixed(1);
  }
  vals.routes = prov && prov.corridors ? Object.keys(prov.corridors).length || null : null;

  // the cost of sending S$5,000 to the Philippines this hour, and the amounts we price
  var cor = prov && prov.corridors && prov.corridors['SGD->PHP'], sizes = [];
  Object.keys((prov && prov.corridors) || {}).forEach(function(k){
    var ks = Object.keys(prov.corridors[k].sizes || {}).map(Number).sort(function(a, b){ return a - b; });
    if (ks.length > sizes.length) sizes = ks;
  });
  var and = H.listAnd || 'and', nums = sizes.map(function(n){ return n.toLocaleString('en-US'); });
  vals.amountList = nums.length ? (nums.length < 2 ? nums.join('') : nums.slice(0, -1).join(', ') + ' ' + and + ' ' + nums[nums.length - 1]) : null;
  // the cheapest APP: the stablecoin route is the first row when it wins, and it is not an app (source "measured")
  var five = cor && cor.sizes && cor.sizes['5000'], row = five && (five.rows || []).filter(function(r){ return r.source !== 'measured'; })[0];
  if (five && row && row.cost_pct >= 0) { vals.amount = five.amount_words; vals.cost = row.costs; vals.app = row.provider; }

  setText('hiwH1', H.h1 || '');
  setText('measureH2', H.measureTitle || '');
  setText('measureBody', fillCopy(H.measureBody, vals));
  setText('meaningH2', H.meaningTitle || '');
  setText('meaningBody', fillCopy(H.meaningBody, vals));
  setText('meaningZero', fillCopy(H.meaningZero, vals));
  setText('sourceH2', H.sourceTitle || '');
  setText('sourceBody', fillCopy(H.sourceBody, vals));
  setText('costH2', H.costTitle || '');
  setText('readLead4', fillCopy(H.readLead4, vals));
  setText('readBody4', fillCopy(H.readBody4, vals));
  setText('notMeasuredH2', H.leaveOutTitle || '');
  var list = document.getElementById('notMeasuredList');
  (H.notMeasured || []).forEach(function(t, i){
    var li = document.createElement('li'), label = (H.notMeasuredLabels || [])[i];
    if (label) { var b = document.createElement('b'); b.textContent = label; li.appendChild(b); li.appendChild(document.createTextNode(' ')); }
    li.appendChild(document.createTextNode(t));
    list.appendChild(li);
  });
  setText('checkH2', H.checkTitle || '');
  setText('checkLead', H.checkLead || '');
  setText('checkBody', H.checkBody || '');
  setLink('checkSources', H.checkSources, H.checkSourcesLink, './sources.html');
  // How it was built lives under How it works (1 Nov): the one place for how the numbers are made and how the site runs
  setText('builtH2', H.builtTitle || '');
  setText('builtLead', H.builtLead || '');
  setLink('builtLink', H.builtBody, H.builtLinkText, './how-it-was-built.html');
});
</script>

  <main class="hw-main">
    <section class="hw-hero" id="hiwIntro">
      <h1 id="hiwH1">How to read this site</h1>
    </section>

    <section class="hiw-section" id="measure">
      <h2 id="measureH2">What we measure</h2>
      <div class="p" id="measureBody">Every country has an official exchange rate. In some countries banks won’t sell dollars at that rate, or sell very few, so people buy them from each other and pay more. Every hour we check what people really pay for a dollar in 55 countries and compare it with the official rate.</div>
    </section>

    <section class="hiw-section" id="meaning">
      <h2 id="meaningH2">What the percentage means</h2>
      <div class="p" id="meaningBody">In Algeria, the official rate says a dollar costs 135 DZD. People actually pay 258 DZD. That’s 90.8% more, so Algeria shows +90.8%.</div>
      <div class="p" id="meaningZero">0% means people pay the official rate, and most countries are close to it. A minus means they pay a little less.</div>
    </section>

    <section class="hiw-section" id="source">
      <h2 id="sourceH2">Where the price comes from</h2>
      <div class="p" id="sourceBody">We get it from local exchanges first, then brokers, then people selling to each other on Binance and OKX. What they sell is mostly stablecoins, digital coins that are always worth one US dollar, so their price is the price of a dollar. If there aren’t enough prices in an hour, that country shows no price. We never guess.</div>
    </section>

    <section class="hiw-section" id="read-4">
      <h2 id="costH2">The cost of sending money</h2>
      <div class="lead-b" id="readLead4">On 11 routes we also check what it costs to send money abroad.</div>
      <div class="p" id="readBody4">We compare transfer apps with sending it by stablecoin. The cost is how much less the person receiving gets than at the official rate, with every fee we can see included. This hour, sending S$5,000 to the Philippines costs S$20.84 with Airwallex, the cheapest app. Where a fee can't be seen, the route says so.</div>
    </section>

    <section class="hiw-section" id="not-measured">
      <h2 id="notMeasuredH2">What our numbers leave out</h2>
      <ul class="plain-list" id="notMeasuredList"><li><b>A day behind.</b> The official rate updates only once a day. On days a currency moves fast, the gap we show can be a day behind.</li><li><b>Bank and wallet charges.</b> Money moves into an exchange and out again through a bank, a wallet or the exchange's local partner. Each has its own charge. Some show it as a fee, some bake it into the rate, some set it in a deal with the exchange. We can't see these, so they are left out.</li><li><b>First-transfer offers.</b> Some app prices are offers for a first transfer. Repeat customers pay more.</li><li><b>Cash comes from trackers.</b> Cash dollar prices come from public websites that track money changers, not from offers we read ourselves. Where we have one, the country page shows it beside the stablecoin price.</li></ul>
    </section>

    <section class="hiw-section" id="check">
      <h2 id="checkH2">How to check any number</h2>
      <div class="lead-b" id="checkLead">Each price on a country page links to the file it came from.</div>
      <div class="p" id="checkBody">A missed hour shows as a blank, never filled in.</div>
      <div class="p" id="checkSources">Every source, and every day it answered: <a href="./sources.html">Sources →</a></div>
    </section>

    <section class="hiw-section" id="built">
      <h2 id="builtH2">How the site is built and run</h2>
      <div class="lead-b" id="builtLead">Plain code collects every price and checks every number. AI only helps write some of the code.</div>
      <div class="p" id="builtLink">What it costs, what runs when, and everything that has broken: <a href="./how-it-was-built.html">How it was built →</a></div>
    </section>
  </main>
