<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<meta name="description" content=""/>
<link rel="stylesheet" href="./style.css">

<link rel="stylesheet" href="./css/site_page.css?v=1">
<style>
  /* How it works (SEB-271 layout rebuild to match the reference, wording
     unchanged -- replaces the SEB-240/SEB-226 card layout). No black band,
     no grey boxes: the hero sits on white like every other section, and
     every section below it is separated by a thin rule instead of a card.
     Colours are the --color-* tokens in style.css; the cycle-strip colours
     live in css/dkpanel.css (see the comment there). */
  {margin: 0;}
  .hw-wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 56px; }
  .hp-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--color-neutral-300); }
  .hp-headleft { display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px; }
  .hp-logo { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; font-size: 18px; color: var(--color-ink); text-decoration: none; }
  .hp-nav { display: flex; flex-wrap: wrap; gap: 0 22px; font-size: 15px; font-weight: 400; color: var(--color-neutral-600); }
  .hp-navlink { display: inline-flex; align-items: center; min-height: 44px; color: var(--color-neutral-600); text-decoration: none; }
  .hp-navlink.on { color: var(--color-ink); }
  .hw-main { display: flex; flex-direction: column; }
  .hw-hero { padding: 24px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .hw-main [hidden] { display: none; }
  h1, h2 {margin: 0;}
  .hw-main .lede {margin: 0;}
  .hw-main .p { margin: 0; font-size: 15px; color: var(--color-neutral-700); max-width: 680px; }
  .hw-main .lead-b { margin: 0; font-size: 17px; font-weight: 600; color: var(--color-ink); max-width: 680px; }
  .hw-main .lead-b:empty { display: none; }
  .hw-main .plain-list b { font-weight: 600; color: var(--color-ink); }
  .hw-main .plain-list { margin: 8px 0 0; padding: 0; list-style: none; font-size: 15px; color: var(--color-neutral-700); max-width: 680px; }
  .hw-main .plain-list:empty { display: none; }
  .hw-main .plain-list li { padding: 12px 0; border-top: 1px solid var(--color-neutral-300); }
  .hw-main .plain-list li:first-child { border-top: 0; }
  .hw-main a { color: var(--color-ink); text-underline-offset: 3px; }
  /* Every section (and the hourly-run block and the full method) is a plain
     region separated from the one above it by a thin rule, never a card. */
  .hiw-section { border-top: 1px solid var(--color-neutral-300); margin-top: 32px; padding-top: 24px; }
  .hiw-section { display: flex; flex-direction: column; gap: 4px; }
  .hw-rows { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-neutral-300); font-size: 15px; }
  .hw-rows:empty { display: none; }
  .hw-rows a { color: var(--color-neutral-700); text-decoration: none; }
  .hw-rows a:hover { color: var(--color-ink); }
  #hiwAnswer { max-width: 680px; margin-top: 8px; padding: 16px 20px; background: var(--color-surface); border: 1px solid var(--color-neutral-300); border-radius: 8px; font-size: 15px; line-height: 1.55; color: var(--color-ink); }
  .foot { font-size: 14px; color: var(--color-neutral-600); border-top: 1px solid var(--color-neutral-300); margin-top: 48px; padding-top: 20px; }
  @media (max-width: 620px) { .hw-wrap { padding: 0 16px 40px; } }
</style>

<body>
<div class="hw-wrap">
  <div class="hp-head"><div class="hp-headleft"><a class="hp-logo mono" href="./index.html">margin.wiki</a><nav class="hp-nav">
        <a class="hp-navlink" href="./countries.html">Countries</a>
        <a class="hp-navlink" href="./sending-money.html">Routes</a>
        <a class="hp-navlink" href="./sources.html">Sources</a>
        <a class="hp-navlink" href="./findings.html">Findings</a>
        <a class="hp-navlink on" href="./how-it-works.html">How it works</a>
      </nav></div></div>

  <main class="hw-main">
    <section class="hw-hero" id="hiwIntro">
      <h1 id="hiwH1"></h1>
      <div class="lead-b" id="hiwIntroLead"></div>
      <div class="p" id="hiwIntroP"></div>
    </section>

    <section class="hiw-section" id="percentage">
      <h2 id="pctH2"></h2>
      <div class="lead-b" id="pctLead"></div>
      <div class="p" id="pctBody"></div>
      <div class="p" id="pctZero"></div>
      <div class="p" id="pctOfficial"></div>
      <div class="p" id="pctStable"></div>
    </section>

    <section class="hiw-section" id="price-source">
      <h2 id="fromH2"></h2>
      <div class="lead-b" id="fromLead"></div>
      <div class="p" id="fromFirst"></div>
      <div class="p" id="fromThen"></div>
      <div class="p" id="fromNone"></div>
    </section>

    <section class="hiw-section" id="sending-cost">
      <h2 id="costH2"></h2>
      <div class="lead-b" id="costLead"></div>
      <div class="p" id="costBody"></div>
      <div class="p" id="costAmounts"></div>
    </section>

    <section class="hiw-section" id="not-measured">
      <h2 id="notMeasuredH2"></h2>
      <ul class="plain-list" id="notMeasuredList"></ul>
    </section>

    <section class="hiw-section" id="check">
      <h2 id="checkH2"></h2>
      <div class="lead-b" id="checkLead"></div>
      <div class="p" id="checkBody"></div>
      <div class="p" id="checkSources"></div>
    </section>
  </main>
</div>

<script>
// Every sentence here is a key of copy.json's "howItWorks" block. Each figure is read from a file the site publishes, never typed:
//   sources         data/sources_daily.json   how many sources are read every hour
//   minAds          data/index_latest.json    min_buy_ads (the evidence rule)
//   country, rate   data/index_latest.json    the ranked country with the largest figure this hour
//   amounts, cost   data/providers_latest.json  the quoted sizes, and the cheapest app for S$5,000 to the Philippines
// A sentence whose figure cannot be read is left out, not guessed.
function getJson(u){ return fetch(u, {cache:'no-store'}).then(function(r){ return r.json(); }).catch(function(){ return null; }); }
function fillCopy(tpl, vals){
  if (!tpl) return '';
  return tpl.split(/(?<=\.)\s+/).map(function(sent){
    var bad = false;
    var out = sent.replace(/\{(\w+)\}/g, function(m, k){ if (vals[k] == null || vals[k] === '') { bad = true; return m; } return vals[k]; });
    return bad ? '' : out;
  }).filter(Boolean).join(' ');
}
function setText(id, txt){ var el = document.getElementById(id); if (el) { el.textContent = txt; el.hidden = !txt; } }
function setLink(id, tpl, label, href){
  var el = document.getElementById(id); if (!el || !tpl) return;
  var parts = tpl.split('{link}');
  el.textContent = parts[0];
  var a = document.createElement('a'); a.href = href; a.textContent = label; el.appendChild(a);
  el.appendChild(document.createTextNode(parts[1] || ''));
}
function whole(n){ return Math.round(n).toLocaleString('en-US'); }

Promise.all([getJson('./copy.json'), getJson('./data/index_latest.json'), getJson('./data/providers_latest.json'), getJson('./data/sources_daily.json')]).then(function(res){
  var H = (res[0] && res[0].howItWorks) || {}, idx = res[1], prov = res[2], src = res[3];
  document.title = H.pageTitle || '';
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', H.pageDescription || '');
  var vals = { minAds: idx && idx.min_buy_ads != null ? idx.min_buy_ads : null };
  vals.sources = src && src.sources ? src.sources.filter(function(s){ return s.live; }).length || null : null;

  // the country with the largest ranked figure this hour, worked through
  var ranked = ((idx && idx.countries) || []).filter(function(c){ return c.denominator_class !== 'unmaintained' && c.index_pct != null; });
  var top = ranked.length ? ranked.reduce(function(a, b){ return b.index_pct > a.index_pct ? b : a; }) : null;
  if (top) {
    vals.country = top.country;
    vals.rate = whole(top.fx_mid_per_usd); vals.unit = top.ccy;
    vals.street = whole(top.buy_price) + ' ' + top.ccy;
    vals.pct = (Math.round(top.index_pct * 10) / 10).toFixed(1);
  }

  // the cost of sending S$5,000 to the Philippines this hour, and the amounts we price
  var cor = prov && prov.corridors && prov.corridors['SGD->PHP'], sizes = [];
  Object.keys((prov && prov.corridors) || {}).forEach(function(k){
    var ks = Object.keys(prov.corridors[k].sizes || {}).map(Number).sort(function(a, b){ return a - b; });
    if (ks.length > sizes.length) sizes = ks;
  });
  var and = H.listAnd || 'and', nums = sizes.map(function(n){ return n.toLocaleString('en-US'); });
  vals.amountList = nums.length ? (nums.length < 2 ? nums.join('') : nums.slice(0, -1).join(', ') + ' ' + and + ' ' + nums[nums.length - 1]) : null;
  var five = cor && cor.sizes && cor.sizes['5000'], row = five && five.rows && five.rows[0];
  if (five && row && row.cost_pct >= 0) { vals.amount = five.amount_words; vals.cost = row.costs; vals.app = row.provider; }

  setText('hiwH1', H.h1 || '');
  setText('hiwIntroLead', fillCopy(H.introLead, vals));
  setText('hiwIntroP', H.introRest || '');
  setText('pctH2', H.pctTitle || '');
  setText('pctLead', fillCopy(H.pctLead, vals));
  setText('pctBody', fillCopy(H.pctBody, vals));
  setText('pctZero', H.pctZero || '');
  setText('pctOfficial', H.pctOfficial || '');
  setText('pctStable', H.pctStable || '');
  setText('fromH2', H.fromTitle || '');
  setText('fromLead', H.fromLead || '');
  setText('fromFirst', fillCopy(H.fromFirst, vals));
  setText('fromThen', fillCopy(H.fromThen, vals));
  setText('fromNone', H.fromNone || '');
  setText('costH2', H.costTitle || '');
  setText('costLead', H.costLead || '');
  setText('costBody', fillCopy(H.costBody, vals));
  setText('costAmounts', fillCopy(H.costAmounts, vals));
  setText('notMeasuredH2', H.leaveOutTitle || '');
  var list = document.getElementById('notMeasuredList');
  (H.notMeasured || []).forEach(function(t, i){
    var li = document.createElement('li'), label = (H.notMeasuredLabels || [])[i];
    if (label) { var b = document.createElement('b'); b.textContent = label; li.appendChild(b); li.appendChild(document.createTextNode(' ')); }
    li.appendChild(document.createTextNode(t));
    list.appendChild(li);
  });
  setText('checkH2', H.checkTitle || '');
  setText('checkLead', H.checkLead || '');
  setText('checkBody', H.checkBody || '');
  setLink('checkSources', H.checkSources, H.checkSourcesLink, './sources.html');
});
</script>

<script>
(function(){
  var btn = document.getElementById('navToggle');
  var nav = document.querySelector('header nav');
  if (btn && nav) {
    btn.addEventListener('click', function(){ nav.classList.toggle('open'); });
    document.addEventListener('click', function(e){
      if (nav.classList.contains('open') && !nav.contains(e.target) && e.target !== btn) nav.classList.remove('open');
    });
  }
})();
</script>

<script src="./js/footer.js"></script>
<script src="./js/site_head.js?v=3"></script>
</body>
</html>
