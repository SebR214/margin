<style>
  /* How it works (SEB-271 layout rebuild to match the reference, wording
     unchanged -- replaces the SEB-240/SEB-226 card layout). No black band,
     no grey boxes: the hero sits on white like every other section, and
     every section below it is separated by a thin rule instead of a card.
     Colours are the --color-* tokens in style.css; the cycle-strip colours
     live in css/dkpanel.css (see the comment there). */
  { margin: 0; }
  .hw-wrap { max-width: 760px; margin: 0 auto; padding: 0 24px 56px; }
  .hp-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--color-neutral-300); }
  .hp-headleft { display: flex; flex-wrap: wrap; align-items: center; gap: 0 28px; }
  .hp-logo { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; font-size: 18px; color: var(--color-ink); text-decoration: none; }
  .hp-nav { display: flex; flex-wrap: wrap; gap: 0 22px; font-size: 15px; font-weight: 400; color: var(--color-neutral-600); }
  .hp-navlink { display: inline-flex; align-items: center; min-height: 44px; color: var(--color-neutral-600); text-decoration: none; }
  .hp-navlink.on { color: var(--color-ink); }
  .hw-main { display: flex; flex-direction: column; }
  .hw-hero { padding: 24px 0 0; display: flex; flex-direction: column; gap: 8px; }
  .hw-main [hidden] { display: none; }
  h1, h2 { margin: 0; font-weight: 600; letter-spacing: 0; text-transform: none; }
  h1 { font-size: 24px; line-height: 1.2; }
  h2 { font-size: 20px; line-height: 1.25; }
  .hw-main .lede { margin: 0; font-size: 17px; color: var(--color-neutral-600); }
  .hw-main .p { margin: 0; font-size: 15px; color: var(--color-neutral-700); max-width: 680px; }
  .hw-main .plain-list { margin: 8px 0 0; padding: 0; list-style: none; font-size: 15px; color: var(--color-neutral-700); max-width: 680px; }
  .hw-main .plain-list:empty { display: none; }
  .hw-main .plain-list li { padding: 12px 0; border-top: 1px solid var(--color-neutral-300); }
  .hw-main .plain-list li:first-child { border-top: 0; }
  .hw-main a { color: var(--color-ink); text-decoration: underline; text-underline-offset: 3px; }
  /* Every section (and the hourly-run block and the full method) is a plain
     region separated from the one above it by a thin rule, never a card. */
  .hiw-section, #cycleBlock, .full-method { border-top: 1px solid var(--color-neutral-300); margin-top: 32px; padding-top: 24px; }
  .hiw-section { display: flex; flex-direction: column; gap: 4px; }
  .hw-rows { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--color-neutral-300); font-size: 15px; }
  .hw-rows:empty { display: none; }
  .hw-rows a { color: var(--color-neutral-700); text-decoration: none; }
  .hw-rows a:hover { color: var(--color-ink); text-decoration: underline; }
  .full-method > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-size: 15px; font-weight: 600; color: var(--color-ink); }
  .full-method > div { display: flex; flex-direction: column; gap: 16px; padding-top: 12px; }
  .full-method .kicker { font-size: 13px; color: var(--color-neutral-600); }
  .full-method .h { font-size: 18px; font-weight: 600; color: var(--color-ink); }
  .ask { display: flex; gap: 8px; max-width: 680px; }
  .ask input { flex: 1; min-width: 0; min-height: 44px; padding: 0 14px; background: var(--color-bg); color: var(--color-ink); border: 1px solid var(--color-neutral-400); border-radius: 6px; font: inherit; font-weight: 400; }
  .ask button { min-width: 44px; min-height: 44px; background: var(--color-ink); color: var(--color-bg); border: 0; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .askNote { font-size: 13px; color: var(--color-neutral-600); max-width: 680px; }
  #hiwAnswer { max-width: 680px; margin-top: 8px; padding: 16px 20px; background: var(--color-surface); border: 1px solid var(--color-neutral-300); border-radius: 8px; font-size: 15px; line-height: 1.55; color: var(--color-ink); }
  .foot { font-size: 14px; color: var(--color-neutral-600); border-top: 1px solid var(--color-neutral-300); margin-top: 48px; padding-top: 20px; }
  @media (max-width: 620px) { .hw-wrap { padding: 0 16px 40px; } }

    <!-- "How fast does the street react?" taken off the site 2026-09-27
         alongside countries.html's #reaction section -- see the HTML
         comment there for the verified reason (the official rate this
         method treats as a "step" only ever moves once a day, at a fixed
         refresh time, so "reaction time" was measuring how soon the next
         hourly street-price poll happens to land after that known daily
         refresh, not a real market response). Left in place, commented
         out, pending an hourly-updating official rate. -->
    <!--
    <div class="h" id="reaction-speed">How fast does the street react?</div>
    <div class="p">When the official rate moves, the street price does not follow instantly. <a href="./countries.html#reaction">The countries page</a> now measures the gap between the two, in hours, country by country.</div>
    <div class="p">There is no ready-made hourly history file for this. Each country's history array is daily, going back to 2024, and only carries the premium, not a separate official-rate series. The one place both series exist hour by hour is git itself: since per-country files started (10 September 2026), a scheduled job commits every country's JSON once an hour, and <span style="font-family:monospace">tools/emit_response_time.py</span> replays those commits back into a time series. That also sets a hard ceiling: only as much hourly history exists as days have passed since 10 September 2026, no matter what any other date on the site implies.</div>
    <div class="p" id="reactionMethodP">Loading the current thresholds&hellip;</div>
    <div class="p">The method is an event study, not a correlation, because the official rate in this data does not drift continuously — it holds flat for hours at a time, then steps, because its upstream source only refreshes periodically. For each detected step: take the median premium over the six hours before it as a baseline (what the premium looked like before the move), then walk forward hour by hour until the premium has closed most of the gap the step opened (the exact share and search window are the two figures in the paragraph above). That hour, minus the step's hour, is the reaction time for that one event. A country's headline number is the median across every event it had that resolved, capped at the next detected step so one event's recovery can't be mistaken for another's.</div>
    <div class="p">A country is only published if it has at least 12.5 days of continuous hourly history (of the ~17 available market-wide as of this writing) and at least one event that actually resolved. Below that, it is left out with a reason, the same as any other "not enough data" gap on this site — never a guessed or averaged-in number.</div>
    <div class="p" id="reactionFindingP">Loading the real numbers&hellip;</div>
    <div class="p"><a href="./data/response_time_latest.json">The full per-country output, every detected event, every resolved and unresolved one →</a></div>
    -->

    </div>

<script>
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Every sentence here is a template in copy.json's "howItWorks" block.
// Each figure is read from a file the site already publishes, never typed:
//   minAds     data/index_latest.json  min_buy_ads (the evidence rule)
//   amounts    data/providers_latest.json  the quoted sizes per corridor
//   n, top     data/sources_latest.json "Order books" countries, then each
//              of those data/countries/<CCY>.json "venues" lists
//   ownWord    data/providers_latest.json count of providers whose rows have
//              source "own" (their names appear only in the provider tables)
// A sentence whose figure cannot be read is left out, not guessed.
function getJson(u){ return fetch(u, {cache:'no-store'}).then(function(r){ return r.json(); }).catch(function(){ return null; }); }
var NUM_WORDS = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
function numWord(n){ return NUM_WORDS[n] != null ? NUM_WORDS[n] : String(n); }
// Every reader-facing word on this page, including the loading, failure and
// ask-box sentences, is a key of copy.json's "howItWorks" block (HIW).
var HIW = {};
var copyP = getJson('./copy.json').then(function(c){ HIW = (c && c.howItWorks) || {}; return HIW; });
// Fill {placeholders} in a template. A missing key or value leaves nothing.
// In an html context the values arrive already escaped.
function fillTpl(tpl, vals){ return (tpl || '').replace(/\{(\w+)\}/g, function(m, k){ return vals && vals[k] != null ? vals[k] : ''; }); }
function joinNames(a){ return a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' ' + HIW.listAnd + ' ' + a[a.length - 1]; }
// Fill {placeholders}; drop any sentence that still has an unfilled one.
function fillCopy(tpl, vals){
  if (!tpl) return '';
  return tpl.split(/(?<=\.)\s+/).map(function(sent){
    var bad = false;
    var out = sent.replace(/\{(\w+)\}/g, function(m, k){ if (vals[k] == null || vals[k] === '') { bad = true; return m; } return vals[k]; });
    return bad ? '' : out;
  }).filter(Boolean).join(' ');
}
// Fill each template and render the survivors as list items.
function setList(id, items, vals){
  var ul = document.getElementById(id); if (!ul) return;
  ul.textContent = '';
  (items || []).forEach(function(t){
    var f = fillCopy(t, vals); if (!f) return;
    var li = document.createElement('li'); li.textContent = f; ul.appendChild(li);
  });
}
function setText(id, txt){ var el = document.getElementById(id); if (el) { el.textContent = txt; el.hidden = !txt; } }

// The page's own fixed text, set as soon as the copy arrives.
copyP.then(function(h){
  document.title = h.pageTitle || '';
  var md = document.querySelector('meta[name="description"]');
  if (md) md.setAttribute('content', h.pageDescription || '');
  setText('methodSummary', h.methodSummary || '');
  setText('methodKicker', h.methodKicker || '');
  setText('methodLede', h.methodLede || '');
  setText('methodMadeTitle', h.methodMadeTitle || '');
  setText('thresholdP', h.thresholdLoading || '');
  setText('methodLink', h.methodLink || '');
  setText('askNote', h.askNote || '');
  var ai = document.getElementById('hiwAskInput'); if (ai) ai.placeholder = h.askPlaceholder || '';
  var ab = document.getElementById('hiwAskBtn'); if (ab) ab.setAttribute('aria-label', h.askLabel || '');
});

Promise.all([
  copyP,
  getJson('./data/index_latest.json'),
  getJson('./data/providers_latest.json'),
  getJson('./data/sources_latest.json')
]).then(function(res){
  var hiw = res[0] || {};
  var idx = res[1], prov = res[2], src = res[3];
  var minAds = idx && idx.min_buy_ads != null ? idx.min_buy_ads : null;

  var sizes = [], own = {};
  Object.keys((prov && prov.corridors) || {}).forEach(function(k){
    var szs = prov.corridors[k].sizes || {};
    var ks = Object.keys(szs);
    if (ks.length > sizes.length) sizes = ks.map(Number).sort(function(a, b){ return a - b; });
    ks.forEach(function(z){ (szs[z].rows || []).forEach(function(r){ if (r.source === 'own') own[r.provider] = 1; }); });
  });
  var vals = {
    minAds: minAds,
    amounts: sizes.length ? numWord(sizes.length) : null,
    minAmount: sizes.length ? sizes[0].toLocaleString('en-US') : null,
    maxAmount: sizes.length ? sizes[sizes.length - 1].toLocaleString('en-US') : null,
    amountList: sizes.length ? joinNames(sizes.map(function(n){ return n.toLocaleString('en-US'); })) : null,
    ownWord: Object.keys(own).length ? numWord(Object.keys(own).length) : null
  };

  setText('hiwH1', hiw.h1 || '');
  setText('hiwSub', hiw.sub || '');
  setList('hiwSubList', hiw.subPoints, vals);
  setText('hiwSubNote', hiw.subNote || '');
  setText('dollarCostH2', hiw.dollarCostTitle || '');
  setText('dollarCostP', fillCopy(hiw.dollarCostLead, vals));
  setList('dollarCostList', hiw.dollarCostPoints, vals);
  setText('sendingCostH2', hiw.sendingCostTitle || '');
  setText('sendingCostP', fillCopy(hiw.sendingCostLead, vals));
  setText('sendingCostAmounts', fillCopy(hiw.sendingCostAmounts, vals));
  setList('sendingCostList', hiw.sendingCostPoints, vals);
  setText('methodMadeP', fillCopy(hiw.methodMadeBody, vals));
  setText('notMeasuredH2', hiw.notMeasuredTitle || '');
  setText('sourcesH2', hiw.sourcesTitle || '');
  var list = document.getElementById('notMeasuredList');
  (hiw.notMeasured || []).forEach(function(t){ var li = document.createElement('li'); li.textContent = t; list.appendChild(li); });
  var note = document.getElementById('notMeasuredNote');
  var parts = (hiw.notMeasuredNote || '').split('{fullMethodLink}');
  note.appendChild(document.createTextNode(parts[0]));
  var a = document.createElement('a');
  a.href = '#full-method'; a.style.cssText = 'font-weight:600;color:var(--color-ink)';
  a.textContent = hiw.fullMethodLink || '';
  note.appendChild(a);
  if (parts[1]) note.appendChild(document.createTextNode(parts[1]));

  // Local exchanges: the venues named in each order-book country's own file,
  // folded to one name per exchange (IndependentReserve prices AUD, NZD and
  // SGD under three labels), ranked by how many countries each one prices.
  var ob = ((src && src.sources) || []).filter(function(s){ return s.name === 'Order books'; })[0];
  var ccys = (ob && ob.countries) || [];
  Promise.all(ccys.map(function(c){ return getJson('./data/countries/' + c + '.json'); })).then(function(files){
    var cover = {};
    files.forEach(function(f){
      var seen = {};
      ((f && f.venues) || []).forEach(function(v){ seen[String(v.venue).replace(/\s*\([^)]*\)\s*$/, '')] = 1; });
      Object.keys(seen).forEach(function(v){ cover[v] = (cover[v] || 0) + 1; });
    });
    var names = Object.keys(cover).sort(function(x, y){ return cover[y] - cover[x] || x.localeCompare(y); });
    vals.n = names.length || null;
    // Every other price source the file lists (the parallel-dollar markets) follows the exchanges.
    ((src && src.sources) || []).forEach(function(s){
      if (/parallel-dollar/.test(s.detail || '') && names.indexOf(s.name) < 0) names.push(s.name);
    });
    vals.top = names.length ? names.map(function(n){ return (hiw.venueNames || {})[n] || n; }).join(', ') : null;
    setList('sourcesList', hiw.sourcesPoints, vals);
    // Each source named above is also a row that opens its entry on the sources page.
    var rowsBox = document.getElementById('sourceRows');
    if (rowsBox) {
      rowsBox.textContent = '';
      var mainSrc = ((src && src.sources) || []).filter(function(x){ return /main source/.test(x.detail || ''); }).map(function(x){ return x.name; });
      mainSrc.concat(names).forEach(function(n){
        var a = document.createElement('a');
        a.classList.add('hw-row', 'mono');
        a.href = './sources.html#s-' + String(n).toLowerCase().replace(/[^a-z0-9]/g, '');
        a.textContent = (hiw.venueNames || {})[n] || n;
        rowsBox.appendChild(a);
      });
    }
  });
}).catch(function(){});

Promise.all([copyP, fetch('./data/index_latest.json', {cache:'no-store'}).then(r=>r.json())]).then(function(res){
  var d = res[1];
  var hourUtc = (d.as_of_utc||d.computed_at||'').replace('T',' ').slice(0,16);
  // Same figure the homepage binds its hero line to (countries.length +
  // withheld.length) -- these were two separately typed numbers for the
  // same fact on different pages (59 here, 60 there) until now. The mockup
  // rebuild dropped the hero's own "Loading… countries" sentence, but this
  // element is guarded rather than removed outright in case a future
  // section wants it again.
  var introCountEl = document.getElementById('introCountryCount');
  if (introCountEl) introCountEl.textContent = (d.countries||[]).length + (d.withheld||[]).length + (d.unverified||[]).length;
  document.getElementById('thresholdP').textContent =
    fillTpl(HIW.thresholdCounts, { priced: (d.countries||[]).length, notPriced: (d.withheld||[]).length + (d.unverified||[]).length });

}).catch(function(){});

// Section commented out above 2026-09-27 -- guard stops this fetch from
// running against elements that no longer exist.
if (document.getElementById('reactionMethodP')) {
copyP.then(function(){ return fetch('./data/response_time_latest.json', {cache:'no-store'}).then(function(r){ return r.json(); }); }).then(function(d){
  document.getElementById('reactionMethodP').innerHTML =
    fillTpl(HIW.reactionCounts, { qualified: d.n_countries_qualified, total: d.n_countries_total, hours: d.min_hours_required }) + ' ' +
    fillTpl(HIW.reactionStep, { threshold: d.event_threshold_pct, closed: Math.round((1 - d.reversion_fraction) * 100), days: Math.round(d.max_window_hours / 24) });
  var r = d.premium_lag_correlation;
  document.getElementById('reactionFindingP').innerHTML =
    fillTpl(HIW.reactionFindingLead, { relation: r == null ? fillTpl(HIW.reactionRelationNone) : fillTpl(HIW.reactionRelationWeak, { r: r.toFixed(2) }) }) + ' ' +
    fillTpl(HIW.reactionFindingBody, { ccy: 'DZD', countriesPage: '<a href="./countries.html#reaction">' + esc(HIW.reactionCountriesLink || '') + '</a>' });
}).catch(function(){
  document.getElementById('reactionMethodP').textContent = HIW.reactionMethodFail || '';
  document.getElementById('reactionFindingP').textContent = HIW.reactionFindingFail || '';
});
}

// ---- The "how was it made" ask box: same real backend as Home's, not a
// decoration. Answer shown as a plain sentence; the SQL that produced it is
// available on click rather than dumped inline -- shown by default, it read
// as unexplained code (real feedback: "the thing is a chat interface? ...
// not clearly thought out"), when the plain sentence is the actual answer.
(function(){
  // A4: this box's own placeholder invites "how any number was made" --
  // spec-cited failure was this exact box refusing that exact question.
  // Everything methodology-shaped answers from prose here, and never
  // reaches SQL. window.hiwByCcy is set once the index data loads below
  // (see the other script block on this page).
  var API_BASE = location.hostname.endsWith("margin.wiki")
    ? "https://api.margin.wiki" : "http://127.0.0.1:8901";
  var input = document.getElementById('hiwAskInput');
  var btn = document.getElementById('hiwAskBtn');
  var box = document.getElementById('hiwAnswer');
  if (!input || !btn) return;

  function show(html) { box.innerHTML = html; box.style.display = 'block'; }

  // See the identical comment in index.html -- deliberately loose so the
  // page's own placeholder ("Ask the agent how any number was made")
  // reliably matches; a stricter pattern missed it.
  var METHOD_RE = /\bhow\b.*\b(made|calculat|comput|built|measur|works?)\b|methodolog/i;

  function methodologyAnswer(q){
    var tracked = window.hiwTrackedByName || {};
    var lower = ' ' + q.toLowerCase().replace(/[^a-z\s]/g, ' ') + ' ';
    var mentioned = Object.keys(tracked).filter(function(n){ return lower.indexOf(' ' + n + ' ') !== -1; });
    if (mentioned.length) {
      var c = tracked[mentioned[0]];
      show(fillTpl(HIW.askMethodTracked, { evidence: esc(c.evidence_words), source: esc(c.source_words) }) +
        '<div style="margin-top:10px;font-size:14px"><a href="./country.html?ccy=' + esc(c.ccy) + '" style="font-weight:600;color:var(--color-ink)">' + fillTpl(HIW.askReceiptLink, { country: esc(c.country) }) + '</a></div>');
    } else {
      show(esc(HIW.askMethodGeneric || '') +
        '<div style="margin-top:10px;font-size:14px"><a href="./countries.html" style="font-weight:600;color:var(--color-ink)">' + esc(HIW.askIndexLink || '') + '</a></div>');
    }
  }

  // A2: this box had no failure floor at all -- a genuine miss bare-
  // refused, caught by the golden set (tools/check_ask.py) the moment it
  // ran. Same rule as Home's ask box: name what was understood, give a
  // real link, never a bare string.
  var worldNames = {};
  try {
    var dn = new Intl.DisplayNames(['en'], { type: 'region' });
    for (var a = 65; a <= 90; a++) for (var b = 65; b <= 90; b++) {
      var code = String.fromCharCode(a) + String.fromCharCode(b);
      var nm = dn.of(code);
      if (nm && nm !== code) worldNames[nm.toLowerCase()] = nm;
    }
  } catch (e) { /* falls through to the generic floor below */ }

  function diagnose(q){
    var tracked = window.hiwTrackedByName || {};
    var lower = ' ' + q.toLowerCase().replace(/[^a-z\s]/g, ' ') + ' ';
    var mentionedTracked = Object.keys(tracked).filter(function(n){ return lower.indexOf(' ' + n + ' ') !== -1; });
    var mentionedWorld = Object.keys(worldNames).filter(function(n){ return lower.indexOf(' ' + n + ' ') !== -1; });
    var untracked = mentionedWorld.filter(function(n){ return !tracked[n]; });
    var allLink = '<a href="./countries.html" style="font-weight:600;color:var(--color-ink)">' + esc(HIW.askAllCountriesLink || '') + '</a>';
    if (untracked.length) {
      return fillTpl(HIW.askUntracked, { country: esc(worldNames[untracked[0]]), link: allLink });
    }
    if (mentionedTracked.length) {
      var c = tracked[mentionedTracked[0]];
      return fillTpl(HIW.askTracked, { country: esc(c.country), link: '<a href="./country.html?ccy=' + esc(c.ccy) + '" style="font-weight:600;color:var(--color-ink)">' + fillTpl(HIW.askTrackedLink, { country: esc(c.country) }) + '</a>' });
    }
    return fillTpl(HIW.askUnparsed, { link: allLink });
  }

  function submit(){
    var q = (input.value || '').trim();
    if (!q) return;
    // Anything methodology-shaped answers from prose -- this page's whole
    // premise is "how it works", so free-form SQL is never the right tool
    // for that shape of question, only for a genuinely open data question.
    if (METHOD_RE.test(q)) { methodologyAnswer(q); return; }
    show('<span style="color:var(--color-neutral-600)">' + esc(HIW.askWaiting || '') + '</span>');
    fetch(API_BASE + '/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q})
    }).then(function(r){ return r.json().then(function(body){ return {ok: r.ok, body: body}; }); })
      .then(function(res){
        if (!res.ok || res.body.error) {
          var err = String(res.body.error || '');
          var isRateLimit = /enough questions|reachable|budget/i.test(err);
          show(isRateLimit ? esc(err) : diagnose(q));
          return;
        }
        var sentence = esc(res.body.sentence || HIW.askNoAnswer || '');
        var sqlId = 'sql' + Math.random().toString(36).slice(2,8);
        var html = '<div>' + sentence + '</div>';
        if (res.body.sql) {
          html += '<div style="margin-top:10px"><a href="#" id="' + sqlId + '-toggle" style="font-size:14px;color:var(--color-neutral-600);font-weight:600">' + esc(HIW.askSqlLink || '') + '</a>' +
            '<div id="' + sqlId + '" style="display:none;margin-top:6px;font-size:14px;color:var(--color-neutral-600);font-family:ui-monospace,monospace;word-break:break-all">' + esc(res.body.sql) + '</div></div>';
        }
        show(html);
        var toggle = document.getElementById(sqlId + '-toggle');
        if (toggle) toggle.addEventListener('click', function(e){
          e.preventDefault();
          var sqlBox = document.getElementById(sqlId);
          sqlBox.style.display = sqlBox.style.display === 'none' ? 'block' : 'none';
        });
      })
      .catch(function(){
        show(esc(HIW.askUnreachable || ''));
      });
  }
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
})();
</script>
