<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>margin.wiki — the machine room</title>
<meta name="description" content="What the site is checking this hour, and what the programs building this site are doing, unedited, as it happens."/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
  :root{ --ink:#0B0B0B; --sub:#6B6B6B; --stamp:#9A9A9A; --indigo:#817FCC; --rule:#F0F0F0;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px) }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Archivo',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);background:#fff}
  a{color:var(--ink);text-decoration:none} a:hover{color:var(--indigo)}
  .num{font-variant-numeric:tabular-nums}
  .lbl{font-size:11px;letter-spacing:.1em;color:#6B6B6B;font-weight:600}
  .stamp{font-size:11px;color:var(--stamp);letter-spacing:.06em}
  .log{font-size:13px;padding:7px 0;border-bottom:1px solid #F6F6F6;display:flex;gap:12px;align-items:baseline}
  .log>div{min-width:0;overflow-wrap:anywhere}
  .log>div:last-child{flex-grow:1}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 0;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:40px;flex-wrap:wrap;min-width:0}
  .logo{font-size:19px;font-weight:800;letter-spacing:-0.02em;flex:none}
  nav{display:flex;gap:28px;font-size:15px;font-weight:500;color:#333;flex-wrap:wrap;min-width:0}
  nav a.active{color:var(--ink);font-weight:700}
  .live{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:#6B6B6B}
  .header-right{display:flex;align-items:center;gap:16px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--indigo)}
  .dot.off{background:#9A9A9A}
  /* Also drops style.css's shared black .hero band/white text -- this page
     never used it, so neutralize what leaks in now that it links style.css. */
  .hero{padding:44px 0 0;display:flex;flex-direction:column;gap:10px;background:none;color:var(--ink)}
  .hero h1{color:var(--ink)}
  h1{font-size:28px;font-weight:800;letter-spacing:-0.02em;margin:0}
  .lede{max-width:840px;font-size:16px;color:#6B6B6B;line-height:1.5}
  .meta{font-size:13px;color:#9A9A9A;letter-spacing:.02em;display:flex;align-items:center;gap:8px;margin:2px 0 0}
  .stack{display:flex;flex-direction:column;gap:44px;padding:36px 0 64px}
  .col-hdr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;border-bottom:1px solid #0B0B0B;padding-bottom:8px}
  .col-title{font-size:16px;font-weight:700}
  .feed{}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0}
  .stats>div{padding:14px 14px 14px 0}
  .stats>div+div{padding-left:14px;border-left:1px solid var(--rule)}
  .stats .v{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
  .empty{padding:20px 0;color:#9A9A9A;font-size:13px}
  .feed-note{font-size:12px;color:#9A9A9A;padding:14px 0 0}
  section{border-top:1px solid var(--rule);padding-top:0}
  h2{font-size:21px;line-height:1.3;margin:0 0 6px;font-weight:700}
  .answer{font-size:16px;color:#6B6B6B;margin:0 0 22px;max-width:760px}
  .kv{list-style:none;margin:0;padding:0}
  .kv li{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--rule);font-size:15px}
  .kv li:first-child{border-top:0}
  .kv li b{font-weight:700}
  .kv li span{color:#6B6B6B}
  .arow{list-style:none;margin:0;padding:0}
  .arow li{display:grid;grid-template-columns:110px 150px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--rule);font-size:15px;align-items:baseline}
  .arow li:first-child{border-top:0}
  .arow b{font-weight:700}
  .arow .when{white-space:nowrap;font-size:13px;color:var(--indigo);font-weight:700;letter-spacing:.02em}
  .arow .txt{color:#6B6B6B}
  .list{margin:0;padding:0;list-style:none}
  .list li{padding:12px 0;border-top:1px solid var(--rule);font-size:15px;display:grid;grid-template-columns:70px 1fr auto;gap:12px}
  .list li:first-child{border-top:0}
  .list .d{color:#9A9A9A;font-size:13px}
  .list .tag{font-size:12px;color:#9A9A9A;text-align:right;white-space:nowrap}
  .fail li{display:block}
  .fail li b{display:block;font-weight:700;margin-bottom:2px}
  .fail li span{color:#6B6B6B;font-size:14px;display:block}
  .small{font-size:13px;color:#9A9A9A;margin:14px 0 0}
  .small a,.meta a,.answer a{display:inline-block;padding:6px 0}
  @media(max-width:1000px){.stack{padding:24px 0 48px;gap:36px}header{padding:22px 0}.hero{padding:32px 0 0}}
  @media(max-width:620px){
    .stats{grid-template-columns:1fr 1fr}
    .stats>div:nth-child(3){padding-left:0;border-left:0}
    .stats>div:nth-child(n+3){border-top:1px solid var(--rule);padding-top:14px}
    .kv li,.arow li{grid-template-columns:1fr;gap:2px}
    .list li{grid-template-columns:56px 1fr;row-gap:2px}
    .list li .tag{grid-column:2;text-align:left}
  }

  /* Nav: a single swipeable row on phones, never a hamburger dropdown, so
     it works the same with one thumb as it does with a mouse. Every link
     keeps a real (>=40px) tap target via its own padding. */
  @media(max-width:760px){
    header{flex-wrap:nowrap!important}
    .brand{gap:14px;min-width:0;flex:1 1 auto}
    nav{flex-wrap:nowrap;overflow-x:auto;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav a{white-space:nowrap;padding:12px 10px;font-size:15px;min-height:40px;display:flex;align-items:center}
    .status{gap:10px}
    .mcp{display:none}
    .live{max-width:38vw;overflow:hidden}
    .live .num{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%;vertical-align:middle}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><a href="./index.html">margin.wiki</a></div>
      <nav>
        <a href="./index.html">Home</a>
        <a href="./sending-money.html">Sending money</a>
        <a href="./the-index.html">Countries</a>
        <a href="./how-it-works.html">How it works</a>
        <a href="./machine-room.html" class="active">How it was built</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="live"><span class="dot off" id="dot"></span><span class="num" id="connLabel">&nbsp;</span></div>
    </div>
  </header>

  <div class="hero">
    <h1 id="pageTitle">&nbsp;</h1>
    <div class="lede" id="pageLede">&nbsp;</div>
    <p class="meta"><span class="dot" id="metaDot"></span><span id="metaLine">&nbsp;</span></p>
  </div>

  <div class="stack">
    <div class="stats">
      <div><div class="lbl" id="lPriced">&nbsp;</div><div class="v num" id="mPriced">—</div></div>
      <div><div class="lbl" id="lWithheld">&nbsp;</div><div class="v num" id="mWithheld">—</div></div>
      <div><div class="lbl" id="lMerged">&nbsp;</div><div class="v num" id="mMerged">—</div></div>
      <div><div class="lbl" id="lPeople">&nbsp;</div><div class="v num" id="mPeople">—</div></div>
    </div>

    <div>
      <div id="hourCheck" style="font-size:15px;color:#333;padding:2px 0">&nbsp;</div>
    </div>

    <div>
      <div class="col-hdr"><div class="col-title" id="col2Title">&nbsp;</div><div class="lbl" id="col2Kicker">&nbsp;</div></div>
      <div class="feed" id="agentFeed"><div class="empty" id="col2Empty">&nbsp;</div></div>
      <div class="feed-note" id="feedCap">&nbsp;</div>
      <div style="padding-top:10px;font-size:13px;color:#6B6B6B"><a href="https://github.com/SebR214/margin/commits/main" id="col2HistoryLink">&nbsp;</a></div>
    </div>

    <section>
      <h2 id="rolesHeading" style="padding-top:32px">&nbsp;</h2>
      <p class="answer" id="rolesAnswer">&nbsp;</p>
      <ul class="arow" id="rolesList"></ul>
    </section>

    <section>
      <h2 id="approvesHeading" style="padding-top:32px">&nbsp;</h2>
      <ul class="kv" id="approvesList"></ul>
    </section>

    <section>
      <div class="col-hdr" style="padding-top:32px;margin-top:-32px;border-bottom:0;padding-bottom:0">
        <h2 id="shippedHeading" style="border-bottom:1px solid #0B0B0B;padding-bottom:8px;width:100%">&nbsp;</h2>
      </div>
      <ul class="list feed" id="shippedFeed"><li class="empty" id="shippedEmpty" style="display:block;grid-template-columns:1fr">&nbsp;</li></ul>
      <p class="small"><a href="https://github.com/SebR214/margin/commits/main" id="shippedHistoryLink">&nbsp;</a></p>
    </section>

    <section>
      <h2 id="incidentsHeading" style="padding-top:32px">&nbsp;</h2>
      <ul class="list fail" id="incidentsList"></ul>
      <p class="small"><a href="./agent-incidents.html" id="incidentsLink">&nbsp;</a></p>
    </section>

    <div style="border-top:1px solid var(--rule);padding-top:20px">
      <div class="col-title" style="margin-bottom:10px">Read more</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px">
        <a href="./sending-money.html" style="font-weight:600;display:inline-block;padding:8px 0">Where the stablecoin cost comes from →</a>
        <a href="./how-it-works.html" style="font-weight:600;display:inline-block;padding:8px 0">How prices are checked →</a>
        <a href="./agent-incidents.html" style="font-weight:600;display:inline-block;padding:8px 0">When the agents got it wrong →</a>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var API_BASE = location.hostname.endsWith("margin.wiki")
    ? "https://api.margin.wiki" : "http://127.0.0.1:8903";

  var COPY = {}; // filled from copy.json's "machineRoom" key before anything renders
  var STATE = {};      // ccy -> whether the collector priced it this pass

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function T(s, vals){
    var out = String(s||'');
    for (var k in (vals||{})) out = out.split('{'+k+'}').join(vals[k]==null?'':vals[k]);
    return out;
  }
  function timeOf(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return d.toISOString().slice(11,19); }
  function dateOf(iso){
    if(!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return String(d.getUTCDate()).padStart(2,'0') + ' ' + MONTHS[d.getUTCMonth()];
  }
  function todayUTC(){ return new Date().toISOString().slice(0,10); }
  // One stream, finite. The page scrolls; this does not. When it reaches the
  // cap the oldest row goes -- the commit log below is the full history, so
  // nothing is lost by saying so plainly rather than scrolling forever.
  var FEED_CAP = 40;
  function prepend(el, html, emptyText, cap){
    var empty = el.querySelector('.empty'); if (empty) empty.remove();
    var row = document.createElement('div'); row.className='log'; row.innerHTML = html;
    el.insertBefore(row, el.firstChild);
    while (el.children.length > (cap||FEED_CAP)) el.removeChild(el.lastChild);
  }

  // A role label for the feed's left column. Never falls through to a raw
  // "unknown" or "" printed as UNKNOWN -- an unmapped role always reads as
  // the copy's own byline.unknown ("--"), never the literal word.
  function roleLabel(role){
    var B = (COPY.columns.agents||{}).byline || {};
    var r = String(role||'').toLowerCase();
    return B[r] || B.unknown || '—';
  }

  // Who actually made a commit, read from the git author rather than assumed.
  // Assuming builder is how a commit made from Sebastian's own laptop gets
  // credited to an agent -- the exact mistake this page exists to avoid.
  function bylineFor(email){
    var B = (COPY.columns.agents||{}).byline || {}, e = String(email||'');
    if (/^(builder|reviewer|product)@margin\.wiki$/.test(e)) return B[e.split('@')[0]] || B.unknown || '';
    if (e.indexOf('margin-agents') !== -1) return B.agents || B.unknown || '';
    if (e && e.indexOf('@users.noreply.github.com') === -1 && e !== 'actions@github.com') return B.person || B.unknown || '';
    return B.unknown || '';
  }

  // A commit authored by the hourly collector pass (actions@github.com) is
  // not a "change the agents shipped" -- it belongs to the hour's price
  // check, already surfaced in the stats row and hourCheck line above. Both
  // the "what the agents did today" feed and the "what shipped" feed below
  // share this one filter so neither ever double-counts or mislabels it.
  function isShippedCommit(c){
    return ((c.commit.author||{}).email || '') !== 'actions@github.com';
  }

  function renderStatic(){
    var M = COPY.columns.meters, C2 = COPY.columns.agents;
    document.getElementById('pageTitle').textContent = COPY.title || '';
    document.getElementById('pageLede').textContent = COPY.lede || '';
    document.getElementById('feedCap').textContent = C2.capNote || '';
    document.getElementById('col2Title').textContent = C2.title || '';
    document.getElementById('col2Kicker').textContent = C2.kicker || '';
    document.getElementById('col2Empty').textContent = C2.empty || '';
    document.getElementById('col2HistoryLink').textContent = C2.historyLink || '';
    document.getElementById('lPriced').textContent = M.priced || '';
    document.getElementById('lWithheld').textContent = M.withheld || '';
    document.getElementById('lMerged').textContent = M.mergedThisWeek || '';
    document.getElementById('lPeople').textContent = M.people || '';
    document.getElementById('mPeople').textContent = M.peopleValue || '';
    document.getElementById('connLabel').textContent = COPY.connecting || '';

    var R = COPY.roles || {};
    document.getElementById('rolesHeading').textContent = R.heading || '';
    document.getElementById('rolesAnswer').textContent = R.answer || '';
    document.getElementById('rolesList').innerHTML = (R.items||[]).map(function(it){
      return '<li><b>'+esc(it.role)+'</b><span class="when">'+esc(it.when)+'</span><span class="txt">'+esc(it.text)+'</span></li>';
    }).join('');

    var A = COPY.approves || {};
    document.getElementById('approvesHeading').textContent = A.heading || '';
    document.getElementById('approvesList').innerHTML = (A.items||[]).map(function(it){
      return '<li><b>'+esc(it.title)+'</b><span>'+esc(it.text)+'</span></li>';
    }).join('');

    document.getElementById('shippedHeading').textContent = C2.shippedTitle || '';
    document.getElementById('shippedEmpty').textContent = C2.shippedEmpty || '';
    document.getElementById('shippedHistoryLink').textContent = C2.shippedHistoryLink || '';

    var I = COPY.incidents || {};
    document.getElementById('incidentsHeading').textContent = I.heading || '';
    document.getElementById('incidentsLink').textContent = I.linkText || '';
    document.getElementById('incidentsLink').href = I.linkHref || './agent-incidents.html';
    document.getElementById('incidentsList').innerHTML = (I.items||[]).map(function(it){
      return '<li><b>'+esc(it.what)+'</b><span>'+esc(it.text)+'</span></li>';
    }).join('') + '<li id="incidentsLiveItem"><b>'+esc(I.liveItemTitle||'')+'</b><span id="incidentsLiveText">'+esc(I.liveItemFallback||'')+'</span></li>';
  }

  // Redraws the one-line "this hour's check" sentence from STATE, and the
  // "countries priced now" stat tile that shares the same live count. STATE's
  // key count is the real live number of currencies the collector has
  // touched so far this pass; TOTAL_CURRENCIES (60, the fixed bounded set
  // this site checks every hour) is the fixed denominator.
  var TOTAL_CURRENCIES = 60;
  function drawHourCheck(){
    var C = COPY.columns.collection;
    var priced = 0, withheld = 0;
    Object.keys(STATE).forEach(function(k){ STATE[k] ? priced++ : withheld++; });
    document.getElementById('mPriced').textContent = priced + ' of ' + TOTAL_CURRENCIES;
    document.getElementById('mWithheld').textContent = withheld;
    document.getElementById('hourCheck').textContent = T(C.checkTemplate,
      { priced: priced, total: TOTAL_CURRENCIES });
  }

  // A live page must never open empty -- an empty live page reads as broken
  // or fake. Seed the collection stat with the real last completed pass
  // before any live SSE event has arrived; live events update STATE in
  // place as they arrive.
  function seedCollection(d){
    var countries = d.countries || [], withheldList = d.withheld || [];
    countries.forEach(function(c){ STATE[c.ccy] = true; });
    withheldList.forEach(function(w){ STATE[w.ccy] = false; });
    drawHourCheck();

    var I = COPY.incidents || {};
    var real = withheldList.filter(function(w){ return w && w.country && w.reason; })[0];
    if (real) {
      document.getElementById('incidentsLiveText').textContent =
        T(I.liveItemTemplate, { country: real.country, reason: real.reason });
    }

    var when = timeOf(d.as_of_utc || d.computed_at);
    document.getElementById('metaLine').textContent = when
      ? T(COPY.metaTemplate, { time: when })
      : '';
  }

  // Seed "what the agents are doing" with real recent commits from GitHub's
  // public API (no auth needed, public repo) -- live SSE events (issues,
  // reviews, further commits) prepend above these as they arrive. The same
  // fetch also drives the curated "what shipped in the last two days" feed
  // below, so a reader sees one real commit history rendered two ways, not
  // two independently-fetched (and possibly disagreeing) ones.
  function seedAgents(commits){
    var C = COPY.columns.agents;
    var shipped = commits.filter(isShippedCommit);

    var html = shipped.slice(0, 8).map(function(c){
      var by = bylineFor((c.commit.author||{}).email);
      var msg = (c.commit.message.split('\n')[0] || '').replace(/\s*\(#\d+\)\s*$/, '');
      var prMatch = c.commit.message.match(/\(#(\d+)\)/);
      return '<div class="log"><div class="stamp num" style="min-width:46px">' + esc(timeOf(c.commit.author.date)) + '</div>' +
        '<div class="stamp" style="min-width:78px;letter-spacing:.08em">' + esc(by) + '</div>' +
        '<div style="flex-grow:1">' + esc(T(C.commitTemplate, { message: msg })) + '</div>' + (prMatch ? ' (#' + prMatch[1] + ')' : '') + '</div>';
    }).join('');
    var feed = document.getElementById('agentFeed');
    if (html) feed.innerHTML = html;

    // "Shipped" here means the same thing tools/emit_changes_merged.py
    // means by "a change merged" -- a commit on main whose subject ends in
    // "(#NNN)", i.e. a squash-merged PR. A raw commit with no PR suffix
    // (an hourly sample, a direct push) is real git history but not a
    // reviewed change a reader would recognise as "shipped", so it is
    // excluded here the same way it is excluded from that count.
    var PR_SUFFIX_RE = /\(#(\d+)\)\s*$/;
    var SHIPPED_FEED_CAP = 12;
    var cutoff = Date.now() - 2 * 24 * 60 * 60 * 1000;
    var recent = shipped.filter(function(c){
      var t = new Date(c.commit.author.date).getTime();
      return !isNaN(t) && t >= cutoff && PR_SUFFIX_RE.test(c.commit.message.split('\n')[0] || '');
    }).slice(0, SHIPPED_FEED_CAP);
    var shippedFeed = document.getElementById('shippedFeed');
    if (recent.length) {
      shippedFeed.innerHTML = recent.map(function(c){
        var msg = (c.commit.message.split('\n')[0] || '').replace(/\s*\(#\d+\)\s*$/, '');
        var prMatch = c.commit.message.match(PR_SUFFIX_RE);
        return '<li><span class="d">' + esc(dateOf(c.commit.author.date)) + '</span>' +
          '<span>' + esc(msg) + '</span>' +
          '<span class="tag">' + (prMatch ? '#' + esc(prMatch[1]) : '') + '</span></li>';
      }).join('');
    }
  }

  async function boot(){
    var copyDoc = await fetch('./copy.json', {cache:'no-store'}).then(function(r){ return r.json(); }).catch(function(){ return {}; });
    COPY = copyDoc.machineRoom || { columns: { collection:{}, agents:{}, meters:{} } };
    renderStatic();

    fetch('./data/index_latest.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(seedCollection).catch(function(){});
    // "Changes shipped this week" -- tools/emit_changes_merged.py counts real
    // commits on main (each one a squash-merged PR, see its own docstring)
    // in the trailing 7 days from this repo's own git history. Never typed.
    // The label reads "shipped" (mockup wording); the computation itself is
    // unchanged from the number this page already published as "changes
    // merged this week" -- same file, same script, same meaning.
    fetch('./data/changes_merged.json', {cache:'no-store'}).then(function(r){ return r.json(); })
      .then(function(m){ document.getElementById('mMerged').textContent = (m && m.count != null) ? m.count : '—'; })
      .catch(function(){});
    fetch('https://api.github.com/repos/SebR214/margin/commits?per_page=60', {headers:{'Accept':'application/vnd.github+json'}})
      .then(function(r){ return r.ok ? r.json() : []; }).then(seedAgents).catch(function(){});

    var es = new EventSource(API_BASE + '/v1/events');
    // Retrying, quietly, is normal for a live feed and should not read as
    // broken -- so an error shows nothing at first. Only a failure that
    // persists past OFFLINE_AFTER_MS (never reconnecting in that window)
    // is "genuinely failed," and that's the only case that gets a visible
    // label. A later successful open clears it back to "connected".
    var OFFLINE_AFTER_MS = 15000;
    var offlineTimer = null;
    es.onopen = function(){
      if (offlineTimer) { clearTimeout(offlineTimer); offlineTimer = null; }
      document.getElementById('dot').classList.remove('off');
      document.getElementById('connLabel').textContent = COPY.connected || '';
    };
    es.onerror = function(){
      document.getElementById('dot').classList.add('off');
      if (!offlineTimer) {
        offlineTimer = setTimeout(function(){
          document.getElementById('connLabel').textContent = COPY.offline || '';
          offlineTimer = null;
        }, OFFLINE_AFTER_MS);
      }
    };

    es.onmessage = function(ev){
      var e; try { e = JSON.parse(ev.data); } catch(err){ return; }
      var C2 = COPY.columns.agents;

      if (e.kind === 'collector_pass') {
        return; // no separate active/idle state is shown any more
      }
      if (e.kind === 'collector_source') {
        // A pass revises the set, it does not append to it: update this
        // currency in place and leave the other 59 alone.
        STATE[e.ccy] = !!e.priced;
        drawHourCheck();
        return;
      }
      if (e.kind === 'linear') {
        var what = e.event === 'transition'
          ? T(C2.transitionTemplate, { ident: esc(e.ident), from: esc(e.from_state), to: esc(e.to_state) })
          : T(C2.commentTemplate, { ident: esc(e.ident), text: esc((e.text||'').slice(0,120)) });
        // A Linear issue move is never one of the four agent identities --
        // it's the tracker itself, so it is always labelled LINEAR, not
        // whatever (or nothing) the event's own role field carries.
        prepend(document.getElementById('agentFeed'),
          '<div class="stamp num" style="min-width:46px">'+esc(timeOf(e.ts))+'</div><div class="stamp" style="min-width:64px;letter-spacing:.08em">'+esc((C2.byline||{}).linear || 'LINEAR')+'</div><div style="flex-grow:1">'+what+'</div>');
        return;
      }
      if (e.kind === 'commit') {
        // A live commit that carries a PR number is a change merging right
        // now -- the same definition tools/emit_changes_merged.py used to
        // compute the seeded count, so bump it in place rather than waiting
        // for the next page load to catch up.
        if (e.pr_number) {
          var mergedEl = document.getElementById('mMerged');
          var cur = parseInt(mergedEl.textContent, 10);
          mergedEl.textContent = isNaN(cur) ? 1 : cur + 1;
        }
        var pr = e.pr_number ? ' (#'+e.pr_number+')' : '';
        var message = T(C2.commitTemplate, { message: '<span style="font-weight:600">'+esc((e.message||'').replace(/\s*\(#\d+\)\s*$/,''))+'</span>' });
        prepend(document.getElementById('agentFeed'),
          '<div class="stamp num" style="min-width:46px">'+esc(timeOf(e.ts))+'</div><div class="stamp" style="min-width:64px;letter-spacing:.08em">BUILDER</div><div style="flex-grow:1">'+message+esc(pr)+'</div>');
        return;
      }
      if (e.kind === 'loop_health') {
        var label = e.event === 'stopped'
          ? T(C2.loopStoppedTemplate, { when: esc(timeOf(e.last_finished_utc)) })
          : e.event === 'pass'
            ? T(C2.loopPassTemplate, { result: e.ok ? C2.loopOk : C2.loopFailed, seconds: e.seconds!=null ? ', '+Math.round(e.seconds)+'s' : '' })
            : C2.loopRecovered;
        prepend(document.getElementById('agentFeed'),
          '<div class="stamp num" style="min-width:46px">'+esc(timeOf(e.ts))+'</div><div class="stamp" style="min-width:64px;letter-spacing:.08em">'+esc(roleLabel(e.role))+'</div><div style="flex-grow:1">'+esc(label)+'</div>');
        return;
      }
    };
  }

  boot();
})();
</script>
</body>
</html>
