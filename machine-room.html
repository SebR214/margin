<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>margin.wiki — the machine room</title>
<meta name="description" content="What the collector is doing this hour, and what the agents building this site are doing, unedited, as it happens."/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#0B0B0B; --sub:#6B6B6B; --stamp:#9A9A9A; --indigo:#817FCC; --rule:#F0F0F0; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Archivo',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);background:#fff}
  a{color:var(--ink);text-decoration:none} a:hover{color:var(--indigo)}
  .num{font-variant-numeric:tabular-nums}
  .lbl{font-size:11px;letter-spacing:.1em;color:#6B6B6B}
  .stamp{font-size:11px;color:var(--stamp);letter-spacing:.06em}
  .log{font-size:13px;padding:7px 0;border-bottom:1px solid #F6F6F6;display:flex;gap:12px;align-items:baseline}
  .wrap{max-width:1440px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:22px 48px;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:800;letter-spacing:-0.02em}
  nav{display:flex;gap:28px;font-size:15px;font-weight:500;color:#333;flex-wrap:wrap}
  nav a.active{color:var(--ink);font-weight:700}
  .live{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:#6B6B6B}
  .header-right{display:flex;align-items:center;gap:16px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--indigo)}
  .dot.off{background:#9A9A9A}
  .hero{padding:44px 48px 0;display:flex;flex-direction:column;gap:12px}
  h1{font-size:42px;font-weight:800;letter-spacing:-0.02em;margin:0}
  .lede{max-width:840px;font-size:16px;color:#6B6B6B;line-height:1.5}
  .cols{flex-grow:1;display:grid;grid-template-columns:1fr 1fr 330px;gap:56px;padding:36px 48px 44px}
  .col-hdr{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;border-bottom:1px solid #0B0B0B;padding-bottom:8px}
  .col-title{font-size:16px;font-weight:700}
  .feed{max-height:560px;overflow-y:auto}
  .meter{display:flex;flex-direction:column;gap:2px;padding:14px 0;border-bottom:1px solid var(--rule)}
  .meter .v{font-size:30px;font-weight:800;color:var(--indigo)}
  .meter .v.muted{color:#9A9A9A;font-size:16px;font-weight:700}
  .empty{padding:20px 0;color:#9A9A9A;font-size:13px}
  @media(max-width:1000px){.cols{grid-template-columns:1fr;padding:24px 24px 44px}h1{font-size:30px}header{padding:22px 24px}.hero{padding:32px 24px 0}}

  .nav-toggle{display:none;background:none;border:0;font-size:20px;cursor:pointer;padding:6px 8px;color:#0B0B0B;line-height:1}
  @media(max-width:760px){
    header{position:relative;flex-wrap:nowrap!important}
    .brand{gap:14px}
    nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column!important;gap:0!important;padding:6px 24px 16px;border-bottom:1px solid #F0F0F0;box-shadow:0 8px 16px rgba(11,11,11,0.06);z-index:30}
    nav.open{display:flex}
    nav a{padding:12px 0;border-bottom:1px solid #F6F6F6;font-size:16px}
    .nav-toggle{display:block}
    .status{gap:10px}
    .mcp{display:none}
    .live{max-width:52vw;overflow:hidden}
    .live .num{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%;vertical-align:middle}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><a href="./index.html">margin.wiki</a></div>
      <nav>
        <a href="./the-index.html">The index</a>
        <a href="./sending-money.html">Sending money</a>
        <a href="./findings.html">Findings</a>
        <a href="./machine-room.html" class="active">The machine room</a>
        <a href="./how-it-works.html">How it works</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="live"><span class="dot off" id="dot"></span><span class="num" id="connLabel">&nbsp;</span></div>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
    </div>
  </header>

  <div class="hero">
    <h1 id="pageTitle">&nbsp;</h1>
    <div class="lede" id="pageLede">&nbsp;</div>
  </div>

  <div class="cols">
    <div style="display:flex;flex-direction:column">
      <div class="col-hdr"><div class="col-title" id="col1Title">&nbsp;</div><div class="lbl num" id="collectorState">&nbsp;</div></div>
      <div id="passProgress" style="font-size:13px;color:#6B6B6B;padding:10px 0;border-bottom:1px solid #F6F6F6">&nbsp;</div>
      <div class="feed" id="collectorFeed"><div class="empty" id="col1Empty">&nbsp;</div></div>
    </div>
    <div style="display:flex;flex-direction:column">
      <div class="col-hdr"><div class="col-title" id="col2Title">&nbsp;</div><div class="lbl" id="col2Kicker">&nbsp;</div></div>
      <div class="feed" id="agentFeed"><div class="empty" id="col2Empty">&nbsp;</div></div>
      <div style="padding-top:16px;font-size:13px;color:#6B6B6B"><a href="https://github.com/SebR214/margin/commits/main" id="col2HistoryLink">&nbsp;</a></div>
    </div>
    <div style="display:flex;flex-direction:column">
      <div style="border-bottom:1px solid #0B0B0B;padding-bottom:8px;font-size:16px;font-weight:700" id="col3Title">&nbsp;</div>
      <div class="meter"><div class="v num" id="mPriced">—</div><div class="lbl" id="lPriced">&nbsp;</div></div>
      <div class="meter"><div class="v num" id="mWithheld">—</div><div class="lbl" id="lWithheld">&nbsp;</div></div>
      <div class="meter"><div class="v num" id="mCommits">0</div><div class="lbl" id="lCommits">&nbsp;</div></div>
      <div class="meter"><div class="v num" id="mPeople">—</div><div class="lbl" id="lPeople">&nbsp;</div></div>
    </div>
  </div>
</div>

<script>
(function () {
  var API_BASE = location.hostname.endsWith("margin.wiki")
    ? "https://api.margin.wiki" : "http://127.0.0.1:8903";

  var COPY = {}; // filled from copy.json's "machineRoom" key before anything renders

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function T(s, vals){
    var out = String(s||'');
    for (var k in (vals||{})) out = out.split('{'+k+'}').join(vals[k]==null?'':vals[k]);
    return out;
  }
  function timeOf(iso){ if(!iso) return ''; var d=new Date(iso); if(isNaN(d)) return ''; return d.toISOString().slice(11,19); }
  function todayUTC(){ return new Date().toISOString().slice(0,10); }
  function prepend(el, html, emptyText, cap){
    var empty = el.querySelector('.empty'); if (empty) empty.remove();
    var row = document.createElement('div'); row.className='log'; row.innerHTML = html;
    el.insertBefore(row, el.firstChild);
    while (el.children.length > (cap||60)) el.removeChild(el.lastChild);
  }
  function classWords(kind){ return (COPY.columns.collection.classWords||{})[kind] || ''; }

  function renderStatic(){
    var M = COPY.columns.meters, C1 = COPY.columns.collection, C2 = COPY.columns.agents;
    document.getElementById('pageTitle').textContent = COPY.title || '';
    document.getElementById('pageLede').textContent = COPY.lede || '';
    document.getElementById('col1Title').textContent = C1.title || '';
    document.getElementById('col1Empty').textContent = C1.empty || '';
    document.getElementById('collectorState').textContent = C1.idle || '';
    document.getElementById('col2Title').textContent = C2.title || '';
    document.getElementById('col2Kicker').textContent = C2.kicker || '';
    document.getElementById('col2Empty').textContent = C2.empty || '';
    document.getElementById('col2HistoryLink').textContent = C2.historyLink || '';
    document.getElementById('col3Title').textContent = M.title || '';
    document.getElementById('lPriced').textContent = M.priced || '';
    document.getElementById('lWithheld').textContent = M.withheld || '';
    document.getElementById('lCommits').textContent = M.commitsToday || '';
    document.getElementById('lPeople').textContent = M.people || '';
    document.getElementById('mPeople').textContent = M.peopleValue || '';
    document.getElementById('connLabel').textContent = COPY.connecting || '';
  }

  // A live page must never open empty -- an empty live page reads as broken
  // or fake. Seed the collection column with the real last completed pass
  // (every country actually checked, real evidence words, real verdict)
  // before any live SSE event has arrived; live events prepend on top of
  // this, not replace it.
  function seedCollection(d){
    var C = COPY.columns.collection;
    var countries = d.countries || [], withheldList = d.withheld || [];
    var priced = countries.length, withheld = withheldList.length;
    document.getElementById('mPriced').textContent = priced;
    document.getElementById('mWithheld').textContent = withheld;
    var hourUtc = (d.as_of_utc||d.computed_at||'').replace('T',' ').slice(0,16);
    document.getElementById('passProgress').textContent = T(C.lastPassTemplate,
      { hour: hourUtc, priced: priced, total: priced + withheld, withheld: withheld });

    var rows = countries.map(function(c){
      return { ccy: c.ccy, priced: true, kind: c.source_words, note: c.evidence_words + C.pricedSuffix };
    }).concat(withheldList.map(function(w){
      return { ccy: w.ccy, priced: false, kind: '', note: C.withheldPrefix + (w.reason || C.noReason) };
    }));
    // No per-country timestamp is published, only the shared pass hour --
    // shown once in the label above, not invented per row.
    var html = rows.map(function(r){
      return '<div class="log"><div class="stamp num" style="min-width:62px">' + esc(r.ccy) + '</div>' +
        '<div style="flex-grow:1">' + esc(r.kind) + '</div>' +
        '<div class="num" style="color:#0B0B0B;font-weight:600;font-size:12px">' + esc(r.note) + '</div></div>';
    }).join('');
    var feed = document.getElementById('collectorFeed');
    feed.innerHTML = html + '<div style="font-size:12px;color:#9A9A9A;padding:10px 0 4px">' + esc(C.seededNote) + '</div>';
  }

  // Seed "what the agents are doing" with real recent commits from GitHub's
  // public API (no auth needed, public repo) -- live SSE events (issues,
  // reviews, further commits) prepend above these as they arrive.
  function seedAgents(commits){
    var C = COPY.columns.agents;
    var html = commits.map(function(c){
      var msg = (c.commit.message.split('\n')[0] || '').replace(/\s*\(#\d+\)\s*$/, '');
      var prMatch = c.commit.message.match(/\(#(\d+)\)/);
      return '<div class="log"><div class="stamp num" style="min-width:46px">' + esc(timeOf(c.commit.author.date)) + '</div>' +
        '<div class="stamp" style="min-width:64px;letter-spacing:.08em">BUILDER</div>' +
        '<div style="flex-grow:1">' + esc(T(C.commitTemplate, { message: msg })) + '</div>' + (prMatch ? ' (#' + prMatch[1] + ')' : '') + '</div>';
    }).join('');
    var feed = document.getElementById('agentFeed');
    if (html) feed.innerHTML = html + '<div style="font-size:12px;color:#9A9A9A;padding:10px 0 4px">' + esc(C.seededNote) + '</div>';
  }

  async function boot(){
    var copyDoc = await fetch('./copy.json', {cache:'no-store'}).then(function(r){ return r.json(); }).catch(function(){ return {}; });
    COPY = copyDoc.machineRoom || { columns: { collection:{}, agents:{}, meters:{} } };
    renderStatic();

    fetch('./data/index_latest.json', {cache:'no-store'}).then(function(r){ return r.json(); }).then(seedCollection).catch(function(){});
    fetch('https://api.github.com/repos/SebR214/margin/commits?per_page=8', {headers:{'Accept':'application/vnd.github+json'}})
      .then(function(r){ return r.ok ? r.json() : []; }).then(seedAgents).catch(function(){});

    var commitsSeen = 0;
    var es = new EventSource(API_BASE + '/v1/events');
    es.onopen = function(){ document.getElementById('dot').classList.remove('off'); document.getElementById('connLabel').textContent = COPY.connected || ''; };
    es.onerror = function(){ document.getElementById('dot').classList.add('off'); document.getElementById('connLabel').textContent = COPY.disconnected || ''; };

    es.onmessage = function(ev){
      var e; try { e = JSON.parse(ev.data); } catch(err){ return; }
      var C1 = COPY.columns.collection, C2 = COPY.columns.agents;

      if (e.kind === 'collector_pass') {
        document.getElementById('collectorState').textContent = e.phase === 'start' ? C1.active : C1.idle;
        return;
      }
      if (e.kind === 'collector_source') {
        var words = e.priced ? classWords(e.source_kind) : '';
        var row = e.priced
          ? '<div class="stamp num" style="min-width:62px">'+esc(timeOf(e.ts))+'</div><div style="flex-grow:1">'+esc(e.ccy)+' · '+esc(words)+'</div><div class="num" style="color:#0B0B0B;font-weight:600;font-size:12px">'+esc(T(C1.evidenceCountTemplate,{n:e.evidence_count}))+esc(C1.pricedSuffix)+'</div>'
          : '<div class="stamp num" style="min-width:62px">'+esc(timeOf(e.ts))+'</div><div style="flex-grow:1">'+esc(e.ccy)+'</div><div class="num" style="color:#0B0B0B;font-weight:600;font-size:12px">'+esc(C1.withheldPrefix)+esc(e.reason||C1.noReason)+'</div>';
        var f = document.getElementById('collectorFeed');
        var empty = f.querySelector('.empty'); if (empty) empty.remove();
        var d2 = document.createElement('div'); d2.className='log'; d2.innerHTML = row;
        f.insertBefore(d2, f.firstChild);
        while (f.children.length > 80) f.removeChild(f.lastChild);
        return;
      }
      if (e.kind === 'linear') {
        var what = e.event === 'transition'
          ? T(C2.transitionTemplate, { ident: esc(e.ident), from: esc(e.from_state), to: esc(e.to_state) })
          : T(C2.commentTemplate, { ident: esc(e.ident), text: esc((e.text||'').slice(0,120)) });
        prepend(document.getElementById('agentFeed'),
          '<div class="stamp num" style="min-width:46px">'+esc(timeOf(e.ts))+'</div><div class="stamp" style="min-width:64px;letter-spacing:.08em">'+esc((e.role||'').toUpperCase())+'</div><div style="flex-grow:1">'+what+'</div>');
        return;
      }
      if (e.kind === 'commit') {
        if ((e.ts||'').slice(0,10) === todayUTC()) { commitsSeen++; document.getElementById('mCommits').textContent = commitsSeen; }
        var pr = e.pr_number ? ' (#'+e.pr_number+')' : '';
        var message = T(C2.commitTemplate, { message: '<span style="font-weight:600">'+esc((e.message||'').replace(/\s*\(#\d+\)\s*$/,''))+'</span>' });
        prepend(document.getElementById('agentFeed'),
          '<div class="stamp num" style="min-width:46px">'+esc(timeOf(e.ts))+'</div><div class="stamp" style="min-width:64px;letter-spacing:.08em">BUILDER</div><div style="flex-grow:1">'+message+esc(pr)+'</div>');
        return;
      }
      if (e.kind === 'loop_health') {
        var label = e.event === 'stopped'
          ? T(C2.loopStoppedTemplate, { when: esc(timeOf(e.last_finished_utc)) })
          : e.event === 'pass'
            ? T(C2.loopPassTemplate, { result: e.ok ? C2.loopOk : C2.loopFailed, seconds: e.seconds!=null ? ', '+Math.round(e.seconds)+'s' : '' })
            : C2.loopRecovered;
        prepend(document.getElementById('agentFeed'),
          '<div class="stamp num" style="min-width:46px">'+esc(timeOf(e.ts))+'</div><div class="stamp" style="min-width:64px;letter-spacing:.08em">'+esc((e.role||'').toUpperCase())+'</div><div style="flex-grow:1">'+esc(label)+'</div>');
        return;
      }
    };
  }

  boot();
})();
</script>

<script>
(function(){
  var btn = document.getElementById('navToggle');
  var nav = document.querySelector('header nav');
  if (btn && nav) {
    btn.addEventListener('click', function(){ nav.classList.toggle('open'); });
    document.addEventListener('click', function(e){
      if (nav.classList.contains('open') && !nav.contains(e.target) && e.target !== btn) nav.classList.remove('open');
    });
  }
})();
</script>
</body>
</html>
