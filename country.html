<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>margin.wiki — a country's price in full</title>
<meta name="description" content="One country's price, its full history, and the receipt behind the number, in one place."/>
<link rel="stylesheet" href="./style.css">
<style>
  /* Layout follows the owner's layout references (SEB-240): the route reference's
     chips, chart box, stats row and list rows, the home reference's header and big number.
     Colours are style.css tokens only. */
  .c-wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px 96px; display: flex; flex-direction: column; gap: 56px; }
  .c-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--color-neutral-300); margin: 0; }
  .c-brand { display: flex; flex-wrap: wrap; align-items: center; gap: 28px; }
  .c-logo { font-weight: 600; font-size: 18px; color: var(--color-ink); text-decoration: none; }
  .c-nav { display: flex; flex-wrap: wrap; gap: 22px; font-size: 15px; font-weight: 400; color: var(--color-neutral-600); }
  .c-nav a { color: var(--color-neutral-600); text-decoration: none; font-weight: 400; display: inline-flex; align-items: center; min-height: 44px; }
  .c-nav a.on { color: var(--color-ink); }
  h1 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 600; }
  h2 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 600; }
  p { margin: 0; }
  .c-small { font-size: 14px; }
  .c-lead { font-size: 17px; }
  .c-hero { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-end; }
  .c-herotext { flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .c-bigbox { flex: 1 0 auto; max-width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .c-big { font-size: clamp(48px, 15vw, 88px); font-weight: 600; line-height: 1; color: var(--data-700); }
  .c-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--color-neutral-300); border: 1px solid var(--color-neutral-300); border-radius: 8px; overflow: hidden; }
  .c-stats > div { background: var(--color-surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .c-k { font-size: 13px; color: var(--color-neutral-600); }
  .c-v { font-size: 16px; }
  .c-sub { font-size: 12px; }
  .c-sec { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .c-sechead { display: flex; flex-direction: column; gap: 8px; max-width: 760px; }
  .c-controls { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
  .c-left { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
  .c-legend { display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; }
  .c-leg { display: flex; align-items: center; gap: 8px; }
  .c-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .c-gapx { width: 12px; }
  .c-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 6px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid var(--color-neutral-400); background: var(--color-surface); color: var(--color-neutral-700); }
  .c-chip.on { background: var(--color-ink); color: var(--color-bg); border-color: var(--color-ink); }
  .c-chip.lay.on { background: var(--color-surface); color: var(--color-ink); border-color: var(--color-ink); }
  .c-chip.lay { opacity: .6; }
  .c-chip.lay.on { opacity: 1; }
  .c-sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
  .c-sw.r { border-radius: 50%; }
  .c-line { width: 18px; height: 3px; display: inline-block; flex: none; }
  .c-line.dashed { background: repeating-linear-gradient(90deg, var(--data-700) 0 5px, transparent 5px 8px); }
  .c-band { width: 14px; height: 10px; display: inline-block; background: var(--color-ink); opacity: .2; }
  .c-chart { position: relative; background: var(--color-surface); border: 1px solid var(--color-neutral-300); border-radius: 8px; padding: 16px 16px 8px; cursor: crosshair; user-select: none; touch-action: pan-y; min-height: 300px; }
  .c-chart.busy { opacity: .6; }
  .cc-svg { display: block; max-width: 100%; }
  .cc-ax { fill: var(--color-neutral-600); font: 400 11px var(--font-body); }
  .cc-sel { fill: var(--color-ink); fill-opacity: .07; }
  .cc-cross { stroke: var(--color-ink); }
  .cc-tip { position: absolute; top: 16px; background: var(--color-bg); border: 1px solid var(--color-neutral-400); border-radius: 6px; padding: 10px 12px; font-size: 13px; pointer-events: none; display: flex; flex-direction: column; gap: 4px; max-width: 80%; z-index: 2; }
  .c-tstamp { color: var(--color-neutral-600); }
  .c-trow { display: flex; align-items: center; gap: 8px; }
  .c-tname { flex: 1; color: var(--color-neutral-700); min-width: 0; }
  .c-axis { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; }
  .c-list { border-top: 1px solid var(--color-neutral-300); }
  .c-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 12px 0; border-bottom: 1px solid var(--color-neutral-300); font-size: 14px; }
  .c-rhead { font-size: 13px; padding: 8px 0; }
  .c-ct { width: 150px; }
  .c-cs { flex: 1 1 140px; min-width: 120px; display: flex; align-items: center; gap: 8px; }
  .c-cp { width: 120px; }
  .c-cg { width: 80px; }
  .c-cd { width: 130px; }
  .c-cr { flex: 1 1 180px; min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
  .c-cr a { color: var(--data-700); }
  .c-row[hidden] { display: none; }
  .c-more { align-self: flex-start; margin-top: 16px; }
  .c-chip.lay.on { opacity: 1; }
  @media (max-width: 620px) {
    .c-wrap { padding: 0 16px 64px; gap: 40px; }
    .c-brand { gap: 0 20px; }
    .c-nav { gap: 0 12px; font-size: 14px; }
    .c-head { padding: 8px 0; }
    .c-rhead { display: none; }
    .c-ct, .c-cp, .c-cg, .c-cd { width: auto; }
  }
</style>
<script src="./js/receipt_replay.js"></script>
<script src="./js/country_chart.js"></script>
<link rel="stylesheet" href="./css/site_head.css?v=3">
<link rel="stylesheet" href="./css/site_page.css?v=1">
</head>
<body>
<div id="app"></div>
<template id="cChartTpl"><div class="c-chart" id="cChart"><svg id="cSvg" class="cc-svg" role="img"><g class="cc-base"></g><rect class="cc-sel" y="0" width="0" height="0"></rect><line class="cc-cross" y1="0" stroke-dasharray="3 3" style="display:none"></line></svg><div class="cc-tip" style="display:none"></div></div></template>
<script src="./js/country_page.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/site_head.js?v=3"></script>
</body>
</html>
