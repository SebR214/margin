<style>
  /* One country (SEB-268), rebuilt to the approved reference. Header, column, title and pill styles are the shared ones
     (css/site_head.css, css/site_page.css); colours are the style.css tokens; every word is in copy.json, countryData. */
  .num { font-variant-numeric: tabular-nums; }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px 96px; box-sizing: border-box; }
  .cnav { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 40px; }
  .hero { padding-left: 0 !important; padding-right: 0 !important; padding-bottom: 0 !important; max-width: 760px; }
  .stamp { margin: 0; font-size: 14px; color: var(--color-neutral-600); }
  .money { margin: 0; font-size: 17px; }
  .money b { font-weight: 600; }
  .flag { margin: 0; font-size: 15px; color: var(--color-neutral-700); padding-left: 12px; border-left: 2px solid var(--color-neutral-300); }
  .body { margin: 0; max-width: 680px; font-size: 16px; }
  section { margin-top: 48px; }
  #depth { margin-top: 20px; }
  h2 { margin: 0 0 8px; }
  .note { margin: 0 0 16px; font-size: 15px; color: var(--color-neutral-700); max-width: 680px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  #chart .pills { margin: 0 0 12px; }
  .key { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; color: var(--color-neutral-700); margin: 0 0 8px; }
  .key i.ln { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--data-700); vertical-align: 4px; margin-right: 8px; }
  .key i.ln.dash { border-top: 2px dashed var(--color-neutral-500); }
  .chart { position: relative; touch-action: pan-y; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ax { fill: var(--color-neutral-600); font-size: 12px; }
  .ax.z { fill: var(--color-ink); font-weight: 600; }
  .gl { stroke: var(--color-neutral-200); }
  .gl.z { stroke: var(--color-ink); }
  .ln-own { fill: none; stroke: var(--data-700); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  .ar-own { fill: var(--data-700); fill-opacity: .14; stroke: none; }
  .band { fill: var(--color-neutral-100); }
  /* the range bar under the chart: a grey rounded bar, the picked range a white pill (24 Oct) */
  .rbar { display: flex; width: max-content; gap: 2px; margin: 12px auto 20px; padding: 3px; border-radius: 999px; background: var(--color-neutral-100); }
  .rbar button { font: inherit; font-size: 14px; font-weight: 500; line-height: 1; padding: 7px 12px; border: 0; border-radius: 999px; background: transparent; color: var(--color-neutral-700); cursor: pointer; }
  .rbar button[aria-pressed="true"] { background: var(--color-bg, #fff); color: var(--color-ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .ln-back { fill: none; stroke: var(--color-neutral-500); stroke-width: 1.3; stroke-dasharray: 4 3; }
  .pt { fill: var(--data-700); }
  .cr { stroke: var(--color-ink); stroke-dasharray: 3 3; }
  .cd { fill: var(--color-ink); }
  #rec { margin-top: 12px; }
  .rows { border-top: 1px solid var(--color-neutral-200); }
  .r { display: grid; grid-template-columns: 260px 1fr 140px; gap: 0 24px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-neutral-200); }
  .r b { font-weight: 600; font-size: 15px; }
  .r .v { text-align: right; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .r .v small { display: block; font-size: 13px; color: var(--color-neutral-600); font-weight: 400; }
  .tbl { font-size: 14px; border-top: 1px solid var(--color-neutral-200); }
  .th, .tr { display: grid; grid-template-columns: 150px 1fr 140px 90px 150px 150px; gap: 0 16px; padding: 10px 0; border-bottom: 1px solid var(--color-neutral-200); align-items: center; }
  .th { color: var(--color-neutral-600); font-size: 13px; }
  .tr span:nth-child(3), .tr span:nth-child(4), .th span:nth-child(3), .th span:nth-child(4) { text-align: right; }
  .tr a { color: var(--color-neutral-700); text-decoration: underline; text-decoration-color: var(--color-neutral-300); text-underline-offset: 3px; }
  .more { margin-top: 16px; }
  .nf { margin-top: 48px; }
  .nsx { border-collapse: collapse; font-size: 14px; margin-top: 12px; }   /* the last 30 days, shown only with scripts off (SEB-426) */
  .nsx th, .nsx td { text-align: left; padding: 6px 28px 6px 0; border-bottom: 1px solid var(--color-neutral-200); font-weight: 400; }
  .nsx th { color: var(--color-neutral-600); font-size: 13px; }
  @media (max-width: 700px) { .wrap { padding: 0 24px 64px; } }
  @media (max-width: 760px) {
    .th { display: none; }
    .tr { grid-template-columns: 1fr auto; }
    .tr span:nth-child(2) { grid-column: 1; grid-row: 2; color: var(--color-neutral-600); }
    .tr span:nth-child(3) { grid-column: 2; grid-row: 1; }
    .tr span:nth-child(4) { grid-column: 2; grid-row: 2; }
    .tr span:nth-child(5), .tr span:nth-child(6) { grid-column: 1 / -1; color: var(--color-neutral-600); font-size: 13px; }
  }
  @media (max-width: 620px) {
    .r { grid-template-columns: 1fr auto; }
    .r > span:not(.v) { display: none; }   /* the empty middle column: without it the price sits beside the name, at the right edge (27 Oct) */
  }
</style>
