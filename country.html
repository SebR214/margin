<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>margin.wiki — a country's price in full</title>
<meta name="description" content="One country's price, its full history, and the receipt behind the number, in one place."/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
<style>
  :root{
    --ink:#0B0B0B; --sub:#3F3047; --stamp:#9A9A9A; --indigo:#817FCC; --rule:#F0F0F0; --soft:#D3D0CB; --bg:#fff;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Archivo',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.55}
  a{color:var(--ink);text-decoration:none;font-weight:500} a:hover{color:var(--indigo)}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;padding:22px 0;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:800;letter-spacing:-0.02em}
  nav{display:flex;gap:28px;font-size:15px;font-weight:500}
  nav a{color:var(--sub)}
  nav a.active{color:var(--ink);font-weight:600}
  .back{padding:20px 0 0;font-size:14px;display:inline-block;color:var(--sub)}
  main{padding:28px 0 60px;max-width:760px}
  h1{font-size:28px;font-weight:700;letter-spacing:-0.02em;line-height:1.25;margin:8px 0 8px;max-width:820px}
  .lead{font-size:17px;color:var(--sub);margin:0;line-height:1.5}
  .meta{font-size:14px;color:var(--stamp);margin:14px 0 0}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--indigo);display:inline-block;margin-right:6px;vertical-align:1px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:28px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .tile{padding:16px 16px 16px 0}
  .tile+.tile{padding-left:16px;border-left:1px solid var(--rule)}
  .tile .k{font-size:14px;color:var(--stamp);font-weight:600}
  .tile .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
  .tile .v.p{color:var(--indigo)}
  .tile .s{font-size:14px;color:var(--sub);margin-top:2px}
  section{border-top:1px solid var(--rule);margin-top:40px;padding-top:32px}
  h2{font-size:21px;line-height:1.3;margin:0 0 6px;font-weight:700}
  .answer{font-size:16px;color:var(--sub);margin:0 0 22px}
  .chartbox{width:100%}
  .chartbox svg{width:100%;height:auto;display:block;font-family:inherit}
  .small{font-size:15px;color:var(--stamp);margin:14px 0 0}
  .note{font-size:14px;color:var(--sub);margin:16px 0 0;padding:12px 16px;border-left:3px solid var(--soft)}
  .steps{list-style:none;margin:0;padding:0;counter-reset:s}
  .steps li{padding:12px 0 12px 34px;border-top:1px solid var(--rule);position:relative;font-size:15px;line-height:1.55}
  .steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:12px;width:22px;height:22px;border-radius:50%;border:1px solid var(--soft);font-size:14px;text-align:center;line-height:21px;color:var(--sub)}
  .steps small{display:block;font-size:14px;color:var(--stamp);margin-top:4px}
  .steps code{font-size:14px;color:var(--sub)}
  .notfound{padding:60px 0;font-size:18px;color:var(--sub)}
  footer.foot{border-top:1px solid var(--rule);margin-top:56px;padding-top:24px;padding-bottom:40px;font-size:15px;color:var(--sub)}
  footer.foot a{color:var(--ink);font-weight:500}
  @media(max-width:760px){
    header{padding:16px 0} main{padding:24px 0 48px} .back{padding:16px 0 0}
    /* Logo + nav must fit one row with nowhere to overflow the viewport --
       nav is the flexible member (min-width:0 lets a flex item shrink
       below its content size, which is what makes overflow-x:auto on it
       actually clip instead of pushing the whole page wider) and scrolls
       internally as one swipeable row rather than wrapping to a second
       line or blowing out the page's own width (SEB mobile rules). */
    header{flex-wrap:nowrap}
    .brand{flex-wrap:nowrap;gap:14px;min-width:0;flex:1 1 auto}
    .logo{white-space:nowrap;flex:0 0 auto}
    nav{flex:1 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;gap:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    nav::-webkit-scrollbar{display:none}
    nav a{white-space:nowrap;padding:12px 8px;font-size:15px;min-height:40px;display:flex;align-items:center}
  }
  @media(max-width:620px){
    .tiles{grid-template-columns:1fr 1fr}
    .tile:nth-child(3){padding-left:0;border-left:0}
    .tile:nth-child(n+3){border-top:1px solid var(--rule)}
    .small a,.meta a,p a,.answer a{display:inline-block;padding:6px 0;min-height:16px}
    .back{padding:10px 0}
  }
</style>
<style id="mwh-style">
header.mwh{display:flex!important;align-items:center!important;justify-content:flex-start!important;height:64px!important;min-height:0!important;margin:0 0 36px 0!important;padding:0!important;border:0!important;background:transparent!important;position:static!important;flex-wrap:nowrap!important;gap:0!important}
header.mwh .mwh-logo{font-family:'Archivo',system-ui,sans-serif!important;font-size:19px!important;font-weight:800!important;color:#0B0B0B!important;text-decoration:none!important;margin:0 28px 0 0!important;padding:0!important;letter-spacing:-.01em!important;white-space:nowrap!important;flex:none!important}
header.mwh nav{display:flex!important;gap:24px!important;align-items:center!important;overflow-x:auto!important;scrollbar-width:none!important;margin:0!important;padding:0!important;flex:1 1 auto!important;min-width:0!important}
header.mwh nav{position:static!important;inset:auto!important;transform:none!important;width:auto!important;height:auto!important;max-height:none!important;box-shadow:none!important;background:none!important;visibility:visible!important;opacity:1!important;flex-direction:row!important;border:0!important;z-index:auto!important}
header.mwh nav::-webkit-scrollbar{display:none}
header.mwh nav a{font-family:'Archivo',system-ui,sans-serif!important;font-size:15px!important;font-weight:500!important;color:#6B6B6B!important;text-decoration:none!important;padding:10px 0!important;margin:0!important;white-space:nowrap!important;border:0!important;background:none!important}
header.mwh nav a.active{color:#0B0B0B!important;font-weight:600!important}
header.mwh nav a:hover,header.mwh .mwh-logo:hover{color:#0B0B0B!important}
@media (max-width:620px){header.mwh{height:56px!important;margin-bottom:24px!important}header.mwh .mwh-logo{margin-right:16px!important;font-size:17px!important}header.mwh nav{gap:16px!important;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}header.mwh nav a{padding:12px 0!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mwh"><a class="mwh-logo" href="./index.html">margin.wiki</a><nav>
        <a href="./index.html">Home</a>
        <a href="./sending-money.html">Sending money</a>
        <a href="./the-index.html">Countries</a>
        <a href="./how-it-works.html">How it works</a>
        <a href="./machine-room.html">How it was built</a>
      </nav></header>

  <a class="back" href="./the-index.html">&larr; All countries</a>

  <main id="main">
    <div class="notfound" id="loading">Loading this country's full record&hellip;</div>
  </main>

  <footer class="foot">Every number on this site comes from a public data file. <a href="https://github.com/SebR214/margin">Code and raw data on GitHub &rarr;</a></footer>
</div>

<script>
(function(){
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  var PAR_EPSILON = 0.05;

  // Same phrasing family as the-index.html/home's headline sentence, but
  // built for a heading: "a dollar costs 91.7% more than the official
  // rate" reads as a finding, "the gap is +91.7%" does not (DESIGN.md
  // register rule). Near-zero collapses to "about the same" rather than
  // manufacturing a "-0.0% less" sentence from a rounding artifact (the
  // same -0.0% bug fixed on the home page, #212).
  function gapPhrase(pct){
    if (Math.abs(pct) < PAR_EPSILON) return 'costs about the same as the official rate';
    if (pct > 0) return 'costs ' + pct.toFixed(1) + '% more than the official rate';
    return 'costs ' + Math.abs(pct).toFixed(1) + '% less than the official rate';
  }
  // Same comparison, without repeating "than the official rate" -- used
  // inside the four-step receipt, where that comparison is already the
  // sentence's own subject (dividing by the official rate), so restating
  // it would just repeat itself.
  function gapPhraseShort(pct){
    if (Math.abs(pct) < PAR_EPSILON) return 'costs about the same';
    if (pct > 0) return 'costs ' + pct.toFixed(1) + '% more';
    return 'costs ' + Math.abs(pct).toFixed(1) + '% less';
  }
  function signedPct(pct){
    var v = Math.abs(pct) < PAR_EPSILON ? 0 : pct;
    return v.toFixed(1) + '%';
  }
  function pointsPhrase(delta){
    if (Math.abs(delta) < 0.05) return 'has held steady';
    return (delta > 0 ? 'is up ' : 'is down ') + Math.abs(delta).toFixed(1) + ' points';
  }

  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function shortDate(iso){ var d=new Date(iso); return isNaN(d)?'':d.getUTCDate()+' '+MONTHS[d.getUTCMonth()]; }
  function shortTime(iso){ var d=new Date(iso); return isNaN(d)?'':String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+' UTC'; }
  function sparkDates(hourUtc, n){
    var end = new Date(hourUtc), out = [];
    for (var i=0;i<n;i++){ var d=new Date(end); d.setUTCDate(d.getUTCDate()-(n-1-i)); out.push(d.toISOString()); }
    return out;
  }
  function fmtMoney(usd){ return '$' + Math.round(usd).toLocaleString('en-US'); }
  function fmtRate(v){ return Math.round(v).toLocaleString('en-US'); }

  // Where "most of the move" happened: the latest point from which at
  // least half of the total change to today is still ahead. Computed from
  // the real daily history each time, never written by hand -- this is a
  // sub-header adding supporting detail to the h2's finding, per DESIGN.md
  // ("headers say the finding, sub-headers only add supporting detail").
  function mostOfMoveDate(spark, dates, total){
    if (Math.abs(total) < 0.5 || spark.length < 3) return null;
    var last = spark[spark.length-1], bestI = null;
    for (var i=1;i<spark.length-1;i++){
      if (Math.abs(last - spark[i]) >= Math.abs(total) * 0.5) bestI = i;
    }
    return bestI != null ? dates[bestI] : null;
  }

  function niceTicks(min, max, target){
    var range = (max - min) || 1;
    var rawStep = range / target;
    var mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    var cand = [1,2,5,10], step = 10*mag;
    for (var i=0;i<cand.length;i++){ if (cand[i]*mag >= rawStep){ step = cand[i]*mag; break; } }
    var lo = Math.floor(min/step)*step, hi = Math.ceil(max/step)*step;
    var out = [];
    for (var v = lo; v <= hi + step/1000; v += step) out.push(Math.round(v*1000)/1000);
    return out;
  }

  // The gap-history chart: reads the container's REAL rendered width and
  // redraws on resize, so a narrow phone gets real 11px+ text, not a fixed
  // viewBox squeezed down by CSS (the sitewide mobile-chart bug fixed for
  // every page). No hover-only affordance -- the start point and the
  // current value are both drawn as permanent labels, so there is nothing
  // that only reveals itself on a mouseover a touch screen can't do.
  function drawGapChart(box, spark, dates){
    function draw(){
      var W = Math.max(280, box.clientWidth), H = W < 480 ? 200 : 230;
      var L = 4, R = 46, T = 26, B = 28;
      var ticks = niceTicks(Math.min.apply(null, spark), Math.max.apply(null, spark), 5);
      var lo = ticks[0], hi = ticks[ticks.length-1];
      var X = function(i){ return L + i*(W-L-R)/(spark.length-1); };
      var Y = function(v){ return T + (hi-v)/((hi-lo)||1)*(H-T-B); };
      var pts = spark.map(function(v,i){ return X(i).toFixed(1)+','+Y(v).toFixed(1); }).join(' ');
      var grid = '';
      ticks.forEach(function(v){
        grid += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="#F0F0F0"/>' +
          '<text x="'+(W-R+8)+'" y="'+(Y(v)+4).toFixed(1)+'" font-size="12" fill="#9A9A9A">'+v.toFixed(1)+'%</text>';
      });
      var ex = X(spark.length-1), ey = Y(spark[spark.length-1]);
      var lastText = spark[spark.length-1].toFixed(1) + '% this hour';
      var badgeW = Math.max(80, lastText.length*6.5 + 16);
      var startText = spark[0].toFixed(1) + '%';
      box.innerHTML = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gap history chart" style="display:block">' + grid +
        '<polygon points="'+X(0).toFixed(1)+','+(H-B)+' '+pts+' '+ex.toFixed(1)+','+(H-B)+'" fill="#D3D0CB" fill-opacity=".45"/>' +
        '<polyline points="'+pts+'" fill="none" stroke="#3F3047" stroke-width="2" stroke-linejoin="round"/>' +
        '<circle cx="'+X(0).toFixed(1)+'" cy="'+Y(spark[0]).toFixed(1)+'" r="3" fill="#3F3047"/>' +
        '<text x="'+(X(0)+2).toFixed(1)+'" y="'+(Y(spark[0])+18).toFixed(1)+'" font-size="12" fill="#3F3047">'+esc(startText)+'</text>' +
        '<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="4" fill="#0B0B0B"/>' +
        '<rect x="'+(ex-badgeW+4).toFixed(1)+'" y="'+(ey-26).toFixed(1)+'" width="'+badgeW+'" height="20" rx="4" fill="#EDEDED"/>' +
        '<text x="'+(ex-badgeW/2+4).toFixed(1)+'" y="'+(ey-12).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="600" fill="#0B0B0B">'+esc(lastText)+'</text>' +
        '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="#D3D0CB"/>' +
        '<text x="'+L+'" y="'+(H-8)+'" font-size="12" fill="#9A9A9A">'+esc(shortDate(dates[0]))+'</text>' +
        '<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="12" fill="#9A9A9A">'+esc(shortDate(dates[dates.length-1]))+'</text>' +
        '</svg>';
    }
    draw();
    window.addEventListener('resize', draw);
  }

  var params = new URLSearchParams(location.search);
  var ccy = (params.get('ccy') || '').toUpperCase();

  Promise.all([
    fetch('./data/index_latest.json', {cache:'no-store'}).then(r=>r.json()),
    fetch('./data/latest.json', {cache:'no-store'}).then(r=>r.json()).catch(()=>null),
    fetch('./data/street_depth_latest.json', {cache:'no-store'}).then(r=>r.json()).catch(()=>null)
  ]).then(function(res){
    var idx = res[0], raw = res[1], depthDoc = res[2];

    var country = (idx.countries || []).find(function(c){ return c.ccy === ccy; });
    var withheld = (idx.withheld || []).find(function(w){ return w.ccy === ccy; });
    var main = document.getElementById('main');

    if (!country && !withheld) {
      main.innerHTML = '<div class="notfound">No country found for code "' + esc(ccy || '(none given)') +
        '". <a href="./the-index.html">See every country on the index &rarr;</a></div>';
      return;
    }

    if (withheld && !country) {
      main.innerHTML =
        '<h1>' + esc(withheld.country) + ': no price this hour</h1>' +
        '<p class="lead">' + esc(withheld.reason) + '.</p>' +
        '<div class="note">A price is collected and checked every hour. ' + esc(withheld.country) +
        ' will show a number the moment it has enough evidence again. Nothing here is permanent.</div>' +
        '<p class="small"><a href="./the-index.html">&larr; All countries</a> &middot; ' +
        '<a href="./the-index.html#withheld">Every country without enough data &rarr;</a></p>';
      return;
    }

    // The headline everywhere on this page is the 24-hour median, the same
    // convention the home page and the-index.html use, so a reader never
    // sees two different "the gap right now" numbers on two pages. The
    // chart below still plots the raw daily series and its own end badge
    // still says "this hour" -- that is a different, narrower claim
    // (SEB: preserve the median convention for headlines, raw for charts).
    var headlinePct = country.median_24h_pct != null ? country.median_24h_pct : country.index_pct;
    var dates = country.spark ? sparkDates(country.hour_utc, country.spark.length) : [];
    var sinceLabel = dates.length ? shortDate(dates[0]) : null;

    var html = '<h1 class="num">' + esc(country.country) + ': a dollar ' + gapPhrase(headlinePct) + '</h1>' +
      '<p class="lead">What people pay for USDT on Binance P2P in ' + esc(country.country) +
      ', compared with the official rate.</p>' +
      '<p class="meta"><span class="dot"></span>Checked ' + esc(shortTime(country.hour_utc)) + ' &middot; median of the last 24 hours</p>';

    var p2p = raw && raw.p2p && raw.p2p[ccy];
    var isP2pSourced = (country.source_class || '').indexOf('p2p') === 0;
    var depth = isP2pSourced && depthDoc && depthDoc.countries && depthDoc.countries[ccy];

    html += '<div class="tiles">';
    if (p2p) {
      html += '<div class="tile"><div class="k">What people pay</div><div class="v num">' + fmtRate(p2p.buy_median) + ' ' + esc(ccy) + '</div><div class="s">per dollar, this hour</div></div>';
      html += '<div class="tile"><div class="k">Official rate</div><div class="v num">' + fmtRate(p2p.fx_mid_per_usd) + ' ' + esc(ccy) + '</div><div class="s">per dollar</div></div>';
    } else {
      html += '<div class="tile"><div class="k">What people pay</div><div class="v">not shown</div><div class="s">priced from an exchange, not person-to-person ads</div></div>';
      html += '<div class="tile"><div class="k">Official rate</div><div class="v">not shown</div><div class="s">not published for this source yet</div></div>';
    }
    if (depth) {
      html += '<div class="tile"><div class="k">You can buy now</div><div class="v p num">' + fmtMoney(depth.depth_usd) + '</div><div class="s">' +
        (depth.is_floor ? 'within ' + depth.threshold_pct + '% of the best price' : 'then the price moved') + '</div></div>';
    } else {
      html += '<div class="tile"><div class="k">You can buy now</div><div class="v">not enough data</div><div class="s">no order-book depth published for this source yet</div></div>';
    }
    html += '<div class="tile"><div class="k">Round trip</div><div class="v num">' + country.round_trip_pct.toFixed(1) + '%</div><div class="s">lost buying a dollar and selling it straight back</div></div>';
    html += '</div>';

    // ---- Gap over time ----
    if (country.spark && country.spark.length > 1) {
      var total = headlinePct - country.spark[0];
      var moveDate = mostOfMoveDate(country.spark, dates, total);
      // "rise"/"fall" mirrors pointsPhrase's own up/down language instead of
      // a direction-blind "move", matching the final mockup's copy (SEB).
      var moveNoun = total > 0.05 ? 'rise' : (total < -0.05 ? 'fall' : 'move');
      var moveVerb = moveNoun === 'rise' ? 'rose' : (moveNoun === 'fall' ? 'fell' : 'moved');
      html += '<section><h2 class="num">' + esc(country.country) + "'s gap " + pointsPhrase(total) +
        (sinceLabel ? ' since we started tracking it on ' + sinceLabel : '') + '</h2>' +
        '<p class="answer">' + (moveDate ? 'Most of the ' + moveNoun + ' came after ' + esc(shortDate(moveDate)) + '.' : 'It ' + moveVerb + ' gradually across the full period.') + '</p>' +
        '<div class="chartbox" id="gapChart"></div>' +
        '</section>';
    }

    // ---- How we get the number, in four steps ----
    if (p2p) {
      var nAds = country.n_sources != null ? Math.round(country.n_sources) : Math.round(p2p.n_ads || 0);
      var ratio = (p2p.buy_median / p2p.fx_mid_per_usd);
      html += '<section><h2 class="num">How we get ' + signedPct(headlinePct) + ', in four steps</h2>' +
        '<ol class="steps">' +
        '<li>We read the ' + nAds + ' cheapest ads selling USDT for ' + esc(ccy) + ' on Binance P2P. The middle price is <b class="num">' +
          p2p.buy_median.toLocaleString(undefined,{maximumFractionDigits:4}) + ' ' + esc(ccy) + '</b> per dollar.<small><code>data/p2p_basis.csv</code></small></li>' +
        '<li>We read ' + esc(country.country) + "'s official rate at the same time: <b class=\"num\">" +
          p2p.fx_mid_per_usd.toLocaleString(undefined,{maximumFractionDigits:4}) + ' ' + esc(ccy) + '</b> per dollar.<small><code>data/fx_rates.csv</code> &middot; this source updates once a day</small></li>' +
        '<li>' + p2p.buy_median.toLocaleString(undefined,{maximumFractionDigits:4}) + ' &divide; ' + p2p.fx_mid_per_usd.toLocaleString(undefined,{maximumFractionDigits:4}) +
          ' = ' + ratio.toFixed(3) + ', so a dollar <b class="num">' + gapPhraseShort(country.index_pct) + '</b> this hour. The headline is the median of the last 24 hours: <b class="num">' +
          signedPct(headlinePct) + '</b>.<small><code>data/index_latest.json</code></small></li>' +
        (depth
          ? '<li>We check how many dollars are on offer near the best price: <b class="num">' + depth.n_ads_held + ' of the ' + depth.n_ads_priced +
            ' sellers</b>, about <b class="num">' + fmtMoney(depth.depth_usd) + '</b>, are within ' + depth.threshold_pct + '% of the best price' +
            (depth.is_floor ? '.' : '. Beyond that, the price moves.') + '<small><code>data/street_depth_latest.json</code></small></li>'
          : '') +
        '</ol>' +
        '</section>';
    } else {
      html += '<section><h2 class="num">How we get ' + signedPct(headlinePct) + '</h2>' +
        '<p class="answer">Priced from an exchange order book (' + esc(country.source_class || '') +
        '), not person-to-person ads. The published figure is real, from ' + esc(country.source_file) +
        ', but the raw per-venue price and official rate this page shows for other countries are not in a published file yet for this source type.</p>' +
        '</section>';
    }

    main.innerHTML = html;

    if (country.spark && country.spark.length > 1) {
      drawGapChart(document.getElementById('gapChart'), country.spark, dates);
    }
  }).catch(function(){
    document.getElementById('main').innerHTML = '<div class="notfound" style="color:var(--ink)">Could not load this country\'s data. That failure is shown, not hidden.</div>';
  });
})();
</script>
</body>
</html>
