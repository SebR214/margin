<noscript><style>body > *:not(noscript){display:none !important}</style><div>
<div id="app"><div class="wrap"><header class="fp-head"><div class="fp-brand"><a class="fp-logo mono" href="./index.html">margin.wiki</a><nav class="fp-nav" id="sh-nav"><a href="./countries.html">Countries</a><a href="./events.html">Events</a><a href="./research.html" aria-current="page">Research</a><a href="./sending-money.html">Routes</a><span class="sh-about"><span class="sh-about-label">About the data</span><a href="./sources.html">Sources</a><a href="./how-it-works.html">How it works</a></span></nav><button type="button" class="sh-menu" aria-expanded="false" aria-controls="sh-nav">Menu</button></div><div class="mono muted hp-clock"><span class="hp-dot"></span><span>Last reading 1 Nov, 23:15 UTC</span><span>Next in 26:46</span></div></header><a class="fp-back" href="./research.html">Research</a><div class="fp-hero"><div class="fp-hero-text"><h1>Markets inside one country disagree</h1><p class="soft fp-line">In some countries every exchange agrees on the price of a dollar. In others, two exchanges sit several percent apart, so the price depends on where you look.</p><p class="muted fp-note">From our own hourly checks, not exchange history. Our own checks run to 1 Nov 2026.</p></div></div><section class="fp-sec"><div class="fp-sec-head"><h2>What the numbers say</h2></div><p class="fp-line rs-result">In 19 of 50 countries, the two exchanges furthest apart usually sit within 0.5% of each other.</p><p class="fp-line rs-result">In 14 countries, two exchanges usually sit 3% or more apart. The furthest apart are India, Tunisia, Nepal, Bangladesh, Sri Lanka, Qatar, Turkey, Zambia.</p></section><section class="fp-sec"><div class="fp-sec-head"><h2>The countries furthest apart</h2></div><div class="rs-list"><a class="rs-item" href="./country/inr/"><span class="rs-item-body"><span class="rs-item-title">India</span><span class="rs-item-line">CoinDCX and OKX usually sat 24% apart, over 83 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/tnd/"><span class="rs-item-body"><span class="rs-item-title">Tunisia</span><span class="rs-item-line">Binance and OKX usually sat 20% apart, over 594 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/npr/"><span class="rs-item-body"><span class="rs-item-title">Nepal</span><span class="rs-item-line">Binance and OKX usually sat 15% apart, over 35 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/bdt/"><span class="rs-item-body"><span class="rs-item-title">Bangladesh</span><span class="rs-item-line">Binance and OKX usually sat 9.8% apart, over 188 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/lkr/"><span class="rs-item-body"><span class="rs-item-title">Sri Lanka</span><span class="rs-item-line">Binance and OKX usually sat 8.8% apart, over 616 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/qar/"><span class="rs-item-body"><span class="rs-item-title">Qatar</span><span class="rs-item-line">Binance and OKX usually sat 8.6% apart, over 616 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/try/"><span class="rs-item-body"><span class="rs-item-title">Turkey</span><span class="rs-item-line">BTCTurk and OKX usually sat 6.0% apart, over 616 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/zmw/"><span class="rs-item-body"><span class="rs-item-title">Zambia</span><span class="rs-item-line">Binance and OKX usually sat 5.6% apart, over 443 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/bwp/"><span class="rs-item-body"><span class="rs-item-title">Botswana</span><span class="rs-item-line">Binance and OKX usually sat 4.8% apart, over 531 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/mzn/"><span class="rs-item-body"><span class="rs-item-title">Mozambique</span><span class="rs-item-line">Binance and OKX usually sat 4.2% apart, over 423 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/lak/"><span class="rs-item-body"><span class="rs-item-title">Laos</span><span class="rs-item-line">Binance and OKX usually sat 3.7% apart, over 616 hours.</span></span><span class="rs-item-go">→</span></a><a class="rs-item" href="./country/rwf/"><span class="rs-item-body"><span class="rs-item-title">Rwanda</span><span class="rs-item-line">Binance and OKX usually sat 3.5% apart, over 615 hours.</span></span><span class="rs-item-go">→</span></a></div></section><section class="fp-sec"><div class="fp-sec-head"><h2>How we worked it out</h2></div><p class="soft fp-line">Every hour we line up each exchange's price for a dollar in the country. For each pair of exchanges we take how far apart they usually sat over the last 30 days. A pair needs at least 24 hours in common to count.</p><p class="soft fp-line">For each country the list shows the pair that sat furthest apart.</p><p class="soft fp-line">Two exchanges can differ because one is harder to use, not because one is wrong. A big gap is a question, not a verdict.</p></section><footer class="site-footer"><p>Every number on this site comes from a public data file.</p><p class="site-links"><a href="https://github.com/SebR214/margin">Code and raw data on GitHub</a></p></footer></div></div>
