  <div class="hero" id="hero" style="display: flex; flex-direction: column;"><h1>People do not always pay the official rate for a dollar</h1><p class="lead sub">Where banks ration dollars, people buy stablecoins from each other and pay more.</p><p class="lead what">We compare what a dollar costs in 55 countries with the official rate every hour. On 11 routes we also check what it costs to send money there, by transfer app and by stablecoin, with every fee we can measure. Where a dollar costs more than the official rate, a stablecoin can be the cheaper way to send.</p><p class="body agents"><a href="./how-it-was-built.html">AI agents built this site and keep it running. So far they have stored 628,890 prices over 1,680 hours, from 41 of the 49 sources we read every hour.</a></p></div>

  <section id="land"><h2>When the official rate finally moved</h2><p class="note">In the history we hold, an official rate jumped 10% or more 5 times while a dollar already cost at least 10% more on exchanges. Each row shows the gap before the jump and after it.</p><p class="note">Argentina, December 2023: a dollar cost 151% more on exchanges than at the official rate. Three weeks after the jump, the official rate had closed 82% of that gap.</p><div class="rows lrows"><a class="r lr" href="./country/ars/"><b>Argentina<small class="d">Dec 2023</small></b><span class="m lba num">Gap 151% before, 27.7% after</span><span class="v num">82%<small>of the gap closed</small></span></a><a class="r lr" href="./country/ars/"><b>Argentina<small class="d">Aug 2023</small></b><span class="m lba num">Gap 106% before, 79.9% after</span><span class="v num">25%<small>of the gap closed</small></span></a><a class="r lr" href="./country/uah/"><b>Ukraine<small class="d">Jul 2022</small></b><span class="m lba num">Gap 25.2% before, 0.2% after</span><span class="v num">99%<small>of the gap closed</small></span></a><a class="r lr" href="./country/ars/"><b>Argentina<small class="d">Dec 2015</small></b><span class="m lba num">Gap 54.4% before, 14.2% after</span><span class="v num">74%<small>of the gap closed</small></span></a><a class="r lr" href="./country/ars/"><b>Argentina<small class="d">Jan 2014</small></b><span class="m lba num">Gap 64.2% before, 47.5% after</span><span class="v num">26%<small>of the gap closed</small></span></a></div><p class="note sm">From exchange history, not our own checks. The gap before is the typical exchange price in the second week before the jump against the official rate. The new official rate is its typical value in the third week after it.</p></section>
