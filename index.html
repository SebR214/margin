<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>margin.wiki</title>
<meta name="description" content=""/>
<link rel="stylesheet" href="./style.css">
<style>
  /* Home (SEB-268), rebuilt to the approved reference. Header, column, title and pill styles are the shared ones
     (css/site_head.css, css/site_page.css). Colours are the style.css tokens. Every word is in copy.json, homeData. */
  .num { font-variant-numeric: tabular-nums; }
  .wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 32px 96px; box-sizing: border-box; }
  .hero { padding: 40px 0 0; max-width: 760px; }
  .lead { margin: 0; max-width: 680px; }
  .body { margin: 0; max-width: 680px; font-size: 16px; }
  .body a { color: var(--color-ink); }
  .counts { display: flex; flex-wrap: wrap; gap: 6px 22px; margin: 6px 0 0; font-size: 15px; color: var(--color-neutral-700); }
  .counts b { color: var(--color-ink); font-weight: 600; }
  section { margin-top: 48px; }
  h2 { margin: 0 0 8px; }
  .note { margin: 0 0 16px; font-size: 15px; color: var(--color-neutral-700); max-width: 680px; }
  .note.sm { font-size: 14px; margin-top: 12px; }
  .pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .pills.hb { margin-top: 14px; }

  .key { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin: 0 0 14px; font-size: 13px; color: var(--color-neutral-700); }
  .key i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 7px; }
  .b0 { background: var(--data-300); } .b1 { background: var(--data-500); } .b2 { background: var(--data-600); } .b3 { background: var(--data-700); } .b4 { background: var(--color-neutral-900); }
  .b-none { background: var(--color-neutral-200); } .b-frozen { background: var(--color-neutral-300); }
  .b-neg { background: repeating-linear-gradient(135deg, var(--data-500) 0 2px, var(--color-bg) 2px 4px); }
  .hax, .hrow { display: grid; grid-template-columns: 180px 1fr 110px; gap: 0 16px; align-items: center; }
  .hax { height: 22px; font-size: 12px; color: var(--color-neutral-600); }
  .hax .ax { position: relative; height: 22px; }
  .hax .ax span { position: absolute; bottom: 4px; transform: translateX(-50%); white-space: nowrap; }
  .hax .ax span.l { transform: none; }
  .hax .axh { text-align: right; }
  .hrow { min-height: 24px; padding: 2px 0; color: inherit; text-decoration: none; }
  .hrow:hover { background: var(--color-neutral-100); }
  .hrow .nm { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hrow:hover .nm { color: var(--data-700); }
  .cells { display: flex; gap: 2px; height: 16px; }
  .cells i { flex: 1 1 0; min-width: 0; border-radius: 2px; }
  .cells i.on { outline: 2px solid var(--color-ink); outline-offset: 1px; }
  .hrow .v { text-align: right; font-size: 14px; font-weight: 600; }
  .hrow .v small { font-weight: 400; color: var(--color-neutral-600); font-size: 12px; }
  .hrow.frozen .v { color: var(--color-neutral-600); }

  .rows { border-top: 1px solid var(--color-neutral-200); }
  .r { display: grid; grid-template-columns: 260px 1fr 140px; gap: 0 24px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--color-neutral-200); color: inherit; text-decoration: none; }
  .r b { font-weight: 600; font-size: 15px; }
  .r .v { text-align: right; font-weight: 600; font-size: 15px; white-space: nowrap; }
  .r .v small { display: block; font-size: 12px; color: var(--color-neutral-600); font-weight: 400; }
  .r .m { font-size: 14px; color: var(--color-neutral-700); }
  .r.f { grid-template-columns: 48px 1fr 40px; }
  .r .no { color: var(--color-neutral-600); font-size: 14px; }
  .r.f .m { font-size: 15px; color: var(--color-ink); }
  a.r:hover b, a.r:hover .m { color: var(--data-700); }
  .sechead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
  #rec section { margin-top: 0; }
  .loaderr { margin-top: 24px; color: var(--color-neutral-700); }

  @media (max-width: 700px) { .wrap { padding: 0 24px 64px; } }
  @media (max-width: 620px) {
    .hax, .hrow { grid-template-columns: 96px 1fr 58px; gap: 0 8px; }
    .cells { gap: 1px; height: 14px; }
    .hrow .nm { font-size: 13px; }
    .hrow .v { font-size: 12px; }
    .hrow .v small { font-size: 10px; }
    .hax .ax span:not(.l):not(.r) { display: none; }
    .r { grid-template-columns: 1fr auto; }
    .r .m { grid-column: 1 / -1; grid-row: 2; margin-top: 4px; }
    .r.f { grid-template-columns: 32px 1fr 24px; }
    .r.f .m { grid-column: 2; grid-row: 1; margin: 0; }
  }
</style>
<link rel="stylesheet" href="./css/dkpanel.css">
<link rel="stylesheet" href="./css/record_block.css">
<link rel="stylesheet" href="./css/site_head.css?v=4">
<link rel="stylesheet" href="./css/site_page.css?v=1">
</head>
<body>
<div class="wrap">
  <div class="hp-head">
    <div class="hp-headleft">
      <a class="hp-logo" href="./index.html">margin.wiki</a>
      <nav class="hp-nav" aria-label="Main" id="nav"></nav>
    </div>
  </div>

  <div class="hero" id="hero"></div>

  <section>
    <h2 id="heatT"></h2>
    <p class="note" id="heatL"></p>
    <div id="heat"></div>
  </section>
  <section id="movers"></section>
  <section id="finds"></section>
  <section id="rec"></section>
  <p class="loaderr" id="loaderr" hidden></p>
</div>
<script src="./js/tooltip.js"></script>
<script src="./js/record_block.js"></script>
<script src="./js/home.js"></script>
<script src="./js/footer.js"></script>
<script src="./js/site_head.js?v=3"></script>
</body>
</html>
