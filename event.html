<link rel="stylesheet" href="./style.css">
<style>
  /* The routes page (SEB-310 item 2): one question, how much of a country's dollar premium survives the trip. One table, one
     chart, a short list of the biggest moves. Archivo, a 760px column and the chart palette of DESIGN.md. Colours of the
     chart lines: the destination sets the colour, the sending country sets the dash. */
  :root{
    --sm-ink:var(--color-ink); --sm-sub:var(--color-neutral-700); --sm-stamp:var(--color-neutral-600); --sm-rule:var(--color-neutral-200);
    --sm-peri:var(--data-700); --sm-dust:var(--color-neutral-300); --sm-grape:var(--color-neutral-900);
  }
  body.sm-body{ background:#fff; color:var(--sm-ink); font-size:17px; line-height:1.55; }
  .sm-wrap{ max-width:760px; margin:0 auto; padding:0 24px 64px; }
  .sm-wrap a{ color:var(--sm-ink); text-decoration:none; font-weight:500; }
  .sm-num{ font-variant-numeric:tabular-nums; }

  .sm-head{ display:flex; align-items:center; gap:28px; padding:20px 0; }
  .sm-logo{ font-size:18px; font-weight:600; letter-spacing:-.02em; flex:none; }
  .sm-nav{ display:flex; gap:4px; font-size:15px; font-weight:500; min-width:0; }
  .sm-nav a{ padding:10px; color:var(--sm-sub); min-height:44px; display:inline-flex; align-items:center; }
  .sm-nav a[aria-current]{ color:var(--sm-ink); font-weight:700; }

  .sm-hero{ padding:24px 0 0; display:flex; flex-direction:column; gap:12px; }
  .sm-hero h1{margin:0;max-width:640px;}
  .sm-lead{margin:0;max-width:620px;}
  .sm-meta{ margin:0; font-size:14px; color:var(--sm-stamp); }

  .sm-wrap section{ margin-top:48px; }
  .sm-wrap h2{margin:0 0 6px;}
  .sm-note{ margin:0 0 14px; font-size:15px; color:var(--sm-sub); max-width:620px; }
  .sm-small{ font-size:14px; color:var(--sm-sub); margin:12px 0 0; max-width:620px; }

  /* the chart: the street price and the official rate, both in local money for one dollar, so one scale */
  .sm-chart{ position:relative; margin-top:12px; }
  .sm-chart svg{ display:block; width:100%; height:auto; overflow:visible; }
  .sm-chart .sm-ax{ fill:var(--color-neutral-600); font:400 11px 'Archivo',system-ui,sans-serif; }
  .sm-chart .sm-grid{ stroke:var(--color-neutral-200); stroke-width:1; }
  .sm-chart .sm-ln{ fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .sm-chart .sm-mark{ stroke:var(--color-ink); stroke-width:1; stroke-dasharray:3 3; }
  .sm-chart .sm-marklbl{ fill:var(--color-ink); font:500 11px 'Archivo',system-ui,sans-serif; }
  .sm-chart .sm-cross{ stroke:var(--color-neutral-600); stroke-dasharray:3 3; }
  .sm-tip{ position:absolute; top:0; background:#fff; border:1px solid var(--sm-dust); border-radius:6px; padding:8px 10px; font-size:13px; line-height:1.4; pointer-events:none; white-space:nowrap; z-index:2; }
  .sm-tip b{ display:block; font-weight:600; margin-bottom:2px; }
  .sm-tip i{ display:inline-block; width:14px; height:0; border-top:2px solid; margin-right:8px; vertical-align:middle; }
  .sm-keys{ list-style:none; padding:0; margin:14px 0 0; display:flex; flex-wrap:wrap; gap:6px 24px; font-size:14px; color:var(--sm-sub); }
  .sm-keys i{ display:inline-block; width:22px; height:0; border-top:2px solid; margin-right:8px; vertical-align:middle; }

  /* before and after: one row per price, three columns of days */
  .ev{ width:100%; border-collapse:collapse; margin-top:16px; }
  .ev th{ text-align:left; font-size:14px; font-weight:500; line-height:1.3; color:var(--sm-sub); padding:0 14px 10px 0; border-bottom:1px solid var(--sm-ink); vertical-align:bottom; }
  .ev td{ padding:14px 14px 14px 0; border-bottom:1px solid var(--sm-rule); vertical-align:top; font-size:15px; line-height:1.35; }
  .ev td.ev-nm{ font-weight:500; }
  .ev td small{ display:block; font-size:14px; color:var(--sm-stamp); margin-top:2px; }
  .ev tr:last-child td{ border-bottom:0; }
  .ev caption{ position:absolute; left:-9999px; }
  .sm-facts{ list-style:none; padding:0; margin:12px 0 0; }
  .sm-facts li{ padding:12px 0; border-bottom:1px solid var(--sm-rule); font-size:15px; line-height:1.4; }
  .sm-facts li:first-child{ border-top:1px solid var(--sm-ink); }

  .sm-wrap footer{ border-top:1px solid var(--sm-rule); margin-top:48px; padding:24px 0 48px; font-size:14px; color:var(--sm-stamp); }
  .sm-wrap footer p{ margin:0 0 6px; }

  @media (max-width:620px){
    .ev,.ev tbody,.ev tr,.ev td{ display:block; width:auto; }
    .ev thead{ position:absolute; left:-9999px; }
    .ev tr{ padding:14px 0; border-bottom:1px solid var(--sm-rule); }
    .ev td{ border:0; padding:3px 0; display:flex; justify-content:space-between; gap:16px; text-align:right; }
    .ev td::before{ content:attr(data-label); color:var(--sm-sub); text-align:left; flex:none; max-width:55%; }
    .ev td.ev-nm{ display:block; text-align:left; font-size:17px; padding-bottom:6px; }
    .ev td.ev-nm::before{ content:none; }
    .ev-v{ text-align:right; white-space:nowrap; }
  }
</style>

<link rel="stylesheet" href="./css/site_page.css?v=7">
</head>
<body class="sm-body">
<div id="app"></div>
<script src="./js/event.js?v=1"></script>
<script src="./js/tooltip.js"></script>
<script src="./js/site_head.js?v=4"></script>
<script src="./js/footer.js" data-links-only></script>
</body>
</html>
