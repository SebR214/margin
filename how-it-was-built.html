  <div class="hero">
    <h1 id="pageTitle">Plain code makes every number. AI only helps build the site.</h1>
    <p class="lead" id="pageLede">The collector and the checks are plain code. The builder uses AI to write some of the code, and one person writes the rest.</p>
    <div class="tiles" id="tiles"><div class="tile"><div class="v">$5.27</div><div class="l">Spent on builds</div></div><div class="tile"><div class="v">5</div><div class="l">Builds merged</div></div><div class="tile"><div class="v">$1.05</div><div class="l">Cost per merged build</div></div><div class="tile"><div class="v">3 days</div><div class="l">Since the last merge</div></div></div>
    <p class="note" id="totalsNote">Spent counts the builder's runs. Every model call together, since 7 Oct, comes to $7.35. All of it is held to $20 a month.</p>
  </div>

  <section>
    <h2 id="rolesHeading">Each part has one job and cannot do the others'</h2>
    <p class="p" id="rolesAnswer">The builder can't approve its own work. No AI ever calculates a number.</p>
    <table class="t" id="rolesTable"><thead><tr><th>Part</th><th>How often</th><th>What it does</th></tr></thead><tbody><tr><td data-label="Part">Collector</td><td data-label="How often">About every 30 minutes</td><td data-label="What it does">Pulls prices from exchanges, transfer apps and official rates about every 30 minutes and keeps one price per hour. Plain code, no AI.</td></tr><tr><td data-label="Part">Builder</td><td data-label="How often">Up to 3 jobs a day</td><td data-label="What it does">Takes the top ready job from a list a person writes and builds it as new files. Uses AI. It can't change existing price collection, pages or methods. It and every other model call together can spend at most $20 a month.</td></tr><tr><td data-label="Part">Checks</td><td data-label="How often">Every change</td><td data-label="What it does">Run tests on every change, recalculate published numbers from the saved files and merge the change when every test is green. Plain code, no AI. A change to how prices are collected that adds nothing new waits for a person.</td></tr><tr><td data-label="Part">Person</td><td data-label="How often">As needed</td><td data-label="What it does">Sets the direction, holds the money and passwords, and writes what the builder skips, using AI sessions of their own.</td></tr></tbody></table>
  </section>

    <h2 id="whereHeading">What runs where</h2>
    <p class="p" id="whereIntro">Every job runs on GitHub Actions. Times are Singapore time.</p>
    <table class="t" id="whereTable"><thead><tr><th>Job</th><th>When</th><th>What it does</th><th>Last run</th></tr></thead><tbody><tr><td data-label="Job">Builder</td><td data-label="When">Every day at 13:07, 16:37, 21:07</td><td data-label="What it does">Builds the top ready job with AI and opens a change.</td><td data-label="Last run">Succeeded (2 Nov 22:17 UTC)</td></tr><tr><td data-label="Job">Merge when green</td><td data-label="When">After the checks finish on a change</td><td data-label="What it does">Merges a change when every check is green.</td><td data-label="Last run">Succeeded (3 Nov 04:18 UTC)</td></tr><tr><td data-label="Job">Checks</td><td data-label="When">On every change</td><td data-label="What it does">Runs the tests and page checks a change must clear.</td><td data-label="Last run">Running (3 Nov 04:13 UTC)</td></tr><tr><td data-label="Job">Reader test</td><td data-label="When">By hand</td><td data-label="What it does">Compares two models reading the pages. Changes nothing.</td><td data-label="Last run">Succeeded (5 Oct 09:28 UTC)</td></tr><tr><td data-label="Job">Collection</td><td data-label="When">About every 30 minutes, each run starts the next</td><td data-label="What it does">Collects prices, rebuilds the pages and saves the data.</td><td data-label="Last run">Running (3 Nov 04:05 UTC)</td></tr><tr><td data-label="Job">Collection alarm</td><td data-label="When">Every 30 minutes</td><td data-label="What it does">Watches collection from outside and sends an alarm when it goes quiet.</td><td data-label="Last run">Running (3 Nov 04:15 UTC)</td></tr><tr><td data-label="Job">Fee check</td><td data-label="When">Day 1 of each month at 11:23</td><td data-label="What it does">Checks the fee tiers each month.</td><td data-label="Last run">Succeeded (1 Nov 10:39 UTC)</td></tr><tr><td data-label="Job">History pull</td><td data-label="When">By hand</td><td data-label="What it does">Pulls older price history from public sources. Never feeds a price.</td><td data-label="Last run">Succeeded (22 Oct 17:30 UTC)</td></tr><tr><td data-label="Job">Older builder</td><td data-label="When">By hand</td><td data-label="What it does">The older builder, run only by hand.</td><td data-label="Last run">Succeeded (23 Oct 17:03 UTC)</td></tr><tr><td data-label="Job">Outside check</td><td data-label="When">After each deploy of the site</td><td data-label="What it does">Asks the live site what a search engine would ask.</td><td data-label="Last run">Succeeded (3 Nov 03:49 UTC)</td></tr><tr><td data-label="Job">Marketplace probe</td><td data-label="When">Sundays at 11:11</td><td data-label="What it does">Re-checks which boards where people sell to each other are usable.</td><td data-label="Last run">Succeeded (1 Nov 10:21 UTC)</td></tr><tr><td data-label="Job">Audit alarm</td><td data-label="When">Every hour, at minutes 11, 41</td><td data-label="What it does">Sends an alarm when the audits or the builder's runner stop working.</td><td data-label="Last run">Running (3 Nov 04:00 UTC)</td></tr><tr><td data-label="Job">writer</td><td data-label="When">By hand</td><td data-label="What it does"></td><td data-label="Last run">Failed (1 Nov 09:45 UTC)</td></tr></tbody></table>

  <section id="incidents">
    <h2 id="incHeading">Incidents</h2>
    <p class="p" id="incIntro">Newest first. A gap in the data stays a gap.</p>
    <div id="incList"><div class="inc"><div class="d">28 to 31 Oct 2026</div><h3>Collection stopped for two days</h3><dl><dt>What broke</dt><dd>A table of seller ads grew to 99.6 MB. GitHub refuses a file over 100 MB, so every save of new prices failed.</dd><dt>How long</dt><dd>The last stored hour was 28 Oct 20:00 UTC and the next was 31 Oct 04:00 UTC, 56 hours apart.</dd><dt>What was lost</dt><dd>Every hour in that gap. Missed hours stay missing and are never filled in.</dd><dt>What fixed it</dt><dd>The big tables now write one file a day. A size check fails the run before the save. One alarm now covers collection.</dd><dt>Changes</dt><dd><a href="https://github.com/SebR214/margin/pull/719">719</a>, <a href="https://github.com/SebR214/margin/pull/720">720</a></dd></dl></div><div class="inc"><div class="d">31 Oct 2026</div><h3>Two tests turned the main branch red</h3><dl><dt>What broke</dt><dd>Tests that read the real data files failed as the hours moved on, so checks on the main branch went red.</dd><dt>How long</dt><dd>Not recorded.</dd><dt>What was lost</dt><dd>Not recorded.</dd><dt>What fixed it</dt><dd>The gas test now uses fixed hours of its own. The research pieces are rebuilt before the claims check.</dd><dt>Changes</dt><dd><a href="https://github.com/SebR214/margin/pull/734">734</a>, <a href="https://github.com/SebR214/margin/pull/736">736</a></dd></dl></div><div class="inc"><div class="d">25 to 27 Oct 2026</div><h3>Two builds merged with empty files</h3><dl><dt>What broke</dt><dd>The builder opened changes whose new files were empty. The checks were green and the changes merged.</dd><dt>How long</dt><dd>The builder first stopped an empty result on 29 Oct.</dd><dt>What was lost</dt><dd>A finding retest and a new price source that were marked built and did nothing.</dd><dt>What fixed it</dt><dd>A merge now counts only if its files are not empty. This page counts that way.</dd><dt>Changes</dt><dd><a href="https://github.com/SebR214/margin/pull/696">696</a>, <a href="https://github.com/SebR214/margin/pull/701">701</a></dd></dl></div><div class="inc"><div class="d">22 Oct 2026</div><h3>The builder rewrote lines it should not touch</h3><dl><dt>What broke</dt><dd>In its first two changes the builder edited existing price code. One change would have altered the source link on every route. The other rewrote four existing entries.</dd><dt>How long</dt><dd>Both changes were closed by hand the same morning.</dd><dt>What was lost</dt><dd>Nothing. Neither change merged.</dd><dt>What fixed it</dt><dd>A check now refuses any change to an existing price collector. The builder tries again until its change only adds.</dd><dt>Changes</dt><dd><a href="https://github.com/SebR214/margin/pull/629">629</a>, <a href="https://github.com/SebR214/margin/pull/632">632</a>, <a href="https://github.com/SebR214/margin/pull/640">640</a></dd></dl></div><div class="inc"><div class="d">Before 23 Sep 2026</div><h3>A key spent $10 in 20 minutes</h3><dl><dt>What broke</dt><dd>A settings change put the key billed for each use where the flat-rate login belonged. Every agent run billed for each use.</dd><dt>How long</dt><dd>About 20 minutes.</dd><dt>What was lost</dt><dd>About $10 of credit.</dd><dt>What fixed it</dt><dd>The two keys now live in separate files, with a note where each is used saying why they must never be mixed.</dd></dl></div></div>
  </section>
