<style>
  :root{ --ink:var(--color-ink); --sub:var(--color-neutral-600); --stamp:var(--color-neutral-500); --indigo:var(--color-neutral-600); --rule:var(--color-neutral-200); }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Archivo',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);background:var(--color-bg)}
  a{color:var(--ink);text-decoration:none} a:hover{color:var(--indigo)}
  .num{font-variant-numeric:tabular-nums}
  .wrap{max-width:1280px;margin:0 auto;padding:0 32px}
  header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;flex-wrap:wrap;gap:12px}
  .brand{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:600;letter-spacing:-0.02em}
  nav{display:flex;gap:28px;font-size:15px;font-weight:500;color:var(--color-neutral-800);flex-wrap:wrap}
  nav a.active{color:var(--ink);font-weight:600}
  .live{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;color:var(--color-neutral-600)}
  .header-right{display:flex;align-items:center;gap:16px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--indigo)}
  .p{font-size:17px;line-height:1.6;color:var(--color-ink);margin:0}
  .p b{font-weight:600}
  .callout{background:var(--color-neutral-100);border-radius:14px;padding:20px 24px;margin-top:22px;font-size:17px;line-height:1.6;color:var(--color-neutral-800)}
  .callout b{color:var(--color-ink)}
  .cite{font-size:13px;color:var(--color-neutral-500);padding-top:8px}
  .cite a{font-weight:600;color:var(--color-neutral-600)}
  .cite a:hover{color:var(--indigo)}
  .sources{margin-top:96px;font-size:14px;color:var(--color-neutral-500);line-height:1.7}
  .sources a{font-weight:600;color:var(--color-neutral-600)}
  

  .nav-toggle{display:none;background:none;border:0;font-size:20px;cursor:pointer;padding:6px 8px;color:var(--color-ink);line-height:1}
  @media(max-width:760px){
    header{position:relative;flex-wrap:nowrap!important}
    .brand{gap:14px}
    nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--color-bg);flex-direction:column!important;gap:0!important;padding:6px 24px 16px;border-bottom:1px solid var(--color-neutral-200);box-shadow:0 8px 16px rgba(11,11,11,0.06);z-index:30}
    nav.open{display:flex}
    nav a{padding:12px 0;border-bottom:1px solid var(--color-neutral-100);font-size:16px}
    .nav-toggle{display:block}
  }

  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--color-ink)}
  .tile{padding:16px 16px 4px 0}
  .tile+.tile{padding-left:16px;border-left:1px solid var(--rule)}
  .tile .v{font-size:24px;font-weight:500;letter-spacing:0;line-height:1.1;font-variant-numeric:tabular-nums}
  .tile .l{font-size:14px;color:var(--sub);padding-top:6px}
  .note{font-size:14px;line-height:1.6;color:var(--sub)}
  .chartbox{margin-top:20px}
  .chartbox svg{width:100%;height:auto;display:block;max-width:720px}
  .legend{display:flex;gap:20px;font-size:14px;color:var(--sub);padding-top:8px}
  .legend svg{width:10px;height:10px;margin-right:6px}
  .ctitle{font-size:15px;font-weight:600;padding-top:24px}
  table.t{width:100%;border-collapse:collapse;margin-top:24px;font-size:15px}
  table.t th{font-size:13px;font-weight:600;color:var(--sub);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--color-ink)}
  table.t td{padding:10px 12px 10px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.5}
  table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
  #rolesTable td:nth-child(-n+2){white-space:nowrap}
  .inc{border-top:1px solid var(--rule);padding:22px 0 6px}
  .inc:first-of-type{border-top:1px solid var(--color-ink);margin-top:24px}
  .inc .d{font-size:13px;color:var(--stamp);font-weight:600}
  .inc h3{font-size:18px;font-weight:500;margin:6px 0 10px;letter-spacing:0}
  .inc dl{margin:0;display:grid;grid-template-columns:150px 1fr;gap:8px 20px;font-size:15px;line-height:1.55}
  .inc dt{color:var(--sub)}
  .inc dd{margin:0}
  .inc dd a{font-weight:600;color:var(--color-neutral-600)}
  @media(max-width:700px){
    .tiles{grid-template-columns:1fr 1fr}
    .tile:nth-child(odd){padding-left:0;border-left:0}
    .tile:nth-child(n+3){border-top:1px solid var(--rule);margin-top:12px;padding-top:16px}
    .tile .v{font-size:20px}
    table.t thead{display:none}
    table.t,table.t tbody,table.t tr,table.t td{display:block;width:100%}
    table.t tr{padding:10px 0;border-bottom:1px solid var(--rule)}
    table.t td{border:0;padding:3px 0;text-align:left!important}
    table.t td::before{content:attr(data-label);display:block;font-size:13px;color:var(--sub)}
    .inc dl{grid-template-columns:1fr;gap:2px}
    .inc dd{padding-bottom:8px}
  }
</style>
