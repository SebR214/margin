ket. A gap here is the price on those exchanges, not what every person paid.</p><p class="soft fp-line">Some years have only one exchange, and countries with no history are not shown. We did not see these prices ourselves.</p></section><section class="fp-sec"><div class="fp-sec-head"><h2>Get the numbers</h2></div><div class="rs-dl"><a class="fp-back" href="./data/research/capital_controls.csv" download="">Download as a table (123 rows)</a><a class="fp-back" href="./data/research/capital_controls.json" download="">Download as JSON</a></div></section><footer class="site-footer"><p>Every number on this site comes from a public data file.</p><p class="site-links"><a href="https://github.com/SebR214/margin">Code and raw data on GitHub</a></p></footer></div></div>
